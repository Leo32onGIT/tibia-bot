# Violent Bot — Docker Compose
#
# Quick start (see README "Running with Docker Compose"):
#   1. Build the bot image once:   sbt docker:publishLocal   (-> violent-bot-dedicated:latest)
#   2. cp .env.example .env        and fill it in
#   3. Start it:
#        • bundled Postgres:   docker compose --profile local-db up -d
#        • pre-existing DB:    docker compose up -d          (set POSTGRES_HOST in .env)
#
# Redis (the cache) starts by default (the `local-cache` profile is meant to
# be active via COMPOSE_PROFILES in .env — see .env.example). A shared-world-
# cycle secondary doesn't run its own Redis at all (it points REDIS_HOST at
# the primary's instead), so its .env leaves COMPOSE_PROFILES unset and the
# local redis service is never created.

services:
  bot:
    image: violent-bot-dedicated:latest
    env_file: .env
    networks:
      - violentbot
    depends_on:
      redis:
        condition: service_healthy
        # Satisfied normally when the `local-cache` profile is active; simply
        # skipped (not an error) when it isn't, e.g. a shared-world-cycle
        # secondary — see the redis service below.
        required: false
    # The bot connects to Postgres at boot; with the bundled DB (local-db profile)
    # it may restart a couple of times while Postgres initialises — that is
    # expected and harmless. It is NOT wired to depends_on postgres so that a
    # pre-existing/external database works without starting the local one.
    restart: unless-stopped
    volumes:
      # Both dashboards read their page fresh on every request, preferring this
      # path over the copy baked into the jar — so editing one of these files
      # (then just refreshing the browser) never needs a rebuild or restart.
      - ./tibia-bot/src/main/resources/web:/opt/docker/web:ro
      # Creature sprites fetched from the wiki. Kept in a named volume so a
      # container recreate does not throw the whole catalogue away and re-fetch
      # it — which works, but is a few hundred needless requests to somebody
      # else's server every deploy.
      - sprite-cache:/opt/docker/cache/sprites
    # Status dashboard (see StatusRoute.scala) — internal-only, reached via
    # Caddy below. Deliberately no `ports:` here: the host never talks to the
    # bot directly, only through the reverse proxy that terminates TLS.

  # Reverse proxy in front of STATUS_DOMAIN (the bot's public apex domain, also
  # the existing GitHub Pages landing page's domain): automatic Let's Encrypt
  # HTTPS, /dashboard* and /status* proxied to the bot's internal port, everything
  # else passed through unauthenticated to GitHub Pages (see Caddyfile).
  # Requires STATUS_DOMAIN's DNS to point at this host instead of GitHub
  # Pages' IPs, and ports 80/443 forwarded to it (80 for the Let's Encrypt
  # HTTP-01 challenge).
  caddy:
    image: caddy:2
    # Only created when the `own-dashboard` profile is active (COMPOSE_PROFILES
    # in .env — see .env.example). A shared-world-cycle secondary doesn't run
    # its own dashboard at all (BotApp skips binding the internal HTTP server
    # too when BOT_ROLE=secondary) — its worlds/guilds are published for the
    # primary's dashboard to merge in instead, so no reverse proxy, no domain, needed.
    profiles: ["own-dashboard"]
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - violentbot
    depends_on:
      - bot
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Only created when the `local-cache` profile is active (COMPOSE_PROFILES
    # in .env — see .env.example). Absent entirely on a shared-world-cycle
    # secondary, which has no use for its own Redis.
    profiles: ["local-cache"]
    networks:
      - violentbot
    # appendonly so the character-cache snapshot (and other cached keys) survive
    # a redis restart instead of forcing a cold re-fetch. requirepass matches
    # REDIS_PASSWORD (already used by the bot's own client config) — matters
    # once this is reachable beyond this host's own docker network, below.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    # Published only to a specific private IP — unset (the default) binds to
    # loopback only, i.e. no real exposure beyond this host. Set
    # REDIS_PUBLISH_HOST to this host's own private IP on a shared-world-cycle
    # primary, so secondary bots elsewhere on the VPC can reach it; leave
    # unset on a plain single-bot or secondary deployment.
    ports:
      - "${REDIS_PUBLISH_HOST:-127.0.0.1}:6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional bundled Postgres — enabled ONLY with the `local-db` profile:
  #   docker compose --profile local-db up -d
  # To use a pre-existing database instead, omit the profile and point
  # POSTGRES_HOST at your server. NOTE: the bot hardcodes port 5432, so an
  # external database must listen on 5432.
  postgres:
    image: postgres:16
    profiles: ["local-db"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
  pgdata:
  caddy-data:
  caddy-config:
  sprite-cache:

networks:
  violentbot:
    external: true

# Violent Bot — Docker Compose
#
# Quick start (see README "Deployment"):
#   1. sbt docker:publishLocal     -> violent-bot-dedicated:latest
#   2. cp .env.example .env        and fill it in
#   3. bundled Postgres:  docker compose --profile local-db up -d
#      pre-existing DB:   docker compose up -d   (set POSTGRES_HOST in .env)
#
# Redis starts by default via COMPOSE_PROFILES in .env. A secondary points
# REDIS_HOST at the primary instead and leaves COMPOSE_PROFILES unset, so its
# local redis service is never created.

services:
  bot:
    image: violent-bot-dedicated:latest
    env_file: .env
    networks:
      - violentbot
    depends_on:
      redis:
        condition: service_healthy
        # Skipped, not an error, when the `local-cache` profile is inactive.
        required: false
    # With the bundled DB the bot may restart a couple of times while Postgres
    # initialises — expected and harmless. Deliberately NOT depends_on postgres,
    # so an external database works without starting the local one.
    restart: unless-stopped
    volumes:
      # Both dashboards read their page fresh per request, preferring this path
      # over the copy in the jar, so editing one needs no rebuild or restart.
      - ./tibia-bot/src/main/resources/web:/opt/docker/web:ro
      # Creature sprites from the wiki, in a named volume so a container recreate
      # does not re-fetch a few hundred files from somebody else's server.
      - sprite-cache:/opt/docker/cache/sprites
    # No `ports:` deliberately — the host reaches the bot only through Caddy,
    # which terminates TLS.

  # Reverse proxy in front of STATUS_DOMAIN: automatic Let's Encrypt HTTPS,
  # /dashboard* and /status* proxied to the bot, everything else passed through
  # unauthenticated to GitHub Pages (see Caddyfile). Needs STATUS_DOMAIN's DNS
  # pointed at this host and ports 80/443 forwarded (80 for the HTTP-01 challenge).
  caddy:
    image: caddy:2
    # Only with the `own-dashboard` profile. A secondary runs no dashboard at all
    # (BotApp skips binding the HTTP server when BOT_ROLE=secondary) — its worlds
    # are published for the primary's dashboard to merge in.
    profiles: ["own-dashboard"]
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - violentbot
    depends_on:
      - bot
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    # Only with the `local-cache` profile. Absent on a secondary, which has no
    # use for its own Redis.
    profiles: ["local-cache"]
    networks:
      - violentbot
    # appendonly so cached keys survive a restart instead of forcing a cold
    # re-fetch. requirepass matches REDIS_PASSWORD, which matters once this is
    # reachable beyond this host's docker network.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    # Unset (the default) binds loopback only. Set REDIS_PUBLISH_HOST to this
    # host's private IP on a primary, so secondaries on the VPC can reach it.
    ports:
      - "${REDIS_PUBLISH_HOST:-127.0.0.1}:6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional bundled Postgres — only with the `local-db` profile. For an existing
  # database, omit the profile and set POSTGRES_HOST. The bot hardcodes port 5432,
  # so an external database must listen there.
  #
  # ⚠️ Postgres refuses to start against a data directory written by a different
  # major version, so raising this number is a migration and not a version bump.
  # A `pgdata` volume created by 16 will not open under 18, and the bot then
  # restarts in a loop against a database that never comes up. Before changing it:
  # `pg_dumpall` the old cluster, `docker volume rm` the pgdata volume, bring up
  # only postgres on the new tag, then restore the dump into it.
  #
  # The mount is `/var/lib/postgresql`, NOT the `/var/lib/postgresql/data` that
  # every pre-18 example uses. The 18 image puts the cluster in a version-named
  # subdirectory (`/var/lib/postgresql/18/docker`) so that pg_upgrade can see two
  # versions at once, and it refuses to start if it finds data at the old path,
  # reporting it as an "unused mount/volume". Confirmed the hard way on 4 Sep 2026.
  postgres:
    image: postgres:18
    profiles: ["local-db"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
  pgdata:
  caddy-data:
  caddy-config:
  sprite-cache:

networks:
  violentbot:
    external: true

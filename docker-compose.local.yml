# Local live-test override (not auto-applied — pass it explicitly with
#   docker compose -f docker-compose.yml -f docker-compose.local.yml \
#     --profile local-db --profile local-cache up -d --build
# Points the bot at the bundled Postgres (service "postgres") instead of .env's
# external sqlhost, so a fresh, isolated test database is used. Everything else
# comes from the base compose + .env.
services:
  bot:
    environment:
      POSTGRES_HOST: postgres
  # The bundled postgres has no network in the base compose (external DBs don't need
  # it); put it on the same network the bot uses so "postgres" resolves.
  postgres:
    networks:
      - violentbot

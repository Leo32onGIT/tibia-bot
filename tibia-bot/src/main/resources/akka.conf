// Routes Akka's own internal logging (stream supervision failures, HTTP
// server connection errors, etc.) through SLF4J/Logback instead of Akka's
// built-in stdout-only logger — without this, those events reach `docker
// logs` but never logback.xml's DASHBOARD appender, so they'd silently
// never show up in the dashboard's Errors/Warnings panel.
akka {
  loggers = ["akka.event.slf4j.Slf4jLogger"]
  logging-filter = "akka.event.slf4j.Slf4jLoggingFilter"
}

akka.http {
  host-connection-pool {
    max-connections = 16
    max-open-requests = 4096
    response-entity-subscription-timeout = 10.seconds

    per-host-override = [
      {
        host-pattern = "api.tibiadata.com"
        max-connections = 64
      }
    ]
  }
}

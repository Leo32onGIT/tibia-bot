discord-config {
  token = ${TOKEN}
  postgres-password = ${POSTGRES_PASSWORD}
  postgres-host = ${POSTGRES_HOST}
  localapi-host = ${TIBIADATA_HOST}

  redis-host = ""
  redis-host = ${?REDIS_HOST}
  redis-port = 6379
  redis-port = ${?REDIS_PORT}
  redis-password = ""
  redis-password = ${?REDIS_PASSWORD}

  cache {
    boosted-ttl = 60s
    boosted-ttl = ${?CACHE_BOOSTED_TTL}
    // Ours, not the endpoint's: Kong holds /v4/worlds for only ~60s and a
    // self-hosted TibiaData instance does not cache it at all, so this is what
    // decides how long a newly released world stays invisible to /setup.
    world-list-ttl = 1h
    world-list-ttl = ${?CACHE_WORLD_LIST_TTL}
    online-duration-ttl = 20m
    online-duration-ttl = ${?CACHE_ONLINE_DURATION_TTL}
    killer-level-ttl = 10m
    killer-level-ttl = ${?CACHE_KILLER_LEVEL_TTL}
  }

  // Ceiling on TibiaData requests in flight across every world stream in this
  // process. Each world fans out at a fixed concurrency, so without a shared
  // ceiling the real limit is that times the number of worlds — thousands of
  // connections from one address. Should not bind in normal running; it is for a
  // cold start and recovery after an upstream outage.
  tibiadata-max-in-flight = 200
  tibiadata-max-in-flight = ${?TIBIADATA_MAX_IN_FLIGHT}

  // CipSoft's official fansite API (https://fansiteapi.tibia.com), a second
  // source for character sheets — see com.tibiabot.fansiteapi.
  //
  // mode:
  //   off    - never called; no behaviour change
  //   shadow - fetched alongside TibiaData and compared, never posted from
  //   race   - both sources out of phase, freshest sheet wins
  fansite-api {
    mode = "off"
    mode = ${?FANSITE_API_MODE}
    // No default on purpose: an empty token must not silently look configured.
    token = ""
    token = ${?FANSITE_API_TOKEN}
    base-url = "https://fansiteapi.tibia.com"
    base-url = ${?FANSITE_API_BASE_URL}
    // Cloudflare 403s an absent or default User-Agent, so this is required
    // rather than cosmetic.
    user-agent = "violentbot.xyz"
    user-agent = ${?FANSITE_API_USER_AGENT}
    // NOT tibiadata-max-in-flight's 200. This upstream blocks the whole IP via
    // Cloudflare rather than answering 429, and 8 keeps us near the ~13 req/s
    // that a throughput run found comfortable (12.9 req/s, ~350 requests, no
    // rate limiting seen).
    //
    // The block that shaped these numbers — a 32-wide cold start at ~60 req/s,
    // refused within about 40 requests — happened from a LOCAL development IP.
    // The VPS is whitelisted with CipSoft, so that measurement says nothing
    // about what prod tolerates, and the real prod threshold is unmeasured.
    // Everything here is therefore a deliberate safeguard rather than a limit
    // derived from prod evidence: cheap to keep, and a mistake in the other
    // direction is paid for by every bot behind the same address.
    max-in-flight = 8
    max-in-flight = ${?FANSITE_API_MAX_IN_FLIGHT}
    // Floor on the gap between two requests leaving for this API, and the
    // shape of that gap. NOT the same instrument as max-in-flight above:
    // that bounds requests in flight, which is only a rate once you divide by
    // a latency this upstream chooses. 75ms is the ~13 req/s measured as
    // comfortable, now held whatever the upstream's speed.
    min-request-gap = 75ms
    min-request-gap = ${?FANSITE_API_MIN_REQUEST_GAP}
    // Spread either side of that gap, as a fraction. What blocks us here
    // scores requests rather than counting them, and a perfectly even gap is
    // itself a signal worth avoiding; the mean holds the rate regardless.
    request-gap-jitter = 0.4
    request-gap-jitter = ${?FANSITE_API_REQUEST_GAP_JITTER}
    // Requests allowed out back to back after an idle spell. Kept small on the
    // same precautionary grounds as max-in-flight above rather than on any prod
    // measurement: this is the one number where the whole IP pays for optimism,
    // and 2 costs nothing on a lane whose producer is continuous anyway.
    burst = 2
    burst = ${?FANSITE_API_BURST}
    // How far ahead the pacer's queue may stretch before a fetch is refused
    // instead of queued. Half a poll interval, so anything admitted still
    // lands inside the tick it was asked for; past that the sheet answers a
    // question the next poll has already asked, and the caller falls back to
    // TibiaData at no cost.
    max-queue-delay = 30s
    max-queue-delay = ${?FANSITE_API_MAX_QUEUE_DELAY}
    // How long to stop calling entirely after the API answers 403/429. It
    // blocks by IP, so the only useful response is to go quiet and try later.
    circuit-open-for = 10m
    circuit-open-for = ${?FANSITE_API_CIRCUIT_OPEN_FOR}
    // How long the racer waits for this source once TibiaData has answered. It
    // only buys a fresher sheet, so it must never hold a death behind it; a slow
    // fetch is abandoned for this poll and still warms the cache for the next.
    secondary-grace = 400ms
    secondary-grace = ${?FANSITE_API_SECONDARY_GRACE}
    // How far this source's cache window is held out of phase with TibiaData's,
    // in poll ticks. A 300s TTL against a 60s poll makes 5 ticks a full window,
    // so 2 (or 3) is as close to antiphase as the grid allows.
    phase-offset-ticks = 2
    phase-offset-ticks = ${?FANSITE_API_PHASE_OFFSET_TICKS}
  }

  // How long a character sheet is reused instead of re-fetched. `ttl` is the
  // upstream Kong cache's own TTL on /v4/character, measured at 300s: until an
  // entry that old turns over, asking again returns identical bytes. Change this
  // one number if that changes upstream; everything else here is a guard rail.
  character-cache {
    enabled = true
    enabled = ${?CHARACTER_CACHE_ENABLED}
    ttl = 300s
    ttl = ${?CHARACTER_CACHE_TTL}
    // Past this, a stored sheet stops being served to cover a failed fetch and
    // the error is passed through instead.
    max-stale = 15m
    max-stale = ${?CHARACTER_CACHE_MAX_STALE}
    // Fraction of skippable fetches made anyway, so the dashboard's cache-age
    // histogram keeps an unbiased sample and a wrong ttl above stays visible.
    canary-fraction = 0.02
    canary-fraction = ${?CHARACTER_CACHE_CANARY_FRACTION}
    // Per world, so this is a ceiling far above any world's population.
    max-entries = 20000
    max-entries = ${?CHARACTER_CACHE_MAX_ENTRIES}
  }

  // The highscores sweep — see com.tibiabot.highscores.
  //
  // Off by default and widened one world at a time. Magic level is the only
  // category needing the vocation filter, so it is the only thing here that
  // reaches tibia.com through our own TibiaData instance — an IP that also
  // serves the boosted feed and an unrelated droplet. Everything else goes to
  // the public Kong-cached endpoint.
  highscores {
    enabled = false
    enabled = ${?HIGHSCORES_ENABLED}
    // How often to ask whether tibia.com has rebuilt the highscores. One
    // request; the sweep behind it only runs when the answer changes.
    probe-interval = 5m
    probe-interval = ${?HIGHSCORES_PROBE_INTERVAL}
    // How long a snapshot lasts, used only to size the window the sweep spreads
    // its requests over. Observed hourly, both readings landing on :40 past.
    // The sweep does not depend on this being right — it detects the real
    // rollover from `highscore_age` — so a wrong value costs pacing, not data.
    snapshot-interval = 1h
    snapshot-interval = ${?HIGHSCORES_SNAPSHOT_INTERVAL}
    // Share of that interval the sweep may spread across. Below 1 so a slow
    // sweep still lands before the next snapshot rather than running into it.
    window-fraction = 0.75
    window-fraction = ${?HIGHSCORES_WINDOW_FRACTION}
    // Lanes fetching pages in parallel. Small on purpose, for the shared-IP
    // reason above.
    workers = 4
    workers = ${?HIGHSCORES_WORKERS}
    // Floor on the gap between two requests from one lane, whatever the pacing
    // arithmetic works out — a handful of tracked worlds must not turn into a
    // burst just because there is little to do.
    min-request-gap = 150ms
    min-request-gap = ${?HIGHSCORES_MIN_REQUEST_GAP}
    // Its own ceiling rather than tibiadata-max-in-flight's 200: a highscores
    // sweep must never take permits the character poll needs to find a death.
    max-in-flight = 4
    max-in-flight = ${?HIGHSCORES_MAX_IN_FLIGHT}
    // Retention. Scores and events are small; the raw experience readings are
    // the only ones the disk notices — 1.63M rows a day across 68 worlds.
    score-retention = 30d
    score-retention = ${?HIGHSCORES_SCORE_RETENTION}
    event-retention = 30d
    event-retention = ${?HIGHSCORES_EVENT_RETENTION}
    experience-raw-retention = 7d
    experience-raw-retention = ${?HIGHSCORES_EXPERIENCE_RAW_RETENTION}
    experience-daily-retention = 90d
    experience-daily-retention = ${?HIGHSCORES_EXPERIENCE_DAILY_RETENTION}
  }

  avatar-url = "https://raw.githubusercontent.com/Leo32onGIT/tibia-bot-resources/main/Violent%20Bot.png"
  namechange-thumbnail = "https://raw.githubusercontent.com/Leo32onGIT/tibia-bot-resources/main/namechange.png"
  guild-leave-thumbnail = "https://raw.githubusercontent.com/Leo32onGIT/tibia-bot-resources/main/guildleaveyellow.png"
  guild-swap-thumbnail-grey = "https://raw.githubusercontent.com/Leo32onGIT/tibia-bot-resources/main/guildswapgrey.png"
  guild-swap-thumbnail-red = "https://raw.githubusercontent.com/Leo32onGIT/tibia-bot-resources/main/guildswapred.png"
  guild-swap-thumbnail-green = "https://raw.githubusercontent.com/Leo32onGIT/tibia-bot-resources/main/guildswapgreen.png"
  guild-join-thumbnail-grey = "https://raw.githubusercontent.com/Leo32onGIT/tibia-bot-resources/main/guildjoingrey.png"
  guild-join-thumbnail-red = "https://raw.githubusercontent.com/Leo32onGIT/tibia-bot-resources/main/guildjoinred.png"
  guild-join-thumbnail-green = "https://raw.githubusercontent.com/Leo32onGIT/tibia-bot-resources/main/guildjoingreen.png"
  world-transfer-thumbnail-grey = "https://raw.githubusercontent.com/Leo32onGIT/tibia-bot-resources/main/worldtransfergrey.png"
  world-transfer-thumbnail-red = "https://raw.githubusercontent.com/Leo32onGIT/tibia-bot-resources/main/worldtransferred.png"
  world-transfer-thumbnail-green = "https://raw.githubusercontent.com/Leo32onGIT/tibia-bot-resources/main/worldtransfergreen.png"


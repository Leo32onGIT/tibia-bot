  // Shared bot-wide pace for the low-priority background lane (renames,
  // activity/admin embeds, batched level-ups, boosted-DM notifications) —
  // deaths and the boosted-channel server-save post bypass this entirely.
  global-message-delay-ms = 100

  // Separate lane just for online-list message edits/sends. Discord groups
  // PATCH .../messages/{id} into a "shared" bucket across many different
  // channels for this bot (confirmed via live 429s with Retry-After 5-6s,
  // same bucket hash across several channel IDs) — a far tighter limit than
  // the general REST budget, so this traffic gets its own lane rather than
  // sharing global-message-delay-ms with everything else.
  //
  // Not a hand-picked "safe" rate — the queue's per-key dedup (see
  // RateLimitedSender) is what actually keeps this safe: it bounds the
  // backlog to one pending item per target and guarantees whatever sends is
  // current, so we lean on JDA's own adaptive rate limiter (which learns
  // real bucket limits from Discord's responses) to do the real-time pacing,
  // the same way it already does for every other request type in this bot,
  // instead of guessing a static number ourselves.
  //
  // Raised from 50 to 200 after still seeing occasional 429s at 50: JDA only
  // learns that many different channel IDs share this one "shared" bucket
  // after it gets a response back for each — so the *first* edit to each
  // channel in a burst goes out "blind" before JDA has correlated it, and
  // several blind requests can land concurrently and collide on the real
  // shared limit. A slower pace narrows that blind window. If 429s still
  // reappear at this pace, raise it further — the dedup means the backlog
  // still can't run away unbounded while tuning.
  online-list-message-delay-ms = 200

  // Monitoring dashboard: Discord OAuth2 + session signing + the domain it's
  // served on. Left blank disables nothing on its own — the dashboard's HTTP
  // server always binds; these just need real values for OAuth login to work
  // end-to-end. status-domain is the bot's public apex domain (violentbot.xyz),
  // not a dedicated subdomain — Caddy proxies /dashboard on that domain to the
  // bot and passes everything else through unauthenticated to the existing
  // landing page (see repo-root Caddyfile).
  web {
    discord-client-secret = ""
    discord-client-secret = ${?DISCORD_CLIENT_SECRET}
    session-secret = ""
    session-secret = ${?SESSION_SECRET}
    status-domain = ""
    status-domain = ${?STATUS_DOMAIN}
    status-port = 8080
    status-port = ${?STATUS_PORT}
  }

  // Patreon paywall (see paywall.PaywallService): the support Discord and the
  // role Patreon assigns to active subscribers there. /setup checks the
  // caller has this role in this guild; each configured guild's activity
  // keeps posting only while its recorded setup_user still does.
  patreon {
    support-guild-id = "867319250708463628"
    support-guild-id = ${?PATREON_SUPPORT_GUILD_ID}
    role-id = "1117655913772367933"
    role-id = ${?PATREON_ROLE_ID}
    seats-per-user = 3
    seats-per-user = ${?PATREON_SEATS_PER_USER}
  }

  // Direct Patreon API access (patreonapi.PatreonApiClient) — periodically
  // syncs the campaign's current member list into the shared bot_cache
  // database for the dashboard's supporters panel. Purely additive/read-only:
  // does not affect /setup's paywall gate, which still checks the Discord
  // role above. All real secrets, no committed defaults — sync-interval is
  // the only one safe to default, since it's not sensitive.
  patreon-api {
    client-id = ""
    client-id = ${?PATREON_API_CLIENT_ID}
    client-secret = ""
    client-secret = ${?PATREON_API_CLIENT_SECRET}
    access-token = ""
    access-token = ${?PATREON_API_ACCESS_TOKEN}
    refresh-token = ""
    refresh-token = ${?PATREON_API_REFRESH_TOKEN}
    campaign-id = ""
    campaign-id = ${?PATREON_API_CAMPAIGN_ID}
    sync-interval = 30m
    sync-interval = ${?PATREON_API_SYNC_INTERVAL}
  }

  // Auto-leave a guild that's tracked no worlds for this many days, unless
  // a command's been run there within activity-days — see BotApp.pruneInactiveGuilds.
  inactive-guild {
    worldless-days = 14
    worldless-days = ${?INACTIVE_GUILD_WORLDLESS_DAYS}
    activity-days = 30
    activity-days = ${?INACTIVE_GUILD_ACTIVITY_DAYS}
  }
}

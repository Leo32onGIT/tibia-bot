  boss-emoji = "<:boss:1195770698401075281>"
  creature-emoji = "<:creature:1195770592650084472>"
  torch-on-emoji = "<:torchon:1195797593700192318>"
  torch-off-emoji = "<:torchoff:1195797616114536659>"
  satchel-emoji = "<:satchel:1030348072577945651>"
  tcstack-emoji = "<a:tcstack:1339890172984295516>"
  dreamscar-emoji = "<a:dreamscar:1504728980010438717>"
  masslog-emoji = "<:masslog:1505437547717988503>"
  bounty-emoji = "<:bounty:1537339697624256524>"
  drome-emoji = "<:drome:1507620940278923294>"
  // Shared bot-wide pace for the low-priority background lane (renames,
  // activity/admin embeds, batched level-ups, boosted-DM notifications) —
  // deaths and the boosted-channel server-save post bypass this entirely.
  global-message-delay-ms = 100

  // Separate lane just for online-list edits. Discord groups PATCH
  // .../messages/{id} into a "shared" bucket across many channels (confirmed by
  // live 429s with Retry-After 5-6s and one bucket hash across several channel
  // IDs) — far tighter than the general REST budget.
  //
  // Not a hand-picked "safe" rate: the queue's per-key dedup (see
  // RateLimitedSender) is what keeps this safe, bounding the backlog to one
  // pending item per target, so JDA's own adaptive limiter does the real pacing.
  //
  // Raised from 50 to 200 after 429s persisted at 50. JDA learns which channel
  // IDs share the bucket only once it has a response for each, so the *first*
  // edit to each channel goes out blind and several can collide. A slower pace
  // narrows that window; raise further if 429s reappear.
  online-list-message-delay-ms = 200

  // Minimum spacing between two online-list sends to the *same channel*. The pace
  // above is bot-wide, but Discord's limit here is per-channel ("Scope: shared"
  // means per-resource). A list packing into several embeds enqueues them at once
  // and in plain FIFO left as one burst, tripping that limit while the bot-wide
  // rate was fine. The drain now skips such an item for another channel, so this
  // costs no throughput. Sized against a ~4-6s Retry-After, i.e. ~5 per 5s.
  //
  // Raised from 1200ms after measuring a 10% 429 rate. 1200ms allowed ~4 per 5s,
  // a 17% margin the lane cannot hold: the gap is enforced at dispatch and
  // everything after — JDA's queue, bucket correlation, connection setup — is
  // jitter on top. 1500ms allows ~3.3 per 5s, leaving a third of the window slack.
  online-list-per-channel-min-gap-ms = 1500

  // Opportunistic online-list reposts. When a channel's list is nearly all dirty
  // anyway, one bulk delete plus one send per message replaces one edit per
  // message: more requests overall, but off the shared PATCH bucket above and
  // onto per-channel routes with room to spare. See OnlineListRepostPolicy.
  //
  // The cost is that a repost marks the channel unread and drops readers to the
  // bottom, where an edit is silent — so reposting starts only once the lane is
  // backed up enough for the relief to be worth that, and gets more frequent as
  // it worsens. Depths line up with AdaptiveRefreshInterval's tiers: at 400 the
  // refresh cadence has already backed off to 200s, so a 15-minute cooldown
  // replaces about one refresh in four; past 800 it replaces two in three.
  //
  // Off unless ONLINE_LIST_REPOST_ENABLED says otherwise: a channel going unread
  // is the first thing about this bot every member of a server sees, so it wants
  // turning on one host at a time and watching, not shipping to everyone at once.
  online-list-repost-enabled = false
  online-list-repost-enabled = ${?ONLINE_LIST_REPOST_ENABLED}
  // Lowered from 0.8 when the stable packing landed: that packing exists to stop
  // one login rewriting every message after it, so a channel that used to show
  // ~83% of its messages dirty now shows ~68%. Left at 0.8 the gate would stop
  // tripping, and losing the repost costs more than the stable packing saves.
  online-list-repost-dirty-fraction = 0.6
  online-list-repost-dirty-fraction = ${?ONLINE_LIST_REPOST_DIRTY_FRACTION}
  online-list-repost-queue-depth = 400
  online-list-repost-queue-depth = ${?ONLINE_LIST_REPOST_QUEUE_DEPTH}
  online-list-repost-cooldown-ms = 900000
  online-list-repost-cooldown-ms = ${?ONLINE_LIST_REPOST_COOLDOWN_MS}
  online-list-repost-urgent-queue-depth = 800
  online-list-repost-urgent-queue-depth = ${?ONLINE_LIST_REPOST_URGENT_QUEUE_DEPTH}
  online-list-repost-urgent-cooldown-ms = 300000
  online-list-repost-urgent-cooldown-ms = ${?ONLINE_LIST_REPOST_URGENT_COOLDOWN_MS}

  // Monitoring dashboard: Discord OAuth2, session signing, and the domain it is
  // served on. Blank disables nothing — the HTTP server always binds; these just
  // need real values for OAuth login. status-domain is the bot's public apex
  // domain, not a subdomain: Caddy proxies /dashboard on it to the bot and passes
  // everything else through to the landing page (see repo-root Caddyfile).
  web {
    discord-client-secret = ""
    discord-client-secret = ${?DISCORD_CLIENT_SECRET}
    session-secret = ""
    session-secret = ${?SESSION_SECRET}
    status-domain = ""
    status-domain = ${?STATUS_DOMAIN}
    // Overrides the origin the OAuth redirect URI is built on. Unset in every
    // deployment, where https://<status-domain> is right; set locally to the
    // plain-HTTP port forward, e.g. http://localhost:8081.
    base-url = ""
    base-url = ${?WEB_BASE_URL}
    // Where members are sent to use the dashboard, for the bots that do not
    // serve one. Every bot in the fleet posts a respawn board and the board
    // links to the dashboard, but only the bot running it has a status-domain
    // to build an address from — so this has a real default rather than being
    // blank, and the two settings above still win where they are set.
    dashboard-domain = "violentbot.xyz"
    dashboard-domain = ${?DASHBOARD_DOMAIN}
    status-port = 8080
    status-port = ${?STATUS_PORT}
  }

  // Patreon paywall (see paywall.PaywallService). Who counts as a subscriber
  // is answered by the Patreon API below, not by a role in this guild —
  // support-guild-id survives only because the dashboard resolves a Discord
  // username to an id by searching it. /setup checks the caller is an active
  // patron with Discord connected on Patreon's side; each configured guild's
  // activity keeps posting only while its recorded setup_user still is.
  patreon {
    support-guild-id = "867319250708463628"
    support-guild-id = ${?PATREON_SUPPORT_GUILD_ID}
    seats-per-user = 5
    seats-per-user = ${?PATREON_SEATS_PER_USER}
    // How many days a configured world keeps running after the subscription
    // behind it stops checking out — whether its seat's owner lapsed, or it
    // was never tied to a seat at all (a legacy setup). Only once this runs
    // out does activity actually pause. 0 restores the old behaviour: pause
    // on the first sweep that notices.
    grace-days = 7
    grace-days = ${?PATREON_GRACE_DAYS}
  }

  // Direct Patreon API access (patreonapi.PatreonApiClient) — periodically syncs
  // the campaign's member list into bot_cache. Read-only but load-bearing: this
  // snapshot is what /setup's paywall gate reads, so if these credentials stop
  // working nobody new can /setup and every world starts its grace countdown (the
  // last good snapshot is kept, so nothing pauses immediately). sync-interval is
  // also how stale the gate can be. All secrets, no committed defaults.
  patreon-api {
    client-id = ""
    client-id = ${?PATREON_API_CLIENT_ID}
    client-secret = ""
    client-secret = ${?PATREON_API_CLIENT_SECRET}
    access-token = ""
    access-token = ${?PATREON_API_ACCESS_TOKEN}
    refresh-token = ""
    refresh-token = ${?PATREON_API_REFRESH_TOKEN}
    campaign-id = ""
    campaign-id = ${?PATREON_API_CAMPAIGN_ID}
    sync-interval = 30m
    sync-interval = ${?PATREON_API_SYNC_INTERVAL}
    // /setup syncs before its subscription check so a brand-new supporter
    // isn't told to subscribe. Cooldown caps how often that can fetch;
    // timeout caps how long the command waits on it before falling back to
    // the last snapshot.
    setup-sync-cooldown = 60s
    setup-sync-cooldown = ${?PATREON_API_SETUP_SYNC_COOLDOWN}
    setup-sync-timeout = 5s
    setup-sync-timeout = ${?PATREON_API_SETUP_SYNC_TIMEOUT}
  }

  // Shared world-cycle role — "primary" polls TibiaData for every world
  // tracked anywhere on the shared Postgres instance and publishes results to
  // Redis; "secondary" reads a primary's published results instead of
  // polling independently, falling back to a direct poll on a cache miss.
  // Empty (the default) disables sharing entirely — a plain single-bot
  // deployment behaves exactly as before this feature existed, with zero
  // new Redis traffic and no extra cross-Postgres scanning.
  bot-role = ""
  bot-role = ${?BOT_ROLE}
  // Shared world cycle, character fetching. Only the primary's address is
  // whitelisted upstream, so by default a secondary never calls out for a
  // character: on a cache miss it waits for the primary to publish one rather
  // than fetching it itself. It reverts to fetching whenever the primary's
  // heartbeat is absent, so losing the primary costs duplicate requests rather
  // than blinding every secondary at once.
  secondary-consume-only = true
  secondary-consume-only = ${?SECONDARY_CONSUME_ONLY}
  // ...and the other half of the same arrangement: the primary polls worlds
  // that only a secondary serves, purely to publish them. Off leaves each bot
  // fetching its own worlds as before.
  primary-fetches-fleet-worlds = true
  primary-fetches-fleet-worlds = ${?PRIMARY_FETCHES_FLEET_WORLDS}
  // How often the primary refreshes its heartbeat, and how long a secondary
  // believes one it has seen. The published key lives longer than the interval
  // so a single missed beat does not send every secondary back to fetching.
  primary-heartbeat-interval = 10s
  primary-heartbeat-interval = ${?PRIMARY_HEARTBEAT_INTERVAL}
  // Deliberately narrower than a real world stream's 32-wide fan-out: these
  // worlds belong to another bot, nothing here waits on the result, and gentler
  // upstream behaviour is worth more than filling the cache a moment sooner.
  fleet-fetch-fan-out = 8
  fleet-fetch-fan-out = ${?FLEET_FETCH_FAN_OUT}

  // Auto-leave a guild that's tracked no worlds for this many days, unless
  // a command's been run there within activity-days — see BotApp.pruneInactiveGuilds.
  inactive-guild {
    worldless-days = 14
    worldless-days = ${?INACTIVE_GUILD_WORLDLESS_DAYS}
    activity-days = 30
    activity-days = ${?INACTIVE_GUILD_ACTIVITY_DAYS}
  }

  // Respawn claim system. `enabled` was the rollout gate and now defaults to what
  // prod runs. Setting it false still withdraws the feature cleanly — `/stamina`
  // and `/bookings` are never registered and no forum channel is created — which
  // is worth keeping for a local run that shouldn't touch a guild's forums.
  respawn {
    enabled = true
    enabled = ${?RESPAWN_ENABLED}
    default-duration-minutes = 120
    default-duration-minutes = ${?RESPAWN_DEFAULT_DURATION_MINUTES}
    max-duration-minutes = 240
    max-duration-minutes = ${?RESPAWN_MAX_DURATION_MINUTES}
    queue-limit = 20
    queue-limit = ${?RESPAWN_QUEUE_LIMIT}
    // Daily claim budget per user, refilled at server save (10:00 Berlin).
    // 0 disables stamina entirely.
    stamina-minutes = 240
    stamina-minutes = ${?RESPAWN_STAMINA_MINUTES}
    warn-minutes = 10
    warn-minutes = ${?RESPAWN_WARN_MINUTES}
    // How long the next person in line has to press Claim on their handover DM
    // before it's assumed they're away and the offer passes to the next person.
    handover-minutes = 10
    handover-minutes = ${?RESPAWN_HANDOVER_MINUTES}
    // How far ahead recurring slots are booked, so they show on a spawn's card
    // before they begin — and so how far ahead somebody booking over one can be
    // asked whether they are hunting it. One window, because the question hangs
    // on the slot: no slot, nothing to ask, and the booking is refused as too far
    // ahead.
    //
    // 12h, so the question is only about a hunt close enough to answer honestly.
    // At 36h it reached the evening after next. Bookings further out still show on
    // the card and in the week, drawn from the rule rather than a written slot.
    schedule-look-ahead-minutes = 720
    schedule-look-ahead-minutes = ${?RESPAWN_SCHEDULE_LOOK_AHEAD_MINUTES}
    // How far into their own slot its owner may still answer "are you hunting
    // tonight?" before it passes to whoever asked. Measured from the slot's start
    // however early the question was put: an hour from the asking took slots off
    // people merely asked at lunchtime about an evening. Ten minutes covers
    // logging in on time without leaving the asker on a no-show.
    booking-request-grace-minutes = 10
    booking-request-grace-minutes = ${?RESPAWN_BOOKING_REQUEST_GRACE_MINUTES}
    // Whether a booked slot claims itself when it comes round, rather than asking
    // its owner to press a button. The default for a guild's first setup; each
    // then flips its own under Config -> Autoclaim.
    //
    // On, because everybody pressed the button every time: a slot booked days ago
    // already states they mean to hunt it, and a confirmation nobody declines is a
    // tax on turning up. A *contested* slot is untouched — booking over one still
    // asks its owner by hand.
    auto-claim = true
    auto-claim = ${?RESPAWN_AUTO_CLAIM}
    // How long before a booked slot starts its owner gets a nudge. 0 = off, and
    // so does autoclaim above: with nothing to confirm the nudge is a DM about a
    // hunt that is going to start either way.
    slot-reminder-minutes = 15
    slot-reminder-minutes = ${?RESPAWN_SLOT_REMINDER_MINUTES}
    // How long after a booking starts on its own its owner has to say they are
    // actually there, before it is given up for them and the spawn moves on.
    // Confirming from the reminder beforehand settles it ahead of time.
    slot-confirm-minutes = 15
    slot-confirm-minutes = ${?RESPAWN_SLOT_CONFIRM_MINUTES}
    max-schedules-per-user = 5
    max-schedules-per-user = ${?RESPAWN_MAX_SCHEDULES_PER_USER}
    sweep-interval = 30s
    sweep-interval = ${?RESPAWN_SWEEP_INTERVAL}
    // How long a free spawn's post must go untouched before it sleeps again.
    // Clicking anything on an archived post re-opens it, and a free spawn's
    // buttons change no claim state, so nothing else would ever close it.
    //
    // 5m: long enough to read a panel, open a form and press again without the
    // post shutting mid-visit, short enough that the forum's front page stays the
    // spawns people are on. A spawn that simply goes free is closed at once.
    close-delay = 5m
    close-delay = ${?RESPAWN_CLOSE_DELAY}
    fallback-image = "https://www.tibiawiki.com.br/wiki/Special:Redirect/file/Sign_(Library).gif"
    fallback-image = ${?RESPAWN_FALLBACK_IMAGE}

    // Where wiki creature sprites are kept so the dashboard serves them from our
    // own domain. Not just about leaning on a third party: tibiawiki geoblocks
    // some regions, so a hotlinking page has no art at all for those visitors
    // while the VPS reaches it fine.
    //
    // Relative, so it lands beside the container's working directory. Mount a
    // volume to keep the cache across deploys, or every recreate re-fetches the
    // whole catalogue once.
    sprite-cache-dir = "cache/sprites"
    sprite-cache-dir = ${?RESPAWN_SPRITE_CACHE_DIR}
  }
}

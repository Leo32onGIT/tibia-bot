discord-config {
  token = ${TOKEN}
  postgres-password = ${POSTGRES_PASSWORD}
  postgres-host = ${POSTGRES_HOST}
  localapi-host = ${TIBIADATA_HOST}

  redis-host = ""
  redis-host = ${?REDIS_HOST}
  redis-port = 6379
  redis-port = ${?REDIS_PORT}
  redis-password = ""
  redis-password = ${?REDIS_PASSWORD}

  cache {
    boosted-ttl = 60s
    boosted-ttl = ${?CACHE_BOOSTED_TTL}
    // Ours, not the endpoint's: Kong holds /v4/worlds for only ~60s and a
    // self-hosted TibiaData instance does not cache it at all, so this is what
    // decides how long a newly released world stays invisible to /setup.
    world-list-ttl = 1h
    world-list-ttl = ${?CACHE_WORLD_LIST_TTL}
    online-duration-ttl = 20m
    online-duration-ttl = ${?CACHE_ONLINE_DURATION_TTL}
    killer-level-ttl = 10m
    killer-level-ttl = ${?CACHE_KILLER_LEVEL_TTL}
  }

  // Ceiling on TibiaData requests in flight at once across every world stream
  // in this process. Each world fans out at a fixed concurrency, so without a
  // shared ceiling the real limit is that times the number of worlds — which
  // is a spike of thousands of connections from one address, and is what load
  // shedding exists to stop. Should not bind in normal running; it is there
  // for a cold start and for recovery after an upstream outage.
  tibiadata-max-in-flight = 200
  tibiadata-max-in-flight = ${?TIBIADATA_MAX_IN_FLIGHT}

  // How long a character sheet is reused instead of re-fetched. `ttl` is the
  // upstream Kong cache's own TTL on /v4/character, measured at 300s: until an
  // entry that old turns over, asking again returns the identical bytes. If
  // that ever changes upstream this is the one number to change; everything
  // else here is a guard rail.
  character-cache {
    enabled = true
    enabled = ${?CHARACTER_CACHE_ENABLED}
    ttl = 300s
    ttl = ${?CHARACTER_CACHE_TTL}
    // Past this, a stored sheet stops being served to cover a failed fetch and
    // the error is passed through instead.
    max-stale = 15m
    max-stale = ${?CHARACTER_CACHE_MAX_STALE}
    // Fraction of skippable fetches made anyway, so the dashboard's cache-age
    // histogram keeps an unbiased sample and a wrong ttl above stays visible.
    canary-fraction = 0.02
    canary-fraction = ${?CHARACTER_CACHE_CANARY_FRACTION}
    // Per world, so this is a ceiling far above any world's population.
    max-entries = 20000
    max-entries = ${?CHARACTER_CACHE_MAX_ENTRIES}
  }

  avatar-url = "https://raw.githubusercontent.com/Leo32onGIT/tibia-bot-resources/main/Violent%20Bot.png"
  namechange-thumbnail = "https://raw.githubusercontent.com/Leo32onGIT/tibia-bot-resources/main/namechange.png"
  guild-leave-thumbnail = "https://raw.githubusercontent.com/Leo32onGIT/tibia-bot-resources/main/guildleaveyellow.png"
  guild-swap-thumbnail-grey = "https://raw.githubusercontent.com/Leo32onGIT/tibia-bot-resources/main/guildswapgrey.png"
  guild-swap-thumbnail-red = "https://raw.githubusercontent.com/Leo32onGIT/tibia-bot-resources/main/guildswapred.png"
  guild-swap-thumbnail-green = "https://raw.githubusercontent.com/Leo32onGIT/tibia-bot-resources/main/guildswapgreen.png"
  guild-join-thumbnail-grey = "https://raw.githubusercontent.com/Leo32onGIT/tibia-bot-resources/main/guildjoingrey.png"
  guild-join-thumbnail-red = "https://raw.githubusercontent.com/Leo32onGIT/tibia-bot-resources/main/guildjoinred.png"
  guild-join-thumbnail-green = "https://raw.githubusercontent.com/Leo32onGIT/tibia-bot-resources/main/guildjoingreen.png"
  world-transfer-thumbnail-grey = "https://raw.githubusercontent.com/Leo32onGIT/tibia-bot-resources/main/worldtransfergrey.png"
  world-transfer-thumbnail-red = "https://raw.githubusercontent.com/Leo32onGIT/tibia-bot-resources/main/worldtransferred.png"
  world-transfer-thumbnail-green = "https://raw.githubusercontent.com/Leo32onGIT/tibia-bot-resources/main/worldtransfergreen.png"

  // Custom Emojis
  nemesis-emoji = "<:nemesis:1024708740810821662>"
  archfoe-emoji = "<:archfoe:1024710113728155738>"
  bane-emoji = "<:bane:1024710168216338433>"
  summon-emoji = "<:summon:1024710212764057663>"
  allyguild-emoji = "<:guild:1077165703473418290>"
  otherguild-emoji = "<:otherguild:1077165707025985646>"
  enemyguild-emoji = "<:enemyguild:1153668299310252032>"
  ally-emoji = "<:ally:1191747022043234445>"
  enemy-emoji = "<:enemy:1153654156423336066>"
  mk-emoji = "<:mortalkombat:1024721079270387863>"
  zelos-emoji = "<a:zelos:1025028426182176848>"
  library-emoji = "<a:libraryfinal:1025031520009846814>"
  hod-emoji = "<a:hodfinal:1025057730865668137>"
  feru-emoji = "<a:ferufinal:1025059479533932634>"
  cube-emoji = "<:cube:1024718798277853296>"
  svar-green-emoji = "<:greenhorn:1024726063068217355>"
  svar-scrapper-emoji = "<:scrapper:1024725986211807343>"
  svar-warlord-emoji = "<:warlord:1024725929316077608>"
  inq-emoji = "<:inq:1025103806851199078>"
  kilmaresh-emoji = "<:kilmaresh:1030130198278058075>"
  exiva-emoji = "<:exiva:1025866744918716416>"
  indent-emoji = "<:indent:1025915320285798451>"
  daily-emoji = "<:daily:1133349016814485584>"
  levelup-emoji = "<:levelup:1075222553624326164>"
  primal-emoji = "<a:bagprimal:1148349798219522138>"
  hazard-emoji = "<:hazard:1148373566077816922>"
  yes-emoji = "<:yes:1135988738565099550>"
  no-emoji = "<:no:1135988651327766648>"
  letter-emoji = "<:letter:1195388031755096114>"
  gold-emoji = "<:gold:1133502093039251486>"
  boss-emoji = "<:boss:1195770698401075281>"
  creature-emoji = "<:creature:1195770592650084472>"
  torch-on-emoji = "<:torchon:1195797593700192318>"
  torch-off-emoji = "<:torchoff:1195797616114536659>"
  satchel-emoji = "<:satchel:1030348072577945651>"
  tcstack-emoji = "<a:tcstack:1339890172984295516>"
  dreamscar-emoji = "<a:dreamscar:1504728980010438717>"
  masslog-emoji = "<:masslog:1505437547717988503>"
  bounty-emoji = "<:bounty:1537339697624256524>"
  drome-emoji = "<:drome:1507620940278923294>"
  // Shared bot-wide pace for the low-priority background lane (renames,
  // activity/admin embeds, batched level-ups, boosted-DM notifications) —
  // deaths and the boosted-channel server-save post bypass this entirely.
  global-message-delay-ms = 100

  // Separate lane just for online-list message edits/sends. Discord groups
  // PATCH .../messages/{id} into a "shared" bucket across many different
  // channels for this bot (confirmed via live 429s with Retry-After 5-6s,
  // same bucket hash across several channel IDs) — a far tighter limit than
  // the general REST budget, so this traffic gets its own lane rather than
  // sharing global-message-delay-ms with everything else.
  //
  // Not a hand-picked "safe" rate — the queue's per-key dedup (see
  // RateLimitedSender) is what actually keeps this safe: it bounds the
  // backlog to one pending item per target and guarantees whatever sends is
  // current, so we lean on JDA's own adaptive rate limiter (which learns
  // real bucket limits from Discord's responses) to do the real-time pacing,
  // the same way it already does for every other request type in this bot,
  // instead of guessing a static number ourselves.
  //
  // Raised from 50 to 200 after still seeing occasional 429s at 50: JDA only
  // learns that many different channel IDs share this one "shared" bucket
  // after it gets a response back for each — so the *first* edit to each
  // channel in a burst goes out "blind" before JDA has correlated it, and
  // several blind requests can land concurrently and collide on the real
  // shared limit. A slower pace narrows that blind window. If 429s still
  // reappear at this pace, raise it further — the dedup means the backlog
  // still can't run away unbounded while tuning.
  online-list-message-delay-ms = 200

  // Minimum spacing between two online-list sends targeting the *same channel*.
  // The pace above is bot-wide; Discord's limit on this traffic is per-channel
  // (the 429s name a different channel_id every time, and "Scope: shared" means
  // a per-resource limit, not one budget shared across our channels). A channel
  // whose list packs into several embeds enqueues all of them at once, so in
  // plain FIFO they left in one burst — 5+ edits to one channel inside a second
  // — and tripped that per-channel limit even while the bot-wide rate was fine.
  // The drain now skips such an item and spends the slot on another channel, so
  // this costs no throughput. Sized against the ~4-6s Retry-After we were told
  // to wait, which implies a ~5s window: 1200ms keeps a channel to ~4 per 5s.
  online-list-per-channel-min-gap-ms = 1200

  // Monitoring dashboard: Discord OAuth2 + session signing + the domain it's
  // served on. Left blank disables nothing on its own — the dashboard's HTTP
  // server always binds; these just need real values for OAuth login to work
  // end-to-end. status-domain is the bot's public apex domain (violentbot.xyz),
  // not a dedicated subdomain — Caddy proxies /dashboard on that domain to the
  // bot and passes everything else through unauthenticated to the existing
  // landing page (see repo-root Caddyfile).
  web {
    discord-client-secret = ""
    discord-client-secret = ${?DISCORD_CLIENT_SECRET}
    session-secret = ""
    session-secret = ${?SESSION_SECRET}
    status-domain = ""
    status-domain = ${?STATUS_DOMAIN}
    // Overrides the origin the OAuth redirect URI is built on. Unset in every
    // deployment, where https://<status-domain> is right; set locally to the
    // plain-HTTP port forward, e.g. http://localhost:8081.
    base-url = ""
    base-url = ${?WEB_BASE_URL}
    // Where members are sent to use the dashboard, for the bots that do not
    // serve one. Every bot in the fleet posts a respawn board and the board
    // links to the dashboard, but only the bot running it has a status-domain
    // to build an address from — so this has a real default rather than being
    // blank, and the two settings above still win where they are set.
    dashboard-domain = "violentbot.xyz"
    dashboard-domain = ${?DASHBOARD_DOMAIN}
    status-port = 8080
    status-port = ${?STATUS_PORT}
  }

  // Patreon paywall (see paywall.PaywallService). Who counts as a subscriber
  // is answered by the Patreon API below, not by a role in this guild —
  // support-guild-id survives only because the dashboard resolves a Discord
  // username to an id by searching it. /setup checks the caller is an active
  // patron with Discord connected on Patreon's side; each configured guild's
  // activity keeps posting only while its recorded setup_user still is.
  patreon {
    support-guild-id = "867319250708463628"
    support-guild-id = ${?PATREON_SUPPORT_GUILD_ID}
    seats-per-user = 5
    seats-per-user = ${?PATREON_SEATS_PER_USER}
    // How many days a configured world keeps running after the subscription
    // behind it stops checking out — whether its seat's owner lapsed, or it
    // was never tied to a seat at all (a legacy setup). Only once this runs
    // out does activity actually pause. 0 restores the old behaviour: pause
    // on the first sweep that notices.
    grace-days = 7
    grace-days = ${?PATREON_GRACE_DAYS}
  }

  // Direct Patreon API access (patreonapi.PatreonApiClient) — periodically
  // syncs the campaign's current member list into the shared bot_cache
  // database. Read-only, but load-bearing: this snapshot is what /setup's
  // paywall gate reads, so if these credentials stop working nobody new can
  // /setup and every configured world starts its grace countdown (the last
  // good snapshot is kept rather than wiped, so nothing pauses immediately).
  // sync-interval is also how stale the gate can be: a brand-new patron is
  // recognised on the next sync, not instantly. All real secrets, no
  // committed defaults — sync-interval is the only one safe to default,
  // since it's not sensitive.
  patreon-api {
    client-id = ""
    client-id = ${?PATREON_API_CLIENT_ID}
    client-secret = ""
    client-secret = ${?PATREON_API_CLIENT_SECRET}
    access-token = ""
    access-token = ${?PATREON_API_ACCESS_TOKEN}
    refresh-token = ""
    refresh-token = ${?PATREON_API_REFRESH_TOKEN}
    campaign-id = ""
    campaign-id = ${?PATREON_API_CAMPAIGN_ID}
    sync-interval = 30m
    sync-interval = ${?PATREON_API_SYNC_INTERVAL}
    // /setup syncs before its subscription check so a brand-new supporter
    // isn't told to subscribe. Cooldown caps how often that can fetch;
    // timeout caps how long the command waits on it before falling back to
    // the last snapshot.
    setup-sync-cooldown = 60s
    setup-sync-cooldown = ${?PATREON_API_SETUP_SYNC_COOLDOWN}
    setup-sync-timeout = 5s
    setup-sync-timeout = ${?PATREON_API_SETUP_SYNC_TIMEOUT}
  }

  // Shared world-cycle role — "primary" polls TibiaData for every world
  // tracked anywhere on the shared Postgres instance and publishes results to
  // Redis; "secondary" reads a primary's published results instead of
  // polling independently, falling back to a direct poll on a cache miss.
  // Empty (the default) disables sharing entirely — a plain single-bot
  // deployment behaves exactly as before this feature existed, with zero
  // new Redis traffic and no extra cross-Postgres scanning.
  bot-role = ""
  bot-role = ${?BOT_ROLE}

  // Auto-leave a guild that's tracked no worlds for this many days, unless
  // a command's been run there within activity-days — see BotApp.pruneInactiveGuilds.
  inactive-guild {
    worldless-days = 14
    worldless-days = ${?INACTIVE_GUILD_WORLDLESS_DAYS}
    activity-days = 30
    activity-days = ${?INACTIVE_GUILD_ACTIVITY_DAYS}
  }

  // Respawn claim system. `enabled` was the rollout gate that kept the feature
  // off until it had settled on DEV; it has since been live in prod, so the
  // default now matches what prod actually runs rather than needing
  // RESPAWN_ENABLED set to turn on a shipped feature. Setting it false still
  // withdraws the feature cleanly — `/stamina` and `/bookings` are never
  // registered and no forum channel is created — which is worth keeping for a
  // local run that shouldn't touch a guild's forums.
  respawn {
    enabled = true
    enabled = ${?RESPAWN_ENABLED}
    default-duration-minutes = 120
    default-duration-minutes = ${?RESPAWN_DEFAULT_DURATION_MINUTES}
    max-duration-minutes = 240
    max-duration-minutes = ${?RESPAWN_MAX_DURATION_MINUTES}
    queue-limit = 20
    queue-limit = ${?RESPAWN_QUEUE_LIMIT}
    // Daily claim budget per user, refilled at server save (10:00 Berlin).
    // 0 disables stamina entirely.
    stamina-minutes = 240
    stamina-minutes = ${?RESPAWN_STAMINA_MINUTES}
    warn-minutes = 10
    warn-minutes = ${?RESPAWN_WARN_MINUTES}
    // How long the next person in line has to press Claim on their handover DM
    // before it's assumed they're away and the offer passes to the next person.
    handover-minutes = 10
    handover-minutes = ${?RESPAWN_HANDOVER_MINUTES}
    // How far ahead recurring slots are booked, so they show on a spawn's card
    // before they begin — and, with them, how far ahead somebody trying to book
    // over one can be asked whether they are actually hunting it. Those are the
    // same window because the question hangs on the slot: no slot, nothing to
    // ask about, and the booking is refused as too far ahead instead.
    //
    // 12h, so the question is only ever about a hunt close enough to answer
    // honestly. At 36h it reached the evening after next, and "are you hunting
    // tonight?" is not a fair thing to ask about a day nobody has got to yet.
    // Bookings further out than this still show on the card and in the week —
    // they are drawn from the rule rather than a written slot.
    schedule-look-ahead-minutes = 720
    schedule-look-ahead-minutes = ${?RESPAWN_SCHEDULE_LOOK_AHEAD_MINUTES}
    // How far into their own slot its owner may still answer "are you hunting
    // tonight?" after somebody tried to book over it, before it passes to them.
    // The deadline is this far past the slot's start however early the question
    // was put — it was an hour from the asking, which took slots off people who
    // had simply been asked at lunchtime about an evening. Ten minutes is long
    // enough to cover logging in on time and short enough that the asker is not
    // left waiting on a no-show.
    booking-request-grace-minutes = 10
    booking-request-grace-minutes = ${?RESPAWN_BOOKING_REQUEST_GRACE_MINUTES}
    // Whether a booked slot claims itself when it comes round, rather than
    // asking its owner to press a button first. The default for a guild's first
    // setup; each guild then flips its own under Config -> Autoclaim.
    //
    // On, because the button was being pressed by everybody every time: a slot
    // its owner booked days ago is already a statement that they mean to hunt
    // it, and a confirmation nobody ever declines is a tax on turning up. What
    // it does not cover is a *contested* slot — somebody trying to book over one
    // still puts the "are you hunting tonight?" question to its owner, and that
    // question is still answered by hand. Autoclaim removes the confirmations
    // nobody asked for, not the one somebody did.
    auto-claim = true
    auto-claim = ${?RESPAWN_AUTO_CLAIM}
    // How long before a booked slot starts its owner gets a nudge. 0 = off, and
    // so does autoclaim above: with nothing to confirm the nudge is a DM about a
    // hunt that is going to start either way.
    slot-reminder-minutes = 15
    slot-reminder-minutes = ${?RESPAWN_SLOT_REMINDER_MINUTES}
    // How long after a booking starts on its own its owner has to say they are
    // actually there, before it is given up for them and the spawn moves on.
    // Confirming from the reminder beforehand settles it ahead of time.
    slot-confirm-minutes = 15
    slot-confirm-minutes = ${?RESPAWN_SLOT_CONFIRM_MINUTES}
    max-schedules-per-user = 5
    max-schedules-per-user = ${?RESPAWN_MAX_SCHEDULES_PER_USER}
    sweep-interval = 30s
    sweep-interval = ${?RESPAWN_SWEEP_INTERVAL}
    // How long a free spawn's post must go untouched before it is put back to
    // sleep. Clicking anything on an archived post re-opens it, and the buttons
    // a free spawn offers — Config, Book, and the forms they open — change no
    // claim state, so nothing else would ever close it again.
    //
    // 5m: long enough to cover reading a booking panel, opening the form,
    // thinking about it and pressing again without the post shutting mid-visit,
    // short enough that the forum's front page is still the spawns people are
    // actually on. A spawn that simply goes free is closed at once regardless —
    // this delay only applies to a post somebody has been clicking on.
    close-delay = 5m
    close-delay = ${?RESPAWN_CLOSE_DELAY}
    fallback-image = "https://www.tibiawiki.com.br/wiki/Special:Redirect/file/Sign_(Library).gif"
    fallback-image = ${?RESPAWN_FALLBACK_IMAGE}

    // Where creature sprites fetched from the wiki are kept so the member
    // dashboard can serve them from our own domain. That is not only about not
    // leaning on a third party: tibiawiki geoblocks some regions, so a page
    // that hotlinks it has no art at all for those visitors, while the VPS can
    // reach it perfectly well.
    //
    // Relative, so it lands beside the working directory in the container. Mount
    // a volume here to keep the cache across deploys — without one every
    // container recreate re-fetches the whole catalogue's sprites once, which
    // works but is needless traffic.
    sprite-cache-dir = "cache/sprites"
    sprite-cache-dir = ${?RESPAWN_SPRITE_CACHE_DIR}
  }
}

  allyguild-emoji = "<:guild:1077165703473418290>"
  otherguild-emoji = "<:otherguild:1077165707025985646>"
  enemyguild-emoji = "<:enemyguild:1153668299310252032>"
  ally-emoji = "<:ally:1191747022043234445>"
  enemy-emoji = "<:enemy:1153654156423336066>"
  mk-emoji = "<:mortalkombat:1024721079270387863>"
  zelos-emoji = "<a:zelos:1025028426182176848>"
  library-emoji = "<a:libraryfinal:1025031520009846814>"
  hod-emoji = "<a:hodfinal:1025057730865668137>"
  feru-emoji = "<a:ferufinal:1025059479533932634>"
  cube-emoji = "<:cube:1024718798277853296>"
  svar-green-emoji = "<:greenhorn:1024726063068217355>"
  svar-scrapper-emoji = "<:scrapper:1024725986211807343>"
  svar-warlord-emoji = "<:warlord:1024725929316077608>"
  inq-emoji = "<:inq:1025103806851199078>"
  kilmaresh-emoji = "<:kilmaresh:1030130198278058075>"

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Violent Bot - <!--TITLE--></title>
<link rel="icon" type="image/png" href="/dashboard/images/avatar.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
  /* Same tokens as the monitoring dashboard, so the two areas are recognisably
     one product even though they answer to different people. */
  :root {
    --bg: #0b0d12;
    --panel: #12151c;
    --panel-border: #1f2430;
    --text: #d7dce3;
    --text-strong: #e8ebf0;
    --muted: #7c8698;
    --accent: #5b8cff;
    --good: #3ecf8e;
    --warn: #e0a93e;
    --bad: #e0563e;
    --purple: #a78bfa;
    --dim: #5c6577;
    /* Discord's own brand colour. Only ever the sign-in control: on this page
       blurple means "you are about to be handed to Discord", so nothing else
       may borrow it. */
    --blurple: #5865f2;
    --blurple-hi: #6b77f5;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.014) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.014) 1px, transparent 1px);
    background-size: 46px 46px;
  }
  main { max-width: 900px; margin: 0 auto; padding: 40px 24px 80px; }

  .brand {
    display: flex; align-items: center; gap: 10px; margin-bottom: 30px;
    font-family: var(--mono); font-size: 14px; font-weight: 600;
    letter-spacing: -0.01em; color: var(--text-strong);
  }
  .brand img { width: 32px; height: 32px; border-radius: 8px; }
  .brand .suffix { color: var(--muted); font-weight: 400; margin-left: 4px; }

  h1 { font-family: var(--mono); font-size: 20px; font-weight: 600; letter-spacing: -0.01em; color: var(--text-strong); margin: 0 0 10px; }
  p { color: var(--muted); font-size: 13.5px; line-height: 1.65; margin: 0 0 10px; max-width: 62ch; }
  p.hint { font-size: 12.5px; opacity: 0.85; }
  /* A picker that is short because something failed says so here. Warn-coloured
     rather than red: nothing is broken for the visitor, and the list below is
     still usable — this is "there may be more" and not "something went wrong
     with what you can see". */
  p.hint.warn {
    display: flex; gap: 8px; align-items: flex-start;
    margin-top: 14px; padding: 9px 12px; border-radius: 7px;
    background: rgba(224, 169, 62, 0.09); border: 1px solid rgba(224, 169, 62, 0.25);
    color: var(--warn); opacity: 1;
  }
  p.hint.warn i { flex-shrink: 0; font-size: 14px; margin-top: 1px; }
  p.hint.warn strong { color: var(--warn); }
  em { color: var(--text); font-style: normal; font-weight: 600; }
  strong { color: var(--text-strong); }

  .empty, .picker, .board-stub {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 10px; padding: 30px 32px;
  }
  .empty { text-align: center; }
  .empty > i { font-size: 34px; color: var(--muted); display: block; margin-bottom: 14px; }
  .empty p { margin-left: auto; margin-right: auto; }

  .btn {
    display: inline-block; margin-top: 16px;
    background: var(--accent); border: 1px solid var(--accent); border-radius: 6px;
    color: var(--bg); font-size: 12.5px; font-weight: 600; padding: 7px 16px;
    text-decoration: none;
  }
  .btn:hover { filter: brightness(1.08); }

  /* ---- sign-in screens ------------------------------------------------- */
  .empty.auth { max-width: 27rem; margin-left: auto; margin-right: auto; }

  /* Two faces and the connection between them, borrowed from Discord's own
     authorise screen: people have seen this composition and know what the
     button under it does before reading a word.

     The state of the wire is the whole message. Waiting to be joined on the
     reconnect screen; joined and green, running into an empty slot, when the
     sign-in worked and there was simply nothing on the other end. */
  .shake { display: flex; align-items: center; justify-content: center; margin-bottom: 22px; }
  .shake .face, .shake .disc, .shake .slot {
    width: 46px; height: 46px; border-radius: 12px; flex-shrink: 0;
    display: grid; place-items: center;
  }
  .shake .face { object-fit: cover; }
  .shake .disc { background: var(--blurple); color: #fff; }
  .shake .disc i { font-size: 26px; }
  .shake .slot { border: 1px dashed var(--panel-border); color: var(--dim); }
  .shake .slot i { font-size: 20px; }
  .shake .wire {
    width: 46px; height: 1px; position: relative;
    background: linear-gradient(90deg, var(--panel-border), var(--muted), var(--panel-border));
  }
  .shake .wire::after {
    content: ""; position: absolute; inset: 0; margin: auto;
    width: 5px; height: 5px; border-radius: 50%; background: var(--muted);
  }
  .shake .wire.done { background: linear-gradient(90deg, var(--panel-border), var(--good), var(--panel-border)); }
  .shake .wire.done::after { background: var(--good); box-shadow: 0 0 0 3px rgba(62, 207, 142, 0.15); }

  .btn-discord {
    display: flex; align-items: center; justify-content: center; gap: 9px;
    width: 100%; margin-top: 20px; padding: 10px 18px; border-radius: 7px;
    background: var(--blurple); border-color: var(--blurple); color: #fff;
    font-size: 13px;
  }
  .btn-discord:hover { background: var(--blurple-hi); border-color: var(--blurple-hi); filter: none; }
  .btn-discord i { font-size: 17px; }

  /* Under a rule, so it reads as an aside to the button rather than a second
     instruction competing with it. */
  .foot {
    font-size: 12px; color: var(--dim); line-height: 1.55;
    margin: 18px 0 0; padding-top: 15px; border-top: 1px solid var(--panel-border);
  }

  .choices { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
  .choice {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px;
    background: rgba(255, 255, 255, 0.02); border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 12px 14px; text-decoration: none;
  }
  .choice:hover { border-color: var(--accent); }
  .choice-name { color: var(--text-strong); font-size: 13.5px; font-weight: 600; }
  .choice-meta { grid-column: 1; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  /* Tier sits on its own row on the right so a long guild name never squeezes it. */
  .tier {
    grid-column: 2; grid-row: 1 / span 2; align-self: center;
    font-family: var(--mono); font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.08em; border-radius: 4px; padding: 2px 7px;
  }
  .tier-member { background: rgba(255, 255, 255, 0.06); color: var(--muted); }
  .tier-moderator { background: rgba(91, 140, 255, 0.15); color: var(--accent); }
  .tier-admin { background: rgba(167, 139, 250, 0.15); color: var(--purple); }

  @media (max-width: 620px) { main { padding: 24px 12px 50px; } .empty, .picker, .board-stub { padding: 22px 18px; } }
</style>
</head>
<body>
<main>
  <div class="brand">
    <img src="/dashboard/images/avatar.png" alt="">
    <span>Violent Bot<span class="suffix">/respawns</span></span>
  </div>
  <!--BODY-->
</main>
</body>
</html>

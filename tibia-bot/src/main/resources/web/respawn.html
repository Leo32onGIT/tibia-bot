<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Violent Bot - <!--TITLE--></title>
<link rel="icon" type="image/png" href="/dashboard/images/avatar.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
  /* Same tokens as the monitoring dashboard, so the two areas are recognisably
     one product even though they answer to different people. */
  :root {
    --bg: #0b0d12;
    --panel: #12151c;
    --panel-border: #1f2430;
    --text: #d7dce3;
    --text-strong: #e8ebf0;
    --muted: #7c8698;
    --accent: #5b8cff;
    --good: #3ecf8e;
    --warn: #e0a93e;
    --bad: #e0563e;
    --purple: #a78bfa;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.014) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.014) 1px, transparent 1px);
    background-size: 46px 46px;
  }
  main { max-width: 900px; margin: 0 auto; padding: 40px 24px 80px; }

  .brand {
    display: flex; align-items: center; gap: 10px; margin-bottom: 30px;
    font-family: var(--mono); font-size: 14px; font-weight: 600;
    letter-spacing: -0.01em; color: var(--text-strong);
  }
  .brand img { width: 32px; height: 32px; border-radius: 8px; }
  .brand .suffix { color: var(--muted); font-weight: 400; margin-left: 4px; }

  h1 { font-family: var(--mono); font-size: 20px; font-weight: 600; letter-spacing: -0.01em; color: var(--text-strong); margin: 0 0 10px; }
  p { color: var(--muted); font-size: 13.5px; line-height: 1.65; margin: 0 0 10px; max-width: 62ch; }
  p.hint { font-size: 12.5px; opacity: 0.85; }
  em { color: var(--text); font-style: normal; font-weight: 600; }
  strong { color: var(--text-strong); }

  .empty, .picker, .board-stub {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 10px; padding: 30px 32px;
  }
  .empty { text-align: center; }
  .empty i { font-size: 34px; color: var(--muted); display: block; margin-bottom: 14px; }
  .empty p { margin-left: auto; margin-right: auto; }

  .btn {
    display: inline-block; margin-top: 16px;
    background: var(--accent); border: 1px solid var(--accent); border-radius: 6px;
    color: var(--bg); font-size: 12.5px; font-weight: 600; padding: 7px 16px;
    text-decoration: none;
  }
  .btn:hover { filter: brightness(1.08); }

  .choices { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
  .choice {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px;
    background: rgba(255, 255, 255, 0.02); border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 12px 14px; text-decoration: none;
  }
  .choice:hover { border-color: var(--accent); }
  .choice-name { color: var(--text-strong); font-size: 13.5px; font-weight: 600; }
  .choice-meta { grid-column: 1; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  /* Tier sits on its own row on the right so a long guild name never squeezes it. */
  .tier {
    grid-column: 2; grid-row: 1 / span 2; align-self: center;
    font-family: var(--mono); font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.08em; border-radius: 4px; padding: 2px 7px;
  }
  .tier-member { background: rgba(255, 255, 255, 0.06); color: var(--muted); }
  .tier-moderator { background: rgba(91, 140, 255, 0.15); color: var(--accent); }
  .tier-admin { background: rgba(167, 139, 250, 0.15); color: var(--purple); }

  @media (max-width: 620px) { main { padding: 24px 12px 50px; } .empty, .picker, .board-stub { padding: 22px 18px; } }
</style>
</head>
<body>
<main>
  <div class="brand">
    <img src="/dashboard/images/avatar.png" alt="">
    <span>Violent Bot<span class="suffix">/respawns</span></span>
  </div>
  <!--BODY-->
</main>
</body>
</html>

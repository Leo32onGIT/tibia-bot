<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Violent Bot - <!--TITLE--></title>
<link rel="icon" type="image/png" href="/dashboard/images/avatar.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
  :root {
    --bg: #0b0d12; --panel: #12151c; --panel-border: #1f2430;
    --text: #d7dce3; --text-strong: #e8ebf0; --muted: #7c8698;
    --accent: #5b8cff; --warn: #e0a93e; --bad: #e0563e; --purple: #a78bfa;

    /* Lifted from the Discord side so a spawn looks the same in both places:
       the code colour is RespawnBoardImage.CodeColor, free and claimed are
       RespawnEmbeds' own FreeColor and RedColor. */
    --code: #f0b232;
    --spawn-name: #e8e9ea;

    /* One definition for every state, used by the cards and by the calendar
       inside the spawn window. Booked and confirmed share a hue deliberately: a
       confirmed slot is the same booking with the question settled, so it reads
       as a stronger version of it (dashed outline -> solid, plus a tick) rather
       than a fourth colour. That keeps the palette three hues wide, which stays
       legible with a red-green colour vision deficiency, and the tick carries
       the distinction with no colour at all. */
    --st-free: #2ecc71;
    --st-claimed: #d23369;
    --st-booked: #5b8cff;
    --st-confirmed: #5b8cff;
    --st-asked: #e0a93e;

    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px;
    background-image:
      linear-gradient(rgba(255,255,255,0.014) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.014) 1px, transparent 1px);
    background-size: 46px 46px;
  }
  /* A page that cannot move cannot drag the window about with it. The spawn
     window is `position: fixed`, and on a phone a fixed element is only really
     fixed while the document behind it is still: rubber-banding at either end of
     the board — or the address bar sliding in and out on the way — repaints it a
     frame late and the whole panel jitters under the thumb. So while the window
     is up the document is pinned where it stood, and put back on the way out.
     `top` is written by the script, since pinning it at 0 would otherwise scroll
     the board back to the beginning behind the window. */
  body.locked { position: fixed; left: 0; right: 0; width: 100%; overflow: hidden; overscroll-behavior: none; }
  main { max-width: 1180px; margin: 0 auto; padding: 26px 24px 70px; }
  .muted { color: var(--muted); }

  .masthead {
    background: rgba(255,255,255,0.02); border: 1px solid var(--panel-border); border-radius: 8px;
    padding: 13px 18px; margin-bottom: 18px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 14px; font-weight: 600; letter-spacing: -0.01em; color: var(--text-strong); }
  .brand img { width: 32px; height: 32px; border-radius: 8px; }
  .brand .sub { display: block; font-size: 10px; font-weight: 400; color: var(--muted); letter-spacing: 0.04em; margin-top: 3px; }
  /* Which Discord this board belongs to. Somebody can be a member of several
     communities that run the bot, and every code, every claim and every booking
     on the page belongs to exactly one of them — so the name is stated rather
     than left to be inferred from the tab. The Discord glyph is what says the
     name is a server's and not the board's. */
  .brand .server { display: inline-flex; align-items: center; gap: 6px; color: inherit; text-decoration: none; min-width: 0; }
  .brand .server i { font-size: 13px; color: var(--muted); }
  /* Which page of the bot this is, in the same muted voice /status wears after
     the bot's name — so the two mastheads read as the same family. */
  .brand-suffix { color: var(--muted); font-weight: 400; margin-left: 4px; }

  /* ---- Switching server --------------------------------------------------
     A menu under the name rather than a link to a page of choices: swapping
     server is a thing you do from a board, and throwing that board away to be
     asked a question is a poor trade for one press. Drawn server-side — see
     RespawnDashboardRoute.serverChip — and only when there is more than one
     server to switch to; the single-server case stays the plain label above and
     never grows a chevron. */
  .sw { position: relative; display: inline-flex; min-width: 0; }
  /* The server's name, given a ceiling and cut with an ellipsis rather than
     allowed to set the masthead's width.
     Without one it wrapped: the button is inline-flex and the name was a bare
     anonymous item with nothing telling it to stay on one line, so a long name
     broke across three of them and painted up out of the header and over the
     page behind it. A fixed width and a clean cut is the whole of the fix —
     the full name is on the row in the menu below, and in the title. */
  /* `flex: 0 0 auto` and not a bare max-width: as a flex item it would
     otherwise be free to shrink, and on a narrow screen — where the row beside
     it takes the full width — it shrank all the way to nothing and the name
     disappeared entirely. This takes its content's width up to the ceiling, and
     gives up none of it. */
  .sw-title { flex: 0 0 auto; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sw-btn {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer; min-width: 0;
    background: transparent; border: 1px solid transparent; border-radius: 7px;
    padding: 4px 8px; margin: -4px -8px;
    color: inherit; font-family: inherit; font-size: inherit; font-weight: inherit; letter-spacing: inherit;
  }
  .sw-btn > i { font-size: 13px; color: var(--muted); }
  .sw-btn:hover { background: rgba(255,255,255,0.04); border-color: var(--panel-border); }
  .sw-btn .chev { font-size: 11px; opacity: 0.7; transition: transform 0.15s ease; }
  .sw.open .sw-btn { background: rgba(255,255,255,0.05); border-color: var(--panel-border); }
  .sw.open .sw-btn .chev { transform: rotate(180deg); }
  .sw-menu {
    position: absolute; top: calc(100% + 7px); left: -8px; z-index: 30;
    min-width: 260px; max-width: 340px;
    background: var(--panel); border: 1px solid #2a3142; border-radius: 10px;
    box-shadow: 0 18px 44px rgba(0,0,0,0.6); padding: 5px; display: none;
    max-height: 320px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #2a3140 transparent;
  }
  .sw.open .sw-menu { display: block; }
  .sw-label {
    display: block; font-family: var(--mono); font-size: 9px; text-transform: uppercase;
    letter-spacing: 0.12em; color: var(--muted); padding: 7px 10px 5px;
  }
  .sw-item {
    display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 7px;
    color: var(--text); text-decoration: none; font-family: var(--sans); font-weight: 400;
  }
  .sw-item:hover { background: rgba(255,255,255,0.05); }
  .sw-item.on { background: rgba(91,140,255,0.13); }
  /* The server's own face. Sized to the row rather than to the brand mark above
     — this is a list to pick from, not a masthead — and squared off with the
     same radius the bot's own avatar wears.
     Written as `.sw-item .sw-icon` and not `.sw-icon`, because the menu lives
     inside .brand and `.brand img` would otherwise win on specificity and blow
     every avatar up to the masthead's 32px. */
  .sw-item .sw-icon {
    width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
    object-fit: cover; background: rgba(255,255,255,0.05);
  }
  /* What a guild with no icon of its own gets, in exactly the space the icon
     would have taken — same width so the names line up down the column, same
     height so the rows do. */
  .sw-glyph {
    width: 22px; height: 22px; font-size: 14px; line-height: 22px;
    color: var(--muted); flex-shrink: 0; text-align: center;
  }
  .sw-item.on .sw-glyph { color: var(--accent); }
  .sw-name { flex: 1; min-width: 0; font-size: 13px; color: var(--text-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Reusing the masthead's tier colours, so what "moderator" looks like is one
     thing across the page. */
  .sw-item .tier { flex-shrink: 0; }
  .sw-check { color: var(--accent); font-size: 14px; flex-shrink: 0; }
  .tier { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; border-radius: 4px; padding: 2px 7px; }
  .tier-member { background: rgba(255,255,255,0.06); color: var(--muted); }
  .tier-moderator { background: rgba(91,140,255,0.15); color: var(--accent); }
  .tier-admin { background: rgba(167,139,250,0.15); color: var(--purple); }
  .masthead-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .filter {
    background: rgba(255,255,255,0.02); border: 1px solid var(--panel-border); border-radius: 6px;
    color: var(--text); font-family: var(--mono); font-size: 12px; padding: 6px 10px; width: 190px;
  }
  .filter::placeholder { color: var(--muted); font-family: var(--sans); }
  .filter:focus { outline: none; border-color: var(--accent); }
  .stale-note { font-family: var(--mono); font-size: 11px; color: var(--warn); }

  .panel { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; overflow: hidden; }
  .panel-title {
    padding: 12px 16px; font-family: var(--mono); font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted);
    border-bottom: 1px solid var(--panel-border); display: flex; align-items: center; gap: 8px;
  }
  .panel-title::before { content: '##'; color: var(--accent); letter-spacing: normal; }
  .panel-title .right { margin-left: auto; text-transform: none; letter-spacing: normal; font-weight: 400; font-size: 11px; }

  .legend { display: flex; gap: 15px; padding: 10px 16px; flex-wrap: wrap; border-bottom: 1px solid var(--panel-border); }
  .legend span { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
  /* The board legend's colour key. Named `key`, not `sw`, which the server
     switcher above already owns: two unrelated components sharing that class
     meant this rule — being the later one — sized the switcher to 12 by 12,
     its contents spilled out of a box that small, and the tier chip beside it
     was laid out on top of them. */
  .key { width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0; border: 1.5px solid; }
  .key-free { border-color: var(--st-free); background: rgba(46,204,113,0.26); }
  .key-claimed { border-color: var(--st-claimed); background: rgba(210,51,105,0.3); }
  .key-booked { border-color: var(--st-booked); background: transparent; border-style: dashed; }
  .key-confirmed { border-color: var(--st-confirmed); background: var(--st-confirmed); }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(248px, 1fr)); gap: 10px; padding: 14px 16px; }
  .card {
    position: relative; overflow: hidden; cursor: pointer;
    background: rgba(255,255,255,0.02); border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 10px 12px;
  }
  .card:hover { border-color: var(--accent); }
  /* State also shows as a hairline down the leading edge, because on a busy
     watermark the dot alone gets lost against the art. */
  .card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--edge, transparent); }

  /* Never mirrored. Tibia sprites are drawn facing a deliberate direction and
     flipping one reads as wrong art rather than as a design choice — and it
     would disagree with the same creature shown the right way round in the
     Discord thread's thumbnail. */
  .sprite {
    position: absolute; right: -10px; bottom: -12px; width: 84px; height: 84px;
    opacity: 0.17; pointer-events: none;
    image-rendering: pixelated; object-fit: contain;
    filter: grayscale(var(--drain, 0));
  }
  /* The avatar stand-in is always fully drained — it is a placeholder for
     missing art and must never be the brightest thing on a board of real
     sprites. */
  .sprite.placeholder { filter: grayscale(1); opacity: 0.1; }

  .card-body { position: relative; }
  .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .code-chip {
    display: inline-flex; align-items: center; font-family: var(--mono); font-weight: 700;
    font-size: 12px; font-variant-numeric: tabular-nums; color: var(--code);
    background: rgba(240,178,50,0.13); border: 1px solid rgba(240,178,50,0.32);
    border-radius: 5px; padding: 2px 7px; flex-shrink: 0;
  }
  .code-chip.live { color: #ffd98a; border-color: rgba(240,178,50,0.75); animation: pulse 2.6s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(240,178,50,0.42); } 70% { box-shadow: 0 0 0 6px rgba(240,178,50,0); } 100% { box-shadow: 0 0 0 0 rgba(240,178,50,0); } }
  @media (prefers-reduced-motion: reduce) { .code-chip.live { animation: none; box-shadow: 0 0 0 2px rgba(240,178,50,0.3); } }

  .spawn-name { color: var(--spawn-name); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .age { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .card-state { display: flex; align-items: center; gap: 6px; font-size: 11.5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; border: 1.5px solid; }
  .dot.free { border-color: var(--st-free); background: var(--st-free); }
  .dot.claimed { border-color: var(--st-claimed); background: var(--st-claimed); }
  .dot.booked { border-color: var(--st-booked); background: transparent; }
  .dot.confirmed { border-color: var(--st-confirmed); background: var(--st-confirmed); }
  .who { font-family: var(--mono); font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who.free { color: var(--st-free); }
  .tick { font-size: 11px; color: var(--st-confirmed); flex-shrink: 0; }
  .queue { font-family: var(--mono); font-size: 10px; color: var(--muted); flex-shrink: 0; }
  .card-state .queue { margin-left: auto; }

  .card-bar { height: 3px; border-radius: 2px; background: rgba(255,255,255,0.07); margin-top: 8px; overflow: hidden; }
  .card-bar span { display: block; height: 100%; border-radius: 2px; background: var(--st-claimed); transition: width 1s linear; }

  .empty-note { padding: 26px 16px; color: var(--muted); font-size: 13px; text-align: center; }

  /* ---- The spawn window ---------------------------------------------------
     One window per spawn, big enough to hold the whole decision: what is
     happening on it now, and the week it is booked into. Booking used to be a
     link somewhere else, which made planning a hunt feel like a separate errand
     from taking one — they are the same thought, so they are one window. */
  .veil { position: fixed; inset: 0; background: rgba(4,5,8,0.72); backdrop-filter: blur(2px); z-index: 40; display: none; }
  .veil.open { display: block; }
  .window {
    position: fixed; z-index: 41; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(1120px, calc(100vw - 28px)); height: min(792px, calc(100vh - 40px));
    background: var(--panel); border: 1px solid #2a3142; border-radius: 14px;
    box-shadow: 0 30px 90px rgba(0,0,0,0.6);
    display: none; overflow: hidden;
    /* Nothing inside hands its leftover scroll to the page behind it. Reaching
       the bottom of the week and carrying on used to bounce the document, which
       is the other half of the jitter the body lock deals with. */
    overscroll-behavior: contain;
  }
  .window.open { display: flex; flex-direction: column; }

  /* The creature, filling the window rather than tucked in a corner. Kept far
     enough back that everything on top of it stays readable — the scrim does
     that work, so the art can be large without becoming noise. Never mirrored,
     for the same reason as the card sprites. */
  .watermark {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; object-position: center 46%;
    image-rendering: pixelated; pointer-events: none; user-select: none;
    opacity: 0.09; filter: saturate(0.85);
  }
  .watermark.placeholder { opacity: 0.05; filter: grayscale(1); }
  .scrim {
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(120% 90% at 50% 45%, rgba(18,21,28,0.12) 0%, rgba(18,21,28,0.7) 62%, rgba(18,21,28,0.93) 100%),
      linear-gradient(rgba(18,21,28,0.55), rgba(18,21,28,0.18) 30%, rgba(18,21,28,0.75));
  }
  .window > .win-head, .window > .win-body { position: relative; }

  /* One row, always. Wrapping put the close button on a line of its own the
     moment a long spawn name met a narrow phone, which cost a row of the panel
     and moved the one control that should never move. So the row does not wrap
     and the two things that can be any length give way instead: the region
     first — where a spawn is, is the least of what this row says — and the name
     ellipsises only once that is gone. */
  .win-head { display: flex; align-items: center; gap: 12px; padding: 15px 20px 13px; border-bottom: 1px solid var(--panel-border); flex-wrap: nowrap; }
  .win-head .code-chip { font-size: 15px; padding: 4px 11px; border-radius: 7px; flex-shrink: 0; }
  .win-title {
    font-size: 17px; color: var(--text-strong); font-weight: 600; letter-spacing: -0.01em;
    flex: 0 1 auto; min-width: 3ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* A shrink factor far above the title's, so this is what disappears first. */
  .win-region {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    flex: 0 100 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .win-close { margin-left: auto; background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; line-height: 1; padding: 0 2px; flex-shrink: 0; }
  .win-close:hover { color: var(--text-strong); }
  /* A column, so the week inside it can be handed whatever height is left over
     rather than guessing at it. `min-height: 0` on each link of that chain is
     what lets a flex child be *shorter* than its contents — without it every
     one of them sizes to the full grid and the panel grows past the window,
     which is the scrolling this is meant to do away with. */
  .win-body { flex: 1; min-height: 0; display: flex; flex-direction: column;
              overflow-y: auto; overscroll-behavior: contain;
              scrollbar-width: thin; scrollbar-color: #2a3140 transparent; }
  .cal-section.open, .cal { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .win-body::-webkit-scrollbar { width: 10px; }
  .win-body::-webkit-scrollbar-track { background: transparent; }
  .win-body::-webkit-scrollbar-thumb { background: #2a3140; border-radius: 5px; border: 3px solid var(--panel); background-clip: padding-box; }

  .strip {
    display: flex; align-items: center; gap: 11px; padding: 10px 20px; flex-wrap: wrap;
    border-bottom: 1px solid var(--panel-border); font-size: 12px; color: var(--muted);
  }
  .strip i { font-size: 14px; }
  .now-strip { background: rgba(255,255,255,0.02); }
  .fold { cursor: pointer; user-select: none; }
  .fold:hover { background: rgba(255,255,255,0.03); }
  .fold-title { color: var(--text-strong); font-weight: 600; font-size: 12.5px; }
  .fold-chevron { transition: transform 0.15s ease; margin-left: auto; }
  .fold.open .fold-chevron { transform: rotate(180deg); }
  /* The standing instructions, belonging to the heading above them rather than to
     the top of the panel: same block, no rule between, indented to the title so
     they read as its second line. Which also means they go with the week when it
     is folded away, along with everything they are about. */
  .fold-hint {
    border-bottom: 1px solid var(--panel-border); padding: 0 20px 9px 46px;
    margin-top: -3px; font-size: 11.5px; line-height: 1.45; color: var(--muted);
  }

  /* ---- Up next -----------------------------------------------------------
     What is actually coming to this spawn, which "+2 queued" never said. The
     queue first — it happens soonest, and its times run off the hunt on now —
     then bookings by start. Shut by default: it is reference, not the thing
     anybody opened the panel to do, and its header carries the one row worth
     having without opening it.

     A rail with a pip per entry rather than a table, because the list is short
     and in time order, and a rail reads as an evening where a table reads as
     data. */
  .up-head {
    display: flex; align-items: center; gap: 9px; padding: 9px 20px;
    border-bottom: 1px solid var(--panel-border); font-size: 12px; color: var(--muted);
    cursor: pointer; user-select: none;
  }
  .up-head:hover { background: rgba(255,255,255,0.03); }
  .up-head .fold-chevron { transform: rotate(180deg); }
  .up-head.open .fold-chevron { transform: rotate(0deg); }
  .up-peek {
    font-family: var(--mono); font-size: 11px; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .up-peek b { color: var(--text); font-weight: 600; }
  .up-count {
    font-family: var(--mono); font-size: 10px; padding: 1px 6px; border-radius: 9px;
    background: rgba(255,255,255,0.05); color: var(--muted); flex-shrink: 0; margin-left: auto;
  }
  .up-list {
    border-bottom: 1px solid var(--panel-border); padding: 6px 20px 9px;
    max-height: 190px; overflow-y: auto; overscroll-behavior: contain;
    scrollbar-width: thin; scrollbar-color: #2a3140 transparent;
    font-family: var(--mono); font-size: 11.5px;
  }
  /* Fixed tracks throughout, and a width on the trailing one: a column that only
     some rows fill is a column that moves. */
  .up-row {
    display: grid; grid-template-columns: 58px 14px minmax(0, 1fr) 44px;
    gap: 8px; align-items: center; padding: 5px 0; line-height: 1.4;
  }
  .up-when { text-align: right; color: var(--text-strong); font-variant-numeric: tabular-nums; }
  .up-when small { display: block; font-size: 9px; color: var(--muted); }
  /* The rail is drawn off each row's own box, joining pip to pip, and stops at
     the first and last so it does not dangle past either end of the list. */
  .up-rail { position: relative; height: 100%; display: flex; align-items: center; justify-content: center; }
  .up-rail::before {
    content: ''; position: absolute; top: -50%; bottom: -50%; left: 50%; width: 1px;
    background: var(--panel-border); transform: translateX(-0.5px);
  }
  .up-row:first-child .up-rail::before { top: 50%; }
  .up-row:last-child .up-rail::before { bottom: 50%; }
  .up-pip { position: relative; width: 7px; height: 7px; border-radius: 50%; background: var(--st-booked); }
  .up-queued .up-pip { background: var(--st-claimed); }
  .up-asked .up-pip { background: var(--st-asked); }
  .up-mine .up-pip { background: var(--st-free); }
  .up-body { min-width: 0; }
  .up-who { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .up-sub { color: var(--muted); font-size: 10px; }
  /* A booking's countdown is definite and coloured; a queue place's is a
     projection off hunts that may not run their length, so it stays muted. */
  .up-sub .up-rel { color: var(--accent); }
  .up-queued .up-sub .up-rel { color: var(--muted); }
  .up-tag {
    font-family: var(--sans); font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.09em;
    padding: 1px 5px; border-radius: 3px; justify-self: end;
  }
  .up-tag.queue { color: var(--st-claimed); background: rgba(210,51,105,0.16); }
  .up-tag.asked { color: var(--st-asked); background: rgba(224,169,62,0.16); }
  .up-tag.you { color: var(--st-free); background: rgba(46,204,113,0.16); }
  .up-more { font-family: var(--mono); font-size: 10.5px; color: var(--muted); padding-top: 6px; }
  .field { display: flex; align-items: center; gap: 7px; }
  .field-label { font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
  .live-bar { flex: 1; min-width: 80px; max-width: 220px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.08); overflow: hidden; }
  .live-bar span { display: block; height: 100%; background: var(--st-claimed); transition: width 1s linear; }

  .seg { display: flex; border: 1px solid var(--panel-border); border-radius: 6px; overflow: hidden; }
  .seg button {
    background: transparent; border: none; border-left: 1px solid var(--panel-border);
    color: var(--muted); font-family: var(--mono); font-size: 11px; padding: 4px 9px; cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .seg button:first-child { border-left: none; }
  .seg button:hover { background: rgba(255,255,255,0.04); color: var(--text); }
  .seg button.on { background: rgba(91,140,255,0.18); color: #cfdcff; }

  .dur-cap { font-family: var(--mono); font-size: 10px; color: var(--muted); }

  /* ---- How long: the day's tank ------------------------------------------
     Not a nought-to-ceiling slider but the stamina itself — grey for what today
     has already taken, accent for what this hunt would take, empty for what
     would be left. The ceiling stops being a rule that refuses you and becomes
     the end of the bar, which you can see yourself approaching.
     It is also why the strip above no longer carries a stamina readout of its
     own: that was the same quantity stated twice, once as a bar you could not
     touch and once as a number, and neither of them was the thing you were
     about to change. */
  .tank {
    display: block; position: relative; width: 240px; height: 34px; border-radius: 8px;
    border: 1px solid var(--panel-border); background: rgba(255,255,255,0.02);
    overflow: hidden; touch-action: none; user-select: none; cursor: ew-resize;
  }
  .tank:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* Nothing to set when there is nothing left to spend. Still drawn, because a
     full grey bar is the clearest possible statement of why. */
  .tank[aria-disabled="true"] { cursor: default; }
  .tank-zones { position: absolute; inset: 5px; border-radius: 4px; background: rgba(255,255,255,0.05); overflow: hidden; display: flex; }
  .tank-spent { background: rgba(124,134,152,0.3); }
  .tank-hunt { background: var(--accent); }
  /* Where this hunt would end. */
  .tank-edge {
    position: absolute; top: 3px; bottom: 3px; width: 3px; border-radius: 2px;
    background: var(--text-strong); box-shadow: 0 0 6px rgba(0,0,0,0.7); z-index: 2; pointer-events: none;
  }
  /* The guild's own ceiling, drawn only when it bites before the tank does.
     Without it the bar would just stop following the finger part way along with
     nothing on screen to say why. */
  .tank-cap { position: absolute; top: 4px; bottom: 4px; border-left: 1px dashed var(--warn); opacity: 0.75; z-index: 1; pointer-events: none; }
  /* Each figure inside the block it is about, both sliding with the boundary. */
  .tank-in, .tank-out {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 3;
    white-space: nowrap; pointer-events: none; font-family: var(--mono); font-variant-numeric: tabular-nums;
  }
  .tank-in { font-size: 12.5px; font-weight: 600; color: #06122e; }
  /* A short hunt is narrower than the word for it, so the figure steps outside
     the block and takes the page's own text colour to stay readable. */
  .tank-in.outside { color: var(--text-strong); }
  .tank-out { font-size: 10.5px; color: var(--muted); }
  /* The blue has reached it and is now behind it, so it wears the blue's type
     colour rather than moving out of the way. */
  .tank-out.on-hunt { color: #06122e; font-weight: 600; }

  /* The booking controls, in named groups rather than one flat run of spans.
     On a wide panel the groups sit on one line and read exactly as they did; on
     a phone each becomes a row of its own, which is the only way any of them can
     be centred — a flat strip left to wrap puts things wherever they happen to
     fall, which is how "Once | Weekly" ended up off to one side. */
  .cal-controls { gap: 10px 14px; }
  .cc-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .cc-week { margin-left: auto; gap: 10px; }

  .btn {
    background: var(--accent); border: 1px solid var(--accent); border-radius: 6px;
    color: var(--bg); font-size: 12.5px; font-weight: 600; padding: 6px 15px; cursor: pointer;
    /* Inline-flex so a button that carries an icon spaces it from its label
       without every such button having to say so itself. A button with only a
       label is laid out exactly as it was. */
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn > i { font-size: 14px; line-height: 1; }
  .btn:hover:not([disabled]) { filter: brightness(1.08); }
  .btn[disabled] { background: transparent; color: var(--muted); border-color: var(--panel-border); cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--text); border-color: var(--panel-border); }
  .btn.ghost:hover:not([disabled]) { border-color: var(--accent); }
  .btn.danger { background: transparent; color: var(--st-claimed); border-color: rgba(210,51,105,0.5); }
  .btn.danger:hover:not([disabled]) { background: rgba(210,51,105,0.12); }
  .btn.small { font-size: 11px; padding: 4px 10px; }
  .btn.mod-btn { background: transparent; color: var(--purple); border-color: rgba(167,139,250,0.4); }
  .btn.mod-btn:hover:not([disabled]) { background: rgba(167,139,250,0.12); }
  /* Claiming is green here because it is green in Discord — Button.success on
     the same action, wearing the same emoji. Somebody who has used the one
     should recognise the other without reading it. */
  .btn.claim { background: var(--st-free); border-color: var(--st-free); color: #06301a; }
  .btn.claim[disabled] { background: transparent; border-color: var(--panel-border); }
  .btn-emoji { width: 15px; height: 15px; flex-shrink: 0; }
  .btn[disabled] .btn-emoji { opacity: 0.4; filter: grayscale(1); }

  /* Everything the panel has to say, on one row of its own above the row you act
     on. A verdict about the slot selected and a reply to something just pressed
     are the same kind of thing at different moments, so they share a row rather
     than stacking two — and the reply wins while there is one, being the newer
     news. The row below never changes height, so the button never moves; this
     one grows upward instead. */
  .foot-msg {
    padding: 9px 20px; border-top: 1px solid var(--panel-border);
    display: flex; align-items: flex-start; gap: 8px; font-size: 12.5px; line-height: 1.45;
  }
  .foot-msg > i { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
  .foot-msg.ok { color: var(--st-free); }
  .foot-msg.no { color: var(--st-asked); }
  /* Sized by its content and never scrolled away, so neither the button nor a
     reply can be left off the bottom of a panel whose body is taller than the
     window. Its children carry their own top borders, so it adds none. */
  .win-foot { position: relative; flex-shrink: 0; }
  .win-foot[hidden] { display: none; }

  /* Moderator tools, walled off from the member ones. Acting on somebody else's
     claim is a different kind of act from taking a free spawn, and a strip that
     mixed them would make it easy to do the first while meaning the second. */
  .mod { border-top: 1px dashed var(--panel-border); padding: 12px 20px 18px; display: flex; flex-direction: column; gap: 9px; }
  .mod-title { font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--purple); display: flex; align-items: center; gap: 6px; }
  .mod-row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }

  /* ---- Week grid ---------------------------------------------------------- */
  .cal-legend { display: flex; gap: 14px; padding: 9px 20px; border-bottom: 1px solid var(--panel-border); flex-wrap: wrap; }
  .cal-legend span { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
  .swatch { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; border: 1.5px solid; }
  .sw-claimed { border-color: var(--st-claimed); background: rgba(210,51,105,0.3); }
  .sw-booked { border-color: var(--st-booked); background: transparent; border-style: dashed; }
  .sw-confirmed { border-color: var(--st-confirmed); background: var(--st-confirmed); }
  .sw-asked { border-color: var(--st-asked); background: rgba(224,169,62,0.28); }
  .sw-pick { border-color: var(--purple); border-style: dashed; background: rgba(167,139,250,0.4); }

  /* The headings ride inside the scroller with the columns they name, stuck to
     its top. They used to be a grid of their own above it, which is fine while
     the week is only ever as wide as the panel — but a phone shows four days of
     seven and slides sideways for the rest, and a heading row outside that
     movement would sit still while its own columns went past underneath. */
  .wk-headrow, .wk-rows { display: grid; grid-template-columns: var(--gutter, 56px) repeat(7, 1fr); }
  .wk-headrow { position: sticky; top: 0; z-index: 7; background: var(--panel); }
  .wk-head { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); text-align: center; padding: 8px 0 7px; border-bottom: 1px solid var(--panel-border); }
  .wk-head.today { color: var(--accent); }
  .wk-head .dnum { display: block; font-size: 13px; color: var(--text-strong); margin-top: 2px; letter-spacing: 0; }
  /* The corner the two sticky axes meet in, above both of them. */
  .wk-corner { position: sticky; left: 0; z-index: 8; background: var(--panel); border-bottom: 1px solid var(--panel-border); }
  /* Sized off the viewport rather than fixed, so on a laptop screen the grid
     gives ground to the strips above and below it instead of pushing the
     booking controls off the bottom of the window. */
  /* The one thing on the panel that scrolls. It takes the height left after the
     strips above and below have had theirs, rather than the viewport arithmetic
     this used to do — which had to be re-guessed whenever anything around it
     changed height, and was wrong on a phone. */
  .wk-body { position: relative; flex: 1; min-height: 120px; overflow: auto; overscroll-behavior: contain;
             margin: 0 20px; scrollbar-width: thin; scrollbar-color: #2a3140 transparent; }
  .wk-body::-webkit-scrollbar { width: 10px; }
  .wk-body::-webkit-scrollbar-track { background: transparent; }
  .wk-body::-webkit-scrollbar-thumb { background: #2a3140; border-radius: 5px; border: 3px solid var(--panel); background-clip: padding-box; }
  /* A week whose bookings have not landed yet. The grid itself is a function of
     the date and is already right, so the only thing outstanding is what is
     drawn on it — which makes a thread at the top the honest signal, rather than
     blanking a panel that is not actually wrong. */
  .wk-body.pending::before {
    /* Pulled back out of the flow it takes up, so the grid does not step down
       two pixels while a week is loading and back up when it arrives. */
    content: ''; position: sticky; top: 0; z-index: 9; display: block;
    height: 2px; margin-bottom: -2px; pointer-events: none;
    background-image: linear-gradient(90deg, transparent, var(--accent), transparent);
    background-size: 40% 100%; background-repeat: no-repeat;
    animation: sweep 1.1s ease-in-out infinite;
  }
  @keyframes sweep { from { background-position: -45% 0; } to { background-position: 145% 0; } }
  @media (prefers-reduced-motion: reduce) {
    .wk-body.pending::before { animation: none; background-image: none; background-color: rgba(91,140,255,0.45); }
  }
  /* Two grids of identical shape, stacked: the headings and the day columns.
     Everything absolutely placed on the week — the now line, the selection —
     belongs to the lower one, so its coordinates stay measured from midnight and
     owe nothing to how tall the headings happen to be. */
  .wk-grid { position: relative; --gutter: 56px; }
  .wk-rows { position: relative; }
  /* Relative only so the now flag can hang off it; it earns a background and a
     layer of its own on a phone, where it is stuck to the left edge and has the
     rest of the week passing behind it. */
  .wk-hours { border-right: 1px solid var(--panel-border); position: relative; z-index: 5; }
  .wk-hour {
    height: 28px; font-family: var(--mono); font-size: 9.5px; color: var(--muted);
    text-align: right; padding-right: 7px; position: relative; top: -5px; font-variant-numeric: tabular-nums;
  }
  /* The server-time echo, so a Berlin-anchored rule can be read off a local axis
     without doing the arithmetic in your head. */
  .wk-hour .srv { display: block; font-size: 8px; opacity: 0.5; margin-top: -3px; }
  .wk-col { border-left: 1px solid var(--panel-border); position: relative; }
  .wk-cell { height: 28px; border-bottom: 1px solid rgba(31,36,48,0.55); cursor: pointer; }
  .wk-cell:hover { background: rgba(91,140,255,0.07); }
  .wk-cell.past { cursor: not-allowed; background: rgba(0,0,0,0.3); }
  .wk-cell.past:hover { background: rgba(0,0,0,0.3); }
  .wk-block {
    position: absolute; left: 2px; right: 2px; border-radius: 4px; padding: 2px 5px; overflow: hidden;
    font-family: var(--mono); font-size: 9.5px; line-height: 1.25; cursor: pointer; border: 1px solid;
  }
  .wk-block .who { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* A time never breaks across two lines. Half of "19:00–21:00" on one line and
     half on the next is not a shorter label, it is a wrong-looking one. */
  .wk-block .tm { opacity: 0.75; font-variant-numeric: tabular-nums; display: block; white-space: nowrap; }
  /* State decides the colour; whose it is decides how loud. Two hues would have
     meant a booking of yours and a booking of theirs looked like different
     kinds of thing, which they are not. */
  .b-claimed { background: rgba(210,51,105,0.26); border-color: var(--st-claimed); color: #f3a6c0; }
  .b-booked { background: rgba(91,140,255,0.16); border-color: var(--st-booked); border-style: dashed; color: #cfdcff; }
  .b-confirmed { background: rgba(91,140,255,0.3); border-color: var(--st-confirmed); color: #cfdcff; }
  .b-asked { background: rgba(224,169,62,0.2); border-color: var(--st-asked); color: #e8c887; }
  .b-mine { box-shadow: inset 3px 0 0 currentColor; }
  /* A rule that will produce this slot but has not booked a row for it yet.
     Real enough to plan around, not yet real enough for its owner to be asked. */
  .b-predicted { opacity: 0.62; }
  .b-pick { background: rgba(167,139,250,0.34); border: 1px dashed var(--purple); color: #ddd0ff; z-index: 3; }
  /* The selection is the one block on the grid you can pick up and move. */
  .b-drag { cursor: grab; touch-action: none; }
  .b-drag.dragging { cursor: grabbing; z-index: 6; box-shadow: 0 4px 14px rgba(0,0,0,0.45); }
  /* An evening the weekly rule will also take. Fainter than the one being
     picked, because it is a consequence rather than a choice. */
  .b-echo { background: rgba(167,139,250,0.14); opacity: 0.8; }
  /* The foot of the selection, for dragging its length. Given a real target
     height rather than a hairline, since it has to be grabbable with a mouse
     and with a thumb. */
  .stretch {
    position: absolute; left: 0; right: 0; bottom: -3px; height: 9px;
    cursor: ns-resize; touch-action: none; z-index: 4;
  }
  .stretch::after {
    content: ''; position: absolute; left: 50%; bottom: 4px; width: 18px; height: 2px;
    transform: translateX(-50%); border-radius: 1px; background: var(--purple); opacity: 0.85;
  }
  /* A block clipped by local midnight keeps a flat edge, so it reads as
     continuing rather than as a booking that really stops there. */
  .clip-top { border-top-left-radius: 0; border-top-right-radius: 0; border-top-style: dashed; }
  .clip-bottom { border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom-style: dashed; }

  .ss-line { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed rgba(224,169,62,0.45); pointer-events: none; z-index: 2; }
  .ss-label { position: absolute; right: 3px; transform: translateY(-100%); font-family: var(--mono); font-size: 8px; color: var(--warn); opacity: 0.9; letter-spacing: 0.08em; pointer-events: none; }
  .now-line { position: absolute; left: var(--gutter, 56px); right: 0; height: 0; border-top: 1px solid var(--bad); z-index: 4; pointer-events: none; }
  /* Carried by the hour gutter rather than by the grid, so that on a phone — where
     the gutter is stuck to the left edge and the days slide past it — the time
     stays where the axis it belongs to is, instead of scrolling off with Tuesday. */
  .now-flag {
    position: absolute; left: 2px; transform: translateY(-50%); z-index: 6; pointer-events: none;
    font-family: var(--mono); font-size: 8.5px; font-weight: 600; color: var(--bg);
    background: var(--bad); border-radius: 3px; padding: 1px 4px; font-variant-numeric: tabular-nums;
  }

  /* How long, and the thing that acts on it, in one row. The tank used to live
     up in the booking controls, a screen away from the button it feeds; the
     verdict that shared this row has moved to .foot-msg above. What is left is
     two objects whose height never changes, which is what keeps the button in
     one place however much the panel has to say. */
  .readout { padding: 10px 20px; border-top: 1px solid var(--panel-border); display: flex; align-items: center; gap: 12px; font-size: 12.5px; }
  .foot-dur { display: flex; align-items: center; gap: 9px; flex: 0 0 auto; min-width: 0; }
  .readout-actions { flex-shrink: 0; display: flex; align-items: center; gap: 10px; margin-left: auto; }
  .readout i { font-size: 15px; }
  .verdict-ask { color: var(--warn); } .verdict-no { color: var(--bad); } .verdict-ok { color: var(--st-free); }
  .srv-note { font-family: var(--mono); font-size: 11px; color: var(--warn); }

  @media (max-width: 900px) { .wk-grid { --gutter: 44px; } }
  @media (max-width: 620px) {
    main { padding: 18px 12px 50px; }
    .masthead-right { margin-left: 0; width: 100%; }
    .filter { flex: 1; width: auto; }
    /* Less room to give it, so it is cut sooner rather than pushing the
       avatar and the chevron off the row. */
    .sw-title { max-width: 150px; }
    /* dvh, not vh: on a phone `100vh` is the viewport with the browser's own
       chrome pretended away, so a full-height panel is taller than the screen
       actually showing it and the whole thing scrolls by exactly the height of
       the address bar. dvh is the height there really is. The vh line stays
       ahead of it for anything too old to know the unit. */
    .window { width: 100vw; height: 100vh; height: 100dvh; border-radius: 0; }
    .wk-body { margin: 0 10px; }
    /* Nothing outside the week scrolls: it is the part that is too big for a
       phone, and everything else earns its place by being small enough. */
    .win-body { overflow-y: hidden; }
    /* Tighter, so the grid keeps as much of a short screen as it can. */
    .win-head { padding: 11px 14px 9px; }
    .strip { padding: 8px 14px; }
    .readout { padding: 9px 14px; gap: 10px; }
    .foot-msg { padding: 8px 14px; }
    .up-head { padding: 8px 14px; }
    .up-list { padding: 5px 14px 8px; max-height: 168px; }
    .fold-hint { padding: 0 14px 8px 37px; }
    .cal-legend { display: none; }

    /* ---- Four days, not seven -------------------------------------------
       A seventh of a phone is about forty pixels, which is not enough to say
       who has a slot or when it runs — every block was an ellipsis. So the
       columns are given a width worth reading and the week slides sideways for
       the rest of itself, opened on yesterday so today and the two days worth
       planning are already in view. The hour gutter and the day headings stay
       put while it does, which is what the sticky rules above are for. */
    .wk-grid {
      --gutter: 44px;
      /* The four that fit: the body's own width (the window, less its margins)
         less the gutter, split four ways. */
      --daycol: calc((100vw - 20px - var(--gutter)) / 4);
      width: max-content;
    }
    .wk-headrow, .wk-rows { grid-template-columns: var(--gutter) repeat(7, var(--daycol)); }
    .wk-hours { position: sticky; left: 0; background: var(--panel); }
    /* Every pixel of a narrow column goes to the label, so a whole time fits on
       one line and the name has somewhere to be above it. The size follows the
       screen, because a quarter of a 320px phone is not a quarter of a 430px one
       and "19:00–21:00" has to survive both — clamped at the top so a big phone
       gets the desktop size rather than an inflated one. */
    .wk-block { padding: 2px 4px; font-size: clamp(8px, 2.4vw, 9.5px); }

    /* ---- Booking controls, on one row -----------------------------------
       Stacked and centred, these took four rows of a short screen. "Book" goes,
       because the heading immediately above says it; Now keeps its crosshair and
       drops its word. What is left is two objects that fit inside 320px with
       room to spare, so the row cannot wrap and never has to be centred twice.
       The weekday mask is still a row of its own — seven targets need the
       width. */
    .cal-controls { justify-content: center; gap: 8px; flex-wrap: wrap; }
    .cc-week { margin-left: 0; gap: 8px; }
    .cc-repeat .field-label { display: none; }
    .cc-week .btn span { display: none; }
    .cc-week .btn { padding: 5px 8px; }
    .cc-days { flex: 1 1 100%; justify-content: center; }
    .cc-days .seg { flex: 1; max-width: 320px; }
    .cc-days .seg button { flex: 1; padding: 7px 0; font-size: 12px; }

    /* The tank takes what is left of the foot beside the button it feeds. */
    .foot-dur { flex: 1 1 auto; }
    .foot-dur .tank { width: auto; flex: 1; height: 40px; }
    .tank-in { font-size: 13px; }
    .tank-out { font-size: 11px; }
  }
</style>
</head>
<body>
<main>
  <div class="masthead">
    <div class="brand">
      <img src="/dashboard/images/avatar.png" alt="">
      <span><!--SERVER--><span class="sub" id="sub">loading…</span></span>
    </div>
    <span class="tier tier-<!--TIER-->"><!--TIER--></span>
    <div class="masthead-right">
      <span class="stale-note" id="stale"></span>
      <input class="filter" id="filter" type="search" placeholder="Filter by code or name…" aria-label="Filter spawns">
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Spawns <span class="right" id="count"></span></div>
    <div class="legend">
      <span><i class="key key-free"></i>Free</span>
      <span><i class="key key-claimed"></i>Being hunted</span>
      <span><i class="key key-booked"></i>Booked</span>
      <span><i class="key key-confirmed"></i>Booked &amp; confirmed</span>
    </div>
    <div class="cards" id="cards"></div>
  </div>
</main>

<div class="veil" id="veil"></div>
<div class="window" id="window" role="dialog" aria-modal="true" aria-labelledby="win-title">
  <img class="watermark" id="watermark" alt="">
  <div class="scrim"></div>
  <div class="win-head">
    <span class="code-chip" id="win-code"></span>
    <span class="win-title" id="win-title"></span>
    <span class="win-region" id="win-region"></span>
    <button class="win-close" id="win-close" aria-label="Close">&times;</button>
  </div>
  <div class="win-body" id="win-body"></div>
  <!-- What the bot said back. Outside the scrolling body on purpose: it is the
       reply to something just pressed, and it belongs in one fixed place at the
       foot of the panel rather than wherever the body's current contents happen
       to push it. -->
  <div class="win-foot" id="win-foot" hidden></div>
</div>

<script>
const GUILD_ID = '<!--GUILD_ID-->';
// Presentation only. Which tools are drawn; never whether they are allowed,
// which every endpoint decides for itself against the live guild.
const TIER = '<!--TIER-->';
// The clock a repeat rule's weekdays and the stamina reset are read in. The page
// cannot guess it, and one that guessed wrong would book the wrong day.
const SERVER_TZ = '<!--SERVER_TZ-->';
const SS_SERVER_HOUR = Number('<!--SERVER_SAVE_HOUR-->');
const PLACEHOLDER = '/dashboard/images/avatar.png';
// The guild's `daily-emoji`, resolved to its CDN image server-side. Empty when
// it is not a custom emoji, in which case Claim goes without a face.
const CLAIM_EMOJI = '<!--CLAIM_EMOJI-->';

const SLOT = 30, ROW_H = 28, DAY_MS = 86400000;
// What dragging a selection about snaps to. Finer than SLOT, which is the step a
// hunt's *length* moves in: a quarter of an hour is a start time somebody means,
// and being made to choose between 20:00 and 20:30 for the sake of one number
// governing both is a worse answer than having two.
const DRAG_SNAP = 15;
// The shortest hunt worth starting — RespawnService.MinimumClaimMinutes. Below
// a whole step the tank's remainder is offered exactly as it stands, because
// eighteen minutes is still eighteen minutes of hunting and rounding it away
// would refuse somebody a hunt to keep the numbers tidy.
const MIN_CLAIM = 5;
// How many rows "Up next" shows before it owns up to the rest. Matches
// RespawnDashboardRoute.UpNextRows and RespawnEmbeds.RowsPerField, so the panel
// and the Discord card are the same list rather than two answers to one
// question. The server has already capped what it sends; this is the guard for
// the two lists together.
const UP_NEXT_ROWS = 10;
// Whether to say "tap" or "click", and whether to mention right-clicking at all
// — a phone has no right button, so that sentence would be advice nobody can
// take. Read once: it is a property of the device, not of the moment.
const TOUCH = matchMedia('(hover: none) and (pointer: coarse)').matches;
const DAY_NAMES = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

const pad = n => String(n).padStart(2, '0');
/** An hour of the day as a twelve-hour clock reads it. Midnight and noon are
 *  12, not 0 — "0 AM" is not a time anybody writes. */
const twelveHour = h => `${h % 12 === 0 ? 12 : h % 12}${h < 12 ? 'am' : 'pm'}`;
const fmtLocal = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fmtDur = m =>
  m == null ? '—' : (m % 60 === 0 && m >= 60 ? `${m / 60}h` : m > 60 ? `${Math.floor(m / 60)}h${m % 60}` : `${m}m`);

// Quantised rather than continuous, for the same reason the monitoring
// dashboard's heat ramp is: a spawn should sit at a recognisable level rather
// than a slightly different shade every poll. `drain` desaturates the sprite in
// step, because full-colour art is the one thing on a faded card that still
// shouts.
const FADE = [
  { maxHours: 1,        opacity: 1.00, drain: 0.00 },
  { maxHours: 24,       opacity: 0.88, drain: 0.15 },
  { maxHours: 72,       opacity: 0.68, drain: 0.40 },
  { maxHours: 168,      opacity: 0.50, drain: 0.65 },
  { maxHours: 720,      opacity: 0.34, drain: 0.85 },
  { maxHours: Infinity, opacity: 0.20, drain: 1.00 }
];
/** Total by construction. A spawn nobody has ever claimed has no age at all,
 *  and `Infinity < Infinity` is false — so relying on the last step to match
 *  everything left over silently returned undefined and took the whole render
 *  down with it. The floor is explicit instead. */
function fadeFor(hours) {
  const dormant = FADE[FADE.length - 1];
  if (hours == null || !isFinite(hours)) return dormant;
  return FADE.find(step => hours < step.maxHours) || dormant;
}

function ageLabel(hours) {
  if (hours == null) return 'never';
  if (hours < 1) return `${Math.max(1, Math.round(hours * 60))}m ago`;
  if (hours < 24) return `${Math.round(hours)}h ago`;
  const days = Math.round(hours / 24);
  return days < 30 ? `${days}d ago` : `${Math.round(days / 30)}mo ago`;
}

/** Rendered in the reader's own zone — every time on the wire is an absolute
 *  instant precisely so this can be done here. */
function clockTime(iso) {
  const d = new Date(iso);
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function minutesLeft(endsAt) {
  return Math.max(0, Math.round((new Date(endsAt).getTime() - Date.now()) / 60000));
}

/** How far off something is, at the coarseness worth reading at that distance.
 *  Minutes while it is soon enough to wait for, hours through the evening, days
 *  once it is another day's problem — an evening seven days out does not become
 *  more useful for being told it is 168 hours. */
function relTime(at) {
  const mins = Math.round((new Date(at).getTime() - Date.now()) / 60000);
  if (mins <= 0) return 'now';
  if (mins < 60) return `${mins}m`;
  const hours = Math.floor(mins / 60), rest = mins % 60;
  if (hours < 24) return rest ? `${hours}h${pad(rest)}` : `${hours}h`;
  return `${Math.round(hours / 24)}d`;
}

/** Today, tomorrow, or the weekday — for a list whose whole point is *when*, a
 *  date is a thing to decode where "Tomorrow" is a thing to read. */
function dayLabel(at) {
  const day = new Date(at); day.setHours(0, 0, 0, 0);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = Math.round((day - today) / DAY_MS);
  if (days === 0) return 'Today';
  if (days === 1) return 'Tomorrow';
  const d = new Date(at);
  return `${DAY_NAMES[(d.getDay() + 6) % 7]} ${d.getDate()}`;
}

/** How a card reads its state, and never a crash if it meets one it does not
 *  know. A missing branch here took the whole render down once before, and a
 *  board that has just learnt a new word should degrade to that word rather
 *  than to a blank page. */
function stateText(spawn) {
  const text = STATE_TEXT[spawn.state];
  return text ? text(spawn) : spawn.state;
}

const STATE_TEXT = {
  free: () => 'free',
  claimed: s => `${s.holder || 'someone'}${s.endsAt ? ` · ${minutesLeft(s.endsAt)}m left` : ''}`,
  booked: s => `${s.holder || 'someone'} booked${s.nextAt ? ` · ${clockTime(s.nextAt)}` : ''}`,
  confirmed: s => `${s.holder || 'someone'} confirmed${s.nextAt ? ` · ${clockTime(s.nextAt)}` : ''}`,
};

// ---- Timezone -------------------------------------------------------------
// The calendar's axis is the reader's own clock, but a repeat rule's weekdays
// and the stamina reset are read on the server's. Rather than hide that, both
// are shown: the hour gutter carries a server echo, and server save is drawn
// where the server's 10:00 actually falls here.
//
// Both formatters are built once and kept. Constructing an Intl.DateTimeFormat
// is among the most expensive ordinary things a page can do, and a single draw
// of the grid asks for around forty readings — twenty-four for the hour gutter's
// echo, two per day to place server save, one per day for a repeat preview. Built
// per call, that alone was a visible part of the pause on changing week.
const tzFormats = new Map();
function tzFormat(tz) {
  let fmt = tzFormats.get(tz);
  if (!fmt) {
    fmt = new Intl.DateTimeFormat('en-US', {
      timeZone: tz, hour12: false, year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
    tzFormats.set(tz, fmt);
  }
  return fmt;
}
function offsetMinutes(date, tz) {
  const parts = tzFormat(tz).formatToParts(date).reduce((acc, p) => (acc[p.type] = p.value, acc), {});
  const asUtc = Date.UTC(parts.year, parts.month - 1, parts.day,
    parts.hour === '24' ? 0 : parts.hour, parts.minute, parts.second);
  return (asUtc - date.getTime()) / 60000;
}
/** A server wall-clock reading -> the instant it names. Resolved twice so a
 *  daylight saving changeover lands on the right side of the jump. */
function serverToInstant(y, mo, d, h, mi) {
  let guess = new Date(Date.UTC(y, mo, d, h, mi));
  for (let i = 0; i < 2; i++) guess = new Date(Date.UTC(y, mo, d, h, mi) - offsetMinutes(guess, SERVER_TZ) * 60000);
  return guess;
}
// Built on first use rather than on load. It is the same formatter either way,
// but a timezone the browser will not accept then takes the calendar down with
// it instead of the whole page — the board itself has no use for this.
let serverFmt = null;
/** Answers held by the minute they describe, which is the finest the reading
 *  distinguishes. The hour gutter asks the same twenty-four questions on every
 *  draw of the same week, so a week paged away from and back to costs nothing
 *  the second time. */
const serverPartsCache = new Map();
function serverParts(date) {
  const key = Math.floor(date.getTime() / 60000);
  const hit = serverPartsCache.get(key);
  if (hit) return hit;
  if (!serverFmt) {
    serverFmt = new Intl.DateTimeFormat('en-US', {
      timeZone: SERVER_TZ, hour12: false, weekday: 'short',
      year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
    });
  }
  const p = serverFmt.formatToParts(date).reduce((acc, x) => (acc[x.type] = x.value, acc), {});
  const answer = { weekday: p.weekday, hour: Number(p.hour === '24' ? 0 : p.hour), minute: Number(p.minute) };
  // Bounded, so a long visit paging through months cannot grow it without
  // limit. A reading thrown away costs one formatter call to get back.
  if (serverPartsCache.size > 2048) serverPartsCache.clear();
  serverPartsCache.set(key, answer);
  return answer;
}
/** The weekday bit the bot would read for this instant — server time, Monday
 *  low. The page never expands a rule itself, but it does have to send the mask
 *  for a weekly booking, and that mask is in the server's terms. */
function serverDayBit(date) {
  return 1 << DAY_NAMES.indexOf(serverParts(date).weekday);
}

// ---- State ----------------------------------------------------------------
let board = null;          // the two halves, stitched: what the spawns are and what is happening
/** code -> the unchanging half of a spawn. Fetched once. */
let catalogue = null;
let filterText = '';
let slots = [];            // the week on screen, as drawn blocks
/** True while the week on screen is one we have never read. Distinct from
 *  "read, and nothing is booked in it": an empty grid means one thing and does
 *  not get to mean the other. */
let weekPending = false;
/** The last read of the week on screen came back empty-handed. Kept apart from
 *  `weekPending` because the two say different things and only one of them is
 *  worth interrupting somebody over. */
let weekError = false;

/** `code|weekOffset` -> { slots, at }: weeks already read.
 *
 *  A week of bookings is not a live board. It changes when somebody books
 *  something, which is minutes apart, so holding one for half a minute costs
 *  nothing anybody can see — and paging back to the week you were just looking
 *  at should not go to the server at all. What the cache actually buys is that
 *  the arrows stop waiting on a round trip before they will move.
 */
const weekCache = new Map();
const WEEK_TTL = 30000;
/** Reads in the air, so a click, a prefetch and a poll landing on the same week
 *  make one request between them rather than three. */
const weekInflight = new Map();
const weekKey = (code, offset) => `${code}|${offset}`;

const view = {
  code: null,              // the spawn whose window is open, or null
  weekOffset: 0,
  duration: null,
  repeat: 'once',
  days: new Set(),
  pick: null,
  answer: null,
  busy: false,
  // Set for real by openWindow, which opens the week — this only covers the
  // moment before any spawn has been opened at all.
  calendarOpen: false,
  // Shut on every open. Deliberately not remembered between spawns: it is
  // reference, and a section that stayed open would take the grid's height on
  // every spawn after the one somebody wanted it on.
  upNextOpen: false
};

let gridEl = null;
let scrolledOnce = false;
/** code -> the card element and the pieces of it that change, so painting never
 *  has to search the DOM for them. */
const cardParts = new Map();
/** The order the cards are in, so the list is only rearranged when it really
 *  differs — reordering under somebody mid-click is its own kind of flicker. */
let lastOrder = null;

const limits = () => (board && board.limits) || null;
const step = () => (limits() ? limits().step : SLOT);
/** The longest claim that can actually be made: the shorter of the guild's
 *  ceiling and what is left in the tank, already snapped to the step. */
/** The longest hunt that could start at `when`.
 *
 *  Stamina is an allowance per server-save day, and it is spent when a hunt
 *  *starts*, not when it is arranged — so a slot booked for after the next
 *  server save is paid out of that day's allowance rather than out of what is
 *  left of this one. Measuring a booking against today's remainder made a spent
 *  tank shrink what could be booked for tomorrow, and at nothing left it barred
 *  booking a future day at all: the ceiling reached zero, the length with it,
 *  and Book was refused for a hunt the server would have accepted quite happily.
 *
 *  A day yet to begin is worth the guild's whole allowance, since that is what
 *  the tank refills to — the true figure is unknowable from here anyway, being
 *  whatever they have not spent by the time it comes round.
 */
function capAt(when) {
  const l = limits();
  if (!l) return 0;
  const resets = l.resetsAt ? new Date(l.resetsAt).getTime() : null;
  if (when && resets && when.getTime() >= resets) {
    return l.budgetMinutes == null
      ? l.maxDurationMinutes
      : Math.max(0, Math.min(l.maxDurationMinutes, l.budgetMinutes));
  }
  return l.claimableMinutes;
}

/** The ceiling for the hunt currently being arranged: the selected slot if
 *  there is one, otherwise a claim starting now. One length serves both, so it
 *  is measured against whichever the button is about to do. */
const cap = () => capAt(view.pick);
const openSpawn = () => (board && view.code ? board.spawns.find(s => s.code === view.code) : null);

function hoursSince(iso) {
  if (!iso) return null;
  return (Date.now() - new Date(iso).getTime()) / 3600000;
}

function matches(spawn) {
  if (!filterText) return true;
  const q = filterText.toLowerCase();
  return spawn.code.toLowerCase().includes(q) || spawn.name.toLowerCase().includes(q);
}

function el(tag, className, html) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (html != null) node.innerHTML = html;
  return node;
}

/** Anything that came from Discord — a spawn name, a booking owner — is escaped
 *  before it goes anywhere near innerHTML. */
function esc(s) {
  const node = document.createElement('div');
  node.textContent = s == null ? '' : s;
  return node.innerHTML;
}

// ---- The board ------------------------------------------------------------
/** One card, built once. Everything that can change later is written by
 *  paintCard, so this runs once per spawn rather than once per second. */
function cardFor(spawn) {
  const card = el('div', 'card');
  card.dataset.code = spawn.code;

  const img = document.createElement('img');
  img.className = 'sprite' + (spawn.sprite ? '' : ' placeholder');
  img.src = spawn.sprite || PLACEHOLDER;
  img.alt = '';
  img.loading = 'lazy';
  // A sprite the cache has not fetched yet 404s; the fetch has just been started
  // by that very request, so a later poll will have it.
  img.addEventListener('error', () => {
    img.src = PLACEHOLDER;
    img.classList.add('placeholder');
  });
  card.appendChild(img);

  const body = el('div', 'card-body', `
    <div class="card-top">
      <span class="code-chip"></span>
      <span class="spawn-name"></span>
      <span class="age"></span>
    </div>
    <div class="card-state">
      <span class="dot"></span>
      <i class="ti ti-check tick" aria-hidden="true" hidden></i>
      <span class="who"></span>
      <span class="queue"></span>
    </div>
    <div class="card-bar" hidden><span></span></div>`);
  card.appendChild(body);

  // The pieces are held onto rather than looked up again later: painting runs
  // every second across every card, and a querySelector per field per card
  // would put back the cost this whole change exists to remove.
  const parts = {
    card, img,
    chip: body.querySelector('.code-chip'),
    name: body.querySelector('.spawn-name'),
    age: body.querySelector('.age'),
    dot: body.querySelector('.dot'),
    tick: body.querySelector('.tick'),
    who: body.querySelector('.who'),
    queue: body.querySelector('.queue'),
    bar: body.querySelector('.card-bar'),
    fill: body.querySelector('.card-bar span')
  };

  // The only three things that never change while the page is open.
  parts.chip.textContent = spawn.code;
  parts.name.textContent = spawn.name;
  card.title = `${spawn.code} — ${spawn.name}${spawn.region ? ' · ' + spawn.region : ''}`;

  card.addEventListener('click', () => openWindow(spawn.code));
  cardParts.set(spawn.code, parts);
  paintCard(spawn);
  return card;
}

/** Write the changeable parts of a card.
 *
 *  Assigning a string that is already there costs nothing — the browser does no
 *  work and nothing repaints — which is what lets this run every second. The
 *  version this replaces rebuilt all 285 cards once a second, so every image
 *  element was thrown away and made again, and every hover and scroll position
 *  went with them. That was the flicker.
 */
function paintCard(spawn) {
  const p = cardParts.get(spawn.code);
  if (!p) return;
  const hours = hoursSince(spawn.lastActivity);
  const fade = fadeFor(hours);
  const state = spawn.state;

  const opacity = String(fade.opacity);
  if (p.card.style.opacity !== opacity) {
    p.card.style.opacity = opacity;
    p.card.style.setProperty('--drain', fade.drain);
  }
  const edge = `var(--st-${state})`;
  if (p.card.style.getPropertyValue('--edge') !== edge) {
    p.card.style.setProperty('--edge', edge);
  }

  const chipClass = 'code-chip' + (state === 'claimed' ? ' live' : '');
  if (p.chip.className !== chipClass) p.chip.className = chipClass;

  p.age.textContent = ageLabel(hours);

  const dotClass = 'dot ' + state;
  if (p.dot.className !== dotClass) p.dot.className = dotClass;
  if (p.tick.hidden !== (state !== 'confirmed')) p.tick.hidden = state !== 'confirmed';

  const whoClass = 'who' + (state === 'free' ? ' free' : '');
  if (p.who.className !== whoClass) p.who.className = whoClass;
  p.who.textContent = stateText(spawn);
  p.queue.textContent = spawn.queueLength > 0 ? `+${spawn.queueLength} queued` : '';

  if (state === 'claimed' && spawn.startsAt && spawn.endsAt) {
    const from = new Date(spawn.startsAt).getTime();
    const to = new Date(spawn.endsAt).getTime();
    const done = Math.min(1, Math.max(0, (Date.now() - from) / Math.max(1, to - from)));
    if (p.bar.hidden) p.bar.hidden = false;
    p.fill.style.width = `${(done * 100).toFixed(1)}%`;
  } else if (!p.bar.hidden) {
    p.bar.hidden = true;
  }
}

/** Which spawns are shown, and in what order: most recently claimed first, and
 *  a spawn nobody has ever claimed last.
 *
 *  The same rule Discord's forum follows — a post is bumped when somebody takes
 *  the spawn and keeps that place until something else is taken, so letting a
 *  spawn go does not cost you the top of the list. Whether it is *currently*
 *  held is deliberately not part of the order: a hunt claimed three hours ago
 *  and still running is older news than one claimed a minute ago and finished.
 *
 *  This briefly sorted held spawns into a group of their own, which looked like
 *  the fix for claiming not reaching the top. It was not: a booked slot's
 *  starts_at counted as activity that had already happened, so a spawn booked
 *  for tomorrow outranked everything until tomorrow — see lastActivityByRespawn,
 *  where that is now excluded until the slot actually comes round.
 */
function shownSpawns() {
  const since = s => { const h = hoursSince(s.lastActivity); return h == null ? Infinity : h; };
  return board.spawns.filter(matches).slice().sort((a, b) => since(a) - since(b));
}

/** Put the cards in the right order, making and removing only what changed.
 *
 *  Order is the one thing that cannot be patched into a card, so it is done by
 *  moving the elements that already exist. They keep their images, and the
 *  browser keeps what it had already decoded.
 */
function layoutBoard() {
  const container = document.getElementById('cards');
  const shown = shownSpawns();
  const order = shown.map(s => s.code).join(',');
  if (order === lastOrder) return;
  lastOrder = order;

  if (!shown.length) {
    cardParts.clear();
    container.innerHTML = `<div class="empty-note">${
      board.spawns.length ? 'No spawns match that filter.' : 'This server has no spawns in its catalogue yet.'
    }</div>`;
    return;
  }
  const first = container.firstElementChild;
  if (first && first.classList.contains('empty-note')) container.innerHTML = '';

  const wanted = new Set(shown.map(s => s.code));
  cardParts.forEach((p, code) => {
    if (!wanted.has(code)) { p.card.remove(); cardParts.delete(code); }
  });

  let previous = null;
  shown.forEach(spawn => {
    const existing = cardParts.get(spawn.code);
    const card = existing ? existing.card : cardFor(spawn);
    const expected = previous ? previous.nextElementSibling : container.firstElementChild;
    if (card !== expected) {
      if (previous) previous.after(card); else container.prepend(card);
    }
    previous = card;
  });
}

function renderBoard() {
  if (!board) return;
  layoutBoard();
  board.spawns.forEach(paintCard);

  const live = board.spawns.filter(s => s.state === 'claimed').length;
  const booked = board.spawns.filter(s => ['booked', 'confirmed'].includes(s.state)).length;
  setText(document.getElementById('count'),
    `${board.spawns.length} spawns · ${live} being hunted · ${booked} booked`);
  // No timezone here any more: every time on the page is already drawn in the
  // reader's own clock, so naming it said nothing, and the line is better spent
  // on which Discord this board belongs to — which the header above now states.
  setText(document.getElementById('sub'), `${board.spawns.length} spawns`);
}

function setText(node, text) {
  if (node && node.textContent !== text) node.textContent = text;
}

/** The once-a-second beat. Only a live hunt moves on its own — its countdown
 *  and its progress bar — so only those cards are touched. Everything else
 *  changes when the poll says it changed, and not before. */
function tick() {
  if (!board) return;
  board.spawns.forEach(spawn => { if (spawn.state === 'claimed') paintCard(spawn); });
}

// ---- Data -----------------------------------------------------------------
/** What the spawns are — names, regions, sprites — which changes only when an
 *  admin edits the catalogue.
 *
 *  Fetched once and kept. It is most of the bytes and almost none of the
 *  change, so sending it on every ten-second poll was the bulk of the traffic
 *  for no information at all. The browser's own cache handles repeat visits;
 *  this only refetches when a spawn turns up that we have never heard of.
 */
async function loadCatalogue() {
  const res = await fetch(`/dashboard/g/${GUILD_ID}/catalogue`, { headers: { 'Accept': 'application/json' } });
  if (!res.ok) throw new Error(res.status === 403 ? 'no longer have access' : 'could not refresh');
  const data = await res.json();
  catalogue = new Map(data.spawns.map(s => [s.code, s]));
}

async function loadBoard() {
  const res = await fetch(`/dashboard/g/${GUILD_ID}/board`, { headers: { 'Accept': 'application/json' } });
  // A session that expired mid-visit lands here; the redirect to login is not
  // something fetch can follow usefully, so say so rather than looping.
  if (!res.ok) throw new Error(res.status === 403 ? 'no longer have access' : 'could not refresh');
  const live = await res.json();

  if (!catalogue) await loadCatalogue();
  // A spawn nobody has told us about means the catalogue moved under us — an
  // admin added one. Refetch once rather than drawing a card with no name.
  if (live.spawns.some(s => !catalogue.has(s.code))) await loadCatalogue();

  // The two halves are stitched back together here, so everything downstream
  // still sees one flat spawn with a name and a state on it.
  board = {
    ...live,
    spawns: live.spawns.map(s => Object.assign({}, catalogue.get(s.code), s))
  };
  if (view.duration == null && limits()) {
    view.duration = Math.max(SLOT, Math.min(limits().defaultDurationMinutes, cap()));
  }
}

/** The open spawn's week.
 *
 *  The window asked for is an absolute range covering the *local* week, not the
 *  server week. A booking near either edge belongs to a different server day
 *  than the column it is drawn in, and asking for the server week would drop it
 *  from the view entirely — silently, which is the worst way for a calendar to
 *  be wrong.
 */
function fetchWeek(code, offset) {
  const key = weekKey(code, offset);
  const already = weekInflight.get(key);
  if (already) return already;

  const start = weekStart(offset);
  const end = new Date(start.getTime() + 7 * DAY_MS);
  const url = `/dashboard/g/${GUILD_ID}/slots?code=${encodeURIComponent(code)}`
    + `&from=${encodeURIComponent(start.toISOString())}&to=${encodeURIComponent(end.toISOString())}`;

  const reading = (async () => {
    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!res.ok) throw new Error('could not read that week');
    const data = await res.json();
    const week = data.slots.map(s => ({ ...s, start: new Date(s.startsAt), end: new Date(s.endsAt) }));
    // Bounded, so paging through a lot of spawns cannot grow this without
    // limit. A week thrown away costs the one read that brings it back.
    if (weekCache.size > 48) weekCache.clear();
    weekCache.set(key, { slots: week, at: Date.now() });
    return week;
  })();

  weekInflight.set(key, reading);
  // Cleared either way: a failed read must not leave a promise nobody can
  // retry sitting in front of every later attempt at that week.
  reading.catch(() => {}).then(() => weekInflight.delete(key));
  return reading;
}

/** Read the week on screen from the server, whatever the cache says. */
async function loadSlots() {
  if (!view.code) { slots = []; return; }
  const code = view.code, offset = view.weekOffset;
  const week = await fetchWeek(code, offset);
  // The reader may have moved on while this was in the air. A late answer for a
  // week nobody is looking at goes into the cache and no further — drawing it
  // would put last week's bookings on this week's grid.
  if (view.code === code && view.weekOffset === offset) {
    slots = week;
    weekPending = false;
    weekError = false;
  }
}

/** Draw whatever week `view.weekOffset` now names, at once.
 *
 *  The grid is a function of the date and nothing else — its columns, its hour
 *  gutter, where server save falls, whether the now line belongs in it — so it
 *  is drawn immediately from a cached week or from none, and the bookings are
 *  filled in when the read lands. Waiting on a round trip before moving at all
 *  is what made the arrows feel broken: nothing on screen answered the click
 *  until the server had been to the database and back.
 */
function showWeek() {
  if (!view.code) return;
  const code = view.code, offset = view.weekOffset;
  const held = weekCache.get(weekKey(code, offset));
  slots = held ? held.slots : [];
  weekPending = !held;
  weekError = false;
  renderWindow();

  const fresh = held && Date.now() - held.at < WEEK_TTL;
  if (fresh) { prefetchNeighbours(); return; }
  // A stale week is left on screen while it is checked, rather than blanked:
  // it is almost certainly still right, and flashing it away to draw it again
  // is a worse answer than being a few seconds behind.
  const stillHere = () => view.code === code && view.weekOffset === offset;
  loadSlots().then(
    () => {
      if (view.code === code) prefetchNeighbours();
      if (stillHere()) { weekPending = false; renderWindow(); }
    },
    () => {
      // An empty grid must not be allowed to read as "nothing is booked" when
      // the truth is that we never found out.
      if (stillHere()) { weekPending = false; weekError = true; renderWindow(); }
    });
}

/** The weeks either side, read quietly once this one has settled.
 *
 *  Somebody paging through a month presses the same arrow several times over,
 *  so the week after the one being looked at is nearly always the next one
 *  wanted. Two reads per week visited buys arrows that answer with no wait at
 *  all — and only while the grid is actually open, since a window opened to
 *  claim something now never looks at another week.
 */
function prefetchNeighbours() {
  if (!view.code || !view.calendarOpen) return;
  const code = view.code;
  [view.weekOffset - 1, view.weekOffset + 1].forEach(offset => {
    const held = weekCache.get(weekKey(code, offset));
    if (held && Date.now() - held.at < WEEK_TTL) return;
    fetchWeek(code, offset).catch(() => {});
  });
}

/** Everything read about this spawn is now suspect. Called after a write:
 *  a weekly booking lands in every week at once, so throwing away only the week
 *  on screen would leave the neighbours confidently wrong. */
function forgetWeeks() {
  weekCache.clear();
}

async function refresh() {
  try {
    await loadBoard();
    await loadSlots();
    document.getElementById('stale').textContent = '';
  } catch (e) {
    document.getElementById('stale').textContent = e.message || 'offline';
  }
  renderBoard();
  if (view.code) renderWindow();
}

// ---- The week -------------------------------------------------------------
function weekStart(offset = view.weekOffset) {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + offset * 7);   // local Monday
  return d;
}
const dayStart = (start, i) => { const d = new Date(start); d.setDate(start.getDate() + i); return d; };
const localMinutes = d => d.getHours() * 60 + d.getMinutes();

function weekLabel(start) {
  const end = new Date(start.getTime() + 6 * DAY_MS);
  const month = d => d.toLocaleDateString(undefined, { month: 'short' });
  return view.weekOffset === 0 ? 'This week'
    : `${start.getDate()} ${month(start)} – ${end.getDate()} ${month(end)}`;
}

// ---- Verdict --------------------------------------------------------------
// Advisory only. The bot decides what a clash means — whether it can be put to
// the other person, whether they have already been asked — and its answer is
// what the window shows after booking. This exists so the button is not a blind
// guess, not to duplicate ClashVerdict.
function overlapping(start, minutes) {
  const end = new Date(start.getTime() + minutes * 60000);
  return slots.filter(b => start < b.end && b.start < end);
}

function judge(start) {
  const end = new Date(start.getTime() + view.duration * 60000);
  if (start.getTime() <= Date.now()) return { type: 'no', text: 'That start time has already passed.' };
  const hit = overlapping(start, view.duration);
  if (!hit.length) return { type: 'ok', text: `Free — ${fmtLocal(start)}–${fmtLocal(end)}, ${fmtDur(view.duration)}` };

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Violent Bot - <!--TITLE--></title>
<link rel="icon" type="image/png" href="/dashboard/images/avatar.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
  :root {
    --bg: #0b0d12; --panel: #12151c; --panel-border: #1f2430;
    --text: #d7dce3; --text-strong: #e8ebf0; --muted: #7c8698;
    --accent: #5b8cff; --warn: #e0a93e; --bad: #e0563e; --purple: #a78bfa;

    /* Lifted from the Discord side so a spawn looks the same in both places:
       the code colour is RespawnBoardImage.CodeColor, free and claimed are
       RespawnEmbeds' own FreeColor and RedColor. */
    --code: #f0b232;
    --spawn-name: #e8e9ea;

    /* One definition for every state, used by the cards and by the calendar
       inside the spawn window. Booked and confirmed share a hue deliberately: a
       confirmed slot is the same booking with the question settled, so it reads
       as a stronger version of it (dashed outline -> solid, plus a tick) rather
       than a fourth colour. That keeps the palette three hues wide, which stays
       legible with a red-green colour vision deficiency, and the tick carries
       the distinction with no colour at all. */
    --st-free: #2ecc71;
    --st-claimed: #d23369;
    --st-booked: #5b8cff;
    --st-confirmed: #5b8cff;
    --st-asked: #e0a93e;

    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

    /* How big the spawn window draws itself, as a multiple. Every type size and
       every hour row inside the window is a multiple of this rather than a flat
       pixel count, so on a display with pixels to spare the panel grows into
       them instead of sitting at laptop size in the middle of the screen with
       nine-pixel type. One here is the size the window has always been; the
       steps that raise it are on .window, so that everything outside the window
       — the board, which is already the size it wants to be — stays at one and
       is untouched by any of this.

       The hour row is here rather than in the grid because the script needs it
       too: every block on the week is placed by multiplying an hour count by it.
       Kept as a bare number and a bare length, with no var() of their own, so
       that reading them back through getComputedStyle gives something
       parseFloat understands rather than an unevaluated calc(). */
    --ui-scale: 1;
    --row-base: 28px;
  }
  * { box-sizing: border-box; }
  /* `hidden` means hidden, whatever else an element is styled as.
     The attribute works through a browser default of `display: none`, which any
     author `display:` on the same element silently beats — so a flex or grid
     component that sets its own display is shown regardless of the attribute,
     and the script toggling it appears to do nothing. That caught the foot of
     the spawn window once and the moderator panel again; this rule ends the
     class of bug rather than patching each instance as it turns up. */
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px;
    background-image:
      linear-gradient(rgba(255,255,255,0.014) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.014) 1px, transparent 1px);
    background-size: 46px 46px;
  }
  /* Chrome on Android reads a downward drag at the top of the document as a
     reload, and here that is pure loss: the board refetches itself every ten
     seconds regardless, so the gesture gains the reader nothing and costs them
     whatever window, selection or week they had open. `contain` keeps the
     rubber band at the end of the scroll and leaves the gesture with the page. */
  html, body { overscroll-behavior-y: contain; }
  /* A page that cannot move cannot drag the window about with it. The spawn
     window is `position: fixed`, and on a phone a fixed element is only really
     fixed while the document behind it is still: rubber-banding at either end of
     the board — or the address bar sliding in and out on the way — repaints it a
     frame late and the whole panel jitters under the thumb. So while the window
     is up the document is pinned where it stood, and put back on the way out.
     `top` is written by the script, since pinning it at 0 would otherwise scroll
     the board back to the beginning behind the window. */
  body.locked { position: fixed; left: 0; right: 0; width: 100%; overflow: hidden; overscroll-behavior: none; }
  main { max-width: 1180px; margin: 0 auto; padding: 26px 24px 70px; }
  .muted { color: var(--muted); }

  .masthead {
    background: rgba(255,255,255,0.02); border: 1px solid var(--panel-border); border-radius: 8px;
    padding: 13px 18px; margin-bottom: 18px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 14px; font-weight: 600; letter-spacing: -0.01em; color: var(--text-strong); }
  .brand img { width: 32px; height: 32px; border-radius: 8px; }
  .brand .sub { display: block; font-size: 10px; font-weight: 400; color: var(--muted); letter-spacing: 0.04em; margin-top: 3px; }
  /* Which Discord this board belongs to. Somebody can be a member of several
     communities that run the bot, and every code, every claim and every booking
     on the page belongs to exactly one of them — so the name is stated rather
     than left to be inferred from the tab. The Discord glyph is what says the
     name is a server's and not the board's. */
  .brand .server { display: inline-flex; align-items: center; gap: 6px; color: inherit; text-decoration: none; min-width: 0; }
  .brand .server i { font-size: 13px; color: var(--muted); }
  /* Which page of the bot this is, in the same muted voice /status wears after
     the bot's name — so the two mastheads read as the same family. */
  .brand-suffix { color: var(--muted); font-weight: 400; margin-left: 4px; }

  /* ---- Switching server --------------------------------------------------
     A menu under the name rather than a link to a page of choices: swapping
     server is a thing you do from a board, and throwing that board away to be
     asked a question is a poor trade for one press. Drawn server-side — see
     RespawnDashboardRoute.serverChip — and only when there is more than one
     server to switch to; the single-server case stays the plain label above and
     never grows a chevron. */
  .sw { position: relative; display: inline-flex; min-width: 0; }
  /* The server's name, given a ceiling and cut with an ellipsis rather than
     allowed to set the masthead's width.
     Without one it wrapped: the button is inline-flex and the name was a bare
     anonymous item with nothing telling it to stay on one line, so a long name
     broke across three of them and painted up out of the header and over the
     page behind it. A fixed width and a clean cut is the whole of the fix —
     the full name is on the row in the menu below, and in the title. */
  /* `flex: 0 0 auto` and not a bare max-width: as a flex item it would
     otherwise be free to shrink, and on a narrow screen — where the row beside
     it takes the full width — it shrank all the way to nothing and the name
     disappeared entirely. This takes its content's width up to the ceiling, and
     gives up none of it. */
  .sw-title { flex: 0 0 auto; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sw-btn {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer; min-width: 0;
    background: transparent; border: 1px solid transparent; border-radius: 7px;
    padding: 4px 8px; margin: -4px -8px;
    color: inherit; font-family: inherit; font-size: inherit; font-weight: inherit; letter-spacing: inherit;
  }
  .sw-btn > i { font-size: 13px; color: var(--muted); }
  .sw-btn:hover { background: rgba(255,255,255,0.04); border-color: var(--panel-border); }
  .sw-btn .chev { font-size: 11px; opacity: 0.7; transition: transform 0.15s ease; }
  .sw.open .sw-btn { background: rgba(255,255,255,0.05); border-color: var(--panel-border); }
  .sw.open .sw-btn .chev { transform: rotate(180deg); }
  .sw-menu {
    position: absolute; top: calc(100% + 7px); left: -8px; z-index: 30;
    min-width: 260px; max-width: 340px;
    background: var(--panel); border: 1px solid #2a3142; border-radius: 10px;
    box-shadow: 0 18px 44px rgba(0,0,0,0.6); padding: 5px; display: none;
    max-height: 320px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #2a3140 transparent;
  }
  .sw.open .sw-menu { display: block; }
  .sw-label {
    display: block; font-family: var(--mono); font-size: 9px; text-transform: uppercase;
    letter-spacing: 0.12em; color: var(--muted); padding: 7px 10px 5px;
  }
  .sw-item {
    display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 7px;
    color: var(--text); text-decoration: none; font-family: var(--sans); font-weight: 400;
  }
  .sw-item:hover { background: rgba(255,255,255,0.05); }
  .sw-item.on { background: rgba(91,140,255,0.13); }
  /* A server that did not answer. Listed so it is visibly missing rather than
     silently absent, and dimmed and unclickable because we do not know it is
     theirs to open — offering it as a link would be offering a 403. */
  .sw-item.off { opacity: 0.55; cursor: default; }
  .sw-item.off:hover { background: none; }
  .sw-item.off .tier { background: rgba(224,169,62,0.15); color: var(--warn); }
  /* The reliable way back to the full list, whatever the menu above it managed
     to resolve. Set off by a rule so it reads as a different kind of row. */
  .sw-item.sw-all { border-top: 1px solid var(--panel-border); margin-top: 4px; padding-top: 9px; }
  .sw-item.sw-all .sw-name { color: var(--muted); }
  .sw-item.sw-all:hover .sw-name { color: var(--text-strong); }
  /* The server's own face. Sized to the row rather than to the brand mark above
     — this is a list to pick from, not a masthead — and squared off with the
     same radius the bot's own avatar wears.
     Written as `.sw-item .sw-icon` and not `.sw-icon`, because the menu lives
     inside .brand and `.brand img` would otherwise win on specificity and blow
     every avatar up to the masthead's 32px. */
  .sw-item .sw-icon {
    width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
    object-fit: cover; background: rgba(255,255,255,0.05);
  }
  /* What a guild with no icon of its own gets, in exactly the space the icon
     would have taken — same width so the names line up down the column, same
     height so the rows do. */
  .sw-glyph {
    width: 22px; height: 22px; font-size: 14px; line-height: 22px;
    color: var(--muted); flex-shrink: 0; text-align: center;
  }
  .sw-item.on .sw-glyph { color: var(--accent); }
  .sw-name { flex: 1; min-width: 0; font-size: 13px; color: var(--text-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Reusing the masthead's tier colours, so what "moderator" looks like is one
     thing across the page. */
  .sw-item .tier { flex-shrink: 0; }
  .sw-check { color: var(--accent); font-size: 14px; flex-shrink: 0; }
  .tier { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; border-radius: 4px; padding: 2px 7px; }
  .tier-member { background: rgba(255,255,255,0.06); color: var(--muted); }
  .tier-moderator { background: rgba(91,140,255,0.15); color: var(--accent); }
  .tier-admin { background: rgba(167,139,250,0.15); color: var(--purple); }
  .masthead-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .filter {
    background: rgba(255,255,255,0.02); border: 1px solid var(--panel-border); border-radius: 6px;
    color: var(--text); font-family: var(--mono); font-size: 12px; padding: 6px 10px; width: 190px;
  }
  .filter::placeholder { color: var(--muted); font-family: var(--sans); }
  .filter:focus { outline: none; border-color: var(--accent); }
  .stale-note { font-family: var(--mono); font-size: 11px; color: var(--warn); }

  .panel { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; overflow: hidden; }
  .panel-title {
    padding: 12px 16px; font-family: var(--mono); font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted);
    border-bottom: 1px solid var(--panel-border); display: flex; align-items: center; gap: 8px;
  }
  .panel-title::before { content: '##'; color: var(--accent); letter-spacing: normal; }

  /* Moderator tools for the catalogue itself. Purple throughout, the same hue
     the per-spawn moderator block and the admin tier chip already use, so
     "something only some people can do" looks like one thing across the page. */
  .mod-panel { margin-bottom: 16px; border-color: rgba(167,139,250,0.28); }
  .mod-panel-head {
    width: 100%; background: none; border: 0; cursor: pointer; color: inherit; text-align: left;
    padding: 11px 16px; display: flex; align-items: center; gap: 8px; font-family: inherit;
  }
  .mod-panel-head:hover { background: rgba(167,139,250,0.06); }
  .mod-panel-head > i:first-child { color: var(--purple); font-size: 15px; }
  .mod-panel-head[aria-expanded="true"] { border-bottom: 1px solid var(--panel-border); }
  .mod-panel-head[aria-expanded="true"] .fold-chevron { transform: rotate(180deg); }
  .mod-panel-body { display: flex; flex-direction: column; }
  /* One band per job. The panel does two unrelated things, and a heading with a
     ground of its own is what makes each read as a section — a hairline between
     them only ever said "something ends here". */
  .mod-band { padding: 13px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
  .mod-band.alt { border-top: 1px solid var(--panel-border); background: rgba(255,255,255,0.012); }
  .mod-section { display: flex; align-items: baseline; gap: 8px; }
  .mod-section-title {
    font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--purple); display: flex; align-items: center; gap: 6px;
  }
  /* The shield the panel's own header wears, quarter size, so a band reads as
     part of it rather than as a heading that wandered in. */
  .mod-section-title::before { content: '◈'; font-size: 10px; }
  .mod-section-hint { color: var(--muted); font-size: 11px; margin-left: auto; }
  /* One field per column while there is room, stacking on a narrow screen. The
     code is the short one and gets the narrow track. */
  .mod-form { display: grid; grid-template-columns: 110px 1fr 1fr 1fr; gap: 10px; align-items: end; }
  /* Two fields rather than four, and the number is the short one — the same
     reasoning as the code column above, mirrored. */
  .mod-form.limits { grid-template-columns: 1fr 130px; }
  .mod-field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .mod-field input {
    background: rgba(255,255,255,0.02); border: 1px solid var(--panel-border); border-radius: 6px;
    color: var(--text); font-family: var(--mono); font-size: 12px; padding: 7px 9px; width: 100%;
  }
  /* A range has no box of its own to draw — the rule above would put a border
     round the track and pad it away from its own thumb. */
  .mod-field input[type="range"] { background: none; border: 0; padding: 0; }
  .mod-field input::placeholder { color: var(--muted); font-family: var(--sans); }
  .mod-field input:focus { outline: none; border-color: var(--purple); }
  .mod-note { color: var(--muted); font-size: 11px; line-height: 1.5; }
  .mod-note code { font-family: var(--mono); color: var(--text); }
  .mod-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .mod-actions .mod-note { flex: 1 1 220px; min-width: 0; }
  /* The answer sits with the button that caused it, not at the top of the page:
     this panel is its own little form and its reply belongs inside it. */
  /* Always the last thing in the panel, whatever said it. Bordered off, so a
     reply reads as the panel answering rather than as a caption on whichever
     control happens to sit above it. */
  .mod-answer { font-size: 12px; min-width: 0; }
  .mod-answer:not(:empty) { border-top: 1px solid var(--panel-border); padding: 11px 16px; }
  .mod-answer.ok { color: var(--st-free); }
  .mod-answer.no { color: var(--st-claimed); }
  /* What this server added, and the way back out. Scrolls rather than growing
     without limit: a guild fifty codes deep should not push the board itself off
     the screen every time this panel is opened. */
  .mod-owned { display: flex; flex-direction: column; gap: 7px; }
  .mod-list { display: flex; flex-direction: column; max-height: 240px; overflow-y: auto; overscroll-behavior: contain;
              scrollbar-width: thin; scrollbar-color: #2a3140 transparent; }
  .mod-list-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; border-bottom: 1px solid rgba(31,36,48,0.6); }
  .mod-list-row:last-child { border-bottom: 0; }
  .mod-list-name { color: var(--spawn-name); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mod-list-region { color: var(--muted); font-size: 11px; margin-left: auto; padding-left: 8px;
                     overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* The ceiling in force, pushed right like a region is — it is what the row is
     about, and the purple says it was set here rather than inherited. */
  .mod-list-max {
    color: var(--purple); font-family: var(--mono); font-size: 11.5px;
    margin-left: auto; padding-left: 8px; flex-shrink: 0;
  }
  .mod-list-row .btn { flex-shrink: 0; }
  .mod-list-row .code-chip { flex-shrink: 0; }
  /* Purple until it is pointed at, red once it is armed: removal takes the
     spawn's claims and bookings with it, so the second press should not look
     like the first. */
  .btn.danger-hover:hover:not([disabled]) { color: var(--st-claimed); border-color: rgba(210,51,105,0.5); background: rgba(210,51,105,0.1); }
  .btn.mod-btn.armed { color: var(--st-claimed); border-color: rgba(210,51,105,0.65); background: rgba(210,51,105,0.14); }

  /* Handing somebody minutes in their tank. A person and an amount, side by side
     while there is room and stacked when there is not. */
  /* Two labelled controls side by side, aligned on their labels rather than
     centred: the boxes under them are within a pixel of each other, and centring
     unequal ones puts the two labels on different lines. */
  .mod-give { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-items: start; }
  .mod-who { position: relative; }
  /* Chips rather than a slider. The amounts are a short known list — a hunt's
     worth and its fractions — and a slider asks somebody to aim at a value they
     could have named. Built on the shared .seg, so only what differs is set
     here: equal widths, a thumb-sized target, and the panel's purple for the
     chosen one where the board's own segments use blue. */
  .mod-give .seg { width: 100%; }
  .mod-give .seg button { flex: 1; padding: 7px 0; }
  .mod-give .seg button[aria-pressed="true"] { color: var(--purple); background: rgba(167,139,250,0.14); }
  /* Over the content rather than pushing it down: a list that grows moves the
     buttons under it, and a moderator who is halfway to pressing one should not
     have it walk away as they type. */
  .mod-suggest {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 5;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 6px;
    max-height: 200px; overflow-y: auto; box-shadow: 0 8px 22px rgba(0,0,0,0.45);
  }
  .mod-suggest-row {
    display: block; width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
    color: var(--text); font-family: var(--mono); font-size: 12px; padding: 7px 10px;
  }
  .mod-suggest-row:hover { background: rgba(167,139,250,0.14); }
  @media (max-width: 720px) {
    .mod-give { grid-template-columns: 1fr; }
  }
  @media (max-width: 720px) {
    .mod-form { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 720px) {
    .mod-form.limits { grid-template-columns: 1fr; }
  }
  @media (max-width: 460px) {
    .mod-form { grid-template-columns: 1fr; }
  }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(248px, 1fr)); gap: 10px; padding: 14px 16px; }
  .card {
    position: relative; overflow: hidden; cursor: pointer;
    background: rgba(255,255,255,0.02); border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 10px 12px;
  }
  .card:hover { border-color: var(--accent); }
  /* State also shows as a hairline down the leading edge, because on a busy
     watermark the dot alone gets lost against the art. */
  .card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--edge, transparent); }

  /* Never mirrored. Tibia sprites are drawn facing a deliberate direction and
     flipping one reads as wrong art rather than as a design choice — and it
     would disagree with the same creature shown the right way round in the
     Discord thread's thumbnail. */
  /* 128px: exactly twice these files' own size, every creature sprite being a
     64x64 canvas. The doubling is the point — an integer scale stays integer
     however dense the display is (2x here becomes 4x on a retina screen, 6x on
     a 4K one), so every source pixel lands on a whole number of device pixels
     and the art stays hard-edged. The 84px box this used to be was 1.3125x,
     which is a whole number of pixels on no display ever made.

     Bigger than the card on purpose. A card is 61px tall, so a creature filling
     its canvas shows about half of itself and the rest is clipped: the card is a
     window onto the art rather than a frame around it, which at seventeen per
     cent opacity reads as a deliberate backdrop rather than a small creature
     adrift in a large box. What the ink nudge buys at this size is that the half
     you see is the middle of the creature rather than whatever the canvas
     happened to leave low.

     If a 32x32 canvas ever turns up, object-fit would draw it at 4x in here.
     None of the 232 sprites in the catalogue is one. */
  /* Centred by `top/bottom: 0` against a fixed height rather than by an offset
     from the bottom, because the card is not one height: it grows eleven pixels
     when a claim adds its progress bar, and anything anchored to the bottom
     edge slides down with it. `margin: auto` splits the difference on whatever
     height the card happens to be, and leaves `transform` free for the ink
     nudge, which needs it. */
  .sprite {
    position: absolute; right: -6px; top: 0; bottom: 0; margin: auto;
    width: 128px; height: 128px;
    opacity: 0.17; pointer-events: none;
    image-rendering: pixelated; object-fit: contain;
    filter: grayscale(var(--drain, 0));
  }
  /* The avatar stand-in is always fully drained — it is a placeholder for
     missing art and must never be the brightest thing on a board of real
     sprites. */
  .sprite.placeholder { filter: grayscale(1); opacity: 0.1; }

  .card-body { position: relative; }
  .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .code-chip {
    display: inline-flex; align-items: center; font-family: var(--mono); font-weight: 700;
    font-size: 12px; font-variant-numeric: tabular-nums; color: var(--code);
    background: rgba(240,178,50,0.13); border: 1px solid rgba(240,178,50,0.32);
    border-radius: 5px; padding: 2px 7px; flex-shrink: 0;
  }
  .code-chip.live { color: #ffd98a; border-color: rgba(240,178,50,0.75); animation: pulse 2.6s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(240,178,50,0.42); } 70% { box-shadow: 0 0 0 6px rgba(240,178,50,0); } 100% { box-shadow: 0 0 0 0 rgba(240,178,50,0); } }
  @media (prefers-reduced-motion: reduce) { .code-chip.live { animation: none; box-shadow: 0 0 0 2px rgba(240,178,50,0.3); } }

  .spawn-name { color: var(--spawn-name); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-state { display: flex; align-items: center; gap: 6px; font-size: 11.5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; border: 1.5px solid; }
  .dot.free { border-color: var(--st-free); background: var(--st-free); }
  .dot.claimed { border-color: var(--st-claimed); background: var(--st-claimed); }
  .dot.booked { border-color: var(--st-booked); background: transparent; }
  .dot.confirmed { border-color: var(--st-confirmed); background: var(--st-confirmed); }
  .who { font-family: var(--mono); font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who.free { color: var(--st-free); }
  /* Whoever the row is about, wherever a row names somebody: the card's state
     line, the strip at the top of an open panel, the "up next" list and its
     one-line summary. A state line is mostly punctuation and clock times, and
     the one word in it worth finding at a glance is the person — so it is the
     one word set apart.

     Weight and colour, not weight alone. A card's state line is eleven pixels
     of monospace in the muted grey, and at that size bold on its own is a
     difference you have to be told about before you can see it; lifting the
     name out of the grey is what actually makes it the thing the eye lands on.
     The rows under "up next" are already drawn in this colour, so there it is
     the weight doing the work. */
  .at-name { font-weight: 700; color: var(--text); }
  .tick { font-size: 11px; color: var(--st-confirmed); flex-shrink: 0; }
  .queue { font-family: var(--mono); font-size: 10px; color: var(--muted); flex-shrink: 0; }
  .card-state .queue { margin-left: auto; }

  .card-bar { height: 3px; border-radius: 2px; background: rgba(255,255,255,0.07); margin-top: 8px; overflow: hidden; }
  .card-bar span { display: block; height: 100%; border-radius: 2px; background: var(--st-claimed); transition: width 1s linear; }

  .empty-note { padding: 26px 16px; color: var(--muted); font-size: 13px; text-align: center; }

  /* ---- The spawn window ---------------------------------------------------
     One window per spawn, big enough to hold the whole decision: what is
     happening on it now, and the week it is booked into. Booking used to be a
     link somewhere else, which made planning a hunt feel like a separate errand
     from taking one — they are the same thought, so they are one window. */
  .veil { position: fixed; inset: 0; background: rgba(4,5,8,0.72); backdrop-filter: blur(2px); z-index: 40; display: none; }
  .veil.open { display: block; }
  /* The ceilings were picked on a laptop and had no upper branch: past a
     1150x830 viewport the min() stopped following the screen entirely, so on a
     4K panel the window took under a third of the width and rather more than a
     third of the height and left the rest of the display empty. Raised, and the
     two raised together on purpose: the enlarged hour rows below are 35px, so a
     day of them is 840px, and a height that did not grow with the type would
     have spent the whole of this change putting fewer hours on the screen than
     were there before. The ceiling is set to clear that day plus the strips
     above and below it — near enough that the evening is in view on opening
     rather than scrolled to, which is what the window is opened for.

     Both stay min() against the viewport, so nothing here reaches a screen
     that has not got the room: a laptop is bounded by its own height exactly
     as it was, and only a display with the pixels going spare ever sees the
     new ceilings at all.

     The height is a ceiling and not a height, which is the whole difference
     between this and a panel with a field of nothing under its calendar. A day
     is 24 rows and no more; once the window was allowed to be 1180px tall, any
     screen whose rows were still the unenlarged 28px had a grid some 700px tall
     sitting in 930px of space, and the remainder was simply empty. So the panel
     is as tall as what is in it and stops growing here — which also means it
     needs no separate ceiling per --ui-scale step, since taller rows make a
     taller grid and the window follows on its own. */
  .window {
    position: fixed; z-index: 41; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(1600px, calc(100vw - 28px));
    height: auto; max-height: min(1180px, calc(100vh - 40px));
    background: var(--panel); border: 1px solid #2a3142; border-radius: 14px;
    box-shadow: 0 30px 90px rgba(0,0,0,0.6);
    display: none; overflow: hidden;
    /* Nothing inside hands its leftover scroll to the page behind it. Reaching
       the bottom of the week and carrying on used to bounce the document, which
       is the other half of the jitter the body lock deals with. */
    overscroll-behavior: contain;
  }
  .window.open { display: flex; flex-direction: column; }

  /* ---- Growing the window's type -----------------------------------------
     A bigger box on its own would have given more week at the same nine pixels,
     which is the half of this that actually reads as unusable: the window is
     pixel-sized throughout, so on a dense display its type is physically half
     the size the same panel has on a laptop.

     Keyed on width alone, and generously, because width is the honest signal
     here. A 4K display run at 100% is 3840 CSS pixels and everything on it is
     tiny; the same display run at 200% is 1920 and everything on it is already
     the right size, and it correctly gets nothing from this. Two steps rather
     than a continuous function so there are only three appearances to have
     looked at, and a height floor on both so a short, wide screen is never
     given rows too tall for a day to fit in what it has.

     The two multiples are eighths, and deliberately: an hour row is 28px, so
     these are the sizes that come out whole — 31.5 and 35 — where a friendlier
     looking 1.3 gives 36.4 and lands every one of the day's twenty-four hour
     rules on a different fraction of a pixel. That costs twice: the rules
     render at visibly uneven weights, and the script's idea of the height
     drifts from the browser's by a fraction a row all the way down the day.
     A quarter is also as far as this should go — a third would push the day
     past the height even the raised window has, and the week would be back to
     being scrolled.

     On .window rather than on :root: the board behind is already the size it
     wants to be, and inherits the 1 declared up there. Classes the two share —
     the buttons, the segmented controls — therefore draw at their old size out
     on the board and at the raised one in here, with no rule of their own. */
  @media (min-width: 2000px) and (min-height: 800px) { .window { --ui-scale: 1.125; } }
  @media (min-width: 2800px) and (min-height: 800px) { .window { --ui-scale: 1.25; } }

  /* The creature, filling the window rather than tucked in a corner. Kept far
     enough back that everything on top of it stays readable — the scrim does
     that work, so the art can be large without becoming noise. Never mirrored,
     for the same reason as the card sprites. */
  .watermark {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; object-position: center 46%;
    image-rendering: pixelated; pointer-events: none; user-select: none;
    opacity: 0.09; filter: saturate(0.85);
  }
  .watermark.placeholder { opacity: 0.05; filter: grayscale(1); }
  .scrim {
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(120% 90% at 50% 45%, rgba(18,21,28,0.12) 0%, rgba(18,21,28,0.7) 62%, rgba(18,21,28,0.93) 100%),
      linear-gradient(rgba(18,21,28,0.55), rgba(18,21,28,0.18) 30%, rgba(18,21,28,0.75));
  }
  .window > .win-head, .window > .win-body { position: relative; }

  /* One row, always. Wrapping put the close button on a line of its own the
     moment a long spawn name met a narrow phone, which cost a row of the panel
     and moved the one control that should never move. So the row does not wrap
     and the two things that can be any length give way instead: the region
     first — where a spawn is, is the least of what this row says — and the name
     ellipsises only once that is gone. */
  .win-head { display: flex; align-items: center; gap: 12px; padding: 15px 20px 13px; border-bottom: 1px solid var(--panel-border); flex-wrap: nowrap; }
  .win-head .code-chip { font-size: calc(15px * var(--ui-scale)); padding: 4px 11px; border-radius: 7px; flex-shrink: 0; }
  .win-title {
    font-size: calc(17px * var(--ui-scale)); color: var(--text-strong); font-weight: 600; letter-spacing: -0.01em;
    flex: 0 1 auto; min-width: 3ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* A shrink factor far above the title's, so this is what disappears first. */
  .win-region {
    font-family: var(--mono); font-size: calc(11px * var(--ui-scale)); color: var(--muted);
    flex: 0 100 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .win-close { margin-left: auto; background: none; border: none; color: var(--muted); font-size: calc(22px * var(--ui-scale)); cursor: pointer; line-height: 1; padding: 0 2px; flex-shrink: 0; }
  .win-close:hover { color: var(--text-strong); }
  /* A column, so the week inside it can be handed whatever height is left over
     rather than guessing at it. `min-height: 0` on each link of that chain is
     what lets a flex child be *shorter* than its contents — without it every
     one of them sizes to the full grid and the panel grows past the window,
     which is the scrolling this is meant to do away with.

     The basis is `auto` and not the 0 that a bare `flex: 1` means, on this and
     on the two links under it. With a window that is only as tall as its
     contents, a basis of 0 says the contents are nothing: the chain has no
     height to be given a share of, so every one of them collapses and the panel
     shuts to the height of its own header. Told to start at what is in them,
     they still take the leftover height whenever there is some — a full window
     distributes exactly as it did — and they now also state a height when the
     window is asking them what it should be. */
  .win-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
              overflow-y: auto; overscroll-behavior: contain;
              scrollbar-width: thin; scrollbar-color: #2a3140 transparent; }
  .cal-section, .cal { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
  .win-body::-webkit-scrollbar { width: 10px; }
  .win-body::-webkit-scrollbar-track { background: transparent; }
  .win-body::-webkit-scrollbar-thumb { background: #2a3140; border-radius: 5px; border: 3px solid var(--panel); background-clip: padding-box; }

  .strip {
    display: flex; align-items: center; gap: 11px; padding: 10px 20px; flex-wrap: wrap;
    border-bottom: 1px solid var(--panel-border); font-size: calc(12px * var(--ui-scale)); color: var(--muted);
  }
  .strip i { font-size: calc(14px * var(--ui-scale)); }
  .now-strip { background: rgba(255,255,255,0.02); }
  /* `.fold` itself has gone with the calendar's fold — it was the only thing
     wearing it, and a heading that does not answer a press has no business
     carrying a pointer and a hover. The two parts below outlived it: the title
     is the voice every section heading speaks in, folding or not, and the
     chevron is still turned by Up next and by the moderator panel. */
  .fold-title { color: var(--text-strong); font-weight: 600; font-size: calc(12.5px * var(--ui-scale)); }
  .fold-chevron { transition: transform 0.15s ease; margin-left: auto; }

  /* ---- Up next -----------------------------------------------------------
     What is actually coming to this spawn, which "+2 queued" never said. The
     queue first — it happens soonest, and its times run off the hunt on now —
     then bookings by start. Shut by default: it is reference, not the thing
     anybody opened the panel to do, and its header carries the one row worth
     having without opening it.

     A rail with a pip per entry rather than a table, because the list is short
     and in time order, and a rail reads as an evening where a table reads as
     data. */
  .up-head {
    display: flex; align-items: center; gap: 9px; padding: 9px 20px;
    border-bottom: 1px solid var(--panel-border); font-size: calc(12px * var(--ui-scale)); color: var(--muted);
    cursor: pointer; user-select: none;
  }
  .up-head:hover { background: rgba(255,255,255,0.03); }
  .up-head .fold-chevron { transform: rotate(180deg); }
  .up-head.open .fold-chevron { transform: rotate(0deg); }
  .up-peek {
    font-family: var(--mono); font-size: calc(11px * var(--ui-scale)); min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .up-peek b { color: var(--text); font-weight: 600; }
  .up-count {
    font-family: var(--mono); font-size: calc(10px * var(--ui-scale)); padding: 1px 6px; border-radius: 9px;
    background: rgba(255,255,255,0.05); color: var(--muted); flex-shrink: 0; margin-left: auto;
  }
  .up-list {
    border-bottom: 1px solid var(--panel-border); padding: 6px 20px 9px;
    max-height: calc(190px * var(--ui-scale)); overflow-y: auto; overscroll-behavior: contain;
    scrollbar-width: thin; scrollbar-color: #2a3140 transparent;
    font-family: var(--mono); font-size: calc(11.5px * var(--ui-scale));
  }
  /* Fixed tracks throughout, and a width on the trailing one: a column that only
     some rows fill is a column that moves. */
  .up-row {
    /* The time track holds "≈11:30pm" — the widest an hour of the day gets once
       it carries am/pm — without the day label under it wrapping. */
    display: grid; grid-template-columns: 66px 14px minmax(0, 1fr) 44px;
    gap: 8px; align-items: center; padding: 5px 0; line-height: 1.4;
  }
  .up-when { text-align: right; color: var(--text-strong); font-variant-numeric: tabular-nums; }
  .up-when small { display: block; font-size: calc(9px * var(--ui-scale)); color: var(--muted); }
  /* The rail is drawn off each row's own box, joining pip to pip, and stops at
     the first and last so it does not dangle past either end of the list. */
  .up-rail { position: relative; height: 100%; display: flex; align-items: center; justify-content: center; }
  .up-rail::before {
    content: ''; position: absolute; top: -50%; bottom: -50%; left: 50%; width: 1px;
    background: var(--panel-border); transform: translateX(-0.5px);
  }
  .up-row:first-child .up-rail::before { top: 50%; }
  .up-row:last-child .up-rail::before { bottom: 50%; }
  .up-pip { position: relative; width: 7px; height: 7px; border-radius: 50%; background: var(--st-booked); }
  .up-queued .up-pip { background: var(--st-claimed); }
  .up-asked .up-pip { background: var(--st-asked); }
  .up-mine .up-pip { background: var(--st-free); }
  .up-body { min-width: 0; }
  .up-who { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .up-sub { color: var(--muted); font-size: calc(10px * var(--ui-scale)); }
  /* A booking's countdown is definite and coloured; a queue place's is a
     projection off hunts that may not run their length, so it stays muted. */
  .up-sub .up-rel { color: var(--accent); }
  .up-queued .up-sub .up-rel { color: var(--muted); }
  .up-tag {
    font-family: var(--sans); font-size: calc(8.5px * var(--ui-scale)); text-transform: uppercase; letter-spacing: 0.09em;
    padding: 1px 5px; border-radius: 3px; justify-self: end;
  }
  .up-tag.queue { color: var(--st-claimed); background: rgba(210,51,105,0.16); }
  .up-tag.asked { color: var(--st-asked); background: rgba(224,169,62,0.16); }
  .up-tag.you { color: var(--st-free); background: rgba(46,204,113,0.16); }
  .up-more { font-family: var(--mono); font-size: calc(10.5px * var(--ui-scale)); color: var(--muted); padding-top: 6px; }
  .field { display: flex; align-items: center; gap: 7px; }
  .field-label { font-family: var(--mono); font-size: calc(9px * var(--ui-scale)); text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
  .live-bar { flex: 1; min-width: 80px; max-width: 220px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.08); overflow: hidden; }
  .live-bar span { display: block; height: 100%; background: var(--st-claimed); transition: width 1s linear; }

  .seg { display: flex; border: 1px solid var(--panel-border); border-radius: 6px; overflow: hidden; }
  .seg button {
    background: transparent; border: none; border-left: 1px solid var(--panel-border);
    color: var(--muted); font-family: var(--mono); font-size: calc(11px * var(--ui-scale)); padding: 4px 9px; cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .seg button:first-child { border-left: none; }
  .seg button:hover { background: rgba(255,255,255,0.04); color: var(--text); }
  .seg button.on { background: rgba(91,140,255,0.18); color: #cfdcff; }

  .dur-cap { font-family: var(--mono); font-size: calc(10px * var(--ui-scale)); color: var(--muted); }

  /* ---- How long: the day's tank ------------------------------------------
     Not a nought-to-ceiling slider but the stamina itself — grey for what today
     has already taken, accent for what this hunt would take, empty for what
     would be left. The ceiling stops being a rule that refuses you and becomes
     the end of the bar, which you can see yourself approaching.
     It is also why the strip above no longer carries a stamina readout of its
     own: that was the same quantity stated twice, once as a bar you could not
     touch and once as a number, and neither of them was the thing you were
     about to change. */
  .tank {
    display: block; position: relative; width: calc(240px * var(--ui-scale)); height: calc(34px * var(--ui-scale)); border-radius: 8px;
    border: 1px solid var(--panel-border); background: rgba(255,255,255,0.02);
    overflow: hidden; touch-action: none; user-select: none; cursor: ew-resize;
  }
  .tank:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* Nothing to set when there is nothing left to spend. Still drawn, because a
     full grey bar is the clearest possible statement of why. */
  .tank[aria-disabled="true"] { cursor: default; }
  .tank-zones { position: absolute; inset: 5px; border-radius: 4px; background: rgba(255,255,255,0.05); overflow: hidden; display: flex; }
  .tank-spent { background: rgba(124,134,152,0.3); }
  .tank-hunt { background: var(--accent); }
  /* Where this hunt would end. */
  .tank-edge {
    position: absolute; top: 3px; bottom: 3px; width: 3px; border-radius: 2px;
    background: var(--text-strong); box-shadow: 0 0 6px rgba(0,0,0,0.7); z-index: 2; pointer-events: none;
  }
  /* The guild's own ceiling, drawn only when it bites before the tank does.
     Without it the bar would just stop following the finger part way along with
     nothing on screen to say why. */
  .tank-cap { position: absolute; top: 4px; bottom: 4px; border-left: 1px dashed var(--warn); opacity: 0.75; z-index: 1; pointer-events: none; }
  /* Each figure inside the block it is about, both sliding with the boundary. */
  .tank-in, .tank-out {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 3;
    white-space: nowrap; pointer-events: none; font-family: var(--mono); font-variant-numeric: tabular-nums;
  }
  .tank-in { font-size: calc(12.5px * var(--ui-scale)); font-weight: 600; color: #06122e; }
  /* A short hunt is narrower than the word for it, so the figure steps outside
     the block and takes the page's own text colour to stay readable. */
  .tank-in.outside { color: var(--text-strong); }
  .tank-out { font-size: calc(10.5px * var(--ui-scale)); color: var(--muted); }
  /* The blue has reached it and is now behind it, so it wears the blue's type
     colour rather than moving out of the way. */
  .tank-out.on-hunt { color: #06122e; font-weight: 600; }

  /* The booking controls, in named groups rather than one flat run of spans.
     On a wide panel the groups sit on one line and read exactly as they did; on
     a phone each becomes a row of its own, which is the only way any of them can
     be centred — a flat strip left to wrap puts things wherever they happen to
     fall, which is how "Once | Weekly" ended up off to one side. */
  .cal-controls { gap: 10px 14px; }
  .cc-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .cc-week { margin-left: auto; gap: 10px; }

  .btn {
    background: var(--accent); border: 1px solid var(--accent); border-radius: 6px;
    color: var(--bg); font-size: calc(12.5px * var(--ui-scale)); font-weight: 600; padding: 6px 15px; cursor: pointer;
    /* Inline-flex so a button that carries an icon spaces it from its label
       without every such button having to say so itself. A button with only a
       label is laid out exactly as it was. */
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn > i { font-size: calc(14px * var(--ui-scale)); line-height: 1; }
  .btn:hover:not([disabled]) { filter: brightness(1.08); }
  .btn[disabled] { background: transparent; color: var(--muted); border-color: var(--panel-border); cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--text); border-color: var(--panel-border); }
  .btn.ghost:hover:not([disabled]) { border-color: var(--accent); }
  .btn.danger { background: transparent; color: var(--st-claimed); border-color: rgba(210,51,105,0.5); }
  .btn.danger:hover:not([disabled]) { background: rgba(210,51,105,0.12); }
  .btn.small { font-size: calc(11px * var(--ui-scale)); padding: 4px 10px; }
  .btn.mod-btn { background: transparent; color: var(--purple); border-color: rgba(167,139,250,0.4); }
  .btn.mod-btn:hover:not([disabled]) { background: rgba(167,139,250,0.12); }
  /* After the variants, not with `.btn[disabled]` above: that rule ties with
     `.btn.mod-btn` and `.btn.ghost` on specificity and loses on order, so a
     disabled button kept its colour and read as pressable. */
  .btn.mod-btn[disabled], .btn.ghost[disabled], .btn.danger[disabled] {
    background: transparent; color: var(--muted); border-color: var(--panel-border);
    cursor: not-allowed;
  }
  /* Claiming is green here because it is green in Discord — Button.success on
     the same action, wearing the same emoji. Somebody who has used the one
     should recognise the other without reading it. */
  .btn.claim { background: var(--st-free); border-color: var(--st-free); color: #06301a; }
  .btn.claim[disabled] { background: transparent; border-color: var(--panel-border); }
  .btn-emoji { width: 15px; height: 15px; flex-shrink: 0; }
  .btn[disabled] .btn-emoji { opacity: 0.4; filter: grayscale(1); }

  /* Everything the panel has to say, on one row of its own above the row you act
     on. A verdict about the slot selected and a reply to something just pressed
     are the same kind of thing at different moments, so they share a row rather
     than stacking two — and the reply wins while there is one, being the newer
     news. The row below never changes height, so the button never moves; this
     one grows upward instead. */
  .foot-msg {
    padding: 9px 20px; border-top: 1px solid var(--panel-border);
    display: flex; align-items: flex-start; gap: 8px; font-size: calc(12.5px * var(--ui-scale)); line-height: 1.45;
  }
  .foot-msg > i { font-size: calc(15px * var(--ui-scale)); flex-shrink: 0; margin-top: 1px; }
  .foot-msg.ok { color: var(--st-free); }
  .foot-msg.no { color: var(--st-asked); }
  /* Standing advice rather than news, so it is quieter than either — it is what
     the row holds when there is nothing to report. */
  .foot-msg.hint-msg { color: var(--muted); font-size: calc(11.5px * var(--ui-scale)); }
  .foot-msg.hint-msg > i { font-size: calc(14px * var(--ui-scale)); opacity: 0.75; }
  /* Sized by its content and never scrolled away, so neither the button nor a
     reply can be left off the bottom of a panel whose body is taller than the
     window. Its children carry their own top borders, so it adds none. */
  .win-foot { position: relative; flex-shrink: 0; }

  /* The same tools one evening at a time, under the calendar. Dashed top border
     and the purple label of the block above, so a moderator reads them as the
     same kind of act rather than as part of the booking controls they sit
     beside — what is being changed here is somebody else's evening.

     Folded away by default, because it is the rarest thing on this panel and
     the only one that acts on somebody else. What is left when it is closed is
     one line naming the evening it would act on, which is what keeps it from
     being a box somebody has to open to find out what is in it. */
  /* The spawn's own moderator block folds the same way and shares these rules
     outright, rather than a second set that looks the same until one of them is
     edited. Both are the same act — reaching past a member to change something
     that is not yours — so they read as one control in two places. */
  .slot-tools { border-top: 1px dashed var(--panel-border); }
  .slot-strip {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 20px;
    background: none; border: 0; cursor: pointer; color: var(--purple); text-align: left;
  }
  .slot-strip:hover { background: rgba(167,139,250,0.06); }
  .slot-tools.open .slot-strip { background: rgba(167,139,250,0.08); }
  .slot-strip-label { font-family: var(--mono); font-size: calc(9px * var(--ui-scale)); text-transform: uppercase; letter-spacing: 0.12em; }
  /* Pushed to the end and allowed to shrink first: on a narrow screen the label
     and the chevron are what must survive, and a long name truncates rather
     than pushing the chevron off the strip. */
  .slot-strip-who {
    margin-left: auto; color: var(--muted); font-family: var(--mono); font-size: calc(10px * var(--ui-scale));
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* The strip above is tinted while the panel is open, so the row needs a gap
     of its own or the buttons sit directly on that tint and read as part of the
     strip rather than as what is under it. The strip's own 9px was doing the
     whole job and was never enough. */
  .slot-body { padding: 10px 20px 12px; }

  /* One row, in every state the panel has. Nothing stretches: the buttons used
     to share the row equally, which made a word like "+30m" as wide as the
     panel and looked like a mistake. They are their own width now and the gap
     below does the separating. */
  .mod-row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .mod-row .btn { flex-shrink: 0; }
  /* Pushes the ceiling to the right, into the space the verbs leave. Anchored
     there so it does not move as the verbs come and go with the selection. */
  .mod-gap { flex: 1; min-width: 12px; }
  /* Inline rather than on a line of its own — it is a caveat to the button
     beside it, not an announcement. */
  .mod-warn { color: var(--st-claimed); font-size: calc(11.5px * var(--ui-scale)); line-height: 1.4; min-width: 0; }
  /* The length being dragged, in the same mono the strip names its target in:
     it is a reading off the grid, not a sentence. */
  .mod-length {
    color: var(--purple); font-family: var(--mono); font-size: calc(11px * var(--ui-scale)); white-space: nowrap;
  }
  /* How to move it, leading the row. Muted, because somebody who has already
     grabbed the block has no more use for it — and the first to give up width
     when the row runs short, since the length and the verbs beside it are what
     anybody is actually reaching for. */
  .mod-hint { color: var(--muted); font-size: calc(11.5px * var(--ui-scale)); line-height: 1.4; min-width: 0; flex-shrink: 1; }
  /* The person picker takes what the verbs were using. */
  .mod-grow { flex: 1 1 12rem; min-width: 0; }

  @media (max-width: 420px) {
    .slot-strip, .slot-body { padding-left: 14px; padding-right: 14px; }
    /* The ceiling drops onto its own line rather than being squeezed beside
       three buttons; the gap collapses so it lands at the left with them. */
    .mod-gap { flex-basis: 100%; min-width: 0; }
  }

  /* ---- Week grid ---------------------------------------------------------- */
  .cal-legend { display: flex; gap: 14px; padding: 9px 20px; border-bottom: 1px solid var(--panel-border); flex-wrap: wrap; }
  .cal-legend span { display: flex; align-items: center; gap: 6px; font-size: calc(11px * var(--ui-scale)); color: var(--muted); }
  .swatch { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; border: 1.5px solid; }
  .sw-claimed { border-color: var(--st-claimed); background: rgba(210,51,105,0.3); }
  .sw-booked { border-color: var(--st-booked); background: transparent; border-style: dashed; }
  .sw-confirmed { border-color: var(--st-confirmed); background: var(--st-confirmed); }
  .sw-asked { border-color: var(--st-asked); background: rgba(224,169,62,0.28); }
  .sw-pick { border-color: var(--purple); border-style: dashed; background: rgba(167,139,250,0.4); }

  /* The headings ride inside the scroller with the columns they name, stuck to
     its top. They used to be a grid of their own above it, which is fine while
     the week is only ever as wide as the panel — but a phone shows four days of
     seven and slides sideways for the rest, and a heading row outside that
     movement would sit still while its own columns went past underneath. */
  .wk-headrow, .wk-rows { display: grid; grid-template-columns: var(--gutter) repeat(var(--days, 7), var(--daycol)); }
  .wk-headrow { position: sticky; top: 0; z-index: 7; background: var(--panel); }
  .wk-head { font-family: var(--mono); font-size: calc(10px * var(--ui-scale)); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); text-align: center; padding: 8px 0 7px; border-bottom: 1px solid var(--panel-border); }
  .wk-head.today { color: var(--accent); }
  .wk-head .dnum { display: block; font-size: calc(13px * var(--ui-scale)); color: var(--text-strong); margin-top: 2px; letter-spacing: 0; }
  /* The corner the two sticky axes meet in, above both of them. */
  .wk-corner { position: sticky; left: 0; z-index: 8; background: var(--panel); border-bottom: 1px solid var(--panel-border); }
  /* Sized off the viewport rather than fixed, so on a laptop screen the grid
     gives ground to the strips above and below it instead of pushing the
     booking controls off the bottom of the window. */
  /* The one thing on the panel that scrolls. It takes the height left after the
     strips above and below have had theirs, rather than the viewport arithmetic
     this used to do — which had to be re-guessed whenever anything around it
     changed height, and was wrong on a phone. */
  .wk-body { position: relative; flex: 1 1 auto; min-height: 120px; overflow: auto; overscroll-behavior: contain;
             margin: 0 20px; scrollbar-width: thin; scrollbar-color: #2a3140 transparent;
             /* One finger scrolls the way the browser scrolls, momentum and all;
                two are ours. On the scroller as well as on the grid inside it,
                because which of the two a touch is measured against is not the
                same question in every engine. */
             touch-action: pan-x pan-y; }
  .wk-body::-webkit-scrollbar { width: 10px; }
  .wk-body::-webkit-scrollbar-track { background: transparent; }
  .wk-body::-webkit-scrollbar-thumb { background: #2a3140; border-radius: 5px; border: 3px solid var(--panel); background-clip: padding-box; }
  /* A week whose bookings have not landed yet. The grid itself is a function of
     the date and is already right, so the only thing outstanding is what is
     drawn on it — which makes a thread at the top the honest signal, rather than
     blanking a panel that is not actually wrong. */
  .wk-body.pending::before {
    /* Pulled back out of the flow it takes up, so the grid does not step down
       two pixels while a week is loading and back up when it arrives. */
    content: ''; position: sticky; top: 0; z-index: 9; display: block;
    height: 2px; margin-bottom: -2px; pointer-events: none;
    background-image: linear-gradient(90deg, transparent, var(--accent), transparent);
    background-size: 40% 100%; background-repeat: no-repeat;
    animation: sweep 1.1s ease-in-out infinite;
  }
  @keyframes sweep { from { background-position: -45% 0; } to { background-position: 145% 0; } }
  @media (prefers-reduced-motion: reduce) {
    .wk-body.pending::before { animation: none; background-image: none; background-color: rgba(91,140,255,0.45); }
  }
  /* Two grids of identical shape, stacked: the headings and the day columns.
     Everything absolutely placed on the week — the now line, the selection —
     belongs to the lower one, so its coordinates stay measured from midnight and
     owe nothing to how tall the headings happen to be. */
  .wk-grid {
    position: relative; --gutter: calc(56px * var(--ui-scale));
    /* A day is a fixed width and the strip is as long as it needs to be, at
       every size. It used to be a seventh of the panel, which is what made the
       week a page: seven columns, exactly one screenful, nothing either side to
       scroll to. A fixed column turns the same grid into a strip that runs on
       as far as there are days, and a wide panel simply shows more of it.

       Times the zoom, which a pinch moves — see pinchZoom. Everything about the
       strip that depends on how wide a day is measures a real column when it is
       asked, so changing this one number is the whole of zooming: the browser
       reflows the grid and nothing is redrawn by us at all. */
    --zoom: 1;
    --daycol: calc(150px * var(--ui-scale) * var(--zoom));
    /* An hour, in pixels, at the size the grid is currently being read at.
       Everything placed against the clock is written as a multiple of this and
       is laid out by the browser, so changing the zoom reflows the whole grid
       and redraws nothing: at 28px an hour a day is 672px, which no phone has,
       and pinching down to a third of that is how the evening and the small
       hours get onto one screen together. */
    --vzoom: 1;
    --row: calc(var(--row-base) * var(--ui-scale) * var(--vzoom));
    --min-block: calc(13px * var(--ui-scale));
    width: max-content;
    /* One finger still scrolls the way the browser scrolls, momentum and all.
       Two are ours: leaving pinch-zoom out of this list is what stops the page
       zooming underneath the gesture. */
    touch-action: pan-x pan-y;
  }
  .wk-rows { position: relative; }
  /* Relative only so the now flag can hang off it; it earns a background and a
     layer of its own on a phone, where it is stuck to the left edge and has the
     rest of the week passing behind it. */
  /* Stuck to the left edge with the days sliding behind it. It needs its own
     background for that, or the columns show through the hour labels. */
  .wk-hours { border-right: 1px solid var(--panel-border); position: sticky; left: 0; z-index: 5; background: var(--panel); }
  .wk-hour {
    height: var(--row); font-family: var(--mono); font-size: calc(9.5px * var(--ui-scale)); color: var(--muted);
    text-align: right; padding-right: 7px; position: relative; top: -5px; font-variant-numeric: tabular-nums;
  }
  /* The server-time echo, so a Berlin-anchored rule can be read off a local axis
     without doing the arithmetic in your head. */
  .wk-hour .srv { display: block; font-size: calc(8px * var(--ui-scale)); opacity: 0.5; margin-top: -3px; }
  .wk-col { border-left: 1px solid var(--panel-border); position: relative; }
  /* The strip is dragged about with a plain mouse, which has no sideways
     gesture of its own — see dragPan. */
  .wk-body { cursor: grab; }
  .wk-body.panning { cursor: grabbing; user-select: none; }
  .wk-body.panning .wk-cell { cursor: grabbing; }
  /* The same hour the gutter and the blocks are drawn against. It was left on
     the unzoomed one, so a pinch moved the labels and the bookings and left the
     lines behind them where they were: the column stayed its full height, the
     blocks bunched into the top of it, and the scroll had a different idea of
     how tall a day was than the layout did — which is why zooming out and back
     never came home. The cells are what give a column its height, so this one
     length has to be the same length as everything measured against it. */
  .wk-cell { height: var(--row); border-bottom: 1px solid rgba(31,36,48,0.55); cursor: pointer; }
  .wk-cell:hover { background: rgba(91,140,255,0.07); }
  .wk-cell.past { cursor: not-allowed; background: rgba(0,0,0,0.3); }
  .wk-cell.past:hover { background: rgba(0,0,0,0.3); }
  .wk-block {
    position: absolute; left: 2px; right: 2px; border-radius: 4px; padding: 2px 5px; overflow: hidden;
    font-family: var(--mono); font-size: calc(9.5px * var(--ui-scale)); line-height: 1.25; cursor: pointer; border: 1px solid;
    /* Placed against the hour rather than in pixels, so a zoom is a reflow and
       not a redraw. `--at` is hours from the top of the column and `--len` is
       how many it runs for; a block being dragged writes over these with a
       plain pixel top, which is what an inline style is for. */
    top: calc(var(--row) * var(--at, 0)); height: max(var(--min-block), calc(var(--row) * var(--len, 1) - 2px));
    /* Opaque, whatever the state's tint. Every block used to be a wash of colour
       with the hour rules showing straight through it, so a booking read as
       coloured glass laid over the grid rather than as a thing sitting on it —
       and on a two-hour block the line across the middle looked like the block
       had been cut in two.

       Each state gives its colour as `--tint` and it is composited here over the
       panel's own background, so the hue is exactly what it always was. Over a
       known colour rather than over whatever happens to lie behind, which is
       also what makes a block the same shade wherever on the grid it falls: a
       block over an hour rule, over the shaded past, or over another block used
       to be three slightly different colours. */
    background: linear-gradient(var(--tint, transparent), var(--tint, transparent)), var(--panel);
  }
  .wk-block .who { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* What a block gives up as its column narrows, in the order it can afford to.
     A pinched-out fortnight is worth having and half a clipped word is not, so
     the account goes first, then the time, and at the far end a block is a bar
     of colour saying only that the evening is taken. Set from the measured
     width rather than from the zoom, because the two bases differ: a phone's
     column starts at a quarter of the screen and a desktop's at 150px. */
  .wk-grid.z-noacct .wk-block .acct, .wk-grid.z-noacct .wk-block .fate { display: none; }
  .wk-grid.z-notime .wk-block .tm { display: none; }
  .wk-grid.z-bars .wk-block { padding: 0; }
  .wk-grid.z-bars .wk-block .who { display: none; }
  /* The same bargain down the other axis. A squeezed hour cannot hold two lines,
     and below about a centimetre it cannot hold twelve labels in a row without
     them touching — so the server echo goes first, then every other hour's
     number, which still leaves an axis anybody can count along. */
  .wk-grid.z-srv .wk-hour .srv { display: none; }
  .wk-grid.z-srv .wk-hour { top: -3px; }
  .wk-grid.z-halfhours .wk-hour:nth-child(even) { color: transparent; }
  /* A time never breaks across two lines. Half of "19:00–21:00" on one line and
     half on the next is not a shorter label, it is a wrong-looking one. */
  .wk-block .tm { opacity: 0.75; font-variant-numeric: tabular-nums; display: block; white-space: nowrap; }
  /* Who the character on the first line belongs to. Quieter than either of the
     lines above it: it answers a question about the block rather than saying
     what the block is, and it is the line that may be cut when the name is
     longer than the column. */
  .wk-block .acct {
    display: block; opacity: 0.6; font-size: calc(8.5px * var(--ui-scale)); margin-top: 1px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* State decides the colour; whose it is decides how loud. Two hues would have
     meant a booking of yours and a booking of theirs looked like different
     kinds of thing, which they are not. */
  .b-claimed { --tint: rgba(210,51,105,0.26); border-color: var(--st-claimed); color: #f3a6c0; }
  .b-booked { --tint: rgba(91,140,255,0.16); border-color: var(--st-booked); border-style: dashed; color: #cfdcff; }
  .b-confirmed { --tint: rgba(91,140,255,0.3); border-color: var(--st-confirmed); color: #cfdcff; }
  .b-asked { --tint: rgba(224,169,62,0.2); border-color: var(--st-asked); color: #e8c887; }
  .b-mine { box-shadow: inset 3px 0 0 currentColor; }
  /* A rule that will produce this slot but has not booked a row for it yet.
     Real enough to plan around, not yet real enough for its owner to be asked. */
  .b-predicted { opacity: 0.62; }
  .b-pick { --tint: rgba(167,139,250,0.34); border: 1px dashed var(--purple); color: #ddd0ff; z-index: 3; }
  /* The selection is the one block on the grid you can pick up and move. */
  .b-drag { cursor: grab; touch-action: none; }
  .b-drag.dragging { cursor: grabbing; z-index: 6; box-shadow: 0 4px 14px rgba(0,0,0,0.45); }
  /* An evening the weekly rule will also take. Fainter than the one being
     picked, because it is a consequence rather than a choice. */
  .b-echo { --tint: rgba(167,139,250,0.14); opacity: 0.8; }
  /* The foot of the selection, for dragging its length. Given a real target
     height rather than a hairline, since it has to be grabbable with a mouse
     and with a thumb. */
  .stretch {
    position: absolute; left: 0; right: 0; bottom: -3px; height: 9px;
    cursor: ns-resize; touch-action: none; z-index: 4;
  }
  .stretch::after {
    content: ''; position: absolute; left: 50%; bottom: 4px; width: 18px; height: 2px;
    transform: translateX(-50%); border-radius: 1px; background: var(--purple); opacity: 0.85;
  }
  /* The block a moderator is re-timing. Lifted over its neighbours and given
     the dashed purple every other moderator control wears, so the length under
     the pointer reads as a proposal rather than as the booking itself — which
     it is not until Save. */
  .wk-block.b-editing {
    z-index: 5; border-style: dashed; border-color: var(--purple);
    box-shadow: 0 4px 14px rgba(0,0,0,0.45); touch-action: none;
  }
  /* A block clipped by local midnight keeps a flat edge, so it reads as
     continuing rather than as a booking that really stops there. */
  .clip-top { border-top-left-radius: 0; border-top-right-radius: 0; border-top-style: dashed; }
  .clip-bottom { border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom-style: dashed; }

  /* What has already happened here, and cannot be booked, asked about or given
     up. Grey rather than a turned-down version of its own state colour: the
     split worth seeing at a glance on a grid that now scrolls through weeks is
     between what is over and what is coming, and leaving colour on the past
     made a fortnight of history read as a fortnight of bookings seen through
     fog. Which it was is still on the block, in words.

     A booking nobody turned up for is hollow. It is the one distinction inside
     the past that anybody asks about — did they actually hunt it — so it is the
     one the shape carries. */
  .wk-block.b-past {
    --tint: rgba(255,255,255,0.035); border-color: rgba(255,255,255,0.1);
    color: var(--muted); cursor: default;
  }
  .wk-block.b-past .tm, .wk-block.b-past .acct { color: #59617a; }
  /* Still the hollow one of the pair: no tint at all against the faint wash the
     hunted block carries, and the dashed edge that was always the louder half of
     the distinction. Hollow, not see-through — a block nobody turned up for is
     no more a window onto the grid than any other. */
  .wk-block.b-past.b-unhunted { --tint: transparent; border-style: dashed; }
  /* Said on the block itself where there is room for it, since the alternative
     is a tooltip, and a tooltip is a thing you have to already suspect before
     you go looking for it. */
  .wk-block .fate { display: block; font-size: calc(8px * var(--ui-scale)); color: #59617a; font-style: italic; }
  /* The hunt the reader has picked out of the past, in the selection's own
     purple — so choosing a finished hunt reads like choosing a live one, which
     gets the purple preview drawn over the top of it.

     Not the preview's own fill, and not its dashed edge: this is a hunt that
     happened, and an evening about to be booked is a different offer that must
     not look the same. The ring is what carries it, since a block an hour long
     has little enough area for a wash of colour to read on. */
  .wk-block.b-past.b-chosen {
    border-color: var(--purple);
    --tint: rgba(167,139,250,0.16);
    color: #ddd0ff;
    box-shadow: 0 0 0 1px var(--purple);
  }
  .wk-block.b-past.b-chosen .tm,
  .wk-block.b-past.b-chosen .acct,
  .wk-block.b-past.b-chosen .fate { color: #b3a2e2; }

  /* ---- A slot holding more than one hunt -----------------------------------
     A window claimed, given up, and claimed again is two rows over the same
     hours, and the grid drew them one exactly on top of the other: the one
     underneath could not be read, could not be clicked, and did not announce
     that it was there. Nothing said the history had more in it than the block
     on top.

     So a run of overlapping blocks draws as one, with a count of what is behind
     it. Side by side was the other way — the shape every desk calendar uses —
     and it was wrong here: these are not two things happening at once, they are
     one slot's history, and splitting the column would have halved the width of
     every block on the busiest days to say so. */
  .wk-more {
    position: absolute; right: 3px; bottom: 3px; z-index: 3;
    /* Big enough to hit with a thumb without being big enough to cover the
       block it sits on — a hunt an hour long is only so tall. */
    min-width: 22px; height: 16px; padding: 0 5px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 8px; border: 1px solid rgba(255,255,255,0.22);
    background: rgba(12,15,22,0.82); color: var(--text);
    font-family: var(--mono); font-size: calc(8.5px * var(--ui-scale)); line-height: 1;
    cursor: pointer; user-select: none;
  }
  .wk-more:hover, .wk-more:focus-visible { background: var(--accent); border-color: var(--accent); color: #fff; outline: none; }
  /* On the shortest blocks the chip is the whole block, so the label goes and
     the count stands alone. Below that there is no room for either, and the
     block keeps a plain edge marker instead of a chip that would overhang. */
  .wk-block.has-more { border-right-width: 3px; }

  /* The picker itself. Fixed rather than absolute: it is opened from inside a
     scroller that clips its own overflow, and an absolute panel would be cut
     off at the column's edge on exactly the busy days it exists for. */
  .stack-pop {
    position: fixed; z-index: 60; width: min(260px, calc(100vw - 24px));
    background: var(--panel); border: 1px solid #2a3142; border-radius: 10px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.55); overflow: hidden;
  }
  .stack-pop h4 {
    margin: 0; padding: 8px 10px 6px; font-size: 11px; font-weight: 600;
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em;
    border-bottom: 1px solid #232a38;
  }
  .stack-pop .sp-list { max-height: min(260px, 50vh); overflow-y: auto; }
  .stack-pop button.sp-row {
    display: flex; gap: 8px; align-items: flex-start; width: 100%;
    padding: 7px 10px; background: none; border: 0; border-bottom: 1px solid #1d2330;
    color: var(--text); font: inherit; text-align: left; cursor: pointer;
  }
  .stack-pop button.sp-row:last-child { border-bottom: 0; }
  .stack-pop button.sp-row:hover, .stack-pop button.sp-row:focus-visible { background: rgba(91,140,255,0.12); outline: none; }
  .stack-pop button.sp-row.on { background: rgba(91,140,255,0.18); }
  /* The same swatch the legend above the grid uses, so a row here and a block
     down there are recognisably the same state. */
  .stack-pop .sp-sw { flex: 0 0 auto; margin-top: 3px; }
  /* A hunt that is over, in the shape the grid draws it: grey, and hollow when
     nobody turned up — the one distinction inside the past anybody asks about. */
  .sw-past { border-color: rgba(255,255,255,0.22); background: rgba(255,255,255,0.06); }
  .sw-past.sw-unhunted { background: transparent; border-style: dashed; }
  .stack-pop .sp-txt { min-width: 0; }
  .stack-pop .sp-who { display: block; font-weight: 600; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stack-pop .sp-tm { display: block; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .stack-pop .sp-note { display: block; font-size: 11px; color: #59617a; font-style: italic; }

  .ss-line { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed rgba(224,169,62,0.45); pointer-events: none; z-index: 2;
             top: calc(var(--row) * var(--at, 0)); }
  .ss-label { position: absolute; right: 3px; top: calc(var(--row) * var(--at, 0)); transform: translateY(-100%); font-family: var(--mono); font-size: calc(8px * var(--ui-scale)); color: var(--warn); opacity: 0.9; letter-spacing: 0.08em; pointer-events: none; }
  /* The width of the whole grid, not of today's column. It marks a height on
     the hour axis, and the axis is shared by every column — which is also why
     the red flag that labels it lives in the gutter, stuck to the left and on
     screen whatever the strip has been scrolled to. Drawn in today's column
     alone it left that flag pointing at nothing the moment anybody scrolled. */
  .now-line { position: absolute; left: 0; right: 0; height: 0; border-top: 1px solid var(--bad); z-index: 4; pointer-events: none;
              top: calc(var(--row) * var(--at, 0)); }
  /* Carried by the hour gutter rather than by the grid, so that on a phone — where
     the gutter is stuck to the left edge and the days slide past it — the time
     stays where the axis it belongs to is, instead of scrolling off with Tuesday. */
  .now-flag {
    position: absolute; left: 2px; transform: translateY(-50%); z-index: 6; pointer-events: none;
    font-family: var(--mono); font-size: calc(8.5px * var(--ui-scale)); font-weight: 600; color: var(--bg);
    background: var(--bad); border-radius: 3px; padding: 1px 4px; font-variant-numeric: tabular-nums;
  }

  /* How long, and the thing that acts on it, in one row. The tank used to live
     up in the booking controls, a screen away from the button it feeds; the
     verdict that shared this row has moved to .foot-msg above. What is left is
     two objects whose height never changes, which is what keeps the button in
     one place however much the panel has to say. */
  .readout { padding: 10px 20px; border-top: 1px solid var(--panel-border); display: flex; align-items: center; gap: 12px; font-size: calc(12.5px * var(--ui-scale)); }
  .foot-dur { display: flex; align-items: center; gap: 9px; flex: 0 0 auto; min-width: 0; }
  .readout-actions { flex-shrink: 0; display: flex; align-items: center; gap: 10px; margin-left: auto; }
  .readout i { font-size: calc(15px * var(--ui-scale)); }
  .verdict-ask { color: var(--warn); } .verdict-no { color: var(--bad); } .verdict-ok { color: var(--st-free); }
  /* The two things a booking-over verdict turns on, picked out of a sentence
     that is now three clauses long: what pressing the button does, and what
     would defeat it. Coloured in the board's own words for those states rather
     than in a highlight of their own — amber is a slot that has been asked
     about, blue is one whose owner has confirmed — so the sentence and the
     block on the grid it is about are saying the same thing in the same hue. */
  .verdict-em { font-weight: 600; }
  .verdict-em.ask { color: var(--st-asked); }
  .verdict-em.yes { color: var(--st-confirmed); }
  .verdict-em.live { color: var(--st-claimed); }
  /* The name of a button, where a line says which one to press. No colour of
     its own: it names a control rather than one of the board's states, and
     spending a state's hue on it would say something untrue about the slot. */
  .verdict-em.act { color: var(--text-strong); }
  /* Whose slot it is, and when — the two things somebody scans a verdict for.
     Weight and brightness rather than colour, for the same reason: an identity
     is not a state. */
  .verdict-who { color: var(--text-strong); font-weight: 600; }
  /* Neither a yes nor a no: somebody clicked a hunt in progress and is being
     told whose it is. */
  .verdict-info { color: var(--muted); }
  .srv-note { font-family: var(--mono); font-size: calc(11px * var(--ui-scale)); color: var(--warn); }

  @media (max-width: 900px) { .wk-grid { --gutter: 44px; } }
  @media (max-width: 620px) {
    main { padding: 18px 12px 50px; }
    .masthead-right { margin-left: 0; width: 100%; }
    .filter { flex: 1; width: auto; }
    /* Less room to give it, so it is cut sooner rather than pushing the
       avatar and the chevron off the row. */
    .sw-title { max-width: 150px; }
    /* dvh, not vh: on a phone `100vh` is the viewport with the browser's own
       chrome pretended away, so a full-height panel is taller than the screen
       actually showing it and the whole thing scrolls by exactly the height of
       the address bar. dvh is the height there really is. The vh line stays
       ahead of it for anything too old to know the unit. */
    /* `max-height: none` puts back what the desktop ceiling would otherwise
       take: a phone wants the whole screen, and a ceiling of 100dvh minus the
       desktop's 40px of margin would hold the panel forty pixels short of the
       bottom with a strip of board showing under it. The height below is a
       height again here, not a ceiling — this is the one case where filling
       the screen is the point rather than fitting the contents. */
    .window { width: 100vw; height: 100vh; height: 100dvh; max-height: none; border-radius: 0; }
    /* Barely a margin. The grid is the thing the panel is for and the panel is
       the whole screen; ten pixels either side of it was a border drawn in
       nothing. */
    .wk-body { margin: 0 3px; }
    /* Nothing outside the week scrolls: it is the part that is too big for a
       phone, and everything else earns its place by being small enough. */
    .win-body { overflow-y: hidden; }
    /* Tighter, so the grid keeps as much of a short screen as it can. Every
       one of these is padding: the rows still say everything they said, they

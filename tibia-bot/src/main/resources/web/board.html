/** A length the reader picked: the slider, or the foot of their own selection.
 *  Remembered as theirs, so anything borrowed later gives way back to it. */
function setDuration(minutes) {
  view.duration = snapDuration(minutes);
  view.chosen = view.duration;
  view.answer = null;
  renderWindow();
}

/** A length taken off whatever is selected, for as long as it is selected.
 *
 *  Clicking a booking draws the selection over exactly that booking rather than
 *  the reader's own length hanging off its start — two windows where they
 *  clicked on one. It is emphatically not a choice, though, so it leaves
 *  [[view.chosen]] alone and `ownDuration` puts it back on the next empty slot.
 */
function borrowDuration(minutes) {
  view.duration = snapDuration(minutes);
  view.answer = null;
  renderWindow();
}

/** Back to the reader's own length, after a look at somebody else's block. */
function ownDuration() {
  if (view.chosen != null) view.duration = snapDuration(view.chosen);
}

/** Keep the chosen length inside what the hunt being arranged can actually run
 *  for.
 *
 *  The ceiling moves with the selection — a slot after the next server save is
 *  paid from that day's allowance — so a length that was impossible a moment ago
 *  may have become possible, and one that was fine may now be too long. Only
 *  ever raised from below the floor, never from a length somebody chose: picking
 *  half an hour deliberately and finding it stretched to two would be the page
 *  overruling them.
 */
function fitDuration() {
  const l = limits();
  if (!l) return;
  const ceiling = cap();
  if (ceiling <= 0) { view.duration = 0; return; }
  const floor = Math.min(SLOT, ceiling);
  if (!view.duration || view.duration < floor) {
    view.duration = Math.min(l.defaultDurationMinutes, ceiling);
  } else if (view.duration > ceiling) {
    view.duration = ceiling;
  }
}

/** The three quantities the duration control is drawn against.
 *
 *  `span` is what the whole bar is worth. With stamina switched off there is no
 *  tank to show — the guild's ceiling is the only limit — so the bar becomes the
 *  claim's own range and nothing is spent, which degrades to an ordinary slider
 *  without needing a second control for the case.
 */
function tankState() {
  const l = limits();
  const budget = l && l.budgetMinutes ? l.budgetMinutes : 0;
  const remaining = budget ? Math.max(0, l.remainingMinutes || 0) : null;
  const ceiling = cap();
  return {
    span: budget || Math.max(SLOT, ceiling),
    spent: budget ? budget - remaining : 0,
    remaining,
    cap: ceiling
  };
}

/** Draw the tank at a given length.
 *
 *  Called on every render and directly on every frame of a drag — the second is
 *  why it takes the length as an argument rather than reading `view.duration`.
 *  Rebuilding the panel per frame of a drag fights the pointer, exactly as it
 *  does for the selection on the grid.
 */
function paintTank(root, minutes) {
  const t = tankState();
  const zones = root.querySelector('.tank-zones');
  root.querySelector('.tank-spent').style.width = (t.spent / t.span * 100) + '%';
  root.querySelector('.tank-hunt').style.width = (minutes / t.span * 100) + '%';

  // Measured rather than computed, because the markers are placed on the face
  // and the zones sit inset within it.
  const box = zones.getBoundingClientRect(), face = root.getBoundingClientRect();
  const left = box.left - face.left, w = box.width;
  const at = left + ((t.spent + minutes) / t.span) * w;

  const edge = root.querySelector('.tank-edge');
  edge.style.left = (at - edge.offsetWidth / 2) + 'px';

  const ceiling = root.querySelector('.tank-cap');
  const bound = t.remaining !== null && t.cap < t.remaining;
  ceiling.hidden = !bound;
  if (bound) ceiling.style.left = (left + ((t.spent + t.cap) / t.span) * w) + 'px';

  // Both figures are anchored to an end rather than floating beside the boundary:
  // the length to the head of the blue, what is left to the tail of the bar.
  // Neither moves while you drag — only the boundary and the fill do — and
  // neither can be pushed out of the bar, which is what the caption-line
  // fallback used to be for.
  const head = left + (t.spent / t.span) * w;
  const inLabel = root.querySelector('.tank-in'), outLabel = root.querySelector('.tank-out');
  // A tank with nothing in it has no length to state — "0m" beside "no stamina"
  // is the same news twice, and the second telling is the one that reads like a
  // choice somebody made.
  inLabel.textContent = minutes ? fmtDur(minutes) : '';
  // A short hunt is narrower than the word for it, so its figure steps just past
  // the boundary into the empty and takes the page's text colour to stay
  // readable. Still inside the bar.
  const fits = (minutes / t.span) * w > inLabel.offsetWidth + 12;
  inLabel.classList.toggle('outside', !fits);
  inLabel.style.left = (fits ? head + 7 : at + 7) + 'px';

  // What the tank would have left afterwards — of the tank, not of this
  // control's own range. A guild whose per-claim ceiling bites before stamina
  // does would otherwise report a full tank as empty.
  const rest = t.remaining === null ? null : Math.max(0, t.remaining - minutes);
  const text = rest === null ? '' : rest ? `${fmtDur(rest)} left` : 'no stamina';
  outLabel.textContent = text;
  // It stays put and lets the blue arrive underneath it, going dark when it
  // does. Moving it would mean shoving it off the end on a full tank, which is
  // the one moment "no stamina" is the thing you want to read.
  const outLeft = left + w - outLabel.offsetWidth - 7;
  outLabel.style.left = outLeft + 'px';
  outLabel.classList.toggle('on-hunt', at > outLeft - 2);
  // The single case where something has to give: a hunt too short to hold its
  // own figure puts it where this one is. The length wins.
  outLabel.style.visibility =
    text && !(!fits && at + 7 + inLabel.offsetWidth > outLeft - 6) ? 'visible' : 'hidden';

  root.setAttribute('aria-valuemin', Math.min(SLOT, t.cap));
  root.setAttribute('aria-valuemax', t.cap);
  root.setAttribute('aria-valuenow', minutes);
  root.setAttribute('aria-valuetext', fmtDur(minutes) + (text ? `, ${text}` : ''));
}

/** Drag it, tap it, or arrow it. There are no buttons on either end, so the face
 *  has to take every gesture there is. */
function wireTank(root) {
  const t = tankState();
  if (t.cap < MIN_CLAIM) { root.setAttribute('aria-disabled', 'true'); return; }

  // A position on the bar is a point in the day, and the hunt is what is left of
  // it once the spent part is taken off — which is why dragging into the grey
  // pins at the floor rather than going negative.
  const at = clientX => {
    const r = root.getBoundingClientRect();
    return snapDuration(((clientX - r.left) / r.width) * t.span - t.spent);
  };

  root.addEventListener('pointerdown', down => {
    if (down.button > 0) return;
    down.preventDefault();
    // Capture keeps the drag alive once the pointer leaves the bar, which is
    // most of a drag on a control this short. Not worth losing the drag over,
    // though, so a refusal is allowed rather than left to abort the handler.
    try { root.setPointerCapture(down.pointerId); } catch (e) { /* drag on regardless */ }
    let preview = at(down.clientX);
    paintTank(root, preview);

    const move = ev => {
      const next = at(ev.clientX);
      if (next === preview) return;
      preview = next;
      paintTank(root, next);
    };
    const up = () => {
      root.removeEventListener('pointermove', move);
      root.removeEventListener('pointerup', up);
      root.removeEventListener('pointercancel', up);
      // One render at the end, against the length actually settled on — it
      // redraws the selection on the grid and the verdict under it.
      if (preview !== view.duration) setDuration(preview);
    };
    root.addEventListener('pointermove', move);
    root.addEventListener('pointerup', up);
    root.addEventListener('pointercancel', up);
  });

  root.addEventListener('keydown', e => {
    const d = e.key === 'ArrowRight' || e.key === 'ArrowUp' ? 1
      : e.key === 'ArrowLeft' || e.key === 'ArrowDown' ? -1 : 0;
    if (d) { e.preventDefault(); setDuration(view.duration + d * step()); }
  });
}

/** Put the selection down without making another one.
 *
 *  The weekday mask is deliberately left standing. It survives changing week and
 *  folding the calendar away already, and it is as often something ticked on
 *  purpose as something inferred from the slot that was clicked — throwing away
 *  a chosen set of days because the start time was withdrawn would be taking
 *  back more than was asked for.
 */
function clearPick() {
  view.pick = null;
  view.stack = null;
  // The verdict on screen is about the slot being given up, as is any refusal
  // still sitting above it, so neither outlives it.
  view.answer = null;
  // Nor does a length borrowed off whatever was selected.
  ownDuration();
  renderWindow();
}

function renderWindow() {
  const spawn = openSpawn();
  // Through the same door as the ✕, so the history entry the card was opened
  // with is spent rather than left behind as a Back that does nothing.
  if (!spawn) { dismissWindow(); return; }
  fitDuration();
  // Both axes: on a phone the week is wider than the screen as well as taller,
  // and a render that put the hours back but not the days would jump the reader
  // to Monday every time the selection moved.
  const keepScroll = gridEl ? { top: gridEl.scrollTop, left: gridEl.scrollLeft } : null;

  const watermark = document.getElementById('watermark');
  const wanted = spawn.sprite || PLACEHOLDER;
  if (watermark.getAttribute('src') !== wanted) {
    watermark.src = wanted;
    watermark.className = 'watermark' + (spawn.sprite ? '' : ' placeholder');
    // Cleared as the source changes, not when the new one arrives: the shift
    // belongs to the creature being replaced, and leaving it on would move the
    // next one by the last one's number for as long as the load takes.
    watermark.style.transform = '';
    watermark.dataset.nudgeX = spawn.nudgeX || '';
    watermark.dataset.nudgeY = spawn.nudgeY || '';
    watermark.onload = () => nudgeArt(watermark);
    watermark.onerror = () => { watermark.src = PLACEHOLDER; watermark.className = 'watermark placeholder'; };
  }

  const chip = document.getElementById('win-code');
  chip.textContent = spawn.code;
  chip.className = 'code-chip' + (spawn.state === 'claimed' ? ' live' : '');
  document.getElementById('win-title').textContent = spawn.name;
  document.getElementById('win-region').textContent = spawn.region || '';

  // The calendar stays where it is and everything above it is replaced around
  // it — see calendarSection. Clearing the body instead took the grid out of the
  // page and put it back on every poll, which costs a layout of every column in
  // it whether or not a single one had changed.
  const body = document.getElementById('win-body');
  const section = calendarSection();
  while (body.firstChild && body.firstChild !== section) body.removeChild(body.firstChild);
  if (section.parentNode !== body) body.appendChild(section);
  body.insertBefore(nowStrip(spawn), section);
  const upNext = upNextSection(spawn);
  if (upNext) body.insertBefore(upNext, section);

  // The foot of the panel: whatever it has to say, then how long and the button
  // that acts on it. Outside the part that scrolls, so all of it sits in the same
  // corner however tall the body above happens to be and whether or not the week
  // is open.
  //
  // The message goes above the action row, not below it. Below, every reply the
  // bot gave changed the height of the thing under the button and shifted the
  // button itself; above, it grows upward into the panel and the button keeps the
  // corner it had.
  const foot = document.getElementById('win-foot');
  foot.innerHTML = '';
  const message = footMessage();
  if (message) foot.appendChild(message);
  // Between the two: a moderator repairing an evening is answering the message
  // above it, and the action row below stays where it always is.
  const tools = moderatorTools(openSpawn());
  if (tools) foot.appendChild(tools);
  const action = readout();
  if (action) foot.appendChild(action);
  foot.hidden = !foot.firstChild;

  wireWindow();
  if (gridEl && homingUntil > Date.now()) {
    // Somebody pressed Now and we are between here and there. Where the scroll
    // happens to be is not where they asked to be.
    scrollToNow(true);
  } else if (keepScroll !== null && gridEl) {
    gridEl.style.scrollBehavior = 'auto';
    gridEl.scrollTop = keepScroll.top;
    gridEl.scrollLeft = keepScroll.left;
  } else if (!scrolledOnce && gridEl) { scrolledOnce = true; scrollToNow(false); }
  // Now that the grid is in the page and can be measured. Both of these are
  // questions about how wide a column actually turned out to be, which nothing
  // knows while the panel is still being built — what the week button says, and
  // how much a block can afford to say. See rangeLabel and fitBlocks.
  if (gridEl) { gridScrolled(); fitBlocks(); }
}

/** Already holding it, or already standing in its queue, means there is nothing
 *  to ask for — the service would refuse either way, and offering the button
 *  anyway just invites a pointless round trip. */
function canClaimNow(spawn) {
  const l = limits();
  // Per spawn, not board-wide: a tight ceiling on one spawn must not grey out
  // the Claim button on every other, and a generous one must not be ignored.
  return !spawn.mine && !spawn.queued && !!l && claimableOn(spawn) >= MIN_CLAIM;
}

/** The Discord emoji the Claim button wears there, worn here too. */
function claimEmojiImg() {
  if (!CLAIM_EMOJI) return null;
  const img = document.createElement('img');
  img.className = 'btn-emoji';
  img.src = CLAIM_EMOJI;
  img.alt = '';
  // A CDN that will not answer should cost the label nothing — better a button
  // that reads "Claim" than one with a broken image nailed to the front of it.
  img.addEventListener('error', () => img.remove());
  return img;
}

/** Giving a spawn back, or standing out of its queue.
 *
 *  "Leave" either way, and the same word the Discord post's own button uses —
 *  giving a spawn back and standing out of its queue are the same act to
 *  somebody doing it, and only one of the two is ever on offer at a time.
 */
function leaveButton(spawn) {
  const holding = spawn.mine;
  return button(holding ? 'Leave' : 'Leave queue', 'btn danger',
    () => post(`/dashboard/g/${GUILD_ID}/release`, { code: spawn.code }, s => {
      if (holding) {
        s.mine = false;
        // Free unless somebody is waiting, in which case it passes to them. Who
        // that is, is not ours to guess — naming the wrong person for a second
        // is worse than saying "someone" until the poll says.
        s.state = (s.queueLength || 0) > 0 ? 'claimed' : 'free';
        delete s.holder;
        delete s.startsAt;
        delete s.endsAt;
      } else {
        s.queued = false;
        s.queueLength = Math.max(0, (s.queueLength || 1) - 1);
      }
    }), 'ti-logout');
}

/** The one thing this panel is most likely to be asked to do, whatever that
 *  currently is.
 *
 *  Every way of taking this spawn on or letting it go is the same decision at a
 *  different moment, so they are one button in one corner rather than several
 *  competing ones scattered around the panel. In order of precedence:
 *
 *    - a time picked on the grid means booking it, even for a spawn already
 *      held — booking a later evening and hunting one now are different acts,
 *      and the pick is the reader saying which they meant;
 *    - holding it offers giving it back, and standing in its queue offers
 *      leaving that queue;
 *    - otherwise it offers taking the spawn now.
 *
 *  Nothing at all when none of those apply — no stamina left, say — which the
 *  strip above explains rather than leaving a dead button to be pressed.
 */
function primaryAction(spawn) {
  // Clicking your own hunt on the grid is not picking a time to book. The block
  // starts in the past, so nothing could ever be booked from it — which left a
  // Book button that was permanently dead. What somebody wants from their own
  // running hunt is the thing they always want from it, so the pick is ignored
  // and the ordinary Leave falls through.
  const own = view.pick && runningAt(view.pick);
  if (own && own.mine && own.state === 'claimed') return leaveButton(spawn);

  if (view.pick) {
    const verdict = judge(view.pick);
    const book = button(view.busy ? 'Working…' : verdict.type === 'ask' ? 'Book & ask' : 'Book',
      'btn', doBook, 'ti-calendar-plus');
    book.disabled = !canBook();
    return book;
  }

  // Giving it up outranks taking it on, and the two can never both apply:
  // holding a spawn or queueing for it is exactly what stops you claiming it.
  if (spawn.mine || spawn.queued) return leaveButton(spawn);

  if (!canClaimNow(spawn)) return null;

  // Wording follows what will actually happen, so nobody presses "Claim" and is
  // surprised to find themselves in a queue. Only a *live hunt* produces a
  // queue: booked and confirmed both mean nobody is on it right now, so claiming
  // succeeds — cut short by the booking, which the answer explains.
  const joining = spawn.state === 'claimed';
  const claim = button(joining ? 'Join queue' : 'Claim', joining ? 'btn' : 'btn claim',
    () => post(`/dashboard/g/${GUILD_ID}/claim`, { code: spawn.code, minutes: view.duration }, s => {
      if (joining) {
        // Behind whoever is on it. The position is theirs to know, so the count
        // moves and nothing claims to know where in the line they are.
        s.queued = true;
        s.queueLength = (s.queueLength || 0) + 1;
      } else {
        // Theirs from now until the duration runs out — subject to a booking or
        // a tank the server knows more about, which the answer corrects.
        s.state = 'claimed';
        s.mine = true;
        // Not a name: the reader's own is not on this page to write, and the
        // card says "you" of a claim it knows is theirs — see holderText.
        delete s.holder;
        s.startsAt = new Date().toISOString();
        s.endsAt = new Date(Date.now() + view.duration * 60000).toISOString();
        s.lastActivity = s.startsAt;
      }
    }));
  // Joining a queue is not the claim action and does not borrow its face.
  if (!joining) {
    const face = claimEmojiImg();
    if (face) claim.insertBefore(face, claim.firstChild);
  }
  return claim;
}

/** What is happening on this spawn right now, and what can be done about it
 *  this minute — as against the calendar below, which is about later. */
function nowStrip(spawn) {
  const l = limits();
  const strip = el('div', 'strip now-strip');
  const tick = spawn.state === 'confirmed' ? '<i class="ti ti-check tick" aria-hidden="true"></i>' : '';
  // No "+2 queued" here. On a card, before the panel is open, a count is the
  // whole story; once it is open the question has moved on to who and when, and
  // the section below answers that with the rows themselves.
  strip.innerHTML = `<span class="dot ${spawn.state}"></span>${tick}
    <span class="who ${spawn.state === 'free' ? 'free' : ''}">${stateHtml(spawn)}</span>`;

  if (spawn.state === 'claimed' && spawn.startsAt && spawn.endsAt) {
    const start = new Date(spawn.startsAt).getTime(), end = new Date(spawn.endsAt).getTime();
    const done = Math.min(1, Math.max(0, (Date.now() - start) / Math.max(1, end - start)));
    strip.appendChild(el('span', 'live-bar', `<span style="width:${(done * 100).toFixed(1)}%"></span>`));
  }

  // Nothing about the ceiling here either. "up to 5h · stamina" was a third
  // telling of a thing the tank says by being the tank — the bar ends where the
  // ceiling is, and you can watch yourself arrive at it.
  if (!canClaimNow(spawn) && l && claimableOn(spawn) < MIN_CLAIM && !spawn.mine) {
    strip.appendChild(el('span', 'dur-cap', 'No stamina left today to start a hunt.'));
  }

  // No buttons here at all. Claim, Book, Release and Leave queue are all the
  // same decision about this spawn at different moments, so they are one button
  // in one corner of the panel — see primaryAction.
  //
  // Nor any stamina, which used to sit at the right of this row as a bar and a
  // figure. The duration control below is that same tank, drawn at a size you
  // can read and act on, so this said it a second time in a place where nothing
  // could be done about it.
  return strip;
}

/** What is actually coming to this spawn: the queue, then the bookings.
 *
 *  Shut by default. It is reference rather than the thing anybody opened the
 *  panel to do, and ten rows is more height than a phone can spare beside the
 *  grid — so the header carries the one row worth having without opening
 *  anything, and the rest is a press away.
 *
 *  The queue comes first because it happens soonest and because its times are
 *  derived from the hunt running now. Those times are projections: the server
 *  works them out from the current hunt's end plus everyone ahead
 *  (`RespawnBoardEntry.projectedQueueStarts`), and a hunt released early brings
 *  every one of them forward. They are marked `≈` and their countdown is left
 *  muted, where a booking's is definite and coloured.
 */
function upNextRows(spawn) {
  const waiting = (spawn.waiting || []).map(w => ({
    at: w.startsAt, minutes: w.minutes, who: w.mine ? 'You' : called(w.name),
    kind: 'queued', tag: 'queue', projected: true
  }));
  const booked = (spawn.booked || []).map(b => ({
    at: b.startsAt, minutes: b.minutes, who: b.mine ? 'You' : called(b.name),
    kind: b.asked ? 'asked' : b.mine ? 'mine' : 'booked',
    tag: b.asked ? 'asked' : b.mine ? 'you' : ''
  }));
  // Everything there was before any cap, so one note covers the lot — the
  // server has already trimmed each list to ten, and `bookedTotal` is what it
  // trimmed from.
  const total = waiting.length + (spawn.bookedTotal || booked.length);
  return { rows: waiting.concat(booked), total };
}

function upNextSection(spawn) {
  const { rows, total } = upNextRows(spawn);
  if (!rows.length) return null;

  const wrap = document.createDocumentFragment();
  const soonest = rows[0];
  const head = el('div', 'up-head' + (view.upNextOpen ? ' open' : ''), `
    <i class="ti ti-clock-hour-4" aria-hidden="true"></i>
    <span class="fold-title">Up next</span>
    <span class="up-peek">next in <b>${esc(relTime(soonest.at))}</b> — <b class="at-name">${esc(soonest.who)}</b></span>
    <span class="up-count">${total}</span>
    <i class="ti ti-chevron-down fold-chevron" aria-hidden="true"></i>`);
  head.setAttribute('role', 'button');
  head.setAttribute('aria-expanded', String(!!view.upNextOpen));
  head.addEventListener('click', () => { view.upNextOpen = !view.upNextOpen; renderWindow(); });
  wrap.appendChild(head);

  if (view.upNextOpen) {
    const shown = rows.slice(0, UP_NEXT_ROWS);
    const hidden = total - shown.length;
    const list = el('div', 'up-list', shown.map(r => `
      <div class="up-row up-${r.kind}">
        <span class="up-when">${r.projected ? '≈' : ''}${fmtClock12(new Date(r.at))}<small>${esc(dayLabel(r.at))}</small></span>
        <span class="up-rail"><span class="up-pip"></span></span>
        <span class="up-body">
          <span class="up-who at-name">${esc(r.who)}</span>
          <span class="up-sub">in <span class="up-rel">${esc(relTime(r.at))}</span> · ${fmtDur(r.minutes)}</span>
        </span>
        ${r.tag ? `<span class="up-tag ${r.tag}">${r.tag}</span>` : '<span></span>'}
      </div>`).join('')
      + (hidden > 0 ? `<div class="up-more">…and ${hidden} more</div>` : ''));
    wrap.appendChild(list);
  }
  return wrap;
}

/** The week, and a heading saying what is in it.
 *
 *  This was a fold once, shut by default, on the reasoning that most visits to a
 *  spawn are about right now — take it, or see who has it — and that a week of
 *  grid would make that ordinary case read as the complicated one. It opened by
 *  default long before this, which was the first half of admitting the reasoning
 *  was wrong: booking is most of what the window is for, and the one press
 *  bought nothing but a chance to be looking at the wrong thing. The control has
 *  now gone after the default. What is left is a heading, which is all the row
 *  was ever really doing — naming the section and saying what the week holds.
 */
/** The calendar half of the panel, kept between renders.
 *
 *  Held rather than rebuilt because the grid inside it is: taking the section
 *  out of the panel and putting it back would make the browser lay seven
 *  hundred cells out again on every poll, which is most of what building them
 *  again used to cost and none of what it bought. The parts that do change —
 *  the heading's count, the booking controls — are small, and are written over
 *  in place.
 */
let heldSection = null;

function calendarSection() {
  // What is still to come, rather than what the strip happens to hold: it opens
  // on yesterday, and counting a hunt that finished last night as something
  // booked would make the heading disagree with the grid under it.
  const booked = slots.filter(b => b.state !== 'claimed' && b.end.getTime() > Date.now()).length;
  // Days we have not read yet, or could not, say so. "Nothing booked" is a
  // claim about the calendar, and it is not one to make on no information.
  const summary = weekError ? 'could not read all of that'
    : weekPending ? 'reading the calendar…'
    : booked === 0 ? 'nothing booked ahead'
    : `${booked} booked ahead`;

  if (!heldSection) {
    const section = el('div', 'cal-section');
    const head = el('div', 'strip cal-head');
    const cal = el('div', 'cal');
    const controls = el('div', 'strip cal-controls');
    cal.appendChild(controls);
    // Fixed text on a fixed row: written once, where the rest of this is
    // written on every render.
    cal.appendChild(el('div', 'cal-legend', `
      <span><i class="swatch sw-claimed"></i>Being hunted</span>
      <span><i class="swatch sw-booked"></i>Booked</span>
      <span><i class="swatch sw-confirmed"></i>Booked &amp; confirmed</span>
      <span><i class="swatch sw-asked"></i>Asked</span>
      <span><i class="swatch sw-pick"></i>Your selection</span>
      <span style="margin-left:auto"><i class="swatch" style="border:none;border-left:2px solid var(--bad);border-radius:0;width:2px"></i>Now</span>
      <span><i class="swatch" style="border:none;border-left:2px dashed var(--warn);border-radius:0;width:2px"></i>Server save</span>`));
    section.appendChild(head);
    // The standing instructions used to sit under this heading. They have moved
    // into the message row at the foot — see footMessage — because they and the
    // verdict on a selection are the same row's job at different moments, and
    // giving them a row of their own meant the panel carried two strips of text
    // where one would do.
    section.appendChild(cal);
    heldSection = { section, head, cal, controls, frame: null };
  }

  heldSection.head.innerHTML = `
    <i class="ti ti-calendar-month" aria-hidden="true"></i>
    <span class="fold-title">Book a time</span>
    <span class="muted">${summary}</span>`;
  calendar(heldSection);
  return heldSection.section;
}

/** Blocks that share a column, gathered into runs that overlap on screen.
 *
 *  Drawn geometry, not booked times: a block is clipped to the column it is in,
 *  so what decides whether two of them collide is the part actually on this
 *  day. A hunt crossing midnight collides with the evening it shares, not with
 *  the morning it does not reach.
 *
 *  Runs, in the interval sense — A overlapping B and B overlapping C puts all
 *  three together even where A and C never touch. That is the right answer for
 *  what this is for: they are one pile on the grid, and the reader wants the
 *  pile rather than a partition of it.
 */
function stackRuns(here, colStart, colEnd) {
  const clipped = here.map(b => ({
    b,
    from: Math.max(b.start.getTime(), colStart),
    to: Math.min(shownEnd(b).getTime(), colEnd)
  })).sort((x, y) => x.from - y.from || y.to - x.to);
  const runs = [];
  let cur = null, reach = 0;
  clipped.forEach(c => {
    if (cur && c.from < reach) { cur.push(c.b); reach = Math.max(reach, c.to); return; }
    cur = [c.b];
    reach = c.to;
    runs.push(cur);
  });
  return runs;
}

/** Which of a run is the one drawn, and so the one the count sits on.
 *
 *  Whatever the reader last chose out of this pile, if it is still in it — the
 *  choice has to survive the redraw that follows making it, or picking the
 *  second hunt would show the first again a moment later.
 *
 *  Failing that: something still live over something finished, since a hunt
 *  happening now is what a column is read for, and then the latest to start. A
 *  slot claimed, given up and claimed again opens on the attempt that stuck
 *  rather than on the one that was abandoned.
 */
function stackLead(run) {
  const held = run.find(b => slotKey(b) === view.stack);
  if (held) return held;
  return run.slice().sort((a, b) =>
    (a.past === b.past ? 0 : a.past ? 1 : -1)
    || b.start.getTime() - a.start.getTime()
    || shownEnd(b).getTime() - shownEnd(a).getTime())[0];
}

/** The count on a stacked block, and the only way to reach what is under it. */
function moreChip(run) {
  const chip = el('button', 'wk-more');
  chip.type = 'button';
  chip.textContent = '+' + (run.length - 1);
  const label = run.length + ' hunts on this slot';
  chip.title = label + ' — open to choose one';
  chip.setAttribute('aria-label', label);
  chip.setAttribute('aria-haspopup', 'true');
  // The block underneath has a click of its own, and it is not the one being
  // asked for here.
  chip.addEventListener('click', e => { e.stopPropagation(); openStack(run, chip); });
  return chip;
}

// At most one open, and it belongs to the chip that opened it rather than to
// the page — a redraw throws that chip away, so the panel goes with it.
let stackPop = null;

function closeStack() {
  if (!stackPop) return;
  stackPop.remove();
  stackPop = null;
  document.removeEventListener('pointerdown', stackAway, true);
  document.removeEventListener('keydown', stackKey, true);
  window.removeEventListener('resize', closeStack);
}
function stackAway(e) { if (stackPop && !stackPop.contains(e.target)) closeStack(); }
function stackKey(e) { if (e.key === 'Escape') { e.stopPropagation(); closeStack(); } }

/** The picker: one row per hunt on the slot, the smallest thing that can answer
 *  "which of these did you mean".
 *
 *  Deliberately not another .window. This is a choice between things already on
 *  screen, and a second modal over the first would be a heavier gesture than the
 *  question deserves — as well as burying the calendar the answer is about.
 */
function openStack(run, anchorEl) {
  closeStack();
  const pop = el('div', 'stack-pop');
  pop.setAttribute('role', 'dialog');
  pop.setAttribute('aria-label', 'Hunts on this slot');
  pop.appendChild(el('h4', '', run.length + ' on this slot'));
  const list = el('div', 'sp-list');
  const lead = stackLead(run);
  // Newest first, which is the order the log and the card are read in, and the
  // order somebody opening a history expects to find.
  run.slice().sort((a, b) => b.start.getTime() - a.start.getTime()).forEach(b => {
    const ends = shownEnd(b);
    const sw = b.past ? 'sw-past' + (b.hunted ? '' : ' sw-unhunted') : 'sw-' + b.state;
    // The fate where there is one, otherwise what the block is: no row is left
    // as a bare name and time while the rows beside it say more.
    const under = b.past
      ? (b.note || (b.hunted ? 'hunted' : 'never hunted'))
      : (b.state === 'claimed' ? 'being hunted now' : b.state);
    const row = el('button', 'sp-row' + (b === lead ? ' on' : ''),
      `<i class="swatch sp-sw ${sw}"></i>`
      + `<span class="sp-txt">`
      + `<span class="sp-who">${b.mine ? 'You' : esc(b.owner)}</span>`
      + `<span class="sp-tm">${fmtLocal(b.start)}–${fmtLocal(ends)}</span>`
      + `<span class="sp-note">${esc(under)}</span>`
      + `</span>`);
    row.type = 'button';
    row.addEventListener('click', () => {
      // Shut before the redraw, not after: renderWindow throws away the chip
      // this is anchored to, and a panel left pointing at nothing then follows
      // the scroll around the screen.
      closeStack();
      view.stack = slotKey(b);
      view.pick = b.start;
      view.answer = null;
      if (b.past) { renderWindow(); return; }
      borrowDuration(slotMinutes(b));
    });
    list.appendChild(row);
  });
  pop.appendChild(list);

  // Measured where it will stand, then moved to fit. Fixed to the viewport
  // because the grid clips its own overflow, and an absolutely placed panel
  // would be cut off at the column edge on exactly the crowded days this is for.
  pop.style.visibility = 'hidden';
  document.body.appendChild(pop);
  const r = anchorEl.getBoundingClientRect(), box = pop.getBoundingClientRect();
  const left = Math.min(Math.max(8, r.right - box.width), window.innerWidth - box.width - 8);
  const below = r.bottom + 6;
  pop.style.left = Math.max(8, left) + 'px';
  pop.style.top = (below + box.height > window.innerHeight - 8
    ? Math.max(8, r.top - box.height - 6) : below) + 'px';
  pop.style.visibility = '';
  stackPop = pop;
  // Capture, so a press anywhere — including on the grid, which stops plenty of
  // its own events — still shuts it.
  document.addEventListener('pointerdown', stackAway, true);
  document.addEventListener('keydown', stackKey, true);
  window.addEventListener('resize', closeStack);
  const first = pop.querySelector('.sp-row.on') || pop.querySelector('.sp-row');
  if (first) first.focus();
}

function calendar(held) {
  const now = new Date();
  const start = gridStart();
  const days = gridDays();

  // --- booking controls
  // One group per decision — how often, which days, which week. How *long* is not
  // among them any more: it sits in the foot beside the button it feeds, which is
  // where the decision it belongs to actually gets made. See .cal-controls for
  // why these are groups rather than a flat run of spans.
  held.controls.innerHTML = `
    <span class="cc-row cc-repeat">
      <span class="field-label">Book</span>
      <span class="seg" data-seg="repeat">
        <button data-v="once" class="${view.repeat === 'once' ? 'on' : ''}">Once</button>
        <button data-v="week" class="${view.repeat === 'week' ? 'on' : ''}">Weekly</button>
      </span>
    </span>
    ${view.repeat === 'week'
      ? `<span class="cc-row cc-days"><span class="seg" data-seg="days">${DAY_NAMES.map((d, i) =>
          `<button data-v="${i}" class="${view.days.has(i) ? 'on' : ''}" title="${d} (server time)">${d[0]}</button>`).join('')}</span></span>`
      : ''}
    <span class="cc-row cc-week">
      <span class="seg" data-seg="week">
        <button data-v="-1" aria-label="Back a week">&lsaquo;</button>
        <button data-v="0" id="wk-label" title="Back to today">${rangeLabel()}</button>
        <button data-v="1" aria-label="Forward a week">&rsaquo;</button>
      </span>
      <button class="btn ghost small" id="jump"><i class="ti ti-crosshair" aria-hidden="true"></i> <span>Now</span></button>
    </span>`;

  // --- grid
  //
  // The strip's skeleton — its columns, their cells, the hour gutter, the day
  // headings, where server save falls — is a function of the date and nothing
  // else. So it is built once and kept, and a render only redraws what is drawn
  // *on* it. Rebuilding the whole thing instead meant seven hundred cells torn
  // down and made again on every ten-second poll, for a panel nobody had
  // touched and a grid that had not changed.
  const frame = gridFrame(start, days, now);
  paintGrid(frame, start, days, now);
  // Only when the frame is a new one — a strip that has grown, or an hour that
  // has turned over. Re-appending an element that is already where it belongs
  // still detaches and reattaches it, and reattaching seven hundred cells is the
  // cost this whole arrangement exists to avoid. The one it replaces has to go
  // with it, or the panel ends up with two strips in it.
  if (held.frame !== frame) {
    if (held.frame) held.frame.body.remove();
    held.cal.appendChild(frame.body);
    held.frame = frame;
  }
  gridEl = frame.body;
  // The verdict and the button that acts on it live in the panel's footer, not
  // here — see readout. They were part of the week once, which is what made them
  // move when it was folded away.
}

/** The strip as last built, and the days it was built for.
 *
 *  Kept across renders, and across the panel being shut: opening another spawn
 *  on the same day reuses it whole, which is most of what opening one used to
 *  cost. */
let heldFrame = null;

/** The part of the strip that only the date decides.
 *
 *  The signature carries the hour as well as the days, because a cell that is
 *  already in the past is drawn differently and that answer changes on the hour.
 *  Rebuilding once an hour is cheaper than asking seven hundred cells whether
 *  they have aged, every ten seconds.
 */
function gridFrame(start, days, now) {
  const sig = `${start.getTime()}|${days}|${Math.floor(now.getTime() / 3600000)}`;
  if (heldFrame && heldFrame.sig === sig) return heldFrame;

  const body = el('div', 'wk-body');
  const grid = el('div', 'wk-grid');

  // --- day headings, inside the scroller so they slide with their own columns
  const heads = [];
  for (let i = 0; i < days; i++) {
    const d = dayStart(start, i);
    const today = d.toDateString() === now.toDateString();
    // The first of a month says which month, so a strip scrolled a long way
    // forward is never a run of bare numbers.
    const first = d.getDate() === 1;
    // Off the date, not off `i` — the first column is yesterday, not Monday.
    heads.push(`<div class="wk-head ${today ? 'today' : ''}">${DAY_NAMES[(d.getDay() + 6) % 7]}` +
      `<span class="dnum">${d.getDate()}` +
      `${first ? ' ' + d.toLocaleDateString(undefined, { month: 'short' }) : ''}</span></div>`);
  }
  grid.appendChild(el('div', 'wk-headrow', '<div class="wk-corner"></div>' + heads.join('')));

  const rows = el('div', 'wk-rows');

  // Built as one string and written once. Appending to innerHTML in the loop
  // made the browser reserialise and reparse the whole gutter twenty-four times
  // over, for a run of markup that is the same shape every hour of every week.
  //
  // The same local hour said twice, twelve-hour over twenty-four. This used to
  // carry the server's hour underneath instead; the axis is the reader's own
  // clock either way, and which of the two ways of writing it they think in is
  // the thing that actually varies between people. Server time has not gone
  // from the page — the readout gives it for whatever is selected, and server
  // save is still drawn where it falls.
  const hourRows = [];
  for (let h = 0; h < 24; h++) {
    hourRows.push(`<div class="wk-hour">${twelveHour(h)}<span class="srv">${pad(h)}:00</span></div>`);
  }
  const hours = el('div', 'wk-hours', hourRows.join(''));
  rows.appendChild(hours);

  const columns = [];
  for (let day = 0; day < days; day++) {
    const col = el('div', 'wk-col');
    const colStart = dayStart(start, day).getTime(), colEnd = colStart + DAY_MS;
    columns.push(col);

    // The hours are drawn but not wired one by one. The strip is weeks long, and
    // a listener on every hour of every day of it is thousands to attach and
    // throw away on each render — which happens on every poll. One listener on
    // the grid reads the column and the hour back off the cell instead; see
    // wireGrid and pickFromCell.
    col.dataset.start = colStart;
    for (let h = 0; h < 24; h++) {
      const cell = el('div', 'wk-cell');
      cell.dataset.h = h;
      if (colStart + (h + 1) * 3600000 <= Date.now()) cell.classList.add('past');
      col.appendChild(cell);
    }

    // Server save, drawn where the server's 10:00 actually falls on this local day.
    const anchor = dayStart(start, day);
    const ss = serverToInstant(anchor.getFullYear(), anchor.getMonth(), anchor.getDate(), SS_SERVER_HOUR, 0);
    if (ss.getTime() >= colStart && ss.getTime() < colEnd) {
      const at = (ss.getTime() - colStart) / 3600000;
      const line = el('div', 'ss-line'); line.style.setProperty('--at', at); col.appendChild(line);
      const lbl = el('div', 'ss-label', `SS ${fmtLocal(ss)}`); lbl.style.setProperty('--at', at); col.appendChild(lbl);
    }
    rows.appendChild(col);
  }

  grid.appendChild(rows);
  body.appendChild(grid);
  heldFrame = { sig, body, grid, rows, hours, columns, painted: [] };
  // Once per frame rather than once per render. The listeners belong to this
  // element, and the element now outlives the render that made it.
  wireGrid(body);
  return heldFrame;
}

/** Everything on the strip that the bookings decide, drawn onto a frame that
 *  already exists. Whatever the last render put there comes off first; the cells
 *  and the gutter underneath are left where they are. */
function paintGrid(frame, start, days, now) {
  const { body, grid, rows, hours, columns } = frame;
  body.className = 'wk-body' + (weekPending ? ' pending' : '');
  // How many columns both grids are made of. In a variable rather than in the
  // stylesheet because the strip's length is a thing that changes while the
  // panel is open — see stretchRange. Re-applied on every paint, so a pinch
  // moves the columns without the strip being rebuilt around them.
  grid.style.setProperty('--days', days);
  grid.style.setProperty('--zoom', view.zoom);
  grid.style.setProperty('--vzoom', view.vzoom);

  frame.painted.forEach(node => node.remove());
  frame.painted = [];
  const drawn = frame.painted;

  // Worked out once for the week rather than once per column: the answer does
  // not depend on which column is being drawn, and each entry may well belong
  // in two of them.
  const selection = view.duration ? previews(start, days) : [];

  for (let day = 0; day < days; day++) {
    const col = columns[day];
    const colStart = dayStart(start, day).getTime(), colEnd = colStart + DAY_MS;

    // Blocks, clipped to this local day. A window crossing local midnight is
    // drawn as two clipped pieces rather than dropped or overflowing.
    // `ends` rather than `b.end` throughout, so a block being re-timed is drawn
    // — and clipped, and titled — at the length under the pointer rather than at
    // the one still in the database.
    // One block per pile, not one per booking. Two hunts over the same hours
    // used to be drawn one exactly on top of the other, which left the lower of
    // them unreadable, unclickable, and unannounced — see stackRuns.
    const here = slots.filter(b => b.start.getTime() < colEnd && colStart < shownEnd(b).getTime());
    stackRuns(here, colStart, colEnd).forEach(run => {
      const b = stackLead(run);
      const ends = shownEnd(b);
      const from = Math.max(b.start.getTime(), colStart), to = Math.min(ends.getTime(), colEnd);
      const block = el('div', `wk-block b-${b.state}${b.mine ? ' b-mine' : ''}${b.predicted ? ' b-predicted' : ''}`
        + (run.length > 1 ? ' has-more' : '')
        // Only shows on a hunt that is over, which is the case with no preview
        // of its own to be highlighted by — see previews and .b-chosen.
        + (slotKey(b) === view.stack ? ' b-chosen' : '')
        + (b.past ? ' b-past' + (b.hunted ? '' : ' b-unhunted') : '')
        + (resizing(b) ? ' b-editing' : '')
        + (b.start.getTime() < colStart ? ' clip-top' : '')
        + (ends.getTime() > colEnd ? ' clip-bottom' : ''));
      // The third line only goes on a block with room for a whole one. A block is
      // as tall as its hunt is long, and half a line of clipped text under the
      // time would read as a rendering fault rather than as information.
      const height = Math.max(MIN_BLOCK_H, ((to - from) / 3600000) * ROW_H - 2);
      const account = accountLine(b);
      block.style.setProperty('--at', (from - colStart) / 3600000);
      block.style.setProperty('--len', (to - from) / 3600000);
      block.innerHTML = `<span class="who">${b.mine ? 'You' : esc(b.owner)}</span>
        <span class="tm">${fmtLocal(b.start)}–${fmtLocal(ends)}</span>`
        // On a block that is over, what became of it earns the third line ahead
        // of the account: the account answers "who do I ask", which is a
        // question about an evening somebody can still do something with.
        + (b.past && b.note && height >= ACCT_MIN_H ? `<span class="fate">${esc(b.note)}</span>`
          : account && height >= ACCT_MIN_H ? `<span class="acct">${esc(account)}</span>` : '');
      // The tooltip carries it whatever the block's height, so a half-hour
      // booking is not the one block you cannot find out who owns.
      block.title = `${b.owner}${account ? ` · ${account}` : ''} · ${fmtLocal(b.start)}–${fmtLocal(ends)} your time`
        + (b.repeats ? ' · repeats' : '') + (b.predicted ? ' · not booked yet' : '')
        + (b.past ? ` · ${b.hunted ? 'hunted' : 'never hunted'}${b.note ? ` · ${b.note}` : ''}` : '');
      block.addEventListener('click', e => {
        e.stopPropagation();
        view.pick = b.start;
        // Which block, not only which instant. Two hunts can share a start, and
        // the readout used to answer for whichever of them the array held first
        // however plainly the reader had clicked the other.
        view.stack = slotKey(b);
        view.answer = null;
        // Nothing to borrow from an evening that is over — see judge, which
        // answers a click on one by saying what became of it.
        if (b.past) { renderWindow(); return; }
        // Borrowed, not chosen: the selection takes the block's own window
        // while the block is what is selected, and hands it back on the next
        // empty slot.
        borrowDuration(slotMinutes(b));
      });
      // Only while Edit claim is armed, and only on the piece carrying the end:
      // the half above a midnight split is not where the window finishes.
      if (resizing(b) && ends.getTime() <= colEnd) block.appendChild(lengthHandle(block, b));
      // Last, so it sits over the block's own text rather than under it.
      if (run.length > 1) block.appendChild(moreChip(run));
      col.appendChild(block);
      drawn.push(block);
    });

    // The selection, drawn over everything so its extent is obvious — and, for a
    // weekly booking, every evening it will actually take, not only the one that
    // was clicked. A rule that quietly recurs on days the reader never saw is
    // how somebody ends up holding four evenings they meant to hold one of.
    //
    // Clipped to this column exactly as the bookings above are, so a hunt
    // running past local midnight is drawn as two pieces — the tail of one day
    // and the head of the next — rather than stopping at the bottom of the
    // column it started in.
    selection.forEach(p => {
      const pEnd = new Date(p.at.getTime() + view.duration * 60000);
      if (p.at.getTime() >= colEnd || colStart >= pEnd.getTime()) return;
      const from = Math.max(p.at.getTime(), colStart), to = Math.min(pEnd.getTime(), colEnd);
      const sel = el('div', 'wk-block b-pick' + (p.echo ? ' b-echo' : '')
        + (p.at.getTime() < colStart ? ' clip-top' : '')
        + (pEnd.getTime() > colEnd ? ' clip-bottom' : ''));
      sel.style.setProperty('--at', (from - colStart) / 3600000);
      sel.style.setProperty('--len', (to - from) / 3600000);
      sel.innerHTML = `<span class="who">${p.label}</span>
        <span class="tm">${fmtLocal(p.at)}–${fmtLocal(pEnd)}</span>`;
      // Taking a selection back. Every piece of it answers, echoes included:
      // the echoes are the same selection seen on another day, and having to
      // hunt for the original block to be rid of them would be a puzzle.
      // Before this there was no way to unpick at all short of shutting the
      // week — picking somewhere else was the only move.
      sel.title = p.echo
        ? 'Right-click to clear this selection'
        : 'Drag to move it · drag its foot to change how long · right-click to clear';
      sel.addEventListener('contextmenu', e => { e.preventDefault(); clearPick(); });
      // Only the real selection is draggable. An echo is a consequence of the
      // rule rather than a thing to take hold of, and moving one would have to
      // mean moving the anchor it is derived from — which is the block the
      // reader is not pointing at.
      if (!p.echo) { sel.classList.add('b-drag'); dragSelection(sel, p.at, start, day, days); }
      // The handle goes only on the piece carrying the hunt's end — the half
      // above a midnight split is not where it finishes.
      if (!p.echo && pEnd.getTime() <= colEnd) sel.appendChild(stretchHandle(sel));
      col.appendChild(sel);
      drawn.push(sel);
    });
  }

  // Now: the height across the grid, and the time on the hour axis — which is
  // what keeps it on screen when the days have been slid sideways.
  const nowDay = Math.round((new Date(now).setHours(0,0,0,0) - start.getTime()) / DAY_MS);
  if (nowDay >= 0 && nowDay < days) {
    const at = localMinutes(now) / 60;
    const line = el('div', 'now-line'); line.style.setProperty('--at', at);
    // The flag hangs off the hour gutter, which is not on the clock grid — it
    // is placed in pixels against the same axis.
    const flag = el('div', 'now-flag', fmtLocal(now)); flag.style.top = at * ROW_H + 'px';
    rows.appendChild(line); hours.appendChild(flag);
    drawn.push(line, flag);
  }
}

/** Every instant the selection occupies in the week starting `start`.
 *
 *  One entry for the slot that was actually picked, and — when the booking
 *  repeats — an echo on every other day the mask names, at the same local time
 *  of day. The echoes are a preview of the rule, not slots that exist: the bot
 *  produces them from the anchor plus whole days, so a local daylight saving
 *  change between here and there would move one by an hour.
 *
 *  The whole week at once, rather than one column's worth. Each entry is a start
 *  and the caller clips it to whichever columns it runs through, so a hunt begun
 *  before local midnight is drawn in both the day it starts and the day it ends.
 *  Asking per column could only ever produce the piece that began there, which
 *  is why the far side of midnight went missing.
 */
function previews(start, days) {
  if (!view.pick) return [];
  // A hunt that is over is not an evening about to be booked. Picking one still
  // moves `pick` — that is how the readout comes to answer for it — so without
  // this the grid laid a bookable-looking selection across a slot nobody can
  // book, and at the reader's own length rather than the hunt's, which made it
  // disagree with the block underneath it about where the evening ended. The
  // block carries the highlight instead; see .b-chosen.
  const on = blockAt(view.pick);
  if (on && on.past) return [];
  const weekly = view.repeat === 'week' && view.days.size > 0;
  const covers = when => view.days.has(DAY_NAMES.indexOf(serverParts(when).weekday));
  const picked = new Date(view.pick).setSeconds(0, 0);
  const out = [];
  for (let day = 0; day < days; day++) {
    const at = dayStart(start, day);
    at.setHours(view.pick.getHours(), view.pick.getMinutes(), 0, 0);
    if (at.getTime() === picked) {
      // The day that was clicked is only a slot if the mask names it. When it
      // does not, the click was just the time of day — drawing it as a booking
      // there would promise an evening nobody is going to get.
      out.push(weekly && !covers(view.pick)
        ? { at: view.pick, echo: true, label: 'Start time' }
        : { at: view.pick, echo: false, label: 'You' });
    } else if (weekly && covers(at)) {
      // The mask is in server weekdays, so which local column an echo belongs in
      // is a question about that instant, not about this column's heading.
      out.push({ at, echo: true, label: 'Repeats' });
    }
  }
  return out;
}

/** Take hold of the selection and move it — up and down for the time, across for
 *  the day.
 *
 *  Picking a time by clicking lands you on the half hour, which is the right
 *  first guess and the wrong final one often enough to be annoying: the way to
 *  say "no, twenty past" was to click again somewhere else and hope. Dragging
 *  snaps to a quarter of an hour, so the block is nudged rather than re-aimed.
 *
 *  It cannot be dragged out of the bookable part of the grid: the past is a
 *  floor the block stops against, not a place it may be dropped and then be
 *  told about.
 *
 *  Moved by writing straight to the element rather than through a re-render, for
 *  the same reason the stretch handle is: rebuilding a hundred and seventy cells
 *  per frame fights the pointer. Sideways movement is a transform rather than a
 *  reparent into the neighbouring column — the same picture, without touching
 *  the DOM's shape — and the real render at the end puts it where it belongs,
 *  clipped and echoed properly.
 */
function dragSelection(block, at, weekStart, day, days) {
  block.addEventListener('pointerdown', down => {
    // The primary button only: right-click clears the selection, and the foot of
    // the block belongs to the stretch handle, which stops the event itself.
    if (down.button > 0) return;
    down.preventDefault();
    try { block.setPointerCapture(down.pointerId); } catch (e) { /* drag on regardless */ }

    const column = block.parentElement.getBoundingClientRect().width;
    const fromX = down.clientX, fromY = down.clientY;
    const startMinutes = at.getHours() * 60 + at.getMinutes();
    const label = block.querySelector('.tm');
    let moved = false;
    let landing = at;

    const move = ev => {
      const dx = ev.clientX - fromX, dy = ev.clientY - fromY;
      if (!moved && Math.abs(dx) < 3 && Math.abs(dy) < 3) return;   // a click, not a drag
      moved = true;
      block.classList.add('dragging');

      // Never off the strip on either axis: a start dragged past midnight
      // belongs to the next column rather than to the bottom of this one.
      const moves = Math.min(days - 1, Math.max(0, day + Math.round(dx / column))) - day;
      const raw = startMinutes + (dy / ROW_H) * 60;
      const snapped = Math.min(DAY_MS / 60000 - DRAG_SNAP,
        Math.max(0, Math.round(raw / DRAG_SNAP) * DRAG_SNAP));

      landing = dayStart(weekStart, day + moves);
      landing.setHours(Math.floor(snapped / 60), snapped % 60, 0, 0);
      // The past is not somewhere a booking can be dragged to, so the block
      // stops at the first slot still ahead rather than following the pointer
      // into one the server would refuse. Both axes at once, since they are the
      // same mistake: dragging down through the now line and dragging back onto
      // yesterday's column both land before this instant, and the block sits on
      // the earliest real answer either way instead of somewhere it cannot go.
      const floor = startFloor();
      if (landing.getTime() < floor.getTime()) landing = new Date(floor);
      // Read back off the landing rather than off the pointer, because the
      // clamp may have moved it to another column — a block held over yesterday
      // is drawn on today, where it would actually be dropped.
      const landed = columnOf(weekStart, landing, days) - day;

      block.style.transform = landed ? `translateX(${landed * column}px)` : '';
      block.style.top = (localMinutes(landing) / 60) * ROW_H + 'px';
      if (label) {
        const ends = new Date(landing.getTime() + view.duration * 60000);
        label.textContent = `${fmtLocal(landing)}–${fmtLocal(ends)}`;
      }
    };

    const up = () => {
      block.removeEventListener('pointermove', move);
      block.removeEventListener('pointerup', up);
      block.removeEventListener('pointercancel', up);
      block.classList.remove('dragging');
      // A press that never moved is not a drag and must leave the selection
      // exactly as it was — including its verdict, which a re-render would
      // rebuild for no reason.
      if (!moved) return;
      view.pick = landing;
      view.answer = null;
      renderWindow();
    };

    block.addEventListener('pointermove', move);
    block.addEventListener('pointerup', up);
    block.addEventListener('pointercancel', up);
  });
}

/** Drag the foot of the selection to change how long the hunt is.
 *
 *  Snapped to half hours on the way, because that is the granularity a booking
 *  is made at — an hour and seven minutes is not a slot anybody can have. The
 *  block is resized directly during the drag rather than through a re-render:
 *  rebuilding a hundred and seventy cells per frame fights the pointer.
 */
function stretchHandle(block) {
  const handle = el('div', 'stretch');
  handle.title = 'Drag to change how long';
  let preview = view.duration;

  handle.addEventListener('pointerdown', down => {
    // The primary button only. The handle sits on the selection, and a right
    // click there is now how the selection is dropped — swallowing the press
    // would start a resize nobody asked for and suppress the menu event that
    // the block above is waiting for.
    if (down.button > 0) return;
    down.preventDefault();
    down.stopPropagation();
    // Capture keeps the drag alive when the pointer leaves the handle, which is
    // most of a drag. It is not worth losing the drag over, though: a browser
    // that refuses the capture should still resize, so the failure is allowed
    // rather than left to abort the handler before its listeners are attached.
    try { handle.setPointerCapture(down.pointerId); } catch (e) { /* drag on regardless */ }
    const fromY = down.clientY;
    const fromDuration = view.duration;
    const label = block.querySelector('.tm');
    // Never below a whole step unless the tank itself is shorter than one, in
    // which case the last of it is the only length on offer.
    const floor = Math.min(SLOT, cap());

    const move = ev => {
      const minutes = fromDuration + ((ev.clientY - fromY) / ROW_H) * 60;
      const next = Math.max(floor, Math.min(cap(), Math.round(minutes / SLOT) * SLOT));
      if (next === preview) return;
      preview = next;
      block.style.height = Math.max(MIN_BLOCK_H, (next / 60) * ROW_H - 2) + 'px';
      if (label) {
        const end = new Date(view.pick.getTime() + next * 60000);
        label.textContent = `${fmtLocal(view.pick)}–${fmtLocal(end)}`;
      }
    };
    const up = () => {
      handle.removeEventListener('pointermove', move);
      handle.removeEventListener('pointerup', up);
      handle.removeEventListener('pointercancel', up);
      // One render at the end, which also redraws the echoes and the verdict
      // against the length that was actually settled on.
      if (preview !== view.duration) setDuration(preview); else renderWindow();
    };
    handle.addEventListener('pointermove', move);
    handle.addEventListener('pointerup', up);
    handle.addEventListener('pointercancel', up);
  });
  return handle;
}

/** Everything the panel has to say, on the row above the one you act on.
 *
 *  Three things want to be said in that spot and never two at once, so one row
 *  serves all of them in order of how much they are worth reading:
 *
 *  A reply to something just pressed wins outright, being the newer news — after
 *  a booking lands, the verdict on the slot still selected would be about a slot
 *  you now own: true, and not what anybody wants to read. Then the verdict on
 *  whatever is selected. Then, with neither of those, how to select anything at
 *  all — which is only worth saying while the grid is open to be clicked.
 *
 *  Those instructions had a row of their own under "Book a time" and were
 *  drawn under exactly the same condition this branch is. Two strips of text
 *  taking turns in different places is worse than one place that always holds
 *  whatever there is to say.
 *
 *  Nothing at all when there is none of the three — a spawn panel with the week
 *  folded away and nothing pressed — where an empty bar above the button would
 *  be worse than no bar.
 */
function footMessage() {
  if (view.answer) {
    return el('div', 'foot-msg ' + (view.answer.ok ? 'ok' : 'no'),
      `<i class="ti ${view.answer.ok ? 'ti-circle-check' : 'ti-alert-triangle'}" aria-hidden="true"></i>
       <span>${esc(view.answer.message)}</span>`);
  }
  if (!view.pick) {
    // Muted and without the verdict's icon: this is standing advice, not news
    // about anything, and dressing it like an answer would have it read as one.
    return el('div', 'foot-msg hint-msg', `<i class="ti ti-info-circle" aria-hidden="true"></i>
      <span>${TOUCH
        ? 'Tap a start time on the grid to book it, or tap one of your own bookings to cancel it.'
        : 'Pick a start time on the grid to book it, or click one of your own bookings to cancel it. '
          + 'Right-click a selection to clear it.'}</span>`);
  }

  const v = judge(view.pick);
  const srv = serverParts(view.pick);
  // `info` is not a refusal and must not be dressed as one: it answers "who has
  // this?", which is the question a click on a running hunt actually asks.
  const icon = v.type === 'ok' ? 'ti-calendar-check' : v.type === 'ask' ? 'ti-hand-stop'
    : v.type === 'info' ? 'ti-info-circle' : 'ti-alert-triangle';
  const cls = v.type === 'ok' ? 'verdict-ok' : v.type === 'ask' ? 'verdict-ask'
    : v.type === 'info' ? 'verdict-info' : 'verdict-no';
  // The server's own clock used to be echoed here whenever it disagreed with the
  // reader's about the day. It is gone: the grid is drawn on the reader's clock,
  // the times in this line are on the reader's clock, and a second reading of
  // the same moment beside them was one more number to reconcile rather than an
  // answer to anything. Where the server's weekday genuinely changes what gets
  // booked, it is said in words below instead of left to be inferred from a
  // timestamp.
  //
  // A weekly booking anchored on a day its own mask excludes is legal — the
  // anchor gives the time of day and the mask gives the days — but it means the
  // first slot is not the evening that was clicked, which nobody expects unless
  // they are told.
  const offMask = view.repeat === 'week' && view.days.size
    && !view.days.has(DAY_NAMES.indexOf(srv.weekday))
    ? `<span class="srv-note">· repeats on ${[...view.days].sort().map(d => DAY_NAMES[d]).join(', ')}, so the first slot is not this ${srv.weekday}</span>`
    : '';

  // A verdict is plain text unless it says otherwise: `html` is written here,
  // by us, with anything from the wire escaped as it goes in — see judge().
  return el('div', 'foot-msg', `<i class="ti ${icon} ${cls}" aria-hidden="true"></i>
    <span class="${cls}">${v.html || esc(v.text)}</span>${offMask}`);
}

/** The panel's action row: how long, and the thing that acts on it.
 *
 *  Anchored to the foot of the panel whether or not the week is open, rather
 *  than drawn wherever the panel currently happens to end. Folding the week away
 *  used to move the button from the bottom corner up into the strip at the top,
 *  so the one control somebody presses over and over was in a different place
 *  depending on something unrelated to it.
 *
 *  Its height never changes — the verdict that used to share it has moved to
 *  footMessage above, which grows upward instead — so the button stays in one
 *  place however much the panel has to say.
 */
function readout() {
  const spawn = openSpawn();
  const primary = spawn ? primaryAction(spawn) : null;

  const out = el('div', 'readout');
  const dur = el('div', 'foot-dur', `<span class="field-label">For</span>
    <span class="tank" id="tank" role="slider" tabindex="0" aria-label="How long">
      <span class="tank-zones"><span class="tank-spent"></span><span class="tank-hunt"></span></span>
      <span class="tank-cap" hidden></span>
      <span class="tank-edge"></span>
      <span class="tank-in"></span>
      <span class="tank-out"></span>
    </span>`);
  const actions = el('div', 'readout-actions');
  // The tank is only worth offering while there is something it could be spent
  // on. With no action available at all — somebody already holding the spawn and
  // nothing selected — the row would be a control feeding nothing.
  if (limits()) out.appendChild(dur);
  out.appendChild(actions);

  if (!view.pick) {
    if (!primary && !limits()) return null;
    if (primary) actions.appendChild(primary);
    return out;
  }
  // The same button that offers Claim when nothing is picked; a selection is
  // what turns it into Book, and clearing one turns it back.
  if (primary) actions.appendChild(primary);

  // Cancelling is offered on the slot itself: picking a block of your own is how
  // you reach it, which is the same gesture as picking a time.
  // `!b.past` for the same reason as in overlapping: a booking cancelled before
  // its start leaves a history row at a time still ahead of now, and offering to
  // cancel it again is offering to undo something already undone.
  const mine = slots.find(b => b.mine && !b.past && b.scheduleId != null
    && b.start.getTime() === view.pick.getTime());
  if (mine) {
    actions.appendChild(button(mine.repeats ? 'Cancel booking (repeats)' : 'Cancel booking', 'btn danger',
      () => post(`/dashboard/g/${GUILD_ID}/cancel-booking`, { scheduleId: mine.scheduleId })));
  }
  return out;
}

/** Putting one evening of the calendar right, for a moderator.
 *
 *  Deliberately about the day and never about the booking behind it. Cancelling
 *  a booking is the owner's own control above and ends the whole arrangement;
 *  these two end an evening — the Tuesday somebody cannot make, the slot two
 *  people ended up agreeing between themselves — and leave a repeating booking
 *  repeating.
 *
 *  Offered against a predicted block as readily as a written one. To the person
 *  looking at the grid they are the same evening, and which of them has a row
 *  in the database yet is not something a moderator should have to know about.
 *
 *  Hidden for a member, which is convenience rather than the control: both
 *  endpoints re-resolve the tier per request, so a forged one is refused.
 */
/** Where the slot tools have got to, kept out of the DOM.
 *
 *  The foot is rebuilt from scratch on every render, and the board re-renders
 *  every ten seconds whether anything happened or not — so anything held only
 *  in an element is thrown away mid-use. `query` is the name being typed, which
 *  otherwise vanished under the person's fingers on the next poll.
 *
 *  `pick` is the slot all of this is about, so opening the panel on one evening
 *  and clicking another closes it rather than quietly re-aiming a Delete at
 *  somebody who was never on screen when it was opened.
 *
 *  `length` is the number Edit claim is dragging, in minutes, and null when it
 *  is not being dragged. It has to live out here for the same reason `query`
 *  does — the grid is rebuilt from scratch every poll, so a length held only in
 *  the block's own height would be thrown away every ten seconds, mid-drag.
 */
let slotPanel = { open: false, mode: 'idle', pick: null, query: '', typing: false, length: null };

/** Everything a moderator can do here, in one panel in the foot.
 *
 *  ==What it acts on==
 *  Whatever is selected in the grid, and nothing else. Select the live claim and
 *  it offers the claim's actions; select a booking and it offers that booking's;
 *  select nothing and all that is left is the spawn's own ceiling.
 *
 *  That is the whole reason this is one function. It used to be two panels —
 *  one keyed on "is this spawn claimed", one on "which evening did you click" —
 *  which stacked two strips both labelled Moderator and left the claim buttons
 *  standing on any busy spawn next to buttons for a booking three days away.
 *  With one target there is nothing to disambiguate.
 *
 *  The live claim was excluded from selection until now (`state !== 'claimed'`),
 *  which is precisely what forced the claim tools to key off the spawn instead.
 *
 *  ==Shape==
 *  One row in every state it has. Verbs at their own width on the left, the
 *  ceiling anchored right in the space that was going spare; confirming and
 *  handing over reuse the row rather than adding one.
 *
 *  Folded shut, and what is left when it is shut names its target — so it is not
 *  a box you have to open to find out what is in it.
 *
 *  Hidden for a member, which is convenience rather than the control: every
 *  endpoint re-resolves the tier per request, so a forged one is refused.
 */
function moderatorTools(spawn) {
  if (TIER !== 'moderator' && TIER !== 'admin') return null;

  // Any block, including the live claim. The old filter dropped `claimed` here.
  const slot = spawn && view.pick
    ? slots.find(b => b.start.getTime() === view.pick.getTime())
    : null;

  // No block selected is nothing to act on, so there is no panel. It briefly
  // drew one regardless, because the spawn's claim ceiling lived in it and was
  // worth reaching without a selection; that moved to the board's own Moderator
  // panel, and what was left here was a strip with an empty row under it.
  if (!slot) {
    if (slotPanel.pick !== null) {
      slotPanel = { open: slotPanel.open, mode: 'idle', pick: null, query: '', typing: false, length: null };
    }
    return null;
  }

  // Keyed on the instant rather than on `startsAt`, so a selection is identified
  // the same way whether or not the thing selected has a row of its own yet.
  const pickKey = slot.start.getTime();
  // The mode is forgotten as soon as the selection moves — otherwise clicking
  // another block would find a Confirm Delete already armed at somebody who was
  // never on screen when it was armed. Whether the panel is *open* is left
  // alone, since a moderator working through several evenings should not have to
  // reopen it for each, and the strip always names what it is aimed at.
  if (slotPanel.pick !== pickKey) {
    slotPanel = { open: slotPanel.open, mode: 'idle', pick: pickKey, query: '', typing: false, length: null };
  }

  const onClaim = slot.state === 'claimed';
  const box = el('div', 'slot-tools' + (slotPanel.open ? ' open' : ''));

  const strip = el('button', 'slot-strip',
    `<i class="ti ti-shield-half" aria-hidden="true"></i>
     <span class="slot-strip-label">Moderator</span>
     <span class="slot-strip-who">${esc(targetSummary(slot))}</span>
     <i class="ti ti-chevron-${slotPanel.open ? 'up' : 'down'}" aria-hidden="true"></i>`);
  strip.type = 'button';
  strip.setAttribute('aria-expanded', String(slotPanel.open));
  strip.addEventListener('click', () => { slotPanel.open = !slotPanel.open; renderWindow(); });
  box.appendChild(strip);
  if (!slotPanel.open) return box;

  const body = el('div', 'slot-body');
  const row = el('div', 'mod-row');
  body.appendChild(row);
  box.appendChild(body);

  const go = (mode) => { slotPanel.mode = mode; renderWindow(); };

  // --- confirming, and handing over: the row becomes the one thing being done
  if (slotPanel.mode === 'confirm') {
    row.appendChild(button('Confirm delete', 'btn mod-btn armed', () =>
      post(`/dashboard/g/${GUILD_ID}/drop-slot`, { code: spawn.code, startsAt: slot.startsAt })));
    row.appendChild(button('Cancel', 'btn ghost', () => go('idle')));
    // Said before the second press rather than after it: a repeating booking
    // losing one evening and a booking ending outright look identical from here,
    // and only one of them is what anybody means. Inline, so it costs no row.
    row.appendChild(el('span', 'mod-warn', slot.repeats
      ? 'Their booking repeats — only this evening goes.'
      : 'This booking is only on this evening.'));
    return box;
  }

  // --- re-timing: the row becomes the length under the pointer
  if (slotPanel.mode === 'length') {
    // What to do leads, and what it produces — the length, then the two verbs —
    // is anchored at the far end, so the row is read in the order the gesture
    // happens in rather than ending on the instruction for it.
    row.appendChild(el('span', 'mod-hint',
      `Drag the foot of the ${onClaim ? 'claim' : 'booking'} to extend or reduce its duration.`));
    row.appendChild(el('div', 'mod-gap'));
    const readout = el('span', 'mod-length', esc(lengthReadout(slot.start, slotPanel.length)));
    readout.id = 'mod-length';
    row.appendChild(readout);
    const save = button('Save', 'btn mod-btn', () =>
      post(`/dashboard/g/${GUILD_ID}/edit-slot`,
        { code: spawn.code, startsAt: slot.startsAt, minutes: slotPanel.length }));
    // Nothing to save until the block has actually moved. Pressing it on an
    // untouched block would write the length it already has, which looks like
    // the button doing nothing — and is indistinguishable from it failing.
    if (slotPanel.length === slotMinutes(slot)) {
      save.disabled = true;
      save.title = 'Drag the foot of the block first';
    }
    row.appendChild(save);
    row.appendChild(button('Cancel', 'btn ghost', () => go('idle')));
    return box;
  }

  if (slotPanel.mode === 'give') {
    const picker = personField('Search a name, or paste a Discord ID', slotPanel);
    picker.field.classList.add('mod-grow');
    row.appendChild(picker.field);
    row.appendChild(button('Give', 'btn mod-btn', () => {
      const person = picker.chosen();
      if (!person) {
        view.answer = { ok: false, message: 'Pick somebody first, or paste their Discord ID.' };
        renderWindow();
        return;
      }
      // Which endpoint depends on what is selected, not on which button was
      // pressed: moving the hunt somebody is on now and moving one booked
      // evening are different things wearing the same word.
      if (onClaim) post(`/dashboard/g/${GUILD_ID}/reassign`, { code: spawn.code, toUserId: person.id });
      else post(`/dashboard/g/${GUILD_ID}/reassign-slot`,
        { code: spawn.code, startsAt: slot.startsAt, toUserId: person.id });
    }));
    row.appendChild(button('Cancel', 'btn ghost', () => go('idle')));
    // After the row, so the field exists to be focused and the caret goes back
    // where the poll took it from.
    picker.restore();
    return box;
  }

  // --- at rest: the verbs for whatever is selected, then the ceiling
  if (onClaim) {
    const remove = button('Remove claim', 'btn danger', () =>
      post(`/dashboard/g/${GUILD_ID}/force-leave`, { code: spawn.code }));
    remove.title = `Take ${spawn.code} off whoever is holding it`;
    row.appendChild(remove);
    row.appendChild(button('Give to…', 'btn mod-btn', () => go('give')));
    // For a hunt that lost time it should have had — a crash, a server issue.
    // Costs the holder no stamina, which is why it is a moderator's to give.
    const extend = button('+30m', 'btn mod-btn', () =>
      post(`/dashboard/g/${GUILD_ID}/extend-holder`, { code: spawn.code, minutes: 30 }));
    extend.title = 'Add 30 minutes to this hunt — costs them no stamina';
    row.appendChild(extend);
    row.appendChild(editClaimButton(slot, go));
  } else {
    row.appendChild(button('Delete booking', 'btn danger', () => go('confirm')));
    row.appendChild(button('Give to…', 'btn mod-btn', () => go('give')));
    row.appendChild(editClaimButton(slot, go));
  }

  return box;
}

/** Edit claim: hands the block on the grid a foot to drag, and the row a
 *  readout of what is being dragged.
 *
 *  A mode rather than a drag that is always live, because the alternative is a
 *  handle sitting on every block a moderator selects — and a stray pointer on
 *  the way to Delete would then be quietly re-timing somebody's evening. Two
 *  presses to change a length is the right price for never changing one by
 *  accident.
 *
 *  The length starts where the block already is, so opening the mode changes
 *  nothing and Save has nothing to write until the block has moved.
 */
function editClaimButton(slot, go) {
  const edit = button('Edit claim', 'btn mod-btn', () => {
    slotPanel.length = slotMinutes(slot);
    go('length');
  });
  edit.title = slot.state === 'claimed'
    ? 'Change how long this hunt runs — costs them no stamina'
    : 'Change how long this booking runs';
  return edit;
}

/** How long a block runs now, in whole minutes. Off its two instants rather
 *  than off a duration field, because a predicted day has no row to carry one
 *  and the grid has already worked both ends out to draw it. */
const slotMinutes = slot => Math.round((slot.end.getTime() - slot.start.getTime()) / 60000);

/** The window a length would make, as the row says it: the clock at both ends,
 *  then the length itself. Both, because a moderator dragging a foot is
 *  answering "until when" and "for how long" at the same time and which of the
 *  two they are thinking in varies. */
const lengthReadout = (start, minutes) =>
  `${fmtLocal(start)}–${fmtLocal(new Date(start.getTime() + minutes * 60000))} · ${fmtDur(minutes)}`;

/** Whether the panel is re-timing this block right now.
 *
 *  Folding the panel away counts as not: the Save the drag is feeding goes with
 *  it, and a handle still on the grid under a shut strip would be a length
 *  nobody could commit. */
const resizing = slot =>
  slotPanel.open && slotPanel.mode === 'length' && slotPanel.length != null &&
  slotPanel.pick === slot.start.getTime();

/** Where a block ends on screen — the length being dragged while it is being
 *  dragged, and the booking's own end the rest of the time. Everything that
 *  draws a block goes through this, so a window dragged past local midnight is
 *  clipped into the next column exactly as a booked one is. */
const shownEnd = slot => resizing(slot) ? new Date(slot.start.getTime() + slotPanel.length * 60000) : slot.end;

/** The shortest a block may be dragged to.
 *
 *  A hunt in progress cannot be dragged above the now line: those minutes are
 *  spent whatever anybody now says, and the server refuses it. Dragging one
 *  down to exactly now ends it at the next sweep, which is as near to stopping
 *  it as this tool goes — Remove claim is what ends a hunt outright, with the
 *  queue behind it served properly. */
function lengthFloor(slot) {
  if (slot.state !== 'claimed') return SLOT;
  const elapsed = (Date.now() - slot.start.getTime()) / 60000;
  return Math.max(SLOT, Math.ceil(elapsed / SLOT) * SLOT);
}

/** Drag the foot of a booked or hunted block to re-time it.
 *
 *  A near twin of [[stretchHandle]], and deliberately not the same function:
 *  that one owns `view.duration`, which is the length of a booking nobody has
 *  made yet, and this one owns a proposal about a block that already exists.
 *  Folding them together would mean a handle that has to ask which of the two
 *  it is on before every frame.
 *
 *  Snapped to half hours, resized directly rather than through a re-render, and
 *  settled with one render at the end — all three for the reasons the other one
 *  gives. The row's readout follows the pointer too, since it is the number
 *  Save will actually write.
 */
function lengthHandle(block, slot) {
  const handle = el('div', 'stretch');
  handle.title = 'Drag to change how long this runs';
  const floor = lengthFloor(slot);
  let preview = slotPanel.length;

  handle.addEventListener('pointerdown', down => {
    if (down.button > 0) return;
    down.preventDefault();
    // The block underneath answers a click by selecting itself, which is where
    // it already is — but a press that reached it would also cancel the drag.
    down.stopPropagation();
    try { handle.setPointerCapture(down.pointerId); } catch (e) { /* drag on regardless */ }
    const fromY = down.clientY;
    const fromLength = slotPanel.length;
    const label = block.querySelector('.tm');
    const readout = document.getElementById('mod-length');

    const move = ev => {
      const minutes = fromLength + ((ev.clientY - fromY) / ROW_H) * 60;
      const next = Math.max(floor, Math.min(MOD_MAX, Math.round(minutes / SLOT) * SLOT));
      if (next === preview) return;
      preview = next;
      block.style.height = Math.max(MIN_BLOCK_H, (next / 60) * ROW_H - 2) + 'px';
      if (label) label.textContent = `${fmtLocal(slot.start)}–${fmtLocal(new Date(slot.start.getTime() + next * 60000))}`;
      if (readout) readout.textContent = lengthReadout(slot.start, next);
    };
    const up = () => {
      handle.removeEventListener('pointermove', move);
      handle.removeEventListener('pointerup', up);
      handle.removeEventListener('pointercancel', up);
      if (preview === slotPanel.length) return;
      slotPanel.length = preview;
      renderWindow();
    };
    handle.addEventListener('pointermove', move);
    handle.addEventListener('pointerup', up);
    handle.addEventListener('pointercancel', up);
  });
  return handle;
}

/** What the shut strip names — which is always the selection, since without one
 *  there is no panel. Said on the strip so it is not a box you have to open to
 *  find out whose evening it is aimed at. */
function targetSummary(slot) {
  const day = slot.start.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' });
  const when = slot.state === 'claimed' ? 'now' : day;
  return `${whoHas(slot)} · ${when}, ${fmtLocal(slot.start)}–${fmtLocal(slot.end)}`;
}

/** Whose evening it is, for a line that has to name somebody in a few words.
 *  The character is what the block is labelled with, so it leads; the account is
 *  what a moderator would go and look for. */
function whoHas(slot) {
  const name = (slot.owner || '').trim();
  const account = (slot.nickname || slot.account || '').trim();
  if (!name) return account || 'Somebody';
  return account && account.toLowerCase() !== name.toLowerCase() ? `${name} (${account})` : name;
}

/** The moderator panel above the board: tools that act on the catalogue rather
 *  than on any one claim.
 *
 *  Built once at startup and left in the document, folded shut. It is reference
 *  rather than what anybody came here for, and an open form above the spawn list
 *  would push the list itself off a phone screen.
 *
 *  Removed outright for a member, not merely hidden — there is nothing here they
 *  could use, and leaving the markup in the page would invite the impression
 *  that unhiding it would do something. It would not: `/spawns` re-resolves the
 *  visitor's tier against the live guild on every request, so the control is
 *  there and this is only tidiness.
 */
function setUpModPanel() {
  const panel = document.getElementById('mod-panel');
  if (TIER !== 'moderator' && TIER !== 'admin') { panel.remove(); return; }

  const head = document.getElementById('mod-panel-head');
  const body = document.getElementById('mod-panel-body');
  panel.hidden = false;

  // Two bands, each titled, rather than one column of controls with hairlines
  // between them. The panel does two unrelated jobs — curating the server's
  // codes, and topping up one person's tank — and a rule says "something ends
  // here" without saying what begins. A heading and a ground of its own is what
  // makes a section read as one.
  const spawns = el('div', 'mod-band');
  spawns.innerHTML = `
    <div class="mod-section">
      <span class="mod-section-title">Spawn codes</span>
      <span class="mod-section-hint" id="ms-count"></span>
    </div>
    <div class="mod-form">
      <div class="mod-field">
        <label class="field-label" for="ms-code">Code</label>
        <input id="ms-code" type="text" maxlength="16" placeholder="2104" autocomplete="off" spellcheck="false">
      </div>
      <div class="mod-field">
        <label class="field-label" for="ms-name">Name</label>
        <input id="ms-name" type="text" maxlength="60" placeholder="Moonstone Crater" autocomplete="off">
      </div>
      <div class="mod-field">
        <label class="field-label" for="ms-region">City</label>
        <input id="ms-region" type="text" maxlength="40" placeholder="Thalassara" autocomplete="off">
      </div>
      <div class="mod-field">
        <label class="field-label" for="ms-creature">Creature Name (Image)</label>
        <input id="ms-creature" type="text" maxlength="64" placeholder="Moonstone Excavator" autocomplete="off">
      </div>
    </div>`;
  body.appendChild(spawns);

  const actions = el('div', 'mod-actions');
  const add = button('Add spawn', 'btn mod-btn', () => submit(), 'ti-plus');
  actions.appendChild(add);
  spawns.appendChild(actions);

  // What this server has added, and the only way back out again. Redrawn from
  // the catalogue on every open and after every write, so it never disagrees
  // with the board below it.
  const owned = el('div', 'mod-owned');
  spawns.appendChild(owned);

  // How long a claim on one spawn may run. Here rather than on the spawn's own
  // card for the same reason stamina is: it is configuration rather than
  // something done to a hunt in progress, and from a card there was no way to
  // see which spawns had been singled out without opening all of them.
  const limitsBand = el('div', 'mod-band alt');
  body.appendChild(limitsBand);

  // Handing somebody stamina. Here rather than on a spawn's card, where it used
  // to sit: a tank belongs to a person and not to a respawn, and reaching it
  // through whichever spawn they happened to be holding meant a moderator could
  // only ever top up somebody who was mid-hunt.
  const stamina = el('div', 'mod-band');
  body.appendChild(stamina);

  // One place for whatever the bot said back, whichever tool above said it, and
  // always the last thing in the panel. Answers used to sit beside the button
  // that caused them, which put the reply to adding a spawn in a different part
  // of the panel from the reply to giving stamina — so where to look depended on
  // what had just been pressed.
  const answer = el('div', 'mod-answer');
  body.appendChild(answer);

  const field = id => document.getElementById(id);
  const inputs = ['ms-code', 'ms-name', 'ms-region', 'ms-creature'].map(field);
  // Enter submits from any field. A four-box form where the only way to send it
  // is to reach for the mouse is a form people fill in wrong twice.
  inputs.forEach(input => input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); submit(); }
  }));

  function say(text, kind) {
    answer.textContent = text;
    answer.className = 'mod-answer' + (kind ? ' ' + kind : '');
  }

  /** The spawns this server added, each with the way to take it back out.
   *
   *  Only ever the custom ones. A seed code has no button because removing one
   *  is refused server-side — it would come back on the next boot — and offering
   *  a button that always fails is worse than offering none.
   *
   *  Two presses, not one. Removal takes the spawn's claims, bookings and forum
   *  post with it, which is not something to hand to a stray click on a list of
   *  small buttons; the second press is the confirmation, and moving away resets
   *  it.
   */
  function drawOwned() {
    owned.innerHTML = '';
    const mine = catalogue
      // Read the way a person reads a code — 101 before 1001, and 411a before
      // 411b — matching how the board image orders them (RespawnCatalogue.sortKey).
      ? [...catalogue.values()].filter(s => s.custom)
          .sort((a, b) => a.code.localeCompare(b.code, undefined, { numeric: true, sensitivity: 'base' }))
      : [];
    // The count belongs to the section, not to the list: it is what the heading
    // is about, and it is still true when the list is empty.
    const counted = document.getElementById('ms-count');
    if (counted) {
      counted.textContent = mine.length
        ? `${mine.length} added here` : 'none added here yet';
    }
    if (!mine.length) return;
    const list = el('div', 'mod-list');
    mine.forEach(spawn => {
      const row = el('div', 'mod-list-row', `<span class="code-chip">${esc(spawn.code)}</span>
        <span class="mod-list-name">${esc(spawn.name)}</span>
        <span class="mod-list-region">${esc(spawn.region || '')}</span>`);
      let armed = false;
      const drop = button('Remove', 'btn mod-btn small danger-hover', () => {
        if (!armed) {
          armed = true;
          drop.textContent = 'Sure?';
          drop.classList.add('armed');
          return;
        }
        remove(spawn.code);
      }, 'ti-trash');
      drop.title = `Remove ${spawn.code} from this server's catalogue`;
      // Anywhere else, and the question is withdrawn. An armed button left
      // sitting on the page is one somebody presses later meaning something else.
      drop.addEventListener('blur', () => {
        if (!armed) return;
        armed = false;
        drop.textContent = 'Remove';
        drop.classList.remove('armed');
      });
      row.appendChild(drop);
      list.appendChild(row);
    });
    owned.appendChild(list);
  }

  async function remove(code) {
    say('Removing…');
    const result = await send(`/dashboard/g/${GUILD_ID}/remove-spawn`, { code });
    say(result.message, result.ok ? 'ok' : 'no');
    if (result.ok) await reread();
  }

  /** One write, with the two failures that are not answers of their own. */
  async function send(path, payload) {
    try {
      const res = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      return await res.json().catch(() => ({ ok: false, message: 'That did not go through.' }));
    } catch (e) {
      return { ok: false, message: 'Could not reach the server.' };
    }
  }

  /** The catalogue has changed, so everything drawn from it is stale: this list,
   *  and the board underneath. `loadCatalogue` bypasses the browser cache, which
   *  `refresh` on its own would not. */
  async function reread() {
    await loadCatalogue().catch(() => {});
    drawOwned();
    drawLimits();
    await refresh();
  }

  // ---- Claim limits -------------------------------------------------------
  // Which spawn the box below is about. Held outside the field because the band
  // is redrawn after every write, and because what was typed and what was
  // *chosen* are different things — see `limitSpawn`.
  let limitPick = null;

  limitsBand.innerHTML = `
    <div class="mod-section">
      <span class="mod-section-title">Claim limits</span>
      <span class="mod-section-hint" id="ml-default"></span>
    </div>
    <div class="mod-form limits">
      <div class="mod-field mod-who">
        <label class="field-label" for="ml-spawn">Spawn</label>
        <input id="ml-spawn" type="text" autocomplete="off" spellcheck="false"
               placeholder="Search a code or a name">
        <div class="mod-suggest" id="ml-suggest" hidden></div>
      </div>
      <div class="mod-field">
        <label class="field-label" for="ml-max">Max claim</label>
        <input id="ml-max" type="text" autocomplete="off" placeholder="2h">
      </div>
    </div>`;

  const mlSpawn = document.getElementById('ml-spawn');
  const mlSuggest = document.getElementById('ml-suggest');
  const mlMax = document.getElementById('ml-max');

  const limitActions = el('div', 'mod-actions');
  const setLimit = button('Set limit', 'btn mod-btn', () => applyLimit(), 'ti-hourglass');
  limitActions.appendChild(setLimit);
  limitsBand.appendChild(limitActions);

  // What has been singled out, and the way back off it — the same shape as the
  // custom-code list above, because it answers the same kind of question.
  const limited = el('div', 'mod-owned');
  limitsBand.appendChild(limited);

  [mlSpawn, mlMax].forEach(input => input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); applyLimit(); }
  }));

  // A code or a name, because a moderator remembers one or the other. Same list
  // and same behaviour as the stamina band's Who — including mousedown rather
  // than click, since the input's blur would otherwise hide the row out from
  // under the pointer.
  mlSpawn.addEventListener('input', () => {
    limitPick = null;
    const text = mlSpawn.value.trim().toLowerCase();
    const hits = !text || !catalogue ? [] : [...catalogue.values()].filter(sp =>
      sp.code.toLowerCase().includes(text) || sp.name.toLowerCase().includes(text)).slice(0, 8);
    mlSuggest.innerHTML = '';
    hits.forEach(sp => {
      const row = el('button', 'mod-suggest-row', `${esc(sp.code)} — ${esc(sp.name)}`);
      row.type = 'button';
      row.addEventListener('mousedown', e => {
        e.preventDefault();
        limitPick = sp;
        mlSpawn.value = `${sp.code} — ${sp.name}`;
        mlSuggest.hidden = true;
        // Pre-filled with what that spawn is on now, so the box says where it is
        // starting from rather than making somebody look it up in the list below.
        mlMax.value = sp.maxMinutes != null ? String(sp.maxMinutes) : '';
        mlMax.focus();
      });
      mlSuggest.appendChild(row);
    });
    mlSuggest.hidden = !hits.length;
  });
  mlSpawn.addEventListener('blur', () => setTimeout(() => (mlSuggest.hidden = true), 120));

  /** The spawn the box is about: the one chosen from the list, or whatever a
   *  typed code matches exactly. Typing `415` and pressing Enter should work
   *  without going through the suggestions. */
  function limitSpawn() {
    if (limitPick) return limitPick;
    const text = mlSpawn.value.trim().toLowerCase();
    if (!text || !catalogue) return null;
    return [...catalogue.values()].find(sp =>
      sp.code.toLowerCase() === text || `${sp.code} — ${sp.name}`.toLowerCase() === text) || null;
  }

  /** Every spawn with a ceiling of its own, in the order the board reads them. */
  function drawLimits() {
    const l = board && board.limits;
    document.getElementById('ml-default').textContent =
      l ? `server default ${fmtDur(l.maxDurationMinutes)}` : '';

    limited.innerHTML = '';
    const rows = !catalogue ? [] : [...catalogue.values()]
      .filter(sp => sp.maxMinutes != null)
      // Sorted the way the list above is, and the board image: 101 before 1001.
      .sort((a, b) => a.code.localeCompare(b.code, undefined, { numeric: true, sensitivity: 'base' }));
    if (!rows.length) return;
    const list = el('div', 'mod-list');
    rows.forEach(sp => {
      const row = el('div', 'mod-list-row');
      row.appendChild(el('span', 'code-chip', esc(sp.code)));
      row.appendChild(el('span', 'mod-list-name', esc(sp.name)));
      row.appendChild(el('span', 'mod-list-max', fmtDur(sp.maxMinutes)));
      const clear = button('Clear', 'btn mod-btn small', () => sendLimit(sp.code, ''));
      clear.title = `Put ${sp.code} back on the server's maximum`;
      row.appendChild(clear);
      list.appendChild(row);
    });
    limited.appendChild(list);
  }

  function applyLimit() {
    const spawn = limitSpawn();
    if (!spawn) { say('Pick a spawn first.', 'no'); mlSpawn.focus(); return; }
    sendLimit(spawn.code, mlMax.value);
  }

  /** One way out for both the form and the Clear buttons, so the reply and the
   *  redraw happen the same way whichever pressed.
   *
   *  Through the panel's own `send` rather than the window's `post`: that one
   *  drives `view.busy` and re-renders the spawn window, which is not what is on
   *  screen here.
   *
   *  The text goes to the server as typed — `ClaimDuration` there is the only
   *  thing that decides what `2h` means, so the page cannot disagree with it. */
  async function sendLimit(code, minutes) {
    setLimit.disabled = true;
    say('Saving…');
    const result = await send(`/dashboard/g/${GUILD_ID}/spawn-max`, { code, minutes });
    setLimit.disabled = false;
    say(result.message, result.ok ? 'ok' : 'no');
    if (result.ok) {
      limitPick = null;
      mlSpawn.value = '';
      mlMax.value = '';
      await reread();
    }
  }

  // ---- Stamina ------------------------------------------------------------
  // The list of people lives at module scope and is read once the panel is
  // opened rather than at page load — most visits never open it — see
  // `loadPeople`.
  let picked = null;

  /** The amounts worth offering, and the whole of what may be given.
   *
   *  A moderator gives stamina to replace what somebody lost, so the figure is a
   *  hunt's worth or a fraction of one rather than an arbitrary number of
   *  minutes. That makes it a short known list, and a slider is the wrong
   *  instrument for a short known list — it asks somebody to aim at a value they
   *  could have named. These are pressed once, land exactly, work under a thumb,
   *  and can be read back afterwards without interpreting where a handle sits.
   */
  const STAMINA_STEPS = [15, 30, 60, 120, 240];
  let staminaMinutes = 30;

  function drawStamina() {
    stamina.innerHTML = `
      <div class="mod-section">
        <span class="mod-section-title">Stamina</span>
        <span class="mod-section-hint">resets at server save</span>
      </div>
      <div class="mod-give">
        <div class="mod-field mod-who">
          <label class="field-label" for="ms-who">Who</label>
          <input id="ms-who" type="text" autocomplete="off" spellcheck="false"
                 placeholder="Search a name, or paste a Discord ID">
          <div class="mod-suggest" id="ms-suggest" hidden></div>
        </div>
        <div class="mod-field">
          <span class="field-label">How much</span>
          <div class="seg" id="ms-amount" role="group" aria-label="How much stamina">
            ${STAMINA_STEPS.map(m =>
              `<button type="button" data-minutes="${m}" aria-pressed="${m === staminaMinutes}">${fmtDur(m)}</button>`
            ).join('')}
          </div>
        </div>
      </div>
      `;

    const who = document.getElementById('ms-who');
    const suggest = document.getElementById('ms-suggest');
    const amount = document.getElementById('ms-amount');
    amount.addEventListener('click', e => {
      const hit = e.target.closest('button');
      if (!hit) return;
      staminaMinutes = Number(hit.dataset.minutes);
      amount.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === hit)));
    });

    const give = button('Give stamina', 'btn mod-btn', () => grant(1), 'ti-battery-charging');
    const take = button('Remove stamina', 'btn mod-btn small', () => grant(-1), 'ti-battery-off');
    const row = el('div', 'mod-actions');
    row.appendChild(give);
    row.appendChild(take);
    stamina.appendChild(row);

    function choose(person) {
      picked = person;
      who.value = personLabel(person);
      suggest.hidden = true;
    }

    // A pasted Discord id is a person too. Nobody knows their own snowflake, but
    // a moderator copying one out of Discord does — and it is the only way to
    // reach somebody who has never used the system here and so is in no list.
    function typed() {
      const text = who.value.trim();
      if (/^\d{15,25}$/.test(text)) return { id: text, name: text, nickname: '' };
      return picked && personLabel(picked) === text ? picked : null;
    }

    who.addEventListener('input', () => {
      picked = null;
      const text = who.value.trim().toLowerCase();
      const matches = !text ? [] : (people || []).filter(p =>
        p.name.toLowerCase().includes(text) || p.nickname.toLowerCase().includes(text)).slice(0, 8);
      suggest.innerHTML = '';
      matches.forEach(person => {
        const hit = el('button', 'mod-suggest-row', esc(personLabel(person)));
        hit.type = 'button';
        // mousedown, not click: the input's blur fires first and would hide the
        // list out from under the pointer before the click ever landed.
        hit.addEventListener('mousedown', e => { e.preventDefault(); choose(person); });
        suggest.appendChild(hit);
      });
      suggest.hidden = !matches.length;
    });
    who.addEventListener('blur', () => setTimeout(() => (suggest.hidden = true), 120));

    async function grant(sign) {
      const person = typed();
      if (!person) { say('Pick somebody first, or paste their Discord ID.', 'no'); return; }
      give.disabled = take.disabled = true;
      say(sign > 0 ? 'Giving…' : 'Taking back…');
      const result = await send(`/dashboard/g/${GUILD_ID}/grant-stamina`,
        { userId: person.id, minutes: sign * staminaMinutes });
      give.disabled = take.disabled = false;
      say(result.message, result.ok ? 'ok' : 'no');
      // Their tank may be the reader's own, and it feeds the length control on
      // every spawn — so the board is re-read rather than left saying what it
      // said before.
      if (result.ok) await refresh();
    }
  }

  async function submit() {
    const payload = {
      code: field('ms-code').value.trim(),
      name: field('ms-name').value.trim(),
      region: field('ms-region').value.trim(),
      creature: field('ms-creature').value.trim()
    };
    // Checked here only to save a round trip on the obvious case; the server
    // decides for real, and says so in its own words.
    if (!payload.code || !payload.name) { say('A spawn needs a code and a name.', 'no'); return; }

    add.disabled = true;
    say('Adding…');
    const result = await send(`/dashboard/g/${GUILD_ID}/spawns`, payload);
    add.disabled = false;
    say(result.message, result.ok ? 'ok' : 'no');

    if (result.ok) {
      // Cleared so the next one can be typed straight in — adding spawns is
      // something done in a run of five, not once.
      inputs.forEach(input => (input.value = ''));
      field('ms-code').focus();
      await reread();
    }
  }

  head.addEventListener('click', () => {
    const open = head.getAttribute('aria-expanded') === 'true';
    head.setAttribute('aria-expanded', String(!open));
    body.hidden = open;
    // Drawn on the way open rather than kept up to date while shut: the list is
    // only ever read here, and the catalogue may well have moved since last time.
    if (!open) {
      drawOwned();
      drawLimits();
      drawStamina();
      loadPeople();
      field('ms-code').focus();
    }
  });
}

/** `icon` is a Tabler class, drawn before the label. Appended as a text node
 *  rather than set through textContent, which would throw the icon away. */
/** How somebody reads in a picker: the account, then what this server calls
 *  them. The same order the bot names people in Discord. */
function personLabel(person) {
  const nick = (person.nickname || '').trim();
  const name = (person.name || '').trim() || person.id;
  return nick && nick.toLowerCase() !== name.toLowerCase() ? `${name} (@${nick})` : name;
}

async function loadPeople() {
  if (people) return;
  try {
    const res = await fetch(`/dashboard/g/${GUILD_ID}/people`, { headers: { 'Accept': 'application/json' } });
    people = res.ok ? (await res.json()).people : [];
  } catch (e) {
    // A picker that cannot be filled still takes a pasted id, so this is a
    // smaller failure than it looks and not worth an error of its own.
    people = [];
  }
}

/** Somebody named by typing, for the calendar's "give this day to".
 *
 *  A search over everybody the system knows, and a pasted Discord id for
 *  anybody it does not — the moderator panel's stamina field takes both for the
 *  same reason, since somebody who has never claimed here is in no list but is
 *  still a person a slot can be handed to.
 *
 *  Returns the field and a `chosen()` that answers null until it names somebody
 *  real, so the caller never has to guess what a half-typed name meant.
 */
function personField(placeholder, memory) {
  // Somewhere outside the DOM to keep what has been typed. The panel this sits
  // in is rebuilt whole on every render, and the board renders every ten
  // seconds on its own — so without this the name being typed disappeared under
  // the fingers of whoever was typing it, roughly once per name.
  const held = memory || { query: '', picked: null, typing: false };
  const field = el('div', 'mod-field mod-who');
  field.innerHTML = `<input type="text" autocomplete="off" spellcheck="false"
      placeholder="${esc(placeholder)}"><div class="mod-suggest" hidden></div>`;
  const input = field.querySelector('input');
  const suggest = field.querySelector('.mod-suggest');
  input.value = held.query || '';

  function choose(person) {
    held.picked = person;
    held.query = personLabel(person);
    input.value = held.query;
    suggest.hidden = true;
  }

  input.addEventListener('focus', () => { held.typing = true; });
  input.addEventListener('input', () => {
    held.picked = null;
    held.query = input.value;
    const text = input.value.trim().toLowerCase();
    const matches = !text ? [] : (people || []).filter(p =>
      p.name.toLowerCase().includes(text) || p.nickname.toLowerCase().includes(text)).slice(0, 8);
    suggest.innerHTML = '';
    matches.forEach(person => {
      const hit = el('button', 'mod-suggest-row', esc(personLabel(person)));
      hit.type = 'button';
      // mousedown, not click: the input's blur fires first and would hide the
      // list out from under the pointer before the click ever landed.
      hit.addEventListener('mousedown', e => { e.preventDefault(); choose(person); });
      suggest.appendChild(hit);
    });
    suggest.hidden = !matches.length;
  });
  input.addEventListener('blur', () => setTimeout(() => (suggest.hidden = true), 120));
  // Filled in the background: the field works without it, and waiting on a read
  // before letting somebody type would make it feel broken.
  loadPeople().then(() => {});

  return {
    field,
    /** Put the cursor back where a re-render took it from. Called once the
     *  field is in the document, since focusing a detached input does nothing. */
    restore() {
      if (!held.typing) return;
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    },
    chosen() {
      const text = input.value.trim();
      // A pasted Discord id is a person too. Nobody knows their own snowflake,
      // but a moderator copying one out of Discord does — and it is the only way
      // to reach somebody who has never used the system here.
      if (/^\d{15,25}$/.test(text)) return { id: text, name: text, nickname: '' };
      return held.picked && personLabel(held.picked) === text ? held.picked : null;
    }
  };
}

function button(label, className, onClick, icon) {
  const b = document.createElement('button');
  b.className = className;
  if (icon) {
    const glyph = document.createElement('i');
    glyph.className = 'ti ' + icon;
    glyph.setAttribute('aria-hidden', 'true');
    b.appendChild(glyph);
  }
  b.appendChild(document.createTextNode(label));
  b.disabled = view.busy;
  b.addEventListener('click', onClick);
  return b;
}

/** How the strip is moved by hand, and how it comes to rest.
 *
 *  Three ways in, because three kinds of pointer exist. A finger swipes, and the
 *  browser does the work — including the momentum, which is better than any
 *  imitation of it. A trackpad or a tilt wheel scrolls sideways, and the browser
 *  does that too. A plain mouse has neither, so it drags the grid about like a
 *  map: both axes, since the day is taller than the panel as well as the week
 *  being wider.
 *
 *  However it was moved, it lands on a day. The pull waits for everything to
 *  stop, then travels along `t^PULL_CURVE` — a curve whose speed at the start is
 *  zero and whose last pixels are its fastest, so the grid creeps away from
 *  where it was let go and arrives with a snap rather than easing off like a
 *  scroll. It is never in the way: any press, wheel, touch or key cancels it
 *  outright, because a grid that fights the hand still on it would be worse than
 *  one that never tidied itself at all.
 *
 *  The three numbers were chosen by feel, on a bench of the real grid at the
 *  real size, against the alternatives — a weaker magnet that only acted near a
 *  boundary, and the browser's own `scroll-snap`. The browser's is free and was
 *  refused for a reason worth keeping written down: it only governs scrolls the
 *  browser itself performed, so it would have snapped a trackpad and ignored a
 *  mouse drag, and the feel would have depended on the device.
 */
const PULL_WAIT = 60, PULL_TIME = 300, PULL_CURVE = 4;
let pullRaf = 0, pullTimer = 0, pulling = false, panning = false, touching = false;
/** Until when a press of Now is still on its way home.
 *
 *  The scroll it starts is a smooth one, and a render landing while it travels
 *  would put the reader back wherever the animation had got to — the panel
 *  rebuilds on every poll and restores the scroll it found, which is the right
 *  thing to do for every scroll except this one. Inside this window a render
 *  aims at today instead of at whatever it measured. */
let homingUntil = 0;
/** Whether the strip was last moved by a finger.
 *
 *  A swipe is the one gesture that already ends by itself: the browser's own
 *  momentum carries it and comes to rest where the thumb aimed. Pulling after
 *  that is a second movement for one gesture — the grid goes still, then goes
 *  again — which is the difference between a magnet and a twitch, and it is
 *  only ever felt on touch. A drag or a wheel has no momentum of its own, so
 *  there the pull is the end of the same motion rather than a new one.
 *
 *  By what moved it, not by how wide the screen is: a phone with a keyboard and
 *  a tablet with a mouse both exist, and each gesture should behave the way that
 *  gesture behaves everywhere else. */
let touchDriven = false;
/** Whether the reader has moved the strip themselves. The difference between
 *  sitting at the first column because that is where it opened and sitting
 *  there because they scrolled back to it — only the second is a request for
 *  more of the past. */
let userMoved = false;

function stopPull() { cancelAnimationFrame(pullRaf); pulling = false; }

function pullToDay() {
  if (!gridEl || panning || touching || touchDriven) return;
  const w = colWidth();
  const from = gridEl.scrollLeft;
  const target = Math.max(0, Math.min(Math.round(from / w) * w,
    gridEl.scrollWidth - gridEl.clientWidth));
  const dist = target - from;
  if (Math.abs(dist) < 0.6) return;
  cancelAnimationFrame(pullRaf);
  pulling = true;
  // Ours to animate frame by frame, so the browser must not be smoothing the
  // same property underneath us — see scrollToNow, which turns it back on.
  gridEl.style.scrollBehavior = 'auto';
  const t0 = performance.now();
  const step = at => {
    const t = Math.min(1, (at - t0) / PULL_TIME);
    gridEl.scrollLeft = from + dist * Math.pow(t, PULL_CURVE);
    if (t < 1) pullRaf = requestAnimationFrame(step);
    else pulling = false;
  };
  pullRaf = requestAnimationFrame(step);
}

/** Everything that follows from the strip having moved.
 *
 *  The label is rewritten in place rather than through a render: it changes on
 *  every frame of a scroll, and rebuilding the panel that often would make the
 *  scroll itself stutter. The reads and the stretch are debounced behind the
 *  scroll going quiet, so a long throw asks for the week it lands on rather than
 *  for every week it passed over.
 */
let viewTimer = 0;
function gridScrolled() {
  const label = document.getElementById('wk-label');
  if (label) label.textContent = rangeLabel();
  clearTimeout(viewTimer);
  viewTimer = setTimeout(() => {
    if (!view.code) return;
    // A stretch reads its own new end, so there is nothing left to do here.
    if (stretchRange()) return;
    const code = view.code;
    const missing = weeksInView().filter(w => !weekCache.get(weekKey(code, w)));
    if (!missing.length) return;
    fetchWeeks(code, missing).then(() => {
      if (view.code !== code) return;
      slots = gatherSlots();
      renderWindow();
    });
  }, 140);
}

/** Back to today, wherever the strip has been walked to.
 *
 *  A strip scrolled far enough forward no longer contains today at all: it is
 *  bounded, and [[stretchRange]] drops days off the near end as it adds them to
 *  the far one. So coming back is sometimes a scroll and sometimes rebuilding
 *  the strip around today first — which is why nothing calls scrollToNow for
 *  this on its own.
 */
function backToNow() {
  // The size comes back with the place. Now is the way out of wherever a panel
  // has been taken — a fortnight out, an evening filled, three weeks along — and
  // leaving it at whatever zoom it had would answer half the question.
  //
  // Ahead of the scroll below, which works in the hour the grid is currently
  // drawn at: reset afterwards and it would aim at the old one.
  if (view.zoom !== 1 || view.vzoom !== 1) {
    view.zoom = view.vzoom = view.intent = 1;
    const grid = gridEl && gridEl.querySelector('.wk-grid');
    if (grid) {
      grid.style.setProperty('--zoom', 1);
      grid.style.setProperty('--vzoom', 1);
    }
    refreshScale();
    fitBlocks();
  }
  if (view.from > -1 || view.to < 0) {
    view.from = OPEN_FROM;
    view.to = OPEN_TO;
    showRange();
  }
  homingUntil = Date.now() + 900;
  scrollToNow(true);
}

/** How far the two sides of the grid may be taken.
 *
 *  A day's width sets what a block can say — the floor is a bar of colour, about
 *  eleven days on a phone, and the ceiling is one evening filling the panel. An
 *  hour's height sets how much of a day is on screen at once: at eleven pixels a
 *  whole twenty-four hours is about the height of a phone's grid, which is the
 *  thing zooming out is for, and below that the hour numbers have nowhere to go.
 *
 *  Both are honoured at once — one pinch moves one number, and the tighter of
 *  the two limits is the one that stops it. */
const MIN_COL = 30, MAX_COL = 300, MIN_ROW = 11, MAX_ROW = 90;

/** The real floors, which are not the numbers above.
 *
 *  A pinch should stop when the thing being looked at fills the frame. Zooming
 *  out past that does not show more of anything — a day is already all there —
 *  it only leaves the foot of the grid empty, which on a tall phone is most of
 *  it and reads as the calendar having come apart.
 *
 *  So the floor is whatever it takes to fill the frame, and the fixed numbers
 *  above are only the far end for a frame small enough to want them. Capped at
 *  the size the grid starts at, so that a frame taller than a whole day at rest
 *  — a landscape tablet, say — cannot end up with a pinch that refuses to zoom
 *  out at all, or worse, forces it in.
 */
function rowFloor() {
  const unzoomed = ROW_H / (view.vzoom || 1);
  if (!gridEl) return Math.min(unzoomed, MIN_ROW);
  const rows = gridEl.querySelector('.wk-rows');
  const visible = gridEl.clientHeight - (rows ? rows.offsetTop : 0);
  return Math.min(unzoomed, Math.max(MIN_ROW, visible / 24));
}

function colFloor() {
  const unzoomed = colWidth() / (view.zoom || 1);
  if (!gridEl) return Math.min(unzoomed, MIN_COL);
  const hours = gridEl.querySelector('.wk-hours');
  const visible = gridEl.clientWidth - (hours ? hours.getBoundingClientRect().width : 0);
  return Math.min(unzoomed, Math.max(MIN_COL, visible / gridDays()));
}

/** What a block can afford to say at the width the columns actually are.
 *
 *  Read off a real column rather than off `view.zoom`: a phone's day starts at a
 *  quarter of the screen and a desktop's at 150px, so the same zoom means two
 *  different widths and it is the width that decides whether a name fits.
 */
function fitBlocks() {
  if (!gridEl) return;
  const grid = gridEl.querySelector('.wk-grid');
  if (!grid) return;
  const w = colWidth();
  // An unmeasurable grid is not a narrow one. Without this a panel drawn while
  // it cannot be measured would strip every block back to a bar and stay that
  // way until something else moved.
  if (w < 4) return;
  grid.classList.toggle('z-noacct', w < 70);
  grid.classList.toggle('z-notime', w < 50);
  grid.classList.toggle('z-bars', w < 38);
  // And the same for the hour axis, which the same pinch compresses.
  grid.classList.toggle('z-srv', ROW_H < 20);
  grid.classList.toggle('z-halfhours', ROW_H < 15);
}

/** Pinching the strip: two fingers make a day wider or narrower.
 *
 *  Days only. Hours stay the size they are, because a block's height is worked
 *  out in pixels by us and a column's width is worked out by the browser from
 *  one variable — so this costs a reflow and nothing else, where zooming time
 *  would cost a redraw of every column on every frame of the gesture.
 *
 *  The instant under the fingers stays under the fingers. The midpoint is turned
 *  into a position along the strip before the change and put back after it,
 *  which is what makes the gesture feel like moving a picture around rather than
 *  like the picture being replaced.
 *
 *  Listened for on the document rather than on the grid, and refused there.
 *  `touch-action` was not enough on its own: it governs what an element's own
 *  scrolling does with a gesture, and zooming the page is not that — it belongs
 *  to the browser, which is why the first version zoomed the whole dashboard,
 *  frame and all. Taking it needs the gesture refused before the browser has
 *  claimed it, which means the document, in the capture phase, and not passive.
 *
 *  Refused only when both fingers are inside the grid. Pinching anywhere else on
 *  the panel still zooms the page the way it always did, which is somebody's way
 *  of reading small text and not ours to take away.
 *
 *  Safari fires its own `gesture*` events beside the touches, and those are the
 *  only thing that stops it zooming; Chrome answers to the touches. Both are
 *  handled, and only one of them ever drives the zoom, so a browser that fires
 *  both does not scale twice.
 */
let pinchInstalled = false;
function pinchZoom() {
  if (pinchInstalled) return;
  pinchInstalled = true;

  let from = 0, base = 1, focal = 0, focalHour = 0, screenX = 0, screenY = 0, active = false;

  const gap = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  const mid = t => (t[0].clientX + t[1].clientX) / 2;
  const midY = t => (t[0].clientY + t[1].clientY) / 2;
  const gutter = () => {
    const hours = gridEl && gridEl.querySelector('.wk-hours');
    return hours ? hours.getBoundingClientRect().width : 0;
  };
  /** The day headings are stuck to the top of the same scroller, so the hours
   *  begin that far down the content rather than at nothing. */
  const headHeight = () => {
    const rows = gridEl && gridEl.querySelector('.wk-rows');
    return rows ? rows.offsetTop : 0;
  };
  /** Both fingers on the grid. By where they are rather than by what they
   *  landed on: two fingers land on two different elements, and a pinch that
   *  began on a block is still a pinch on the grid. */
  const onGrid = touches => {
    if (!gridEl) return false;
    const r = gridEl.getBoundingClientRect();
    const inside = t => t.clientX >= r.left && t.clientX <= r.right &&
                        t.clientY >= r.top && t.clientY <= r.bottom;
    return inside(touches[0]) && inside(touches[1]);
  };

  document.addEventListener('touchstart', e => {
    if (e.touches.length !== 2 || !onGrid(e.touches)) return;
    // Nothing to measure against, so nothing to scale: colWidth falls back to a
    // single pixel when the grid has not been laid out, and a zoom worked out
    // against that would be a factor of hundreds.
    if (colWidth() < 4) return;
    stopPull();
    active = true;
    from = gap(e.touches) || 1;
    base = view.intent;
    const box = gridEl.getBoundingClientRect();
    screenX = mid(e.touches) - box.left;
    screenY = midY(e.touches) - box.top;
    // Where between the fingers is, on both axes: a distance along the strip in
    // days and a distance down it in hours. Neither is a pixel, which is what
    // makes them survive the grid changing size.
    focal = (gridEl.scrollLeft + screenX - gutter()) / colWidth();
    focalHour = (gridEl.scrollTop + screenY - headHeight()) / ROW_H;
  }, { capture: true, passive: true });

  document.addEventListener('touchmove', e => {
    if (!active || e.touches.length !== 2) return;
    // Before anything else: whatever happens below, this gesture is not the
    // browser's to zoom the page with.
    e.preventDefault();
    const grid = gridEl && gridEl.querySelector('.wk-grid');
    if (!grid) return;
    // What a column and an hour would each be at zoom 1, so the limits can be
    // written in the units they are actually about.
    const unitCol = colWidth() / view.zoom, unitRow = ROW_H / view.vzoom;
    if (unitCol < 4 || unitRow < 4) return;
    // One gesture, one intent, clamped twice: the fingers say how much, and
    // each side stops where its own frame says it should. Past the point where a
    // whole day fills the grid the hours stay where they are while the days
    // carry on getting narrower — and because both are still readings of the
    // same number, coming back off that floor puts them in step again.
    const lowCol = colFloor() / unitCol, highCol = MAX_COL / unitCol;
    const lowRow = rowFloor() / unitRow, highRow = MAX_ROW / unitRow;
    // Bounded by whichever side still has room, so a long pinch against one
    // limit cannot run the intent off somewhere it takes a second gesture to
    // come back from.
    view.intent = Math.min(Math.max(highCol, highRow),
      Math.max(Math.min(lowCol, lowRow), base * (gap(e.touches) / from)));
    view.zoom = Math.min(highCol, Math.max(lowCol, view.intent));
    view.vzoom = Math.min(highRow, Math.max(lowRow, view.intent));
    grid.style.setProperty('--zoom', view.zoom);
    grid.style.setProperty('--vzoom', view.vzoom);
    // ROW_H is this file's copy of the hour the CSS is now drawing at, and the
    // scroll below is measured in it.
    refreshScale();
    // Put the same day, and the same time of day, back under the same fingers.
    gridEl.scrollLeft = focal * colWidth() + gutter() - screenX;
    gridEl.scrollTop = focalHour * ROW_H + headHeight() - screenY;
    fitBlocks();
    gridScrolled();
  }, { capture: true, passive: false });

  const stop = () => { active = false; };
  document.addEventListener('touchend', stop, { capture: true, passive: true });
  document.addEventListener('touchcancel', stop, { capture: true, passive: true });

  // Safari's own. `gesturestart` is the one that has to be refused — it is what
  // the page zoom actually begins from — and it carries no touch list, so where
  // it happened is read off the event itself.
  const onGridPoint = e => {
    if (!gridEl) return false;
    const r = gridEl.getBoundingClientRect();
    return e.clientX >= r.left && e.clientX <= r.right &&
           e.clientY >= r.top && e.clientY <= r.bottom;
  };
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(ev =>
    document.addEventListener(ev, e => { if (onGridPoint(e)) e.preventDefault(); },
      { capture: true, passive: false }));
}

/** A week's worth of columns, for the arrows — which is what a plain mouse and
 *  a keyboard have, and the distance the panel has always moved by. */
function scrollDays(days) {
  if (!gridEl) return;
  stopPull();
  userMoved = true;
  // An arrow is a deliberate "a week that way" and lands square whatever the
  // scroll was resting on — which on a phone, where nothing else straightens
  // the strip any more, is the only thing that does.
  touchDriven = false;
  // Walking off the front lengthens the strip rather than stopping against it:
  // the arrows are how a mouse with no sideways gesture reaches last week, and
  // clamping at column zero would leave them dead exactly where they are most
  // needed. Forwards needs no such help — the scroll itself reaches the end and
  // stretchRange grows it from there.
  if (gridEl.scrollLeft + days * colWidth() < 0) growBack();
  gridEl.style.scrollBehavior = 'smooth';
  const w = colWidth();
  gridEl.scrollLeft = (Math.round(gridEl.scrollLeft / w) + days) * w;
}

function wireGrid(box) {
  box.addEventListener('click', e => {
    // The hour that was pressed, not the one the click is reported against: a
    // drag takes pointer capture, and a captured pointer's click is delivered to
    // the grid rather than to the cell under it. The press is also the honest
    // answer — it is where the reader aimed.
    const cell = box._downCell || e.target.closest('.wk-cell');
    // A press that turned into a pan is not a click on an hour: the pointer
    // travelled, and whatever it came to rest over is an accident.
    if (cell && !box._panned) pickFromCell(cell, e);
  });
  box.addEventListener('scroll', () => {
    gridScrolled();
    // The pull's own scrolling must not keep putting the pull off.
    if (pulling) return;
    clearTimeout(pullTimer);
    pullTimer = setTimeout(pullToDay, PULL_WAIT);
  }, { passive: true });
  ['pointerdown', 'wheel', 'touchstart', 'keydown'].forEach(ev =>
    box.addEventListener(ev, () => { userMoved = true; stopPull(); }, { passive: true }));
  // Which kind of gesture is moving it. A touch pointerdown arrives before its
  // own touchstart, so the order below settles on the truth either way.
  box.addEventListener('pointerdown', e => { if (e.pointerType !== 'touch') touchDriven = false; }, { passive: true });
  box.addEventListener('wheel', () => { touchDriven = false; }, { passive: true });
  box.addEventListener('keydown', () => { touchDriven = false; }, { passive: true });
  box.addEventListener('touchstart', () => { touching = true; touchDriven = true; }, { passive: true });
  box.addEventListener('touchend', () => { touching = false; }, { passive: true });
  dragPan(box);
  // Installs once, on the document, and finds the current grid for itself — the
  // panel is rebuilt on every poll and document listeners do not come with it.
  pinchZoom();
}

/** Booking the hour that was clicked. Lifted out of the cell it used to be
 *  bound to, so one listener on the grid can serve every cell on the strip. */
function pickFromCell(cell, e) {
  const colStart = Number(cell.parentElement.dataset.start);
  // Measured against the cell itself rather than read off the event, which
  // reports its offset from whatever it was delivered to — see wireGrid.
  const box = cell.getBoundingClientRect();
  const half = e.clientY - box.top > box.height / 2 ? SLOT : 0;
  const picked = new Date(colStart + (Number(cell.dataset.h) * 60 + half) * 60000);
  if (picked.getTime() <= Date.now()) return;    // nothing to book in the past
  view.pick = picked;
  view.answer = null;
  // Whatever block was being read is not what is selected now, so it stops being
  // highlighted and stops answering for the pick. Without this a hunt chosen out
  // of a pile stayed lit while the reader had moved on to an empty evening.
  view.stack = null;
  // A fresh slot is the reader's own again, whatever length the block they were
  // looking at happened to run for.
  ownDuration();
  // A weekly booking defaults to the day it was picked on, read in server time —
  // which is not always the column it was clicked in.
  if (view.repeat === 'week' && view.days.size === 0) {
    view.days.add(DAY_NAMES.indexOf(serverParts(picked).weekday));
  }
  renderWindow();
}

/** Drag the grid about with a plain mouse, both axes, with a throw at the end.
 *
 *  Mouse only. A finger already has this and the browser does it better, so
 *  taking the gesture over would be swapping something good for an imitation.
 *  A press that lands on a block belongs to the block — moving a booking and
 *  moving the grid are different verbs — and a press that becomes a drag
 *  swallows the click it would otherwise end with, so panning never books
 *  anything.
 */
function dragPan(box) {
  let id = null, lastX = 0, lastY = 0, lastT = 0, vx = 0, vy = 0, raf = 0, moved = 0;

  box.addEventListener('pointerdown', e => {
    // Both recorded for every pointer, not only the one that pans: a tap after
    // a drag must not inherit the drag's verdict, and a tap is where it landed.
    box._panned = false;
    box._downCell = e.target.closest('.wk-cell');
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    if (e.target.closest('.wk-block, .stretch, .wk-more')) return;
    id = e.pointerId; panning = true; moved = 0;
    lastX = e.clientX; lastY = e.clientY; lastT = performance.now(); vx = vy = 0;
    cancelAnimationFrame(raf);
    stopPull();
    box.style.scrollBehavior = 'auto';
    box.classList.add('panning');
    try { box.setPointerCapture(id); } catch (err) { /* pan on regardless */ }
  });

  box.addEventListener('pointermove', e => {
    if (e.pointerId !== id) return;
    const at = performance.now(), dt = Math.max(1, at - lastT);
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    box.scrollLeft -= dx;
    box.scrollTop -= dy;
    moved += Math.abs(dx) + Math.abs(dy);
    if (moved > 5) box._panned = true;
    vx = dx / dt; vy = dy / dt;
    lastX = e.clientX; lastY = e.clientY; lastT = at;
    e.preventDefault();
  });

  const up = e => {
    if (e.pointerId !== id) return;
    id = null; panning = false;
    box.classList.remove('panning');
    // The throw. Decays to nothing in about a second, at which point the pull
    // takes over and puts the columns straight.
    let sx = vx * 16, sy = vy * 16;
    const glide = () => {
      sx *= 0.94; sy *= 0.94;
      box.scrollLeft -= sx;
      box.scrollTop -= sy;
      if (Math.abs(sx) > 0.4 || Math.abs(sy) > 0.4) raf = requestAnimationFrame(glide);
    };
    if (Math.abs(sx) > 1.2 || Math.abs(sy) > 1.2) glide();
  };
  box.addEventListener('pointerup', up);
  box.addEventListener('pointercancel', up);
}

function scrollToNow(smooth) {
  if (!gridEl) return;
  const now = new Date();
  gridEl.style.scrollBehavior = smooth ? 'smooth' : 'auto';

  // The headings sit at the top of the same scroller, stuck there, so the height
  // they hold is height the hours are never scrolled into — the third is a third
  // of what is left under them, not of the box.
  const rows = gridEl.querySelector('.wk-rows');
  const headH = rows ? rows.offsetTop : 0;
  const visible = Math.max(0, gridEl.clientHeight - headH);
  // A third down: enough of the morning above for context, most of the evening
  // below, which is where hunts actually are.
  gridEl.scrollTop = Math.max(0, Math.min(
    (localMinutes(now) / 60) * ROW_H - visible / 3, gridEl.scrollHeight - gridEl.clientHeight));

  // Sideways: open on yesterday, so the days in view are the one just gone,
  // today, and the ones anybody is actually planning into. Today's column is at
  // -view.from, the strip being measured in offsets from today; the column
  // before it is where the scroll goes.
  if (gridEl.scrollWidth > gridEl.clientWidth) {
    stopPull();
    gridEl.scrollLeft = Math.max(0, Math.min(
      (-view.from - 1) * colWidth(), gridEl.scrollWidth - gridEl.clientWidth));
  }
}

function wireWindow() {
  const body = document.getElementById('win-body');

  // In the foot rather than the body now, so it is looked up on the document.
  // Painted here rather than while it was being built, because it measures its
  // own zones to place the markers and cannot do that until it is in the page.
  const tank = document.getElementById('tank');
  if (tank) { wireTank(tank); paintTank(tank, view.duration || 0); }

  body.querySelectorAll('[data-seg] button').forEach(btn => btn.addEventListener('click', () => {
    const seg = btn.closest('[data-seg]').dataset.seg;
    const v = btn.dataset.v;
    if (seg === 'repeat') {
      view.repeat = v;
      // Coming back to a weekly booking, start from the day that is picked.
      if (v === 'week' && view.days.size === 0 && view.pick) {
        view.days.add(DAY_NAMES.indexOf(serverParts(view.pick).weekday));
      }
      view.answer = null;
      renderWindow();
    } else if (seg === 'days') {
      const d = Number(v);
      view.days.has(d) ? view.days.delete(d) : view.days.add(d);
      renderWindow();
    } else if (v === '0') {
      backToNow();
    } else {
      // A week at a time, still. The arrows are what a mouse with no sideways
      // gesture has, and a week is the distance the panel has always moved by.
      // The selection is left alone: it used to be cleared on every page, which
      // made sense while paging replaced the grid and makes none now that the
      // days either side are simply further along the same strip.
      scrollDays(Number(v) * 7);
    }
  }));

  const jump = body.querySelector('#jump');
  if (jump) jump.addEventListener('click', backToNow);
}

// ---- Writes ---------------------------------------------------------------

/** What the spawn will look like if this works, applied right now.
 *
 *  A claim takes a round trip — longer when the guild's respawns are run by
 *  another bot and the write is relayed through Redis — and a button that sits
 *  there doing nothing for half a second reads as broken however fast the
 *  server actually is. So the change is drawn immediately and the server's
 *  answer is treated as the correction.
 *
 *  Only what this visitor can work out for certain is guessed at. A claim on a
 *  free spawn is theirs; a claim on a held one puts them in the queue. Anything
 *  the server decides — how long they actually got once stamina and bookings
 *  are taken into account, whether a booking clashed — is left alone and
 *  arrives with the answer.
 */
function optimistically(change) {
  const spawn = openSpawn();
  if (!spawn) return null;
  const before = { ...spawn };
  change(spawn);
  paintCard(spawn);
  renderWindow();
  return before;
}

/** Put back what was guessed, when the guess turns out to be wrong. */
function revert(before) {
  if (!before) return;
  const spawn = openSpawn();
  if (!spawn) return;
  Object.assign(spawn, before);
  paintCard(spawn);
}

async function post(path, payload, guess) {
  view.busy = true;
  const before = guess ? optimistically(guess) : null;
  renderWindow();

  let answer;
  try {
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    answer = await res.json().catch(() => ({ ok: false, message: 'That did not go through.' }));
  } catch (e) {
    answer = { ok: false, message: 'Could not reach the server.' };
  }
  view.busy = false;

  // A refusal means the guess was wrong, so it goes back before the message
  // explaining why — otherwise the page would be showing one thing and saying
  // another.
  if (!answer.ok) revert(before);
  view.answer = answer;
  if (answer.ok) view.pick = null;
  // Whatever was held about this spawn's weeks was read before the write. Even
  // a refusal is worth forgetting over: it usually means the week is not what
  // we thought it was.
  forgetWeeks();
  renderWindow();

  // Re-read either way, and after the message rather than before it: the answer
  // is what the person asked for, and it should not wait on a poll. The read
  // then corrects whatever the guess got approximately right.
  await refresh();
  renderWindow();
}

function doBook() {
  if (!canBook()) return;
  // The mask is in server-time weekdays, which is what the bot reads it as. A
  // weekly booking with nothing ticked would mean "no days at all", so the day
  // the slot lands on server-side is the floor.
  const days = view.repeat === 'week'
    ? (view.days.size ? [...view.days].reduce((mask, d) => mask | (1 << d), 0) : serverDayBit(view.pick))
    : 0;
  post(`/dashboard/g/${GUILD_ID}/book`, {
    code: view.code,
    startsAt: view.pick.toISOString(),
    minutes: view.duration,
    days
  });
}

// All three go through the history entry rather than tearing the card down
// themselves, so a phone's Back is the same action as the ✕ rather than a
// fourth one that has to be kept in step with the other three.
document.getElementById('win-close').addEventListener('click', dismissWindow);
veil.addEventListener('click', dismissWindow);
document.addEventListener('keydown', e => { if (e.key === 'Escape') dismissWindow(); });

/** The server menu. Present only when there is more than one server to switch
 *  to — the markup for it is not drawn otherwise — so everything here is behind
 *  that one check.
 *
 *  The whole menu is server-rendered and its items are ordinary links, so this
 *  only has to open it, shut it, and shut it again on the two things every menu
 *  must answer to: a press somewhere else, and Escape. */
const switcher = document.getElementById('server-switch');
if (switcher) {
  const switchBtn = document.getElementById('server-switch-btn');
  const showMenu = open => {
    switcher.classList.toggle('open', open);
    switchBtn.setAttribute('aria-expanded', String(open));
  };
  switchBtn.addEventListener('click', e => {
    // Or the document listener below would shut it in the same breath.
    e.stopPropagation();
    showMenu(!switcher.classList.contains('open'));
  });
  document.addEventListener('click', () => showMenu(false));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') showMenu(false); });
}

// The tank places its markers and its two figures by measuring itself, so a
// phone turned on its side has to be told to look again.
addEventListener('resize', () => {
  // A resize that crosses one of the --ui-scale steps changes how tall an hour
  // is, and every block already on the grid was placed against the old height.
  // Only then, though: redrawing the week on every frame of a drag across the
  // desktop would throw away a half-made selection for nothing.
  if (refreshScale() && view.code) renderWindow();
  const tank = document.getElementById('tank');
  if (tank) paintTank(tank, view.duration || 0);
  // The watermark's shift is a fraction of what it paints, and what it paints
  // is the window — which a phone turned on its side has just changed. The
  // cards do not need this: their box is 128px whatever the viewport does.
  const watermark = document.getElementById('watermark');
  if (watermark) nudgeArt(watermark);
});

document.getElementById('filter').addEventListener('input', e => {
  filterText = e.target.value;
  renderBoard();
});

/** The spawn a link asked for, opened once there is a board to open it on.
 *
 *  `?spawn=CODE` — what the Dashboard button on a spawn's Book panel in Discord
 *  points at, so pressing it lands on that spawn's card with its week drawn
 *  rather than on the board to go and find it.
 *
 *  Spent on arrival. The parameter is an instruction from the link that was
 *  followed, not a description of where the reader now is, and clearing it
 *  before the card opens is what keeps the history honest: the entry the card
 *  is pushed on top of is already the plain board, so Back lands somewhere that
 *  says what it shows, and a reload comes back to the board exactly as it did
 *  before any of this existed.
 *
 *  Matched without case, because a code is read off a Discord post and typed
 *  back by hand as often as it is clicked. A code that is not in the catalogue —
 *  a spawn removed since the link was posted — quietly leaves the reader on the
 *  board, which is the page they asked for the spawn on.
 */
function openDeepLink() {
  const params = new URLSearchParams(location.search);
  const wanted = params.get('spawn');
  if (!wanted) return;
  params.delete('spawn');
  const rest = params.toString();
  history.replaceState(history.state, '', location.pathname + (rest ? `?${rest}` : '') + location.hash);
  const spawn = board && board.spawns.find(s => s.code.toLowerCase() === wanted.toLowerCase());
  if (spawn) openWindow(spawn.code);
}

setUpModPanel();
refreshScale();
// After the first poll, not beside it: openWindow reads the guild's limits and
// the spawn's own ceiling to decide what length the card opens at, and neither
// is there until the board has landed.
refresh().then(openDeepLink);
// The board keeps up on its own. The open window is left alone while somebody is
// mid-decision: rebuilding the grid under a half-made selection would throw it
// away, and a week of bookings does not change under the reader the way a live
// board does.
setInterval(() => { if (!view.busy && !view.pick) refresh(); }, 10000);
// The progress bars and the time left move between polls, so redraw on a shorter beat
// than the fetch — otherwise a hunt would visibly jump every ten seconds.
setInterval(() => { if (board && !view.code) tick(); }, 1000);
</script>

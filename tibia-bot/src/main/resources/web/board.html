 *  Offered against a predicted block as readily as a written one. To the person
 *  looking at the grid they are the same evening, and which of them has a row
 *  in the database yet is not something a moderator should have to know about.
 *
 *  Hidden for a member, which is convenience rather than the control: both
 *  endpoints re-resolve the tier per request, so a forged one is refused.
 */
/** Where the slot tools have got to, kept out of the DOM.
 *
 *  The foot is rebuilt from scratch on every render, and the board re-renders
 *  every ten seconds whether anything happened or not — so anything held only
 *  in an element is thrown away mid-use. `query` is the name being typed, which
 *  otherwise vanished under the person's fingers on the next poll.
 *
 *  `pick` is the slot all of this is about, so opening the panel on one evening
 *  and clicking another closes it rather than quietly re-aiming a Delete at
 *  somebody who was never on screen when it was opened.
 *
 *  `length` is the number Edit claim is dragging, in minutes, and null when it
 *  is not being dragged. It has to live out here for the same reason `query`
 *  does — the grid is rebuilt from scratch every poll, so a length held only in
 *  the block's own height would be thrown away every ten seconds, mid-drag.
 */
let slotPanel = { open: false, mode: 'idle', pick: null, query: '', typing: false, length: null };

/** Everything a moderator can do here, in one panel in the foot.
 *
 *  ==What it acts on==
 *  Whatever is selected in the grid, and nothing else. Select the live claim and
 *  it offers the claim's actions; select a booking and it offers that booking's;
 *  select nothing and all that is left is the spawn's own ceiling.
 *
 *  That is the whole reason this is one function. It used to be two panels —
 *  one keyed on "is this spawn claimed", one on "which evening did you click" —
 *  which stacked two strips both labelled Moderator and left the claim buttons
 *  standing on any busy spawn next to buttons for a booking three days away.
 *  With one target there is nothing to disambiguate.
 *
 *  The live claim was excluded from selection until now (`state !== 'claimed'`),
 *  which is precisely what forced the claim tools to key off the spawn instead.
 *
 *  ==Shape==
 *  One row in every state it has. Verbs at their own width on the left, the
 *  ceiling anchored right in the space that was going spare; confirming and
 *  handing over reuse the row rather than adding one.
 *
 *  Folded shut, and what is left when it is shut names its target — so it is not
 *  a box you have to open to find out what is in it.
 *
 *  Hidden for a member, which is convenience rather than the control: every
 *  endpoint re-resolves the tier per request, so a forged one is refused.
 */
function moderatorTools(spawn) {
  if (TIER !== 'moderator' && TIER !== 'admin') return null;

  // Any block, including the live claim. The old filter dropped `claimed` here.
  const slot = spawn && view.pick
    ? slots.find(b => b.start.getTime() === view.pick.getTime())
    : null;

  // No block selected is nothing to act on, so there is no panel. It briefly
  // drew one regardless, because the spawn's claim ceiling lived in it and was
  // worth reaching without a selection; that moved to the board's own Moderator
  // panel, and what was left here was a strip with an empty row under it.
  if (!slot) {
    if (slotPanel.pick !== null) {
      slotPanel = { open: slotPanel.open, mode: 'idle', pick: null, query: '', typing: false, length: null };
    }
    return null;
  }

  // Keyed on the instant rather than on `startsAt`, so a selection is identified
  // the same way whether or not the thing selected has a row of its own yet.
  const pickKey = slot.start.getTime();
  // The mode is forgotten as soon as the selection moves — otherwise clicking
  // another block would find a Confirm Delete already armed at somebody who was
  // never on screen when it was armed. Whether the panel is *open* is left
  // alone, since a moderator working through several evenings should not have to
  // reopen it for each, and the strip always names what it is aimed at.
  if (slotPanel.pick !== pickKey) {
    slotPanel = { open: slotPanel.open, mode: 'idle', pick: pickKey, query: '', typing: false, length: null };
  }

  const onClaim = slot.state === 'claimed';
  const box = el('div', 'slot-tools' + (slotPanel.open ? ' open' : ''));

  const strip = el('button', 'slot-strip',
    `<i class="ti ti-shield-half" aria-hidden="true"></i>
     <span class="slot-strip-label">Moderator</span>
     <span class="slot-strip-who">${esc(targetSummary(slot))}</span>
     <i class="ti ti-chevron-${slotPanel.open ? 'up' : 'down'}" aria-hidden="true"></i>`);
  strip.type = 'button';
  strip.setAttribute('aria-expanded', String(slotPanel.open));
  strip.addEventListener('click', () => { slotPanel.open = !slotPanel.open; renderWindow(); });
  box.appendChild(strip);
  if (!slotPanel.open) return box;

  const body = el('div', 'slot-body');
  const row = el('div', 'mod-row');
  body.appendChild(row);
  box.appendChild(body);

  const go = (mode) => { slotPanel.mode = mode; renderWindow(); };

  // --- confirming, and handing over: the row becomes the one thing being done
  if (slotPanel.mode === 'confirm') {
    row.appendChild(button('Confirm delete', 'btn mod-btn armed', () =>
      post(`/dashboard/g/${GUILD_ID}/drop-slot`, { code: spawn.code, startsAt: slot.startsAt })));
    row.appendChild(button('Cancel', 'btn ghost', () => go('idle')));
    // Said before the second press rather than after it: a repeating booking
    // losing one evening and a booking ending outright look identical from here,
    // and only one of them is what anybody means. Inline, so it costs no row.
    row.appendChild(el('span', 'mod-warn', slot.repeats
      ? 'Their booking repeats — only this evening goes.'
      : 'This booking is only on this evening.'));
    return box;
  }

  // --- re-timing: the row becomes the length under the pointer
  if (slotPanel.mode === 'length') {
    const readout = el('span', 'mod-length', esc(lengthReadout(slot.start, slotPanel.length)));
    readout.id = 'mod-length';
    row.appendChild(readout);
    const save = button('Save', 'btn mod-btn', () =>
      post(`/dashboard/g/${GUILD_ID}/edit-slot`,
        { code: spawn.code, startsAt: slot.startsAt, minutes: slotPanel.length }));
    // Nothing to save until the block has actually moved. Pressing it on an
    // untouched block would write the length it already has, which looks like
    // the button doing nothing — and is indistinguishable from it failing.
    if (slotPanel.length === slotMinutes(slot)) {
      save.disabled = true;
      save.title = 'Drag the foot of the block first';
    }
    row.appendChild(save);
    row.appendChild(button('Cancel', 'btn ghost', () => go('idle')));
    row.appendChild(el('span', 'mod-hint', onClaim
      ? 'Drag the foot of the hunt on the grid. It cannot end before now.'
      : 'Drag the foot of the block on the grid.'));
    return box;
  }

  if (slotPanel.mode === 'give') {
    const picker = personField('Search a name, or paste a Discord ID', slotPanel);
    picker.field.classList.add('mod-grow');
    row.appendChild(picker.field);
    row.appendChild(button('Give', 'btn mod-btn', () => {
      const person = picker.chosen();
      if (!person) {
        view.answer = { ok: false, message: 'Pick somebody first, or paste their Discord ID.' };
        renderWindow();
        return;
      }
      // Which endpoint depends on what is selected, not on which button was
      // pressed: moving the hunt somebody is on now and moving one booked
      // evening are different things wearing the same word.
      if (onClaim) post(`/dashboard/g/${GUILD_ID}/reassign`, { code: spawn.code, toUserId: person.id });
      else post(`/dashboard/g/${GUILD_ID}/reassign-slot`,
        { code: spawn.code, startsAt: slot.startsAt, toUserId: person.id });
    }));
    row.appendChild(button('Cancel', 'btn ghost', () => go('idle')));
    // After the row, so the field exists to be focused and the caret goes back
    // where the poll took it from.
    picker.restore();
    return box;
  }

  // --- at rest: the verbs for whatever is selected, then the ceiling
  if (onClaim) {
    const remove = button('Remove claim', 'btn danger', () =>
      post(`/dashboard/g/${GUILD_ID}/force-leave`, { code: spawn.code }));
    remove.title = `Take ${spawn.code} off whoever is holding it`;
    row.appendChild(remove);
    row.appendChild(button('Give to…', 'btn mod-btn', () => go('give')));
    // For a hunt that lost time it should have had — a crash, a server issue.
    // Costs the holder no stamina, which is why it is a moderator's to give.
    const extend = button('+30m', 'btn mod-btn', () =>
      post(`/dashboard/g/${GUILD_ID}/extend-holder`, { code: spawn.code, minutes: 30 }));
    extend.title = 'Add 30 minutes to this hunt — costs them no stamina';
    row.appendChild(extend);
    row.appendChild(editClaimButton(slot, go));
  } else {
    row.appendChild(button('Delete booking', 'btn danger', () => go('confirm')));
    row.appendChild(button('Give to…', 'btn mod-btn', () => go('give')));
    row.appendChild(editClaimButton(slot, go));
  }

  return box;
}

/** Edit claim: hands the block on the grid a foot to drag, and the row a
 *  readout of what is being dragged.
 *
 *  A mode rather than a drag that is always live, because the alternative is a
 *  handle sitting on every block a moderator selects — and a stray pointer on
 *  the way to Delete would then be quietly re-timing somebody's evening. Two
 *  presses to change a length is the right price for never changing one by
 *  accident.
 *
 *  The length starts where the block already is, so opening the mode changes
 *  nothing and Save has nothing to write until the block has moved.
 */
function editClaimButton(slot, go) {
  const edit = button('Edit claim', 'btn mod-btn', () => {
    slotPanel.length = slotMinutes(slot);
    go('length');
  });
  edit.title = slot.state === 'claimed'
    ? 'Change how long this hunt runs — costs them no stamina'
    : 'Change how long this booking runs';
  return edit;
}

/** How long a block runs now, in whole minutes. Off its two instants rather
 *  than off a duration field, because a predicted day has no row to carry one
 *  and the grid has already worked both ends out to draw it. */
const slotMinutes = slot => Math.round((slot.end.getTime() - slot.start.getTime()) / 60000);

/** The window a length would make, as the row says it: the clock at both ends,
 *  then the length itself. Both, because a moderator dragging a foot is
 *  answering "until when" and "for how long" at the same time and which of the
 *  two they are thinking in varies. */
const lengthReadout = (start, minutes) =>
  `${fmtLocal(start)}–${fmtLocal(new Date(start.getTime() + minutes * 60000))} · ${fmtDur(minutes)}`;

/** Whether the panel is re-timing this block right now.
 *
 *  Folding the panel away counts as not: the Save the drag is feeding goes with
 *  it, and a handle still on the grid under a shut strip would be a length
 *  nobody could commit. */
const resizing = slot =>
  slotPanel.open && slotPanel.mode === 'length' && slotPanel.length != null &&
  slotPanel.pick === slot.start.getTime();

/** Where a block ends on screen — the length being dragged while it is being
 *  dragged, and the booking's own end the rest of the time. Everything that
 *  draws a block goes through this, so a window dragged past local midnight is
 *  clipped into the next column exactly as a booked one is. */
const shownEnd = slot => resizing(slot) ? new Date(slot.start.getTime() + slotPanel.length * 60000) : slot.end;

/** The shortest a block may be dragged to.
 *
 *  A hunt in progress cannot be dragged above the now line: those minutes are
 *  spent whatever anybody now says, and the server refuses it. Dragging one
 *  down to exactly now ends it at the next sweep, which is as near to stopping
 *  it as this tool goes — Remove claim is what ends a hunt outright, with the
 *  queue behind it served properly. */
function lengthFloor(slot) {
  if (slot.state !== 'claimed') return SLOT;
  const elapsed = (Date.now() - slot.start.getTime()) / 60000;
  return Math.max(SLOT, Math.ceil(elapsed / SLOT) * SLOT);
}

/** Drag the foot of a booked or hunted block to re-time it.
 *
 *  A near twin of [[stretchHandle]], and deliberately not the same function:
 *  that one owns `view.duration`, which is the length of a booking nobody has
 *  made yet, and this one owns a proposal about a block that already exists.
 *  Folding them together would mean a handle that has to ask which of the two
 *  it is on before every frame.
 *
 *  Snapped to half hours, resized directly rather than through a re-render, and
 *  settled with one render at the end — all three for the reasons the other one
 *  gives. The row's readout follows the pointer too, since it is the number
 *  Save will actually write.
 */
function lengthHandle(block, slot) {
  const handle = el('div', 'stretch');
  handle.title = 'Drag to change how long this runs';
  const floor = lengthFloor(slot);
  let preview = slotPanel.length;

  handle.addEventListener('pointerdown', down => {
    if (down.button > 0) return;
    down.preventDefault();
    // The block underneath answers a click by selecting itself, which is where
    // it already is — but a press that reached it would also cancel the drag.
    down.stopPropagation();
    try { handle.setPointerCapture(down.pointerId); } catch (e) { /* drag on regardless */ }
    const fromY = down.clientY;
    const fromLength = slotPanel.length;
    const label = block.querySelector('.tm');
    const readout = document.getElementById('mod-length');

    const move = ev => {
      const minutes = fromLength + ((ev.clientY - fromY) / ROW_H) * 60;
      const next = Math.max(floor, Math.min(MOD_MAX, Math.round(minutes / SLOT) * SLOT));
      if (next === preview) return;
      preview = next;
      block.style.height = Math.max(13, (next / 60) * ROW_H - 2) + 'px';
      if (label) label.textContent = `${fmtLocal(slot.start)}–${fmtLocal(new Date(slot.start.getTime() + next * 60000))}`;
      if (readout) readout.textContent = lengthReadout(slot.start, next);
    };
    const up = () => {
      handle.removeEventListener('pointermove', move);
      handle.removeEventListener('pointerup', up);
      handle.removeEventListener('pointercancel', up);
      if (preview === slotPanel.length) return;
      slotPanel.length = preview;
      renderWindow();
    };
    handle.addEventListener('pointermove', move);
    handle.addEventListener('pointerup', up);
    handle.addEventListener('pointercancel', up);
  });
  return handle;
}

/** What the shut strip names — which is always the selection, since without one
 *  there is no panel. Said on the strip so it is not a box you have to open to
 *  find out whose evening it is aimed at. */
function targetSummary(slot) {
  const day = slot.start.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' });
  const when = slot.state === 'claimed' ? 'now' : day;
  return `${whoHas(slot)} · ${when}, ${fmtLocal(slot.start)}–${fmtLocal(slot.end)}`;
}

/** Whose evening it is, for a line that has to name somebody in a few words.
 *  The character is what the block is labelled with, so it leads; the account is
 *  what a moderator would go and look for. */
function whoHas(slot) {
  const name = (slot.owner || '').trim();
  const account = (slot.nickname || slot.account || '').trim();
  if (!name) return account || 'Somebody';
  return account && account.toLowerCase() !== name.toLowerCase() ? `${name} (${account})` : name;
}

/** The moderator panel above the board: tools that act on the catalogue rather
 *  than on any one claim.
 *
 *  Built once at startup and left in the document, folded shut. It is reference
 *  rather than what anybody came here for, and an open form above the spawn list
 *  would push the list itself off a phone screen.
 *
 *  Removed outright for a member, not merely hidden — there is nothing here they
 *  could use, and leaving the markup in the page would invite the impression
 *  that unhiding it would do something. It would not: `/spawns` re-resolves the
 *  visitor's tier against the live guild on every request, so the control is
 *  there and this is only tidiness.
 */
function setUpModPanel() {
  const panel = document.getElementById('mod-panel');
  if (TIER !== 'moderator' && TIER !== 'admin') { panel.remove(); return; }

  const head = document.getElementById('mod-panel-head');
  const body = document.getElementById('mod-panel-body');
  panel.hidden = false;

  // Two bands, each titled, rather than one column of controls with hairlines
  // between them. The panel does two unrelated jobs — curating the server's
  // codes, and topping up one person's tank — and a rule says "something ends
  // here" without saying what begins. A heading and a ground of its own is what
  // makes a section read as one.
  const spawns = el('div', 'mod-band');
  spawns.innerHTML = `
    <div class="mod-section">
      <span class="mod-section-title">Spawn codes</span>
      <span class="mod-section-hint" id="ms-count"></span>
    </div>
    <div class="mod-form">
      <div class="mod-field">
        <label class="field-label" for="ms-code">Code</label>
        <input id="ms-code" type="text" maxlength="16" placeholder="2104" autocomplete="off" spellcheck="false">
      </div>
      <div class="mod-field">
        <label class="field-label" for="ms-name">Name</label>
        <input id="ms-name" type="text" maxlength="60" placeholder="Moonstone Crater" autocomplete="off">
      </div>
      <div class="mod-field">
        <label class="field-label" for="ms-region">City</label>
        <input id="ms-region" type="text" maxlength="40" placeholder="Thalassara" autocomplete="off">
      </div>
      <div class="mod-field">
        <label class="field-label" for="ms-creature">Creature Name (Image)</label>
        <input id="ms-creature" type="text" maxlength="64" placeholder="Moonstone Excavator" autocomplete="off">
      </div>
    </div>`;
  body.appendChild(spawns);

  const actions = el('div', 'mod-actions');
  const add = button('Add spawn', 'btn mod-btn', () => submit(), 'ti-plus');
  actions.appendChild(add);
  spawns.appendChild(actions);

  // What this server has added, and the only way back out again. Redrawn from
  // the catalogue on every open and after every write, so it never disagrees
  // with the board below it.
  const owned = el('div', 'mod-owned');
  spawns.appendChild(owned);

  // How long a claim on one spawn may run. Here rather than on the spawn's own
  // card for the same reason stamina is: it is configuration rather than
  // something done to a hunt in progress, and from a card there was no way to
  // see which spawns had been singled out without opening all of them.
  const limitsBand = el('div', 'mod-band alt');
  body.appendChild(limitsBand);

  // Handing somebody stamina. Here rather than on a spawn's card, where it used
  // to sit: a tank belongs to a person and not to a respawn, and reaching it
  // through whichever spawn they happened to be holding meant a moderator could
  // only ever top up somebody who was mid-hunt.
  const stamina = el('div', 'mod-band');
  body.appendChild(stamina);

  // One place for whatever the bot said back, whichever tool above said it, and
  // always the last thing in the panel. Answers used to sit beside the button
  // that caused them, which put the reply to adding a spawn in a different part
  // of the panel from the reply to giving stamina — so where to look depended on
  // what had just been pressed.
  const answer = el('div', 'mod-answer');
  body.appendChild(answer);

  const field = id => document.getElementById(id);
  const inputs = ['ms-code', 'ms-name', 'ms-region', 'ms-creature'].map(field);
  // Enter submits from any field. A four-box form where the only way to send it
  // is to reach for the mouse is a form people fill in wrong twice.
  inputs.forEach(input => input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); submit(); }
  }));

  function say(text, kind) {
    answer.textContent = text;
    answer.className = 'mod-answer' + (kind ? ' ' + kind : '');
  }

  /** The spawns this server added, each with the way to take it back out.
   *
   *  Only ever the custom ones. A seed code has no button because removing one
   *  is refused server-side — it would come back on the next boot — and offering
   *  a button that always fails is worse than offering none.
   *
   *  Two presses, not one. Removal takes the spawn's claims, bookings and forum
   *  post with it, which is not something to hand to a stray click on a list of
   *  small buttons; the second press is the confirmation, and moving away resets
   *  it.
   */
  function drawOwned() {
    owned.innerHTML = '';
    const mine = catalogue
      // Read the way a person reads a code — 101 before 1001, and 411a before
      // 411b — matching how the board image orders them (RespawnCatalogue.sortKey).
      ? [...catalogue.values()].filter(s => s.custom)
          .sort((a, b) => a.code.localeCompare(b.code, undefined, { numeric: true, sensitivity: 'base' }))
      : [];
    // The count belongs to the section, not to the list: it is what the heading
    // is about, and it is still true when the list is empty.
    const counted = document.getElementById('ms-count');
    if (counted) {
      counted.textContent = mine.length
        ? `${mine.length} added here` : 'none added here yet';
    }
    if (!mine.length) return;
    const list = el('div', 'mod-list');
    mine.forEach(spawn => {
      const row = el('div', 'mod-list-row', `<span class="code-chip">${esc(spawn.code)}</span>
        <span class="mod-list-name">${esc(spawn.name)}</span>
        <span class="mod-list-region">${esc(spawn.region || '')}</span>`);
      let armed = false;
      const drop = button('Remove', 'btn mod-btn small danger-hover', () => {
        if (!armed) {
          armed = true;
          drop.textContent = 'Sure?';
          drop.classList.add('armed');
          return;
        }
        remove(spawn.code);
      }, 'ti-trash');
      drop.title = `Remove ${spawn.code} from this server's catalogue`;
      // Anywhere else, and the question is withdrawn. An armed button left
      // sitting on the page is one somebody presses later meaning something else.
      drop.addEventListener('blur', () => {
        if (!armed) return;
        armed = false;
        drop.textContent = 'Remove';
        drop.classList.remove('armed');
      });
      row.appendChild(drop);
      list.appendChild(row);
    });
    owned.appendChild(list);
  }

  async function remove(code) {
    say('Removing…');
    const result = await send(`/dashboard/g/${GUILD_ID}/remove-spawn`, { code });
    say(result.message, result.ok ? 'ok' : 'no');
    if (result.ok) await reread();
  }

  /** One write, with the two failures that are not answers of their own. */
  async function send(path, payload) {
    try {
      const res = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      return await res.json().catch(() => ({ ok: false, message: 'That did not go through.' }));
    } catch (e) {
      return { ok: false, message: 'Could not reach the server.' };
    }
  }

  /** The catalogue has changed, so everything drawn from it is stale: this list,
   *  and the board underneath. `loadCatalogue` bypasses the browser cache, which
   *  `refresh` on its own would not. */
  async function reread() {
    await loadCatalogue().catch(() => {});
    drawOwned();
    drawLimits();
    await refresh();
  }

  // ---- Claim limits -------------------------------------------------------
  // Which spawn the box below is about. Held outside the field because the band
  // is redrawn after every write, and because what was typed and what was
  // *chosen* are different things — see `limitSpawn`.
  let limitPick = null;

  limitsBand.innerHTML = `
    <div class="mod-section">
      <span class="mod-section-title">Claim limits</span>
      <span class="mod-section-hint" id="ml-default"></span>
    </div>
    <div class="mod-form limits">
      <div class="mod-field mod-who">
        <label class="field-label" for="ml-spawn">Spawn</label>
        <input id="ml-spawn" type="text" autocomplete="off" spellcheck="false"
               placeholder="Search a code or a name">
        <div class="mod-suggest" id="ml-suggest" hidden></div>
      </div>
      <div class="mod-field">
        <label class="field-label" for="ml-max">Max claim</label>
        <input id="ml-max" type="text" autocomplete="off" placeholder="2h">
      </div>
    </div>`;

  const mlSpawn = document.getElementById('ml-spawn');
  const mlSuggest = document.getElementById('ml-suggest');
  const mlMax = document.getElementById('ml-max');

  const limitActions = el('div', 'mod-actions');
  const setLimit = button('Set limit', 'btn mod-btn', () => applyLimit(), 'ti-hourglass');
  limitActions.appendChild(setLimit);
  limitsBand.appendChild(limitActions);

  // What has been singled out, and the way back off it — the same shape as the
  // custom-code list above, because it answers the same kind of question.
  const limited = el('div', 'mod-owned');
  limitsBand.appendChild(limited);

  [mlSpawn, mlMax].forEach(input => input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); applyLimit(); }
  }));

  // A code or a name, because a moderator remembers one or the other. Same list
  // and same behaviour as the stamina band's Who — including mousedown rather
  // than click, since the input's blur would otherwise hide the row out from
  // under the pointer.
  mlSpawn.addEventListener('input', () => {
    limitPick = null;
    const text = mlSpawn.value.trim().toLowerCase();
    const hits = !text || !catalogue ? [] : [...catalogue.values()].filter(sp =>
      sp.code.toLowerCase().includes(text) || sp.name.toLowerCase().includes(text)).slice(0, 8);
    mlSuggest.innerHTML = '';
    hits.forEach(sp => {
      const row = el('button', 'mod-suggest-row', `${esc(sp.code)} — ${esc(sp.name)}`);
      row.type = 'button';
      row.addEventListener('mousedown', e => {
        e.preventDefault();
        limitPick = sp;
        mlSpawn.value = `${sp.code} — ${sp.name}`;
        mlSuggest.hidden = true;
        // Pre-filled with what that spawn is on now, so the box says where it is
        // starting from rather than making somebody look it up in the list below.
        mlMax.value = sp.maxMinutes != null ? String(sp.maxMinutes) : '';
        mlMax.focus();
      });
      mlSuggest.appendChild(row);
    });
    mlSuggest.hidden = !hits.length;
  });
  mlSpawn.addEventListener('blur', () => setTimeout(() => (mlSuggest.hidden = true), 120));

  /** The spawn the box is about: the one chosen from the list, or whatever a
   *  typed code matches exactly. Typing `415` and pressing Enter should work
   *  without going through the suggestions. */
  function limitSpawn() {
    if (limitPick) return limitPick;
    const text = mlSpawn.value.trim().toLowerCase();
    if (!text || !catalogue) return null;
    return [...catalogue.values()].find(sp =>
      sp.code.toLowerCase() === text || `${sp.code} — ${sp.name}`.toLowerCase() === text) || null;
  }

  /** Every spawn with a ceiling of its own, in the order the board reads them. */
  function drawLimits() {
    const l = board && board.limits;
    document.getElementById('ml-default').textContent =
      l ? `server default ${fmtDur(l.maxDurationMinutes)}` : '';

    limited.innerHTML = '';
    const rows = !catalogue ? [] : [...catalogue.values()]
      .filter(sp => sp.maxMinutes != null)
      // Sorted the way the list above is, and the board image: 101 before 1001.
      .sort((a, b) => a.code.localeCompare(b.code, undefined, { numeric: true, sensitivity: 'base' }));
    if (!rows.length) return;
    const list = el('div', 'mod-list');
    rows.forEach(sp => {
      const row = el('div', 'mod-list-row');
      row.appendChild(el('span', 'code-chip', esc(sp.code)));
      row.appendChild(el('span', 'mod-list-name', esc(sp.name)));
      row.appendChild(el('span', 'mod-list-max', fmtDur(sp.maxMinutes)));
      const clear = button('Clear', 'btn mod-btn small', () => sendLimit(sp.code, ''));
      clear.title = `Put ${sp.code} back on the server's maximum`;
      row.appendChild(clear);
      list.appendChild(row);
    });
    limited.appendChild(list);
  }

  function applyLimit() {
    const spawn = limitSpawn();
    if (!spawn) { say('Pick a spawn first.', 'no'); mlSpawn.focus(); return; }
    sendLimit(spawn.code, mlMax.value);
  }

  /** One way out for both the form and the Clear buttons, so the reply and the
   *  redraw happen the same way whichever pressed.
   *
   *  Through the panel's own `send` rather than the window's `post`: that one
   *  drives `view.busy` and re-renders the spawn window, which is not what is on
   *  screen here.
   *
   *  The text goes to the server as typed — `ClaimDuration` there is the only
   *  thing that decides what `2h` means, so the page cannot disagree with it. */
  async function sendLimit(code, minutes) {
    setLimit.disabled = true;
    say('Saving…');
    const result = await send(`/dashboard/g/${GUILD_ID}/spawn-max`, { code, minutes });
    setLimit.disabled = false;
    say(result.message, result.ok ? 'ok' : 'no');
    if (result.ok) {
      limitPick = null;
      mlSpawn.value = '';
      mlMax.value = '';
      await reread();
    }
  }

  // ---- Stamina ------------------------------------------------------------
  // The list of people lives at module scope and is read once the panel is
  // opened rather than at page load — most visits never open it — see
  // `loadPeople`.
  let picked = null;

  /** The amounts worth offering, and the whole of what may be given.
   *
   *  A moderator gives stamina to replace what somebody lost, so the figure is a
   *  hunt's worth or a fraction of one rather than an arbitrary number of
   *  minutes. That makes it a short known list, and a slider is the wrong
   *  instrument for a short known list — it asks somebody to aim at a value they
   *  could have named. These are pressed once, land exactly, work under a thumb,
   *  and can be read back afterwards without interpreting where a handle sits.
   */
  const STAMINA_STEPS = [15, 30, 60, 120, 240];
  let staminaMinutes = 30;

  function drawStamina() {
    stamina.innerHTML = `
      <div class="mod-section">
        <span class="mod-section-title">Stamina</span>
        <span class="mod-section-hint">resets at server save</span>
      </div>
      <div class="mod-give">
        <div class="mod-field mod-who">
          <label class="field-label" for="ms-who">Who</label>
          <input id="ms-who" type="text" autocomplete="off" spellcheck="false"
                 placeholder="Search a name, or paste a Discord ID">
          <div class="mod-suggest" id="ms-suggest" hidden></div>
        </div>
        <div class="mod-field">
          <span class="field-label">How much</span>
          <div class="seg" id="ms-amount" role="group" aria-label="How much stamina">
            ${STAMINA_STEPS.map(m =>
              `<button type="button" data-minutes="${m}" aria-pressed="${m === staminaMinutes}">${fmtDur(m)}</button>`
            ).join('')}
          </div>
        </div>
      </div>
      `;

    const who = document.getElementById('ms-who');
    const suggest = document.getElementById('ms-suggest');
    const amount = document.getElementById('ms-amount');
    amount.addEventListener('click', e => {
      const hit = e.target.closest('button');
      if (!hit) return;
      staminaMinutes = Number(hit.dataset.minutes);
      amount.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === hit)));
    });

    const give = button('Give stamina', 'btn mod-btn', () => grant(1), 'ti-battery-charging');
    const take = button('Remove stamina', 'btn mod-btn small', () => grant(-1), 'ti-battery-off');
    const row = el('div', 'mod-actions');
    row.appendChild(give);
    row.appendChild(take);
    stamina.appendChild(row);

    function choose(person) {
      picked = person;
      who.value = personLabel(person);
      suggest.hidden = true;
    }

    // A pasted Discord id is a person too. Nobody knows their own snowflake, but
    // a moderator copying one out of Discord does — and it is the only way to
    // reach somebody who has never used the system here and so is in no list.
    function typed() {
      const text = who.value.trim();
      if (/^\d{15,25}$/.test(text)) return { id: text, name: text, nickname: '' };
      return picked && personLabel(picked) === text ? picked : null;
    }

    who.addEventListener('input', () => {
      picked = null;
      const text = who.value.trim().toLowerCase();
      const matches = !text ? [] : (people || []).filter(p =>
        p.name.toLowerCase().includes(text) || p.nickname.toLowerCase().includes(text)).slice(0, 8);
      suggest.innerHTML = '';
      matches.forEach(person => {
        const hit = el('button', 'mod-suggest-row', esc(personLabel(person)));
        hit.type = 'button';
        // mousedown, not click: the input's blur fires first and would hide the
        // list out from under the pointer before the click ever landed.
        hit.addEventListener('mousedown', e => { e.preventDefault(); choose(person); });
        suggest.appendChild(hit);
      });
      suggest.hidden = !matches.length;
    });
    who.addEventListener('blur', () => setTimeout(() => (suggest.hidden = true), 120));

    async function grant(sign) {
      const person = typed();
      if (!person) { say('Pick somebody first, or paste their Discord ID.', 'no'); return; }
      give.disabled = take.disabled = true;
      say(sign > 0 ? 'Giving…' : 'Taking back…');
      const result = await send(`/dashboard/g/${GUILD_ID}/grant-stamina`,
        { userId: person.id, minutes: sign * staminaMinutes });
      give.disabled = take.disabled = false;
      say(result.message, result.ok ? 'ok' : 'no');
      // Their tank may be the reader's own, and it feeds the length control on
      // every spawn — so the board is re-read rather than left saying what it
      // said before.
      if (result.ok) await refresh();
    }
  }

  async function submit() {
    const payload = {
      code: field('ms-code').value.trim(),
      name: field('ms-name').value.trim(),
      region: field('ms-region').value.trim(),
      creature: field('ms-creature').value.trim()
    };
    // Checked here only to save a round trip on the obvious case; the server
    // decides for real, and says so in its own words.
    if (!payload.code || !payload.name) { say('A spawn needs a code and a name.', 'no'); return; }

    add.disabled = true;
    say('Adding…');
    const result = await send(`/dashboard/g/${GUILD_ID}/spawns`, payload);
    add.disabled = false;
    say(result.message, result.ok ? 'ok' : 'no');

    if (result.ok) {
      // Cleared so the next one can be typed straight in — adding spawns is
      // something done in a run of five, not once.
      inputs.forEach(input => (input.value = ''));
      field('ms-code').focus();
      await reread();
    }
  }

  head.addEventListener('click', () => {
    const open = head.getAttribute('aria-expanded') === 'true';
    head.setAttribute('aria-expanded', String(!open));
    body.hidden = open;
    // Drawn on the way open rather than kept up to date while shut: the list is
    // only ever read here, and the catalogue may well have moved since last time.
    if (!open) {
      drawOwned();
      drawLimits();
      drawStamina();
      loadPeople();
      field('ms-code').focus();
    }
  });
}

/** `icon` is a Tabler class, drawn before the label. Appended as a text node
 *  rather than set through textContent, which would throw the icon away. */
/** How somebody reads in a picker: the account, then what this server calls
 *  them. The same order the bot names people in Discord. */
function personLabel(person) {
  const nick = (person.nickname || '').trim();
  const name = (person.name || '').trim() || person.id;
  return nick && nick.toLowerCase() !== name.toLowerCase() ? `${name} (@${nick})` : name;
}

async function loadPeople() {
  if (people) return;
  try {
    const res = await fetch(`/dashboard/g/${GUILD_ID}/people`, { headers: { 'Accept': 'application/json' } });
    people = res.ok ? (await res.json()).people : [];
  } catch (e) {
    // A picker that cannot be filled still takes a pasted id, so this is a
    // smaller failure than it looks and not worth an error of its own.
    people = [];
  }
}

/** Somebody named by typing, for the calendar's "give this day to".
 *
 *  A search over everybody the system knows, and a pasted Discord id for
 *  anybody it does not — the moderator panel's stamina field takes both for the
 *  same reason, since somebody who has never claimed here is in no list but is
 *  still a person a slot can be handed to.
 *
 *  Returns the field and a `chosen()` that answers null until it names somebody
 *  real, so the caller never has to guess what a half-typed name meant.
 */
function personField(placeholder, memory) {
  // Somewhere outside the DOM to keep what has been typed. The panel this sits
  // in is rebuilt whole on every render, and the board renders every ten
  // seconds on its own — so without this the name being typed disappeared under
  // the fingers of whoever was typing it, roughly once per name.
  const held = memory || { query: '', picked: null, typing: false };
  const field = el('div', 'mod-field mod-who');
  field.innerHTML = `<input type="text" autocomplete="off" spellcheck="false"
      placeholder="${esc(placeholder)}"><div class="mod-suggest" hidden></div>`;
  const input = field.querySelector('input');
  const suggest = field.querySelector('.mod-suggest');
  input.value = held.query || '';

  function choose(person) {
    held.picked = person;
    held.query = personLabel(person);
    input.value = held.query;
    suggest.hidden = true;
  }

  input.addEventListener('focus', () => { held.typing = true; });
  input.addEventListener('input', () => {
    held.picked = null;
    held.query = input.value;
    const text = input.value.trim().toLowerCase();
    const matches = !text ? [] : (people || []).filter(p =>
      p.name.toLowerCase().includes(text) || p.nickname.toLowerCase().includes(text)).slice(0, 8);
    suggest.innerHTML = '';
    matches.forEach(person => {
      const hit = el('button', 'mod-suggest-row', esc(personLabel(person)));
      hit.type = 'button';
      // mousedown, not click: the input's blur fires first and would hide the
      // list out from under the pointer before the click ever landed.
      hit.addEventListener('mousedown', e => { e.preventDefault(); choose(person); });
      suggest.appendChild(hit);
    });
    suggest.hidden = !matches.length;
  });
  input.addEventListener('blur', () => setTimeout(() => (suggest.hidden = true), 120));
  // Filled in the background: the field works without it, and waiting on a read
  // before letting somebody type would make it feel broken.
  loadPeople().then(() => {});

  return {
    field,
    /** Put the cursor back where a re-render took it from. Called once the
     *  field is in the document, since focusing a detached input does nothing. */
    restore() {
      if (!held.typing) return;
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    },
    chosen() {
      const text = input.value.trim();
      // A pasted Discord id is a person too. Nobody knows their own snowflake,
      // but a moderator copying one out of Discord does — and it is the only way
      // to reach somebody who has never used the system here.
      if (/^\d{15,25}$/.test(text)) return { id: text, name: text, nickname: '' };
      return held.picked && personLabel(held.picked) === text ? held.picked : null;
    }
  };
}

function button(label, className, onClick, icon) {
  const b = document.createElement('button');
  b.className = className;
  if (icon) {
    const glyph = document.createElement('i');
    glyph.className = 'ti ' + icon;
    glyph.setAttribute('aria-hidden', 'true');
    b.appendChild(glyph);
  }
  b.appendChild(document.createTextNode(label));
  b.disabled = view.busy;
  b.addEventListener('click', onClick);
  return b;
}

function scrollToNow(smooth) {
  if (!gridEl) return;
  const now = new Date();
  gridEl.style.scrollBehavior = smooth ? 'smooth' : 'auto';

  // The headings sit at the top of the same scroller, stuck there, so the height
  // they hold is height the hours are never scrolled into — the third is a third
  // of what is left under them, not of the box.
  const rows = gridEl.querySelector('.wk-rows');
  const headH = rows ? rows.offsetTop : 0;
  const visible = Math.max(0, gridEl.clientHeight - headH);
  // A third down: enough of the morning above for context, most of the evening
  // below, which is where hunts actually are.
  gridEl.scrollTop = Math.max(0, Math.min(
    (localMinutes(now) / 60) * ROW_H - visible / 3, gridEl.scrollHeight - gridEl.clientHeight));

  // Sideways, where the week is wider than the screen: open on yesterday, so the
  // four days in view are the one just gone, today, and the two anybody is
  // actually planning into. That is column 0 while the window is the current
  // one; the arithmetic is kept because a window the arrows have been walked to
  // has no "today" in it at all, and clamps to its own first day.
  const col = gridEl.querySelector('.wk-col');
  if (col && gridEl.scrollWidth > gridEl.clientWidth) {
    const width = col.getBoundingClientRect().width;
    const today = Math.round((new Date(now).setHours(0, 0, 0, 0) - weekStart().getTime()) / DAY_MS);
    gridEl.scrollLeft = Math.max(0, Math.min(
      (today - 1) * width, gridEl.scrollWidth - gridEl.clientWidth));
  }
}

function wireWindow() {
  const body = document.getElementById('win-body');

  // In the foot rather than the body now, so it is looked up on the document.
  // Painted here rather than while it was being built, because it measures its
  // own zones to place the markers and cannot do that until it is in the page.
  const tank = document.getElementById('tank');
  if (tank) { wireTank(tank); paintTank(tank, view.duration || 0); }

  body.querySelectorAll('[data-seg] button').forEach(btn => btn.addEventListener('click', () => {
    const seg = btn.closest('[data-seg]').dataset.seg;
    const v = btn.dataset.v;
    if (seg === 'repeat') {
      view.repeat = v;
      // Coming back to a weekly booking, start from the day that is picked.
      if (v === 'week' && view.days.size === 0 && view.pick) {
        view.days.add(DAY_NAMES.indexOf(serverParts(view.pick).weekday));
      }
      view.answer = null;
      renderWindow();
    } else if (seg === 'days') {
      const d = Number(v);
      view.days.has(d) ? view.days.delete(d) : view.days.add(d);
      renderWindow();
    } else {
      view.weekOffset = v === '0' ? 0 : view.weekOffset + Number(v);
      view.pick = null;
      showWeek();
    }
  }));

  const jump = body.querySelector('#jump');
  if (jump) jump.addEventListener('click', () => {
    if (view.weekOffset !== 0) {
      view.weekOffset = 0;
      view.pick = null;
      showWeek();
    }
    // The grid is on screen either way by now, so the scroll no longer waits on
    // a read to know where to put itself.
    scrollToNow(true);
  });
}

// ---- Writes ---------------------------------------------------------------

/** What the spawn will look like if this works, applied right now.
 *
 *  A claim takes a round trip — longer when the guild's respawns are run by
 *  another bot and the write is relayed through Redis — and a button that sits
 *  there doing nothing for half a second reads as broken however fast the
 *  server actually is. So the change is drawn immediately and the server's
 *  answer is treated as the correction.
 *
 *  Only what this visitor can work out for certain is guessed at. A claim on a
 *  free spawn is theirs; a claim on a held one puts them in the queue. Anything
 *  the server decides — how long they actually got once stamina and bookings
 *  are taken into account, whether a booking clashed — is left alone and
 *  arrives with the answer.
 */
function optimistically(change) {
  const spawn = openSpawn();
  if (!spawn) return null;
  const before = { ...spawn };
  change(spawn);
  paintCard(spawn);
  renderWindow();
  return before;
}

/** Put back what was guessed, when the guess turns out to be wrong. */
function revert(before) {
  if (!before) return;
  const spawn = openSpawn();
  if (!spawn) return;
  Object.assign(spawn, before);
  paintCard(spawn);
}

async function post(path, payload, guess) {
  view.busy = true;
  const before = guess ? optimistically(guess) : null;
  renderWindow();

  let answer;
  try {
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    answer = await res.json().catch(() => ({ ok: false, message: 'That did not go through.' }));
  } catch (e) {
    answer = { ok: false, message: 'Could not reach the server.' };
  }
  view.busy = false;

  // A refusal means the guess was wrong, so it goes back before the message
  // explaining why — otherwise the page would be showing one thing and saying
  // another.
  if (!answer.ok) revert(before);
  view.answer = answer;
  if (answer.ok) view.pick = null;
  // Whatever was held about this spawn's weeks was read before the write. Even
  // a refusal is worth forgetting over: it usually means the week is not what
  // we thought it was.
  forgetWeeks();
  renderWindow();

  // Re-read either way, and after the message rather than before it: the answer
  // is what the person asked for, and it should not wait on a poll. The read
  // then corrects whatever the guess got approximately right.
  await refresh();
  renderWindow();
}

function doBook() {
  if (!canBook()) return;
  // The mask is in server-time weekdays, which is what the bot reads it as. A
  // weekly booking with nothing ticked would mean "no days at all", so the day
  // the slot lands on server-side is the floor.
  const days = view.repeat === 'week'
    ? (view.days.size ? [...view.days].reduce((mask, d) => mask | (1 << d), 0) : serverDayBit(view.pick))
    : 0;
  post(`/dashboard/g/${GUILD_ID}/book`, {
    code: view.code,
    startsAt: view.pick.toISOString(),
    minutes: view.duration,
    days
  });
}

// All three go through the history entry rather than tearing the card down
// themselves, so a phone's Back is the same action as the ✕ rather than a
// fourth one that has to be kept in step with the other three.
document.getElementById('win-close').addEventListener('click', dismissWindow);
veil.addEventListener('click', dismissWindow);
document.addEventListener('keydown', e => { if (e.key === 'Escape') dismissWindow(); });

/** The server menu. Present only when there is more than one server to switch
 *  to — the markup for it is not drawn otherwise — so everything here is behind
 *  that one check.
 *
 *  The whole menu is server-rendered and its items are ordinary links, so this
 *  only has to open it, shut it, and shut it again on the two things every menu
 *  must answer to: a press somewhere else, and Escape. */
const switcher = document.getElementById('server-switch');
if (switcher) {
  const switchBtn = document.getElementById('server-switch-btn');
  const showMenu = open => {
    switcher.classList.toggle('open', open);
    switchBtn.setAttribute('aria-expanded', String(open));
  };
  switchBtn.addEventListener('click', e => {
    // Or the document listener below would shut it in the same breath.
    e.stopPropagation();
    showMenu(!switcher.classList.contains('open'));
  });
  document.addEventListener('click', () => showMenu(false));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') showMenu(false); });
}

// The tank places its markers and its two figures by measuring itself, so a
// phone turned on its side has to be told to look again.
addEventListener('resize', () => {
  const tank = document.getElementById('tank');
  if (tank) paintTank(tank, view.duration || 0);
});

document.getElementById('filter').addEventListener('input', e => {
  filterText = e.target.value;
  renderBoard();
});

setUpModPanel();
refresh();
// The board keeps up on its own. The open window is left alone while somebody is
// mid-decision: rebuilding the grid under a half-made selection would throw it
// away, and a week of bookings does not change under the reader the way a live
// board does.
setInterval(() => { if (!view.busy && !view.pick) refresh(); }, 10000);
// The progress bars and "m left" move between polls, so redraw on a shorter beat
// than the fetch — otherwise a hunt would visibly jump every ten seconds.
setInterval(() => { if (board && !view.code) tick(); }, 1000);
</script>

       simply stop holding it at arm's length. Between them they are worth about
       a fifth of the panel, which the grid takes. */
    .win-head { padding: 7px 12px 6px; }
    .strip { padding: 6px 12px; }
    .readout { padding: 6px 12px; gap: 10px; }
    .foot-msg { padding: 5px 12px; }
    .up-head { padding: 6px 12px; }
    .up-list { padding: 4px 12px 6px; max-height: 168px; }
    .cal-legend { display: none; }

    /* "Book a time", which on a phone is a heading over a row of controls that
       already say what they are for. The count it carried goes with it — see
       the note where it is built. */
    .cal-head { display: none; }

    /* The day and its number on one line. Two lines of heading over four
       columns is a row of the grid spent saying what the row below already
       shows. */
    .wk-head { padding: 3px 0 2px; letter-spacing: 0.06em; }
    .wk-head .dnum { display: inline; margin: 0 0 0 4px; font-size: calc(11.5px * var(--ui-scale)); }

    /* ---- Four days, not seven -------------------------------------------
       A seventh of a phone is about forty pixels, which is not enough to say
       who has a slot or when it runs — every block was an ellipsis. So the
       columns are given a width worth reading and the week slides sideways for
       the rest of itself, opened on yesterday so today and the two days worth
       planning are already in view. The hour gutter and the day headings stay
       put while it does, which is what the sticky rules above are for. */
    .wk-grid {
      /* Sized to what it holds, which is less than it looks: the widest thing
         in the gutter is the server echo at 22px and the twelve-hour label is
         21px behind it, so forty-four pixels carried fifteen of empty space to
         the left of every label. Both still say everything they said. */
      --gutter: 30px;
      /* The four that fit: the body's own width (the window, less its margins)
         less the gutter, split four ways. */
      --daycol: calc((100vw - 6px - var(--gutter)) / 4 * var(--zoom));
    }
    /* Every pixel of a narrow column goes to the label, so a whole time fits on
       one line and the name has somewhere to be above it. The size follows the
       screen, because a quarter of a 320px phone is not a quarter of a 430px one
       and "19:00–21:00" has to survive both — clamped at the top so a big phone
       gets the desktop size rather than an inflated one. */
    .wk-block { padding: 2px 4px; font-size: clamp(8px, 2.4vw, 9.5px); }
    /* The label sits closer to its own edge, the gutter having no room to spare. */
    .wk-hour { padding-right: 5px; }

    /* ---- Booking controls, on one row -----------------------------------
       Stacked and centred, these took four rows of a short screen. "Book" goes,
       because the heading immediately above says it; Now keeps its crosshair and
       drops its word. What is left is two objects that fit inside 320px with
       room to spare, so the row cannot wrap and never has to be centred twice.
       The weekday mask is still a row of its own — seven targets need the
       width. */
    .cal-controls { justify-content: center; gap: 8px; flex-wrap: wrap; }
    .cc-week { margin-left: 0; gap: 8px; }
    .cc-repeat .field-label { display: none; }
    .cc-week .btn span { display: none; }
    .cc-week .btn { padding: 5px 8px; }
    /* Last here, whatever the source order. The mask sits beside Once/Weekly on
       a wide panel, which is the pair it belongs to — but it takes a whole row
       of a phone, and a full-width item in the middle of the source would break
       the line there and leave the week nav stranded on a third row. `order`
       puts it back at the end without the desktop having to give up the
       adjacency it was moved for. */
    .cc-days { flex: 1 1 100%; justify-content: center; order: 1; }
    .cc-days .seg { flex: 1; max-width: 320px; }
    .cc-days .seg button { flex: 1; padding: 7px 0; font-size: 12px; }

    /* The tank takes what is left of the foot beside the button it feeds. */
    .foot-dur { flex: 1 1 auto; }
    .foot-dur .tank { width: auto; flex: 1; height: 40px; }
    .tank-in { font-size: 13px; }
    .tank-out { font-size: 11px; }
  }
</style>
</head>
<body>
<main>
  <div class="masthead">
    <div class="brand">
      <img src="/dashboard/images/avatar.png" alt="">
      <span><!--SERVER--><span class="sub" id="sub">loading…</span></span>
    </div>
    <span class="tier tier-<!--TIER-->"><!--TIER--></span>
    <div class="masthead-right">
      <span class="stale-note" id="stale"></span>
      <input class="filter" id="filter" type="search" placeholder="Filter by code, name or creature…" aria-label="Filter spawns by code, name or creature">
    </div>
  </div>

  <!-- Moderator tools that belong to the catalogue rather than to any one spawn.
       Shut until asked for, and above the list because what it does — adding a
       code — changes the list underneath it. Drawn only for a moderator, and
       removed outright otherwise: see modPanel(). -->
  <div class="panel mod-panel" id="mod-panel" hidden>
    <button class="mod-panel-head" id="mod-panel-head" type="button" aria-expanded="false" aria-controls="mod-panel-body">
      <i class="ti ti-shield-half" aria-hidden="true"></i>
      <span class="fold-title">Moderator Tools</span>
      <i class="ti ti-chevron-down fold-chevron" aria-hidden="true"></i>
    </button>
    <div class="mod-panel-body" id="mod-panel-body" hidden></div>
  </div>

  <div class="panel">
    <div class="panel-title">Spawns</div>
    <div class="cards" id="cards"></div>
  </div>
</main>

<div class="veil" id="veil"></div>
<div class="window" id="window" role="dialog" aria-modal="true" aria-labelledby="win-title">
  <img class="watermark" id="watermark" alt="">
  <div class="scrim"></div>
  <div class="win-head">
    <span class="code-chip" id="win-code"></span>
    <span class="win-title" id="win-title"></span>
    <span class="win-region" id="win-region"></span>
    <button class="win-close" id="win-close" aria-label="Close">&times;</button>
  </div>
  <div class="win-body" id="win-body"></div>
  <!-- What the bot said back. Outside the scrolling body on purpose: it is the
       reply to something just pressed, and it belongs in one fixed place at the
       foot of the panel rather than wherever the body's current contents happen
       to push it. -->
  <div class="win-foot" id="win-foot" hidden></div>
</div>

<script>
const GUILD_ID = '<!--GUILD_ID-->';
// Presentation only. Which tools are drawn; never whether they are allowed,
// which every endpoint decides for itself against the live guild.
const TIER = '<!--TIER-->';
// The clock a repeat rule's weekdays and the stamina reset are read in. The page
// cannot guess it, and one that guessed wrong would book the wrong day.
const SERVER_TZ = '<!--SERVER_TZ-->';
const SS_SERVER_HOUR = Number('<!--SERVER_SAVE_HOUR-->');
const PLACEHOLDER = '/dashboard/images/avatar.png';
// The guild's `daily-emoji`, resolved to its CDN image server-side. Empty when
// it is not a custom emoji, in which case Claim goes without a face.
const CLAIM_EMOJI = '<!--CLAIM_EMOJI-->';

const SLOT = 30, DAY_MS = 86400000;

/* How tall an hour is on the week, and the two smallest things drawn on it: the
   least a block may be however short its hunt, and the height one needs before
   a third line of text fits inside it.
 *
 *  These are `let` and not `const` because the window now draws itself larger on
 *  a display with room for it — see --ui-scale — and every block on the grid is
 *  placed by multiplying an hour count by the first of them. A stylesheet that
 *  grew the rows while the script went on believing they were 28px would put
 *  every booking at the wrong height on the right day, which is a worse fault
 *  than the small type this exists to fix. So the scale is read back out of the
 *  CSS rather than restated here, and the ten places that use ROW_H keep reading
 *  the same name and did not have to change.
 */
let ROW_H = 28, MIN_BLOCK_H = 13, ACCT_MIN_H = 40;

/** The window's scale as the stylesheet currently computes it, or 1 if anything
 *  about that reading is not a number — a grid drawn slightly small is a far
 *  better failure than one drawn at NaN pixels. Both properties it reads are
 *  bare literals for this reason: a custom property holding a calc() comes back
 *  from getComputedStyle unevaluated, and parseFloat would make nothing of it.
 *
 *  Returns whether the scale moved, so a resize that crosses a step can redraw
 *  the week and one that does not can leave it alone. */
function refreshScale() {
  const num = (el, name, fallback) => {
    const v = parseFloat(getComputedStyle(el).getPropertyValue(name));
    return v > 0 ? v : fallback;
  };
  const scale = num(windowEl, '--ui-scale', 1);
  const base = num(document.documentElement, '--row-base', 28);
  const was = ROW_H;
  // Times the zoom, because ROW_H is this file's copy of `--row` and the two
  // disagreeing is how a drag would land somewhere other than where it looked.
  ROW_H = base * scale * (view.vzoom || 1);
  MIN_BLOCK_H = 13 * scale;
  ACCT_MIN_H = 40 * scale;
  return ROW_H !== was;
}
// What dragging a selection about snaps to. Finer than SLOT, which is the step a
// hunt's *length* moves in: a quarter of an hour is a start time somebody means,
// and being made to choose between 20:00 and 20:30 for the sake of one number
// governing both is a worse answer than having two.
const DRAG_SNAP = 15;
// The shortest hunt worth starting — RespawnService.MinimumClaimMinutes. Below
// a whole step the tank's remainder is offered exactly as it stands, because
// eighteen minutes is still eighteen minutes of hunting and rounding it away
// would refuse somebody a hunt to keep the numbers tidy.
const MIN_CLAIM = 5;
// The longest a moderator may drag a window out to — RespawnService's
// MaxModeratorSlotMinutes. The guild's own maximum deliberately does not apply
// to a moderator's ruler (see the panel's Edit claim), so this is the only
// ceiling the drag has, and it is a guard against a number that could not be a
// hunt rather than a rule about what anybody may ask for.
const MOD_MAX = 12 * 60;
// How many rows "Up next" shows before it owns up to the rest. Matches
// RespawnDashboardRoute.UpNextRows and RespawnEmbeds.RowsPerList, so the panel
// and the Discord card are the same list rather than two answers to one
// question. The server has already capped what it sends; this is the guard for
// the two lists together.
const UP_NEXT_ROWS = 10;
// Whether to say "tap" or "click", and whether to mention right-clicking at all
// — a phone has no right button, so that sentence would be advice nobody can
// take. Read once: it is a property of the device, not of the moment.
const TOUCH = matchMedia('(hover: none) and (pointer: coarse)').matches;
const DAY_NAMES = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

const pad = n => String(n).padStart(2, '0');
/** An hour of the day as a twelve-hour clock reads it. Midnight and noon are
 *  12, not 0 — "0 AM" is not a time anybody writes. */
const twelveHour = h => `${h % 12 === 0 ? 12 : h % 12}${h < 12 ? 'am' : 'pm'}`;
const fmtLocal = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
/** A time of day on a twelve-hour clock, minutes and all.
 *
 *  For the times somebody reads one at a time and out of context — when their
 *  turn comes, when a booking starts — where "9:30pm" is the way they would say
 *  it out loud. The grid keeps the 24-hour form: a column of times read against
 *  each other wants every one the same width, and am/pm is a suffix that makes
 *  them ragged. Midnight is 12:00am, not 0:00, for the same reason as
 *  [[twelveHour]].
 */
const fmtClock12 = d =>
  `${d.getHours() % 12 === 0 ? 12 : d.getHours() % 12}:${pad(d.getMinutes())}${d.getHours() < 12 ? 'am' : 'pm'}`;
const fmtDur = m =>
  m == null ? '—' : (m % 60 === 0 && m >= 60 ? `${m / 60}h` : m > 60 ? `${Math.floor(m / 60)}h${m % 60}` : `${m}m`);

// Quantised rather than continuous, for the same reason the monitoring
// dashboard's heat ramp is: a spawn should sit at a recognisable level rather
// than a slightly different shade every poll. `drain` desaturates the sprite in
// step, because full-colour art is the one thing on a faded card that still
// shouts.
const FADE = [
  { maxHours: 1,        opacity: 1.00, drain: 0.00 },
  { maxHours: 24,       opacity: 0.88, drain: 0.15 },
  { maxHours: 72,       opacity: 0.68, drain: 0.40 },
  { maxHours: 168,      opacity: 0.50, drain: 0.65 },
  { maxHours: 720,      opacity: 0.34, drain: 0.85 },
  { maxHours: Infinity, opacity: 0.20, drain: 1.00 }
];
/** Total by construction. A spawn nobody has ever claimed has no age at all,
 *  and `Infinity < Infinity` is false — so relying on the last step to match
 *  everything left over silently returned undefined and took the whole render
 *  down with it. The floor is explicit instead. */
function fadeFor(hours) {
  const dormant = FADE[FADE.length - 1];
  if (hours == null || !isFinite(hours)) return dormant;
  return FADE.find(step => hours < step.maxHours) || dormant;
}


/** Rendered in the reader's own zone — every time on the wire is an absolute
 *  instant precisely so this can be done here.
 *
 *  Twelve-hour, like the "Up next" rows: this is the same fact — when the next
 *  booking is due — said on the card instead of in the list, and one page
 *  writing one instant two ways reads as two different times. */
function clockTime(iso) {
  return fmtClock12(new Date(iso));
}

function minutesLeft(endsAt) {
  return Math.max(0, Math.round((new Date(endsAt).getTime() - Date.now()) / 60000));
}

/** What is left of a hunt, in units somebody can act on.
 *
 *  A claim can run for hours, and hours read as minutes stop being a quantity
 *  and become a number to divide: nobody reads 189m as "just over three hours"
 *  without doing the arithmetic, and the whole point of the line is to be
 *  glanced at. Under an hour it stays in plain minutes, which is where the
 *  minute is the unit worth having — the last stretch of a hunt is counted down
 *  in them.
 *
 *  Whole hours drop the minutes rather than printing a zero, as the page's other
 *  durations do. The count itself is unchanged: still rounded to the minute and
 *  floored at zero, so a hunt at the wire reads 0m and never goes negative.
 */
function timeLeft(endsAt) {
  const mins = minutesLeft(endsAt);
  if (mins < 60) return `${mins}m`;
  const hours = Math.floor(mins / 60), rest = mins % 60;
  return rest ? `${hours}hr${rest}m` : `${hours}hr`;
}

/** How far off something is, at the coarseness worth reading at that distance.
 *  Minutes while it is soon enough to wait for, hours through the evening, days
 *  once it is another day's problem — an evening seven days out does not become
 *  more useful for being told it is 168 hours. */
function relTime(at) {
  const mins = Math.round((new Date(at).getTime() - Date.now()) / 60000);
  if (mins <= 0) return 'now';
  if (mins < 60) return `${mins}m`;
  const hours = Math.floor(mins / 60), rest = mins % 60;
  if (hours < 24) return rest ? `${hours}h${pad(rest)}m` : `${hours}h`;
  return `${Math.round(hours / 24)}d`;
}

/** Today, tomorrow, or the weekday — for a list whose whole point is *when*, a
 *  date is a thing to decode where "Tomorrow" is a thing to read. */
function dayLabel(at) {
  const day = new Date(at); day.setHours(0, 0, 0, 0);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = Math.round((day - today) / DAY_MS);
  if (days === 0) return 'Today';
  if (days === 1) return 'Tomorrow';
  const d = new Date(at);
  return `${DAY_NAMES[(d.getDay() + 6) % 7]} ${d.getDate()}`;
}

/** Who a block's owner actually is, under whatever name is on the front of it.
 *
 *  A block is labelled with a Tibia character nine times in ten, and a character
 *  name is no use to somebody who wants to go and ask about the slot — so the
 *  Discord account goes underneath, with the server's own nickname beside it.
 *  Said in that order, and nowhere as a `<@id>` mention: it matches how the bot
 *  names people in Discord (`Names.user`), so the same person reads the same way
 *  in the thread and on the grid.
 *
 *  Everything that would merely repeat the line above is dropped. A block with
 *  no character on it is already labelled with the account, so only the nickname
 *  is left to add; a nickname equal to the account name is not a second fact.
 *  Empty when there is nothing to say — most bookings made before nicknames were
 *  recorded — and the caller then draws no line at all rather than a blank one.
 */
function accountLine(b) {
  const acct = (b.account || '').trim();
  const nick = (b.nickname || '').trim();
  const shown = (b.owner || '').trim().toLowerCase();
  const at = nick && nick.toLowerCase() !== acct.toLowerCase() ? `@${nick}` : '';
  if (!acct || acct.toLowerCase() === shown) return at;
  return at ? `${acct} (${at})` : acct;
}

/** How a card reads its state, and never a crash if it meets one it does not
 *  know. A missing branch here took the whole render down once before, and a
 *  board that has just learnt a new word should degrade to that word rather
 *  than to a blank page. */
function stateHtml(spawn) {
  const text = STATE_TEXT[spawn.state];
  return text ? text(spawn) : spawn.state;
}

/** Somebody as this page names them: the one Discord name they answer to,
 *  written `@name` — the same shape the bot uses on the spawn card in the
 *  thread (`Names.called`), so one person reads the same way in both places.
 *
 *  Which name that is, is the server's choice (`Names.calledPlain`); the `@` is
 *  written here, so a name travels as a name and the punctuation around it
 *  stays the page's business. Nobody to name reads as "someone", which is what
 *  a card says when it has not been told — never a bare `@`.
 */
function called(name) {
  return name ? '@' + name : 'someone';
}

/** Whoever a card is about. A hunt the reader has just started has no name on
 *  it yet — it is on screen for the moment between claiming and the poll that
 *  says who holds it — and "you" is both shorter and truer than their own name
 *  would be there. */
function holderText(spawn) {
  if (!spawn.holder && spawn.mine) return 'you';
  return called(spawn.holder);
}

/** The same name, set apart from the sentence around it. Escaped as it is
 *  wrapped, since it is the half of the line that comes off the wire. */
function atName(spawn) {
  return `<b class="at-name">${esc(holderText(spawn))}</b>`;
}

const STATE_TEXT = {
  free: () => 'free',
  claimed: s => `${atName(s)}${s.endsAt ? ` · ${timeLeft(s.endsAt)} left` : ''}`,
  booked: s => `${atName(s)} booked${s.nextAt ? ` · ${clockTime(s.nextAt)}` : ''}`,
  confirmed: s => `${atName(s)} confirmed${s.nextAt ? ` · ${clockTime(s.nextAt)}` : ''}`,
};

// ---- Timezone -------------------------------------------------------------
// The calendar's axis is the reader's own clock, but a repeat rule's weekdays
// and the stamina reset are read on the server's. Rather than hide that, both
// are shown: the hour gutter carries a server echo, and server save is drawn
// where the server's 10:00 actually falls here.
//
// Both formatters are built once and kept. Constructing an Intl.DateTimeFormat
// is among the most expensive ordinary things a page can do, and a single draw
// of the grid asks for around forty readings — twenty-four for the hour gutter's
// echo, two per day to place server save, one per day for a repeat preview. Built
// per call, that alone was a visible part of the pause on changing week.
const tzFormats = new Map();
function tzFormat(tz) {
  let fmt = tzFormats.get(tz);
  if (!fmt) {
    fmt = new Intl.DateTimeFormat('en-US', {
      timeZone: tz, hour12: false, year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
    tzFormats.set(tz, fmt);
  }
  return fmt;
}
function offsetMinutes(date, tz) {
  const parts = tzFormat(tz).formatToParts(date).reduce((acc, p) => (acc[p.type] = p.value, acc), {});
  const asUtc = Date.UTC(parts.year, parts.month - 1, parts.day,
    parts.hour === '24' ? 0 : parts.hour, parts.minute, parts.second);
  return (asUtc - date.getTime()) / 60000;
}
/** A server wall-clock reading -> the instant it names. Resolved twice so a
 *  daylight saving changeover lands on the right side of the jump. */
function serverToInstant(y, mo, d, h, mi) {
  let guess = new Date(Date.UTC(y, mo, d, h, mi));
  for (let i = 0; i < 2; i++) guess = new Date(Date.UTC(y, mo, d, h, mi) - offsetMinutes(guess, SERVER_TZ) * 60000);
  return guess;
}
// Built on first use rather than on load. It is the same formatter either way,
// but a timezone the browser will not accept then takes the calendar down with
// it instead of the whole page — the board itself has no use for this.
let serverFmt = null;
/** Answers held by the minute they describe, which is the finest the reading
 *  distinguishes. The hour gutter asks the same twenty-four questions on every
 *  draw of the same week, so a week paged away from and back to costs nothing
 *  the second time. */
const serverPartsCache = new Map();
function serverParts(date) {
  const key = Math.floor(date.getTime() / 60000);
  const hit = serverPartsCache.get(key);
  if (hit) return hit;
  if (!serverFmt) {
    serverFmt = new Intl.DateTimeFormat('en-US', {
      timeZone: SERVER_TZ, hour12: false, weekday: 'short',
      year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
    });
  }
  const p = serverFmt.formatToParts(date).reduce((acc, x) => (acc[x.type] = x.value, acc), {});
  const answer = { weekday: p.weekday, hour: Number(p.hour === '24' ? 0 : p.hour), minute: Number(p.minute) };
  // Bounded, so a long visit paging through months cannot grow it without
  // limit. A reading thrown away costs one formatter call to get back.
  if (serverPartsCache.size > 2048) serverPartsCache.clear();
  serverPartsCache.set(key, answer);
  return answer;
}
/** The weekday bit the bot would read for this instant — server time, Monday
 *  low. The page never expands a rule itself, but it does have to send the mask
 *  for a weekly booking, and that mask is in the server's terms. */
function serverDayBit(date) {
  return 1 << DAY_NAMES.indexOf(serverParts(date).weekday);
}

// ---- State ----------------------------------------------------------------
let board = null;          // the two halves, stitched: what the spawns are and what is happening
/** code -> the unchanging half of a spawn. Fetched once. */
let catalogue = null;
let filterText = '';
let slots = [];            // the week on screen, as drawn blocks
/** True while the week on screen is one we have never read. Distinct from
 *  "read, and nothing is booked in it": an empty grid means one thing and does
 *  not get to mean the other. */
let weekPending = false;
/** The last read of the week on screen came back empty-handed. Kept apart from
 *  `weekPending` because the two say different things and only one of them is
 *  worth interrupting somebody over. */
let weekError = false;
/** Everybody the guild's respawn system has seen, once anything has asked for
 *  them. Module-scope rather than owned by the moderator panel, because the
 *  calendar's own "give this day to" needs the same list and reading it twice
 *  would be two round trips for one answer. Null until first asked. */
let people = null;

/** `code|weekOffset` -> { slots, at }: weeks already read.
 *
 *  A week of bookings is not a live board. It changes when somebody books
 *  something, which is minutes apart, so holding one for half a minute costs
 *  nothing anybody can see — and paging back to the week you were just looking
 *  at should not go to the server at all. What the cache actually buys is that
 *  the arrows stop waiting on a round trip before they will move.
 */
const weekCache = new Map();
const WEEK_TTL = 30000;
/** Reads in the air, so a click, a prefetch and a poll landing on the same week
 *  make one request between them rather than three. */
const weekInflight = new Map();
/** Keyed on the window's first day rather than on the offset. The offsets slide
 *  a day at midnight — offset 0 is yesterday-onward, whatever "yesterday" now
 *  is — so a key of `code|0` would hand a reader the day before's bookings for
 *  as long as the entry lived. */
const weekKey = (code, offset) => `${code}|${weekStart(offset).getTime()}`;

const view = {
  code: null,              // the spawn whose window is open, or null
  // The strip of days on screen, as offsets from today: -1 is yesterday, which
  // is where it opens. Both ends grow towards whichever one is being scrolled
  // at — see stretchRange — so further ahead is a scroll rather than a page.
  from: -1,
  to: 27,
  // How wide a day is, and how tall an hour is, each as a multiple of the size
  // it would otherwise be. Moved by pinching and by nothing else, and
  // deliberately not remembered: it is a way of looking at one spawn for a
  // moment, not a setting, so every panel opens at the size the screen chose.
  //
  // Two numbers rather than one, because they run out at different points. A
  // single pinch moves both, but a whole day fills the frame long before a
  // fortnight of columns does, and past that the hours have nowhere left to go
  // while the days still have plenty — so tying them together would trade the
  // fortnight view for an empty foot of grid.
  zoom: 1,
  vzoom: 1,
  // What the fingers asked for, before either side's frame had its say. Both of
  // the numbers above are this one clamped, which is what keeps them equal
  // wherever neither limit is binding — so a block holds its shape through the
  // ordinary middle of the range, and the two only part company at a floor,
  // where one axis has run out and the other has not. Coming back off the
  // floor brings them together again, because they are both still this.
  intent: 1,
  duration: null,
  // The length the reader themselves chose, which is not always the one on
  // screen: selecting somebody's booking shows that booking's length, and their
  // own comes back the moment they pick an empty slot again. Without this the
  // borrowed length stuck, and clicking a half-hour booking quietly rewrote
  // what the next hunt they arranged would run for.
  chosen: null,
  repeat: 'once',
  days: new Set(),
  pick: null,
  // Which of a stacked run of blocks the reader chose, when a slot holds more
  // than one. Something other than a time, because a time is exactly what
  // cannot tell them apart: a claim taken, given up, and taken again is two
  // rows over one window, and `pick` alone would leave the readout answering
  // for whichever the array happened to hold first.
  //
  // A slotKey rather than the block itself, so the choice survives the poll
  // that replaces every slot object underneath it.
  stack: null,
  answer: null,
  busy: false,
  // Shut on every open. Deliberately not remembered between spawns: it is
  // reference, and a section that stayed open would take the grid's height on
  // every spawn after the one somebody wanted it on.
  upNextOpen: false
}
;

let gridEl = null;
let scrolledOnce = false;
/** code -> the card element and the pieces of it that change, so painting never
 *  has to search the DOM for them. */
const cardParts = new Map();
/** The order the cards are in, so the list is only rearranged when it really
 *  differs — reordering under somebody mid-click is its own kind of flicker. */
let lastOrder = null;

const limits = () => (board && board.limits) || null;
const step = () => (limits() ? limits().step : SLOT);
/** The longest claim that can actually be made: the shorter of the guild's
 *  ceiling and what is left in the tank, already snapped to the step. */
/** The longest hunt that could start at `when`.
 *
 *  Stamina is an allowance per server-save day, and it is spent when a hunt
 *  *starts*, not when it is arranged — so a slot booked for after the next
 *  server save is paid out of that day's allowance rather than out of what is
 *  left of this one. Measuring a booking against today's remainder made a spent
 *  tank shrink what could be booked for tomorrow, and at nothing left it barred
 *  booking a future day at all: the ceiling reached zero, the length with it,
 *  and Book was refused for a hunt the server would have accepted quite happily.
 *
 *  A day yet to begin is worth the guild's whole allowance, since that is what
 *  the tank refills to — the true figure is unknowable from here anyway, being
 *  whatever they have not spent by the time it comes round.
 */
function capAt(when) {
  const l = limits();
  if (!l) return 0;
  const resets = l.resetsAt ? new Date(l.resetsAt).getTime() : null;
  const ceiling = spawnMax(openSpawn());
  if (when && resets && when.getTime() >= resets) {
    return l.budgetMinutes == null
      ? ceiling
      : Math.max(0, Math.min(ceiling, l.budgetMinutes));
  }
  return claimableOn(openSpawn());
}

/** The ceiling for the hunt currently being arranged: the selected slot if
 *  there is one, otherwise a claim starting now. One length serves both, so it
 *  is measured against whichever the button is about to do. */
const cap = () => capAt(view.pick);
const openSpawn = () => (board && view.code ? board.spawns.find(s => s.code === view.code) : null);

/** The longest a claim on one spawn may run.
 *
 *  `maxMinutes` arrives with the catalogue and is present only on a spawn a
 *  moderator has singled out; everything else follows the server's figure. It
 *  replaces that figure rather than capping it, so a spawn may be worth *more*
 *  than the server's ceiling as well as less — the same rule the bot applies,
 *  and the reason this is not a `Math.min`.
 */
const spawnMax = spawn => {
  const l = limits();
  if (!l) return 0;
  return spawn && spawn.maxMinutes != null ? spawn.maxMinutes : l.maxDurationMinutes;
};

/** What this viewer could actually claim on one spawn right now: that spawn's
 *  ceiling, or what is left in their tank if that is lower.
 *
 *  The same arithmetic the server does in `BoardLimits.claimableMinutes`, except
 *  that the ceiling is the spawn's. `claimableMinutes` off the wire is the
 *  board-wide answer and is still right for every spawn without an override —
 *  which is nearly all of them — but it cannot speak for the ones with.
 */
const claimableOn = spawn => {
  const l = limits();
  if (!l) return 0;
  const ceiling = spawnMax(spawn);
  if (!l.budgetMinutes) return ceiling;
  return Math.max(0, Math.min(ceiling, l.remainingMinutes || 0));
};

function hoursSince(iso) {
  if (!iso) return null;
  return (Date.now() - new Date(iso).getTime()) / 3600000;
}

/** Code, name, or the creature the spawn is known for — the last of those
 *  because people remember what they went there to kill more readily than what
 *  the place is called. The creature arrives with the catalogue and is empty for
 *  the many rows that deliberately have none, which simply never match it.
 *
 *  Every word has to appear somewhere, but they may appear in any order and in
 *  any of the three: "fire library" finds "Secret Library (Fire)", which no
 *  substring of that name does. A single word behaves exactly as a substring
 *  search over the three fields, which is what this used to be. */
function matches(spawn) {
  const q = filterText.trim().toLowerCase();
  if (!q) return true;
  const haystack = `${spawn.code} ${spawn.name} ${spawn.creature || ''}`.toLowerCase();
  return q.split(/\s+/).every(word => haystack.includes(word));
}

function el(tag, className, html) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (html != null) node.innerHTML = html;
  return node;
}

/** Anything that came from Discord — a spawn name, a booking owner — is escaped
 *  before it goes anywhere near innerHTML. */
function esc(s) {
  const node = document.createElement('div');
  node.textContent = s == null ? '' : s;
  return node.innerHTML;
}

/** Shift a sprite so the creature sits where its canvas pretends it does.
 *
 *  Tibia sprites are drawn standing on the bottom of their cell and the cell is
 *  often bigger than the creature, so a 64x64 file can be half empty air above
 *  a Misguided Bully. `object-fit: contain` centres the *canvas*, which centres
 *  the air along with it and leaves the creature sitting low, with its feet cut
 *  off by the bottom of the card. The server measures where the ink actually is
 *  (see SpriteInk) and sends each axis as a fraction of that side of the canvas;
 *  this turns those into the pixels this element is painting at.
 *
 *  In painted pixels rather than a CSS percentage because the two surfaces
 *  showing a sprite paint it at wildly different sizes — a little over natural
 *  size on a card, a dozen times it in the window's watermark — and a percentage
 *  resolves against the element box, which is the same as the painted art on
 *  one of them and not the other.
 *
 *  Reads the figures off the element so that anything redrawing it later — the
 *  resize handler, most of all — needs nothing but the element itself.
 */
function nudgeArt(img) {
  const x = Number(img.dataset.nudgeX || 0), y = Number(img.dataset.nudgeY || 0);
  // The avatar stand-in is not a creature and has no canvas to be off centre
  // in, so a card that fell back to it drops whatever shift it was carrying.
  if ((!x && !y) || img.classList.contains('placeholder')) { img.style.transform = ''; return; }
  const box = img.getBoundingClientRect();
  const w = img.naturalWidth, h = img.naturalHeight;
  if (!w || !h || !box.width || !box.height) return;
  // What `object-fit: contain` actually paints inside the box, which is what
  // the fractions are fractions of. Not the box: the box is square and the art
  // frequently is not.
  const scale = Math.min(box.width / w, box.height / h);
  img.style.transform =
    `translate(${(x * w * scale).toFixed(1)}px, ${(y * h * scale).toFixed(1)}px)`;
}

// ---- The board ------------------------------------------------------------
/** One card, built once. Everything that can change later is written by
 *  paintCard, so this runs once per spawn rather than once per second. */
function cardFor(spawn) {
  const card = el('div', 'card');
  card.dataset.code = spawn.code;

  const img = document.createElement('img');
  img.className = 'sprite' + (spawn.sprite ? '' : ' placeholder');
  img.src = spawn.sprite || PLACEHOLDER;
  img.alt = '';
  img.loading = 'lazy';
  // Applied on load rather than now, because the shift is a fraction of the art
  // and there is no art to take a fraction of until the browser has it. Lazy
  // loading means that is when the card is scrolled to, not when it is built.
  if (spawn.nudgeX) img.dataset.nudgeX = spawn.nudgeX;
  if (spawn.nudgeY) img.dataset.nudgeY = spawn.nudgeY;
  img.addEventListener('load', () => nudgeArt(img));
  // A sprite the cache has not fetched yet 404s; the fetch has just been started
  // by that very request, so a later poll will have it.
  img.addEventListener('error', () => {
    img.src = PLACEHOLDER;
    img.classList.add('placeholder');
  });
  card.appendChild(img);

  const body = el('div', 'card-body', `
    <div class="card-top">
      <span class="code-chip"></span>
      <span class="spawn-name"></span>
    </div>
    <div class="card-state">
      <span class="dot"></span>
      <i class="ti ti-check tick" aria-hidden="true" hidden></i>
      <span class="who"></span>
      <span class="queue"></span>
    </div>
    <div class="card-bar" hidden><span></span></div>`);
  card.appendChild(body);

  // The pieces are held onto rather than looked up again later: painting runs
  // every second across every card, and a querySelector per field per card
  // would put back the cost this whole change exists to remove.
  const parts = {
    card, img,
    chip: body.querySelector('.code-chip'),
    name: body.querySelector('.spawn-name'),
    dot: body.querySelector('.dot'),
    tick: body.querySelector('.tick'),
    who: body.querySelector('.who'),
    queue: body.querySelector('.queue'),
    bar: body.querySelector('.card-bar'),
    fill: body.querySelector('.card-bar span')
  };

  // The only three things that never change while the page is open.
  parts.chip.textContent = spawn.code;
  parts.name.textContent = spawn.name;
  card.title = `${spawn.code} — ${spawn.name}${spawn.region ? ' · ' + spawn.region : ''}`;

  card.addEventListener('click', () => openWindow(spawn.code));
  // The panel takes a moment to build, and the weeks it will want are knowable
  // the instant a finger lands on the card. Asking for them now overlaps the
  // request with the layout instead of following it — and showRange, arriving a
  // moment later, joins the read already in the air rather than starting a
  // second one. Failures are ignored: this is a head start, and showRange asks
  // properly either way.
  card.addEventListener('pointerdown', () => {
    if (view.code === spawn.code) return;
    fetchWeeks(spawn.code, [0, 1]);
  }, { passive: true });
  cardParts.set(spawn.code, parts);
  paintCard(spawn);
  return card;
}

/** Write the changeable parts of a card.
 *
 *  Assigning a string that is already there costs nothing — the browser does no
 *  work and nothing repaints — which is what lets this run every second. The
 *  version this replaces rebuilt all 285 cards once a second, so every image
 *  element was thrown away and made again, and every hover and scroll position
 *  went with them. That was the flicker.
 */
function paintCard(spawn) {
  const p = cardParts.get(spawn.code);
  if (!p) return;
  const hours = hoursSince(spawn.lastActivity);
  const fade = fadeFor(hours);
  const state = spawn.state;

  const opacity = String(fade.opacity);
  if (p.card.style.opacity !== opacity) {
    p.card.style.opacity = opacity;
    p.card.style.setProperty('--drain', fade.drain);
  }
  const edge = `var(--st-${state})`;
  if (p.card.style.getPropertyValue('--edge') !== edge) {
    p.card.style.setProperty('--edge', edge);
  }

  const chipClass = 'code-chip' + (state === 'claimed' ? ' live' : '');
  if (p.chip.className !== chipClass) p.chip.className = chipClass;

  const dotClass = 'dot ' + state;
  if (p.dot.className !== dotClass) p.dot.className = dotClass;
  if (p.tick.hidden !== (state !== 'confirmed')) p.tick.hidden = state !== 'confirmed';

  const whoClass = 'who' + (state === 'free' ? ' free' : '');
  if (p.who.className !== whoClass) p.who.className = whoClass;
  // Guarded, unlike the textContent it replaces. Writing the same string to
  // textContent costs nothing; writing the same markup to innerHTML reparses it,
  // and this runs once a second for every card on the board.
  const whoHtml = stateHtml(spawn);
  if (p.whoHtml !== whoHtml) { p.whoHtml = whoHtml; p.who.innerHTML = whoHtml; }
  p.queue.textContent = spawn.queueLength > 0 ? `+${spawn.queueLength} queued` : '';

  if (state === 'claimed' && spawn.startsAt && spawn.endsAt) {
    const from = new Date(spawn.startsAt).getTime();
    const to = new Date(spawn.endsAt).getTime();
    const done = Math.min(1, Math.max(0, (Date.now() - from) / Math.max(1, to - from)));
    if (p.bar.hidden) p.bar.hidden = false;
    p.fill.style.width = `${(done * 100).toFixed(1)}%`;
  } else if (!p.bar.hidden) {
    p.bar.hidden = true;
  }
}

/** Which spawns are shown, and in what order: the ones being hunted right now
 *  first, soonest to finish at the front, then the ones with a booking due,
 *  soonest to start at the front, then everything else by how recently it was
 *  touched — and a spawn nobody has ever claimed last.
 *
 *  A live hunt is the one thing on the board that is about to change, so the
 *  front of the list is ordered by when it changes. Letting a spawn go drops it
 *  behind everything still held, which is the point: the top of the board is
 *  for what is happening, not for who was last to do something.
 *
 *  The middle tier is what is about to happen, on the same reasoning. It is the
 *  blue cards exactly — booked and confirmed alike — and it is keyed off the
 *  time the card prints rather than off the state word, so the tier a spawn is
 *  in is the tier its face says it is in. A settled booking whose start the
 *  server did not send has nothing to sort by and no time on the card either,
 *  so it drops to recency with the rest.
 *
 *  The last tier is still plain recency, the rule Discord's forum follows for a
 *  post. A booked slot that has not come round yet does not count as activity
 *  — see lastActivityByRespawn, without which a spawn booked for tomorrow
 *  outranked everything until tomorrow. That is still the right rule down here:
 *  the booking now lifts the card by its own tier, and letting it also count as
 *  activity would rank a spawn twice for one fact.
 */
function shownSpawns() {
  const tier = s => (s.state === 'claimed' ? 0 : s.nextAt ? 1 : 2);
  // A held spawn with no window on it — both ends have to be present for the
  // server to send either — has no time left to read, so it sorts to the back
  // of the held group rather than turning the comparison into NaN.
  const ends = s => (s.endsAt ? new Date(s.endsAt).getTime() : Infinity);
  const starts = s => new Date(s.nextAt).getTime();
  const since = s => { const h = hoursSince(s.lastActivity); return h == null ? Infinity : h; };
  return board.spawns.filter(matches).slice().sort((a, b) => {
    const group = tier(a) - tier(b);
    if (group) return group;
    if (tier(a) === 0) return ends(a) - ends(b);
    if (tier(a) === 1) return starts(a) - starts(b);
    return since(a) - since(b);
  });
}

/** Put the cards in the right order, making and removing only what changed.
 *
 *  Order is the one thing that cannot be patched into a card, so it is done by
 *  moving the elements that already exist. They keep their images, and the
 *  browser keeps what it had already decoded.
 */
function layoutBoard() {
  const container = document.getElementById('cards');
  const shown = shownSpawns();
  const order = shown.map(s => s.code).join(',');
  if (order === lastOrder) return;
  lastOrder = order;

  if (!shown.length) {
    cardParts.clear();
    container.innerHTML = `<div class="empty-note">${
      board.spawns.length ? 'No spawns match that filter.' : 'This server has no spawns in its catalogue yet.'
    }</div>`;
    return;
  }
  const first = container.firstElementChild;
  if (first && first.classList.contains('empty-note')) container.innerHTML = '';

  const wanted = new Set(shown.map(s => s.code));
  cardParts.forEach((p, code) => {
    if (!wanted.has(code)) { p.card.remove(); cardParts.delete(code); }
  });

  let previous = null;
  shown.forEach(spawn => {
    const existing = cardParts.get(spawn.code);
    const card = existing ? existing.card : cardFor(spawn);
    const expected = previous ? previous.nextElementSibling : container.firstElementChild;
    if (card !== expected) {
      if (previous) previous.after(card); else container.prepend(card);
    }
    previous = card;
  });
}

function renderBoard() {
  if (!board) return;
  layoutBoard();
  board.spawns.forEach(paintCard);

  // No running tally beside the title any more. It counted what the board was
  // already showing in colour, and on a phone it was a line of small print
  // between the reader and the spawns — which is what they came for.
  //
  // No timezone here any more: every time on the page is already drawn in the
  // reader's own clock, so naming it said nothing, and the line is better spent
  // on which Discord this board belongs to — which the header above now states.
  setText(document.getElementById('sub'), `${board.spawns.length} spawns`);
}

function setText(node, text) {
  if (node && node.textContent !== text) node.textContent = text;
}

/** The once-a-second beat. Only a live hunt moves on its own — its countdown
 *  and its progress bar — so only those cards are touched. Everything else
 *  changes when the poll says it changed, and not before. */
function tick() {
  if (!board) return;
  board.spawns.forEach(spawn => { if (spawn.state === 'claimed') paintCard(spawn); });
}

// ---- Data -----------------------------------------------------------------
/** What the spawns are — names, regions, sprites — which changes only when an
 *  admin edits the catalogue.
 *
 *  Fetched once and kept. It is most of the bytes and almost none of the
 *  change, so sending it on every ten-second poll was the bulk of the traffic
 *  for no information at all. The browser's own cache handles repeat visits;
 *  this only refetches when a spawn turns up that we have never heard of.
 */
async function loadCatalogue() {
  // `reload` rather than a plain fetch: the catalogue is served with a two-minute
  // max-age, which is right for the ordinary case and exactly wrong for the two
  // that get here — a code has just been added, or one has turned up that we
  // have never heard of. Both mean the copy in the browser's cache is the one
  // thing we know to be out of date. The ETag still saves the body when nothing
  // has really changed.
  const res = await fetch(`/dashboard/g/${GUILD_ID}/catalogue`,
    { headers: { 'Accept': 'application/json' }, cache: 'reload' });
  if (!res.ok) throw new Error(res.status === 403 ? 'no longer have access' : 'could not refresh');
  const data = await res.json();
  catalogue = new Map(data.spawns.map(s => [s.code, s]));
}

async function loadBoard() {
  const res = await fetch(`/dashboard/g/${GUILD_ID}/board`, { headers: { 'Accept': 'application/json' } });
  // A session that expired mid-visit lands here; the redirect to login is not
  // something fetch can follow usefully, so say so rather than looping.
  if (!res.ok) throw new Error(res.status === 403 ? 'no longer have access' : 'could not refresh');
  const live = await res.json();

  if (!catalogue) await loadCatalogue();
  // A spawn nobody has told us about means the catalogue moved under us — an
  // admin added one. Refetch once rather than drawing a card with no name.
  if (live.spawns.some(s => !catalogue.has(s.code))) await loadCatalogue();

  // The two halves are stitched back together here, so everything downstream
  // still sees one flat spawn with a name and a state on it.
  board = {
    ...live,
    spawns: live.spawns.map(s => Object.assign({}, catalogue.get(s.code), s))
  };
  if (view.duration == null && limits()) {
    view.duration = Math.max(SLOT, Math.min(limits().defaultDurationMinutes, cap()));
    view.chosen = view.duration;
  }
}

/** Weeks that sit next to each other, gathered so they can be asked for
 *  together. Sorted and deduplicated on the way in, since the callers build
 *  their lists by filtering and a repeated week would split a run in two. */
function runsOf(weeks) {
  const runs = [];
  Array.from(new Set(weeks)).sort((a, b) => a - b).forEach(w => {
    const last = runs[runs.length - 1];
    if (last && w === last[last.length - 1] + 1) last.push(w);
    else runs.push([w]);
  });
  return runs;
}

/** Read these weeks of the open spawn, in as few requests as they can be had in.
 *
 *  A card opens needing two weeks — the one it shows and the one the reader
 *  might scroll to — and asking for them separately was two round trips for one
 *  answer the server assembles from a single snapshot of the guild either way.
 *  Runs of adjacent weeks become one request; a gap between them is a second,
 *  which only arises for somebody who has scrolled past a week they already
 *  hold.
 *
 *  A week already in the air is joined rather than asked for again, so a click,
 *  a prefetch and a poll landing together still make one request between them.
 */
function fetchWeeks(code, weeks) {
  const reads = [], fresh = [];
  weeks.forEach(w => {
    const already = weekInflight.get(weekKey(code, w));
    if (already) reads.push(already); else fresh.push(w);
  });
  runsOf(fresh).forEach(run => reads.push(fetchRun(code, run[0], run[run.length - 1])));
  return Promise.allSettled(reads);
}

/** One request covering weeks `first` through `last`, filed a week at a time.
 *
 *  The window asked for is an absolute range covering the *local* weeks, not the
 *  server ones. A booking near either edge belongs to a different server day
 *  than the column it is drawn in, and asking for the server week would drop it
 *  from the view entirely — silently, which is the worst way for a calendar to
 *  be wrong.
 *
 *  What comes back is split across the weeks it covers before it is stored, so
 *  everything downstream still reads the cache a week at a time and a week
 *  already seen still costs nothing. A hunt crossing a boundary is filed under
 *  both weeks it touches, exactly as two separate reads would have returned it
 *  — [[gatherSlots]] deduplicates.
 */
function fetchRun(code, first, last) {
  const start = weekStart(first);
  const end = new Date(weekStart(last).getTime() + 7 * DAY_MS);
  const url = `/dashboard/g/${GUILD_ID}/slots?code=${encodeURIComponent(code)}`
    + `&from=${encodeURIComponent(start.toISOString())}&to=${encodeURIComponent(end.toISOString())}`;

  const reading = (async () => {
    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!res.ok) throw new Error('could not read that week');
    const data = await res.json();
    const span = data.slots.map(s => ({ ...s, start: new Date(s.startsAt), end: new Date(s.endsAt) }));
    // Bounded, so visiting a lot of spawns cannot grow this without limit. A
    // week thrown away costs the one read that brings it back. The ceiling is
    // generous because the strip is: a panel scrolled a month out is holding
    // nine weeks of one spawn on its own, and a limit set for the days when the
    // grid was a single week would empty the cache every few spawns.
    if (weekCache.size > 200) weekCache.clear();
    const at = Date.now();
    for (let w = first; w <= last; w++) {
      const from = weekStart(w).getTime(), to = from + 7 * DAY_MS;
      weekCache.set(weekKey(code, w),
        { slots: span.filter(b => b.start.getTime() < to && b.end.getTime() > from), at });
    }
    return span;
  })();

  for (let w = first; w <= last; w++) weekInflight.set(weekKey(code, w), reading);
  // Cleared either way: a failed read must not leave a promise nobody can
  // retry sitting in front of every later attempt at those weeks.
  reading.catch(() => {}).then(() => {
    for (let w = first; w <= last; w++) weekInflight.delete(weekKey(code, w));
  });
  return reading;
}

/** Read the week on screen from the server, whatever the cache says. */
async function loadSlots() {
  if (!view.code) { slots = []; return; }
  const code = view.code;
  // Only what is actually on screen. The strip is a month long and the poll runs
  // every ten seconds; re-reading all of it that often would be a month of
  // requests a minute for a panel showing four days.
  await fetchWeeks(code, weeksInView(0));
  // The reader may have moved on while this was in the air. A late answer for a
  // spawn nobody is looking at goes into the cache and no further.
  if (view.code === code) {
    slots = gatherSlots();
    weekPending = false;
    weekError = false;
  }
}

/** Everything read that the strip can currently draw, as one list.
 *
 *  The wire still speaks in weeks — one request per week, cached per week, which
 *  is what makes a week already seen cost nothing — but the grid spans several
 *  of them at once, so what it draws is their union. A hunt running across a
 *  week boundary comes back in both weeks either side of it, hence the dedup:
 *  the same booking twice is two blocks fighting over the same pixels.
 */
/** The bookings the board already told us about, as blocks.
 *
 *  The board's ten-second poll carries the next few bookings on every spawn,
 *  because the "Up next" list under the calendar needs them: who, when, how
 *  long, whether it is yours, whether it has been asked about. Those are the
 *  same blocks the grid draws, and they are in the browser before the panel is
 *  opened — so the grid can be drawn from them at once and corrected when the
 *  week itself lands, instead of opening empty on a request that has not come
 *  back yet.
 *
 *  Not the whole answer, and not pretending to be: it is the next few on one
 *  spawn, with no repeat previews and no history, so the loading thread stays
 *  up until the real week arrives. What it buys is that the first thing the
 *  reader sees is their own bookings rather than an empty grid.
 */
function knownSlots() {
  const spawn = openSpawn();
  if (!spawn) return [];
  const out = [];
  // The hunt in progress, which the card is already showing at the top of the
  // panel — the same block, in the same place, a moment sooner.
  if (spawn.state === 'claimed' && spawn.startsAt && spawn.endsAt) {
    out.push({ owner: spawn.holder || 'someone', account: '', nickname: '',
      mine: !!spawn.mine, start: new Date(spawn.startsAt), end: new Date(spawn.endsAt),
      state: 'claimed', repeats: false, days: 0, predicted: false, provisional: true });
  }
  (spawn.booked || []).forEach(b => {
    const start = new Date(b.startsAt);
    out.push({ owner: b.name, account: '', nickname: '', mine: !!b.mine,
      start, end: new Date(start.getTime() + b.minutes * 60000),
      state: b.asked ? 'asked' : 'booked', repeats: false, days: 0,
      predicted: false, provisional: true });
  });
  return out;
}

/** What names a block across a refetch.
 *
 *  A poll replaces every slot object, so holding on to one by identity loses it
 *  the moment the week is read again — and the reader's choice of which hunt in
 *  a pile they are looking at would reset under them while they read it. These
 *  four fields are what the wire already distinguishes rows by; gatherSlots
 *  dedupes on exactly them.
 */
function slotKey(b) { return `${b.owner}|${b.startsAt}|${b.endsAt}|${b.state}`; }

function gatherSlots() {
  const seen = new Set(), out = [];
  for (let w = weekOf(view.from); w <= weekOf(view.to); w++) {
    const held = weekCache.get(weekKey(view.code, w));
    if (!held) continue;
    held.slots.forEach(b => {
      const key = slotKey(b);
      if (seen.has(key)) return;
      seen.add(key);
      out.push(b);
    });
  }
  // Nothing read yet for any of it. Rather than an empty grid under a loading
  // thread, draw what the board already handed us — see knownSlots.
  return out.length ? out : knownSlots();
}

/** Which weeks the reader can see, padded by `pad` weeks either side.
 *
 *  Before the grid exists there is nothing to measure, so it answers for the
 *  strip's own beginning — which is where it will open. */
function weeksInView(pad = 1) {
  const first = visibleFrom(), last = first + visibleCols() - 1;
  const out = [];
  for (let w = weekOf(first) - pad; w <= weekOf(last) + pad; w++) {
    if (w >= weekOf(view.from) && w <= weekOf(view.to)) out.push(w);
  }
  return out;
}

const colWidth = () => {
  const col = gridEl && gridEl.querySelector('.wk-col');
  const w = col ? col.getBoundingClientRect().width : 0;
  return w || 1;
};
function visibleFrom() {
  if (!gridEl) return view.from;
  return view.from + Math.max(0, Math.round(gridEl.scrollLeft / colWidth()));
}
function visibleCols() {
  if (!gridEl) return 7;
  const gutter = gridEl.querySelector('.wk-hours');
  const g = gutter ? gutter.getBoundingClientRect().width : 0;
  return Math.max(1, Math.round((gridEl.clientWidth - g) / colWidth()));
}

/** Draw the strip as it stands, and read whatever part of it is missing.
 *
 *  The grid is a function of the date and nothing else — its columns, its hour
 *  gutter, where server save falls, whether the now line belongs in it — so it
 *  is drawn immediately from a cached week or from none, and the bookings are
 *  filled in when the read lands. Waiting on a round trip before moving at all
 *  is what made the arrows feel broken: nothing on screen answered the click
 *  until the server had been to the database and back.
 */
function showRange() {
  if (!view.code) return;
  const code = view.code;
  slots = gatherSlots();
  // The week either side of what is on screen as well, so a scroll of one
  // column does not arrive at an empty one. Reading the whole strip up front
  // would be six weeks of requests for a panel opened to check tonight.
  const missing = weeksInView().filter(w => {
    const held = weekCache.get(weekKey(code, w));
    return !held || Date.now() - held.at >= WEEK_TTL;
  });
  // A stale week is left on screen while it is checked, rather than blanked: it
  // is almost certainly still right, and flashing it away to draw it again is a
  // worse answer than being a few seconds behind. Only a week never read at all
  // makes the panel say it is reading.
  weekPending = missing.some(w => !weekCache.get(weekKey(code, w)));
  weekError = false;
  renderWindow();
  if (!missing.length) return;

  fetchWeeks(code, missing).then(answers => {
    if (view.code !== code) return;
    slots = gatherSlots();
    weekPending = false;
    // An empty grid must not be allowed to read as "nothing is booked" when the
    // truth is that we never found out.
    weekError = answers.some(a => a.status === 'rejected');
    renderWindow();
  });
}

/** The strip grows at whichever end is being scrolled towards.
 *
 *  Rather than being two months long from the start: a spawn opened to see
 *  tonight should not pay for sixty columns nobody looks at. Growing forwards
 *  leaves the scroll alone, the content simply being longer to the right;
 *  growing backwards moves every column along by what was added, so the scroll
 *  is moved by the same amount and the reader stays where they were.
 */
function stretchRange() {
  const first = visibleFrom(), last = first + visibleCols() - 1;

  if (last > view.to - 4 && view.to < MAX_AHEAD) {
    view.to = Math.min(MAX_AHEAD, view.to + 14);
    // Columns dropped off the near end are columns that leave the left of the
    // scroll, so the scroll comes back by exactly as many.
    const drop = Math.max(0, gridDays() - MAX_SPAN);
    const keep = gridEl ? gridEl.scrollLeft - drop * colWidth() : 0;
    view.from += drop;
    showRange();
    if (drop && gridEl) { gridEl.style.scrollBehavior = 'auto'; gridEl.scrollLeft = keep; }
    return true;
  }

  // Hard against the front of it, and put there by the reader. The strip opens
  // at its own first column, so without that second condition every spawn
  // opened would immediately grow a fortnight of history nobody asked to see.
  if (userMoved && gridEl && gridEl.scrollLeft <= 2 && view.from > MIN_BEHIND) {
    growBack();
    return true;
  }

  return false;
}

/** Another fortnight in front of the strip, with the scroll moved to match.
 *
 *  Everything shifts along by what was added, so leaving the scroll where it was
 *  would jump the reader a fortnight forward at the moment they asked to go
 *  back. Trimmed at the far end to keep the span bounded — see MAX_SPAN.
 */
function growBack() {
  const grow = Math.min(14, view.from - MIN_BEHIND);
  if (grow <= 0) return;
  view.from -= grow;
  view.to -= Math.max(0, gridDays() - MAX_SPAN);
  const keep = gridEl ? gridEl.scrollLeft + grow * colWidth() : 0;
  showRange();
  if (gridEl) { gridEl.style.scrollBehavior = 'auto'; gridEl.scrollLeft = keep; }
}

/** Everything read about this spawn is now suspect. Called after a write:
 *  a weekly booking lands in every week at once, so throwing away only the week
 *  on screen would leave the neighbours confidently wrong. */
function forgetWeeks() {
  weekCache.clear();
}

async function refresh() {
  try {
    await loadBoard();
    await loadSlots();
    document.getElementById('stale').textContent = '';
  } catch (e) {
    document.getElementById('stale').textContent = e.message || 'offline';
  }
  // Only the one that can be seen. A card open covers the board completely, and
  // painting three hundred spawns behind the veil every ten seconds is work
  // nobody is looking at — the same reason `tick` leaves it alone. closeWindow
  // paints it once on the way out, so what comes back is current rather than as
  // it was when the card was opened.
  if (view.code) renderWindow(); else renderBoard();
}

// ---- The week -------------------------------------------------------------
/** The first column's local midnight.
 *
 *  A unit of reading, not a unit of looking: the grid is one continuous strip
 *  of days and knows nothing about weeks, but the server is asked for them a
 *  week at a time and the cache is keyed by which — so this is what turns a
 *  week number into the dates that go on the request.
 *
 *  Anchored on yesterday rather than on the local Monday, which is also where
 *  the strip opens. A calendar week is the right shape for a month view and the
 *  wrong one for booking a hunt: on a Saturday five of its seven columns are
 *  days that have already happened. Yesterday keeps one day of context — a hunt
 *  that ran past midnight, and the bookings the reader remembers — and gives
 *  everything else to what is still bookable.
 */
function weekStart(offset) {
  return dayAt(offset * 7 - 1);
}

/** Midnight, `off` days from today. The grid's coordinate for everything: which
 *  column is where, which week to read, where the scroll is. */
const dayAt = off => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + off); return d; };
const gridStart = () => dayAt(view.from);
const gridDays = () => view.to - view.from + 1;
/** Which week's read covers a day. Week 0 begins yesterday — see [[weekStart]] —
 *  so the offsets it holds are -1 through 5, and the arithmetic has to shift by
 *  one before it divides. */
const weekOf = off => Math.floor((off + 1) / 7);

/** How far the strip may be walked in either direction, and how much of it may
 *  exist at once.
 *
 *  The span is the important one. Every column costs a run of DOM, and one that
 *  only ever grew would have somebody who had scrolled to Christmas holding two
 *  hundred of them. Days added at the end past this come off the other one, and
 *  the scroll is moved to match so the reader does not see it happen.
 */
const MAX_AHEAD = 180, MIN_BEHIND = -60, MAX_SPAN = 63;

/** How much strip a card opens with.
 *
 *  A fortnight, not a month. The panel opens showing about a week and grows at
 *  whichever end is scrolled towards — see stretchRange — so the columns past
 *  the first fortnight were seven hundred cells built for a reader who, more
 *  often than not, opened the card to look at tonight. What it costs when they
 *  do scroll is one stretch, which is already the ordinary way along the strip.
 */
const OPEN_FROM = -1, OPEN_TO = 13;
const dayStart = (start, i) => { const d = new Date(start); d.setDate(start.getDate() + i); return d; };
const localMinutes = d => d.getHours() * 60 + d.getMinutes();

/** The earliest start a selection may be dragged to: the first snap boundary
 *  still ahead.
 *
 *  A floor rather than a refusal, the same way [[lengthFloor]] is one. A
 *  booking whose start has passed is one the server will not take, and finding
 *  that out by dropping the block and reading a sentence about it is a slower
 *  way of being told what the grid could simply not let you do.
 *
 *  Strictly ahead of now, never level with it: `judge` refuses a start on this
 *  instant, and a slot that is exactly now has passed by the time the request
 *  lands anyway. */
function startFloor() {
  const step = DRAG_SNAP * 60000;
  return new Date(Math.ceil((Date.now() + 1) / step) * step);
}

/** Which of the seven columns an instant belongs to.
 *
 *  Clamped to the grid, and worked out by walking the columns rather than
 *  dividing by DAY_MS — the day a clock change falls on is not twenty-four
 *  hours long, and a column arrived at by arithmetic would be the wrong one
 *  for the rest of that week. */
function columnOf(start, at, days) {
  for (let i = days - 1; i > 0; i--) if (at.getTime() >= dayStart(start, i).getTime()) return i;
  return 0;
}

/** What is on screen, as dates.
 *
 *  It read "This week" once, then a week's worth of dates. Neither is true of a
 *  strip that slides: what the button can honestly say is the days actually in
 *  front of the reader, which is why it is rewritten on scroll rather than on
 *  render — see [[gridScrolled]].
 */
function rangeLabel() {
  const from = visibleFrom();
  const a = dayAt(from), b = dayAt(from + Math.max(0, visibleCols() - 1));
  const month = d => d.toLocaleDateString(undefined, { month: 'short' });
  return a.getMonth() === b.getMonth()
    ? `${a.getDate()} – ${b.getDate()} ${month(b)}`
    : `${a.getDate()} ${month(a)} – ${b.getDate()} ${month(b)}`;
}

// ---- Verdict --------------------------------------------------------------
// Advisory only. The bot decides what a clash means — whether it can be put to
// the other person, whether they have already been asked — and its answer is
// what the window shows after booking. This exists so the button is not a blind
// guess, not to duplicate ClashVerdict.
function overlapping(start, minutes) {
  const end = new Date(start.getTime() + minutes * 60000);
  // What is over is not in the way — the same rule the `past` flag is defined
  // by. It has to be said here because a history row is not always in the past:
  // a booking cancelled before it began keeps the future start it was made for,
  // so the row for it sits ahead of now with `past` set. Counting those as
  // conflicts made a slot somebody gave up permanently unbookable, by them and
  // by everybody else — the verdict read "that runs over a booking of your own"
  // and named the booking they had just cancelled.
  return slots.filter(b => !b.past && start < b.end && b.start < end);
}

/** The one Discord name a block's owner answers to, as the card says it.
 *
 *  A verdict used to introduce somebody in full — the character on the block,
 *  then the account and the nickname behind it, three names for one person. The
 *  block being described is a finger's width above, already labelled with the
 *  character and carrying [[accountLine]] underneath it; what the sentence is
 *  for is naming somebody to go and ask, and that is the one name they answer
 *  to in Discord. The card at the top of the panel names them the same way, so
 *  the two agree instead of reading as two people.
 *
 *  The character is the last resort rather than the first: a block written
 *  before nicknames were kept has only its account, and one from before accounts
 *  travelled has only what it is labelled with.
 */
function calledOf(b) {
  const nick = (b.nickname || '').trim();
  const acct = (b.account || '').trim();
  return called(nick || acct || (b.owner || '').trim());
}

/** A name or a time, in the weight the eye goes looking for.
 *
 *  These are the pieces of a verdict that come off the wire rather than out of
 *  this file, so this is also where they are escaped — a verdict carrying markup
 *  has to escape what it interpolates, and doing it in the same breath as the
 *  wrapping is what stops the two coming apart later.
 */
function bright(text) {
  return `<span class="verdict-who">${esc(text)}</span>`;
}

/** The block covering an instant, whether it has happened yet or not. A moment
 *  rather than a range, because the question is "what is drawn here". */
function blockAt(at) {
  const t = at.getTime();
  const covers = b => b.start.getTime() <= t && t < b.end.getTime() && !b.predicted;
  // What the reader picked out of a stack wins over what the array happens to
  // hold first. Without this, choosing the second of two hunts on one window
  // moved the highlight and left the verdict describing the other one.
  const held = chosenBlock();
  if (held && covers(held)) return held;
  return slots.find(covers);
}

/** The block the reader chose, as it stands in the week on screen now. */
function chosenBlock() {
  return view.stack ? slots.find(b => slotKey(b) === view.stack) : undefined;
}

/** Whatever is actually happening at an instant, which is a narrower thing: an
 *  evening that is over is drawn at that height and is not happening. Keeping
 *  the distinction here rather than at each caller is what stops a click on your
 *  own hunt from last Tuesday offering to give it back. */
function runningAt(at) {
  const block = blockAt(at);
  return block && !block.past ? block : undefined;
}

function judge(start) {
  const end = new Date(start.getTime() + view.duration * 60000);
  if (start.getTime() <= Date.now()) {
    // Clicking a block that is running sets the pick to its start, which is
    // always in the past — so the honest reading of "that time has passed" was
    // the answer to a question nobody asked. What they clicked was somebody's
    // hunt, and what they wanted to know is whose. Named the way the bot names
    // people in Discord, so the person on the card and the person in the thread
    // are recognisably the same one.
    // What happened here, for a click on a block that is over. It is the only
    // question such a click can be asking: the time cannot be booked, and "that
    // start time has already passed" is a true answer to something nobody
    // wanted to know.
    const drawn = blockAt(start);
    if (drawn && drawn.past) {
      return {
        type: 'info',
        html: `${bright(calledOf(drawn))} ${drawn.hunted ? 'hunted' : 'had'} this until `
          + `${bright(fmtClock12(drawn.end))}${drawn.note ? ` — ${esc(drawn.note)}` : ''}.`
      };
    }
    const live = runningAt(start);
    if (live) {
      const who = live.mine ? 'You are' : `${bright(calledOf(live))} is`;
      // What the grid is painting under the pointer, in the grid's own colour
      // for it: a hunt running is the claimed pink, a booking that has started
      // is the booked blue.
      const verb = live.state === 'claimed'
        ? '<b class="verdict-em live">hunting</b>'
        : '<b class="verdict-em yes">booked for</b>';
      // The advice names whatever the button is currently offering, which for
      // your own hunt is giving it back rather than booking anything — so the
      // word is set as the button name it is.
      const next = live.mine && live.state === 'claimed'
        ? '<b class="verdict-em act">Leave</b> to give it back, or pick a later time to book it.'
        : 'Pick a later time to book it.';
      return {
        type: 'info',
        html: `${who} ${verb} this until ${bright(fmtClock12(live.end))}. ${next}`
      };
    }
    return { type: 'no', text: 'That start time has already passed.' };
  }
  const hit = overlapping(start, view.duration);
  if (!hit.length) return { type: 'ok', text: `Free — ${fmtLocal(start)}–${fmtLocal(end)}, ${fmtDur(view.duration)}` };
  if (hit.some(b => b.mine)) return { type: 'no', text: 'That runs over a booking of your own.' };
  // "Somebody" was the page declining to say something it knew: the block is on
  // the grid under the selection, with a name on it.
  const running = hit.find(b => b.state === 'claimed');
  if (running) return {
    type: 'no',
    html: `${bright(calledOf(running))} is <b class="verdict-em live">hunting</b> that right now.`
  };
  if (view.repeat === 'week') return { type: 'no', text: 'A repeating booking cannot be settled by asking about one evening.' };
  if (hit.length > 1) return { type: 'no', text: 'That runs over more than one booking — nobody single to ask.' };
  // "asked" is a state the grid paints — the amber block with the dashed edge —
  // so the word naming it is set in the same amber.
  if (hit[0].state === 'asked') return {
    type: 'no',
    html: `${bright(calledOf(hit[0]))} has already been <b class="verdict-em ask">asked</b> about that slot.`
  };
  if (hit[0].predicted) return {
    type: 'no',
    html: `${bright(calledOf(hit[0]))} books that every week — too far ahead to ask about yet.`
  };
  // The one verdict that says what pressing the button will actually set off,
  // rather than why it cannot be pressed — so it is the one that spells out both
  // halves of what happens next, and picks each of them out.
  return {
    type: 'ask',
    html: `Taken by ${bright(calledOf(hit[0]))}. You can try to Book over their slot, Violent Bot will `
      + `<b class="verdict-em ask">ask</b> them to confirm their plans to hunt, you will be denied if they `
      + `<b class="verdict-em yes">confirm their booking</b>.`
  };
}

function canBook() {
  if (!view.pick || view.busy || !view.duration) return false;
  if (view.repeat === 'week' && view.days.size === 0) return false;
  // `ok` and `ask` are the two that lead somewhere: a free slot, or one whose
  // owner can be asked about it. Anything else — a refusal, or the note about a
  // hunt already running — is not a booking waiting to be made.
  const verdict = judge(view.pick).type;
  return verdict === 'ok' || verdict === 'ask';
}

// ---- The spawn window -----------------------------------------------------
const veil = document.getElementById('veil');
const windowEl = document.getElementById('window');

/** The open card as a history entry, so a phone's Back closes it.
 *
 *  Without one the card is pure DOM state and the browser has no idea anything
 *  happened, so Back does the only thing it can — leaves the dashboard, which
 *  is a long way to fall for shutting a panel.
 *
 *  The URL is left alone: `pushState` with the current href adds an entry
 *  without changing what the address bar says or what a refresh would load.
 *  That does mean a reload with a card open comes back to the board rather than
 *  to the card, which is the trade for not having to define what a bookmarked
 *  card means.
 *
 *  A link that names a spawn does not change that. `openDeepLink` spends its
 *  parameter before opening anything, so by the time a card is pushed the
 *  address is the plain board again — the link is a way in, not an address the
 *  card lives at.
 *
 *  `history.state` rather than a variable of our own, because a reload keeps the
 *  state and would not keep the variable — and the two disagreeing is exactly
 *  how a Back button ends up needing two presses. */
const cardEntryOpen = () => !!(history.state && history.state.spawn);

/** Shut the card the way a reader asked for it: through the history entry, so
 *  the ✕, the veil, Escape and Back are one action rather than four that have
 *  to be kept in step. The teardown itself happens in `closeWindow`, when the
 *  `popstate` below arrives.
 *
 *  The fallback matters as much as the normal path. `renderWindow` shuts the
 *  card on its own when a spawn has gone from the catalogue under somebody, and
 *  a card opened before this code shipped has no entry behind it — neither has
 *  a `history.back()` to spend, and calling one would take the reader off the
 *  dashboard instead. */
/** Set between asking to go back and the `popstate` that answers, since the two
 *  are a tick apart. `renderWindow` can shut the card while it draws and is
 *  called freely, so without this a spawn that vanished could spend two Backs
 *  in that gap — and the second one leaves the dashboard. */
let dismissing = false;

function dismissWindow() {
  if (dismissing) return;
  if (cardEntryOpen()) { dismissing = true; history.back(); }
  else closeWindow();
}

window.addEventListener('popstate', () => {
  // Only ever a close. The entry is pushed on open and spent on Back, so
  // arriving here with the card already shut means the reader has gone back
  // past the board itself, and there is nothing of ours to undo.
  if (view.code) closeWindow();
});

function openWindow(code) {
  // Guarded rather than assumed: two entries for one card would need two Backs
  // to shut it. The cards sit behind the veil so this should not arise, but the
  // cost of being wrong is a button that looks broken.
  if (!view.code) history.pushState({ spawn: code }, '');
  view.code = code;
  view.from = OPEN_FROM;
  view.to = OPEN_TO;
  view.zoom = 1;
  view.vzoom = 1;
  view.intent = 1;
  userMoved = false;
  view.pick = null;
  view.stack = null;
  view.answer = null;
  view.repeat = 'once';
  view.days = new Set();
  view.upNextOpen = false;
  // Shut on every spawn.
  slotPanel = { open: false, mode: 'idle', pick: null, query: '', typing: false };
  scrolledOnce = false;
  const l = limits();
  // Start at the guild's default, but never above what is actually claimable —
  // a default of 2h is meaningless if only 18m of stamina is left, and a floor
  // of half an hour would put the figure straight back above the ceiling.
  //
  // Through cap() rather than the board-wide `claimableMinutes`, so a spawn with
  // a ceiling of its own opens at a length it will actually accept instead of
  // opening too long and being corrected on the first render.
  view.duration = l ? Math.min(l.defaultDurationMinutes, cap()) : null;
  view.chosen = view.duration;
  veil.classList.add('open');
  windowEl.classList.add('open');
  // Before the week is drawn, not after: the grid about to be built needs to
  // know how tall an hour is, and a browser zoom or a window dragged to another
  // monitor between one spawn and the next changes the answer.
  refreshScale();
  lockPage();
  // Read even while the week is folded away, because the header says how much is
  // in it and a header that lied until you opened it would be worse than no
  // header. Drawn first and filled in after, so the window itself is up as soon
  // as it is asked for.
  showRange();
}

function closeWindow() {
  dismissing = false;
  view.code = null;
  // Whatever the polls said while the card was over it — see refresh, which
  // does not paint a board nobody can see.
  if (board) renderBoard();
  slots = [];
  // The weeks themselves are kept — reopening a spawn a moment later should not
  // go back to the server — but nothing is outstanding once the window is shut.
  weekPending = false;
  weekError = false;
  gridEl = null;
  veil.classList.remove('open');
  windowEl.classList.remove('open');
  unlockPage();
}

/** Hold the board still behind the window, and put it back afterwards.
 *
 *  The window is fixed to the viewport, which on a phone only means anything
 *  while the viewport is not itself moving. Scrolling past either end of the
 *  board rubber-bands the document, the address bar comes and goes on the way,
 *  and a fixed panel is repainted against all of it a frame behind — which is
 *  the jitter. Nothing behind the window is reachable anyway, so the cheapest
 *  answer is for there to be nothing to scroll.
 *
 *  Pinning is `position: fixed` rather than `overflow: hidden`, which iOS
 *  ignores on the body; the offset is what stops the board jumping to the top
 *  while it is pinned, and it is undone on the way out.
 */
let pinnedAt = 0;
function lockPage() {
  if (document.body.classList.contains('locked')) return;
  pinnedAt = window.scrollY;
  document.body.style.top = -pinnedAt + 'px';
  document.body.classList.add('locked');
}
function unlockPage() {
  if (!document.body.classList.contains('locked')) return;
  document.body.classList.remove('locked');
  document.body.style.top = '';
  window.scrollTo(0, pinnedAt);
}

/** What lengths actually exist. Half hours on the way up, but the ceiling wins:
 *  the last of a tank is claimable exactly as it stands, so the floor is a whole
 *  step only while there is a whole step to be had. */
function snapDuration(minutes) {
  const s = step();
  return Math.max(Math.min(s, cap()), Math.min(cap(), Math.round(minutes / s) * s));
}

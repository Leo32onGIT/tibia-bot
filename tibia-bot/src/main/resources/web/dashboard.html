<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Violent Bot — Status</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
  :root {
    --bg: #0b0d12;
    --sidebar-bg: #0f1218;
    --panel: #12151c;
    --panel-border: #1f2430;
    --text: #d7dce3;
    --text-strong: #e8ebf0;
    --muted: #7c8698;
    --accent: #5b8cff;
    --good: #3ecf8e;
    --warn: #e0a93e;
    --bad: #e0563e;
    /* Dedicated 4-step scale for the sidebar edits heat map — kept separate
       from --warn/--bad above so retuning it doesn't also recolor the
       deaths/edits icons and tag pills that reuse those. */
    --heat-great: #3ecf8e;
    --heat-good: #e0c23e;
    --heat-medium: #cf7a2e;
    --heat-hot: #a8362a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    display: flex;
  }
  .sidebar {
    width: 200px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--panel-border);
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: sticky;
    top: 0;
  }
  .sidebar-header {
    padding: 18px 16px;
    border-bottom: 1px solid var(--panel-border);
    font-size: 14px;
    font-weight: 600;
    color: var(--text-strong);
  }
  .sidebar-header span { color: var(--muted); font-weight: 400; display: block; font-size: 11px; margin-top: 2px; }
  .world-list { flex: 1; overflow-y: auto; padding: 8px 0; }
  .world-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px;
    border-left: 2px solid transparent;
    cursor: pointer;
    color: var(--muted);
  }
  .world-item i { font-size: 16px; }
  .world-item .name { flex: 1; font-size: 13px; }
  .world-item .pop { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .world-item:hover { background: rgba(255, 255, 255, 0.03); }
  .world-item.active {
    background: rgba(91, 140, 255, 0.1);
    border-left-color: var(--accent);
    color: var(--text-strong);
  }
  .world-item.active i { color: var(--accent); }

  main { flex: 1; padding: 20px 28px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }

  .kpis-strip { display: flex; gap: 14px; }
  .kpi {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    padding: 6px 14px 6px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .kpi i { font-size: 15px; color: var(--muted); }
  .kpi .label { color: var(--muted); font-size: 12px; }
  .kpi .value { color: var(--text-strong); font-size: 14px; font-weight: 600; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    overflow: hidden;
  }
  .panel-title {
    padding: 12px 16px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .panel-title .stale { color: var(--warn); text-transform: none; letter-spacing: normal; font-weight: 400; }

  .detail-stats { display: flex; gap: 24px; padding: 16px; flex-wrap: wrap; }
  .detail-stat { display: flex; align-items: center; gap: 8px; }
  .detail-stat i { font-size: 18px; }
  .detail-stat .num { font-size: 16px; font-weight: 600; color: var(--text-strong); font-variant-numeric: tabular-nums; }
  .detail-stat .num-label { font-size: 11px; color: var(--muted); }

  .discord-list { display: flex; flex-direction: column; gap: 6px; padding: 0 16px 16px; }
  .discord-item { display: flex; align-items: center; gap: 8px; font-size: 12px; background: rgba(255, 255, 255, 0.02); padding: 8px 10px; border-radius: 6px; }
  .discord-item i { color: var(--muted); font-size: 14px; }
  .discord-item .owner-icon { color: var(--warn); font-size: 13px; }
  .discord-item .sep { color: var(--muted); }
  .discord-item .owner { color: var(--muted); }
  .discord-item .gid { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }

  .lanes { display: flex; gap: 24px; padding: 16px; flex-wrap: wrap; }
  .lane { flex: 1; min-width: 220px; }
  .lane-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .lane-name { font-size: 13px; font-weight: 600; color: var(--text-strong); }
  .lane-pill { font-size: 10px; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; letter-spacing: 0.03em; }
  .lane-bar-track { background: var(--panel-border); border-radius: 4px; height: 6px; margin-bottom: 10px; overflow: hidden; }
  .lane-bar-fill { height: 100%; }
  .lane-summary { color: var(--muted); font-size: 11px; margin-bottom: 8px; }
  .lane-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .lane-chip { font-size: 11px; padding: 3px 8px; border-radius: 6px; font-variant-numeric: tabular-nums; }

  .feed { max-height: 320px; overflow-y: auto; }
  .feed-row { padding: 8px 16px; border-top: 1px solid var(--panel-border); font-size: 12px; display: flex; gap: 10px; align-items: center; }
  .feed-row:first-child { border-top: none; }
  .feed-time { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.03em; }
  .tag.death { background: rgba(224, 86, 62, 0.15); color: var(--bad); }
  .tag.level-up { background: rgba(62, 207, 142, 0.15); color: var(--good); }
  .tag.edit { background: rgba(91, 140, 255, 0.15); color: var(--accent); }

  .muted { color: var(--muted); }
  .stale { color: var(--warn); }
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-header">Violent Bot<span>/ status</span></div>
  <div class="world-list" id="world-list"></div>
</aside>
<main>
  <div class="kpis-strip">
    <div class="kpi"><i class="ti ti-world" aria-hidden="true"></i><span class="label">Worlds</span><span class="value" id="kpi-worlds">–</span></div>
    <div class="kpi"><i class="ti ti-brand-discord" aria-hidden="true"></i><span class="label">Discords</span><span class="value" id="kpi-discords">–</span></div>
    <div class="kpi"><i class="ti ti-users" aria-hidden="true"></i><span class="label">Tracked Players</span><span class="value" id="kpi-population">–</span></div>
  </div>

  <div class="panel">
    <div class="panel-title"><span id="detail-title">World</span><span class="stale" id="detail-stale"></span></div>
    <div class="detail-stats" id="detail-stats"></div>
    <div class="discord-list" id="detail-discords"></div>
  </div>

  <div class="panel">
    <div class="panel-title">Rate-limit lanes</div>
    <div class="lanes" id="lanes"></div>
  </div>

  <div class="panel">
    <div class="panel-title">Recent activity</div>
    <div class="feed" id="feed"></div>
  </div>
</main>

<script>
let lastData = null;
let selectedWorld = null;

function timeAgo(iso) {
  if (!iso) return '–';
  const seconds = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
  if (seconds < 60) return `${seconds}s ago`;
  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) return `${minutes}m ago`;
  return `${Math.floor(minutes / 60)}h ago`;
}

function sortedWorlds(worlds) {
  return worlds.slice().sort((a, b) => a.name.localeCompare(b.name));
}

// Edits (15m) is what actually feeds the online-list rate-limit lane, so it
// stands in for per-world queue pressure — there's no true per-world queue
// depth tracked today, only bot-wide lane totals (see renderLanes). Fixed
// bands rather than relative-to-max, so "great" always means the same thing
// regardless of how busy the bot is overall.
function heatColor(edits) {
  if (edits < 50) return 'var(--heat-great)';
  if (edits < 100) return 'var(--heat-good)';
  if (edits < 250) return 'var(--heat-medium)';
  return 'var(--heat-hot)';
}

function renderSidebar(worlds) {
  const el = document.getElementById('world-list');
  el.innerHTML = '';
  sortedWorlds(worlds).forEach(w => {
    const div = document.createElement('div');
    div.className = 'world-item' + (w.name === selectedWorld ? ' active' : '');
    const nameColor = heatColor(w.edits15m);
    div.innerHTML = `<i class="ti ti-world" aria-hidden="true"></i><span class="name" style="color:${nameColor}" title="${w.edits15m} edits in the last 15m">${w.name}</span><span class="pop">${w.population}</span>`;
    div.addEventListener('click', () => { selectedWorld = w.name; render(); });
    el.appendChild(div);
  });
}

function renderDetail(worlds) {
  const world = worlds.find(w => w.name === selectedWorld) || sortedWorlds(worlds)[0];
  if (!world) return;

  document.getElementById('detail-title').textContent = world.name;
  document.getElementById('detail-stale').textContent = world.lastPollAt ? '' : 'no data yet';

  document.getElementById('detail-stats').innerHTML = `
    <div class="detail-stat"><i class="ti ti-users" style="color:var(--accent)" aria-hidden="true"></i><div><div class="num">${world.population}</div><div class="num-label">Population</div></div></div>
    <div class="detail-stat"><i class="ti ti-skull" style="color:var(--bad)" aria-hidden="true"></i><div><div class="num">${world.deaths15m}</div><div class="num-label">Deaths (15m)</div></div></div>
    <div class="detail-stat"><i class="ti ti-arrow-big-up-lines" style="color:var(--good)" aria-hidden="true"></i><div><div class="num">${world.levels15m}</div><div class="num-label">Levels (15m)</div></div></div>
    <div class="detail-stat"><i class="ti ti-edit" style="color:var(--warn)" aria-hidden="true"></i><div><div class="num">${world.edits15m}</div><div class="num-label">Edits (15m)</div></div></div>
    <div class="detail-stat"><i class="ti ti-clock" style="color:var(--muted)" aria-hidden="true"></i><div><div class="num">${timeAgo(world.lastPollAt)}</div><div class="num-label">Last poll</div></div></div>
  `;

  document.getElementById('detail-discords').innerHTML = world.discords.length
    ? world.discords.map(d => `<div class="discord-item"><i class="ti ti-brand-discord" aria-hidden="true"></i><span>${d.name}</span><span class="sep">&middot;</span><i class="ti ti-crown owner-icon" aria-hidden="true"></i><span class="owner">${d.owner}</span><span class="gid">${d.id}</span></div>`).join('')
    : '<div class="muted">No discords tracking this world</div>';
}

// Queue depth is what "backed up" actually means for a lane — a healthy lane
// drains close to as fast as it fills. Fixed threshold, not relative, so the
// pill means the same thing regardless of how busy the bot is overall.
function laneHealthVar(queueDepth) {
  return queueDepth > 20 ? '--bad' : '--good';
}

// Avg wait is the "effect on sends" signal per label — how long something
// sits queued before it actually goes out.
function waitVar(avgWaitMs) {
  if (avgWaitMs < 300) return '--good';
  if (avgWaitMs < 1000) return '--warn';
  return '--bad';
}

function renderLanes(lanes) {
  const el = document.getElementById('lanes');
  el.innerHTML = '';
  Object.entries(lanes).forEach(([name, lane]) => {
    const healthVar = laneHealthVar(lane.queueDepth);
    const barPct = Math.min(100, lane.queueDepth);
    const chips = Object.entries(lane.labels).map(([label, stats]) => {
      const v = waitVar(stats.avgWaitMs);
      return `<span class="lane-chip" style="background:color-mix(in srgb, var(${v}) 15%, transparent); color:var(${v});">${label} ${Math.round(stats.avgWaitMs)}ms</span>`;
    }).join('') || '<span class="muted" style="font-size:11px;">No traffic yet</span>';

    const div = document.createElement('div');
    div.className = 'lane';
    div.innerHTML = `
      <div class="lane-header">
        <span class="lane-name">${name}</span>
        <span class="lane-pill" style="background:color-mix(in srgb, var(${healthVar}) 15%, transparent); color:var(${healthVar});">${healthVar === '--bad' ? 'Backed up' : 'Healthy'}</span>
      </div>
      <div class="lane-bar-track"><div class="lane-bar-fill" style="width:${barPct}%; background:var(${healthVar});"></div></div>
      <div class="lane-summary">${lane.queueDepth} queued &middot; ${lane.totalDropped} dropped &middot; ${lane.totalSuperseded} superseded</div>
      <div class="lane-chips">${chips}</div>
    `;
    el.appendChild(div);
  });
}

function renderFeed(events) {
  const el = document.getElementById('feed');
  el.innerHTML = '';
  events.forEach(ev => {
    const row = document.createElement('div');
    row.className = 'feed-row';
    row.innerHTML = `
      <div class="feed-time">${timeAgo(ev.at)}</div>
      <span class="tag ${ev.tag}">${ev.tag}</span>
      <div class="muted">${ev.world}</div>
      <div>${ev.text}</div>
    `;
    el.appendChild(row);
  });
}

function render() {
  if (!lastData) return;
  const worlds = lastData.worlds;
  if (!selectedWorld && worlds.length) selectedWorld = sortedWorlds(worlds)[0].name;

  document.getElementById('kpi-worlds').textContent = worlds.length;
  document.getElementById('kpi-discords').textContent = new Set(worlds.flatMap(w => w.discords.map(d => d.id))).size;
  document.getElementById('kpi-population').textContent = worlds.reduce((sum, w) => sum + w.population, 0);

  renderSidebar(worlds);
  renderDetail(worlds);
  renderLanes(lastData.rateLimitLanes);
  renderFeed(lastData.recentEvents);
}

async function poll() {
  try {
    const res = await fetch('/dashboard/status');
    if (!res.ok) return;
    lastData = await res.json();
    render();
  } catch (e) {
    console.error('status poll failed', e);
  }
}

poll();
setInterval(poll, 10000);
</script>
</body>
</html>

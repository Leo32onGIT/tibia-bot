<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Violent Bot — Status</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
  :root {
    --bg: #0b0d12;
    --sidebar-bg: #0f1218;
    --panel: #12151c;
    --panel-border: #1f2430;
    --text: #d7dce3;
    --text-strong: #e8ebf0;
    --muted: #7c8698;
    --accent: #5b8cff;
    --good: #3ecf8e;
    --warn: #e0a93e;
    --bad: #e0563e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    display: flex;
  }
  .sidebar {
    width: 200px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--panel-border);
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: sticky;
    top: 0;
  }
  .sidebar-header {
    padding: 18px 16px;
    border-bottom: 1px solid var(--panel-border);
    font-size: 14px;
    font-weight: 600;
    color: var(--text-strong);
  }
  .sidebar-header span { color: var(--muted); font-weight: 400; display: block; font-size: 11px; margin-top: 2px; }
  .world-list { flex: 1; overflow-y: auto; padding: 8px 0; }
  .world-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px;
    border-left: 2px solid transparent;
    cursor: pointer;
    color: var(--muted);
  }
  .world-item i { font-size: 16px; }
  .be-icon { width: 16px; height: 16px; flex-shrink: 0; }
  .world-item .name { flex: 1; font-size: 13px; }
  .world-item .pop { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .world-item:hover { background: rgba(255, 255, 255, 0.03); }
  .world-item.active {
    background: rgba(91, 140, 255, 0.1);
    border-left-color: var(--accent);
    color: var(--text-strong);
  }

  /* Mobile-only: a menu button to open the sidebar as a slide-in drawer, and
     the backdrop behind it. Both display:none here; the media query below
     turns them on — see .sidebar's mobile override for the actual drawer. */
  .mobile-topbar { display: none; align-items: center; gap: 10px; }
  .mobile-menu-btn {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    color: var(--text-strong);
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
  }
  .mobile-topbar-title { font-size: 14px; font-weight: 600; color: var(--text-strong); }
  .sidebar-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 25;
  }
  .sidebar-backdrop.open { display: block; }

  main { flex: 1; padding: 20px 28px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }

  .kpis-strip {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 8px 16px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
  }
  .kpi-group { display: flex; gap: 20px; justify-self: center; }
  .kpi { display: flex; align-items: center; gap: 6px; }
  .kpi i { font-size: 14px; color: var(--muted); }
  .kpi .label { color: var(--muted); font-size: 11px; }
  .kpi .value { color: var(--text-strong); font-size: 13px; font-weight: 600; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    overflow: hidden;
  }
  .panel-title {
    padding: 12px 16px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .panel-title .stale { color: var(--warn); text-transform: none; letter-spacing: normal; font-weight: 400; }

  .detail-stats { display: flex; gap: 24px; padding: 16px; flex-wrap: wrap; }
  .detail-stat { display: flex; align-items: center; gap: 8px; }
  .detail-stat i { font-size: 18px; }
  .detail-stat .num { font-size: 16px; font-weight: 600; color: var(--text-strong); font-variant-numeric: tabular-nums; }
  .detail-stat .num-label { font-size: 11px; color: var(--muted); }

  .discord-list { display: flex; flex-direction: column; gap: 6px; padding: 0 16px 16px; }
  .discord-item { display: flex; align-items: center; gap: 8px; font-size: 12px; background: rgba(255, 255, 255, 0.02); padding: 8px 10px; border-radius: 6px; }
  .discord-item i { color: var(--muted); font-size: 14px; }
  .discord-item .owner-icon { color: var(--warn); font-size: 13px; }
  .discord-item .sep { color: var(--muted); }
  .discord-item .owner { color: var(--muted); }
  .discord-item .gid { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Compact rate-limit indicator, folded into the same bordered strip as the
     KPI group (see .kpis-strip above) — rate-limit health is bot-wide, not
     tied to the selected world's details, so it doesn't belong in the
     world-detail panel below. */
  .lanes-compact { justify-self: start; }
  .lanes-rows { display: flex; gap: 8px; }
  .lane-card {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 6px 14px;
    text-align: center;
    min-width: 76px;
  }
  .lane-card-label { color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 3px; }
  .lane-card-depth { font-size: 18px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
  .lane-card-ms { color: var(--muted); font-size: 9px; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .lane-card-refresh { color: var(--muted); font-size: 9px; margin-top: 1px; font-variant-numeric: tabular-nums; }

  .log-alerts-summary { display: flex; align-items: center; gap: 12px; justify-self: end; }
  .log-alert-count { display: flex; align-items: center; gap: 4px; font-size: 12px; cursor: pointer; }
  .log-alert-count i { font-size: 14px; }
  .log-alert-count.error { color: var(--bad); }
  .log-alert-count.warn { color: var(--warn); }
  .log-alerts-chevron { color: var(--muted); font-size: 14px; transition: transform 0.15s ease; }
  .log-alerts-chevron.expanded { transform: rotate(180deg); }

  .feed { max-height: 320px; overflow-y: auto; }
  .feed-row { padding: 8px 16px; border-top: 1px solid var(--panel-border); font-size: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .feed-row > div:last-child { min-width: 0; word-break: break-word; }
  .feed-row a { color: var(--accent); text-decoration: none; }
  .feed-row a:hover { text-decoration: underline; }
  .feed-row:first-child { border-top: none; }
  .feed-time { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .feed-row.grouped { cursor: pointer; }
  .feed-group-chevron { color: var(--muted); font-size: 12px; transition: transform 0.15s ease; }
  .feed-group-chevron.expanded { transform: rotate(180deg); }
  .feed-subgroup { padding-left: 24px; }
  .feed-subgroup .feed-row { opacity: 0.8; }
  .tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.03em; }
  .tag.death { background: rgba(224, 86, 62, 0.15); color: var(--bad); }
  .tag.level-up { background: rgba(62, 207, 142, 0.15); color: var(--good); }
  .tag.edit { background: rgba(91, 140, 255, 0.15); color: var(--accent); }
  .tag.error { background: rgba(224, 86, 62, 0.15); color: var(--bad); }
  .tag.warn { background: rgba(224, 169, 62, 0.15); color: var(--warn); }
  .log-alert-logger { color: var(--muted); }
  .log-alert-repeat { background: rgba(255, 255, 255, 0.06); color: var(--text); font-size: 10px; padding: 1px 7px; border-radius: 10px; font-variant-numeric: tabular-nums; }

  .muted { color: var(--muted); }
  .stale { color: var(--warn); }
  .sep { color: var(--muted); }
  .tag.active { background: rgba(62, 207, 142, 0.15); color: var(--good); }
  .tag.paused { background: rgba(224, 169, 62, 0.15); color: var(--warn); }

  .patreon-list { display: flex; flex-direction: column; gap: 10px; padding: 0 16px 16px; }
  .patreon-sup { border: 1px solid var(--panel-border); border-radius: 8px; overflow: hidden; }
  .patreon-sup-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: rgba(255, 255, 255, 0.02); }
  .patreon-sup-head i { color: var(--warn); font-size: 14px; }
  .patreon-sup-name { color: var(--text-strong); font-weight: 600; font-size: 12px; }
  .patreon-sup-seats { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .patreon-seat { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 7px 12px 7px 34px; border-top: 1px solid var(--panel-border); }
  .patreon-seat i { color: var(--muted); font-size: 13px; }
  .patreon-seat-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .patreon-btn { background: transparent; border: 1px solid var(--panel-border); border-radius: 6px; color: var(--muted); font-size: 11px; padding: 3px 8px; cursor: pointer; }
  .patreon-btn:hover { color: var(--text-strong); border-color: var(--muted); }
  .patreon-btn.danger:hover { color: var(--bad); border-color: var(--bad); }
  .patreon-add-toggle { background: #2b3242; border: 1px solid var(--panel-border); border-radius: 6px; color: var(--text-strong); font-size: 11px; font-weight: 600; padding: 4px 10px; cursor: pointer; text-transform: none; letter-spacing: normal; }
  .patreon-add-toggle:hover { background: #343d51; }
  .patreon-add-form { display: none; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--panel-border); flex-wrap: wrap; }
  .patreon-add-form.open { display: flex; }
  .patreon-add-form input { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--panel-border); border-radius: 6px; color: var(--text); font-size: 12px; padding: 6px 10px; flex: 1; min-width: 120px; }
  .patreon-add-form button[type="submit"] { background: #2b3242; border: 1px solid var(--panel-border); border-radius: 6px; color: var(--text-strong); font-size: 12px; font-weight: 600; padding: 6px 14px; cursor: pointer; }
  .patreon-add-form button[type="submit"]:hover { background: #343d51; }

  /* Below this, the fixed 200px side-by-side sidebar and the single-row KPI
     strip both stop working: the sidebar eats half a phone screen, and the
     KPI strip's three grid columns have nowhere to shrink to. The sidebar
     becomes an off-canvas drawer (opened via .mobile-topbar's button,
     closed via the backdrop or picking a world) instead of taking any
     permanent screen space; the KPI strip drops to one stacked, centered
     column instead of three fixed side-by-side ones. */
  @media (max-width: 720px) {
    .mobile-topbar { display: flex; }
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 260px;
      max-width: 80vw;
      z-index: 30;
      transform: translateX(-100%);
      transition: transform 0.2s ease;
    }
    .sidebar.open { transform: translateX(0); }

    main { padding: 12px; gap: 14px; }

    .kpis-strip { grid-template-columns: 1fr; gap: 12px; }
    .lanes-compact, .kpi-group, .log-alerts-summary { justify-self: center; }
    .kpi-group { flex-wrap: wrap; justify-content: center; }

    .detail-stats { gap: 12px 20px; padding: 12px; }
    .discord-item { flex-wrap: wrap; }
    .discord-item .gid { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>
<div class="sidebar-backdrop" id="sidebar-backdrop"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">Violent Bot<span>/ status</span></div>
  <div class="world-list" id="world-list"></div>
</aside>
<main>
  <div class="mobile-topbar">
    <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle world list"><i class="ti ti-menu-2" aria-hidden="true"></i></button>
    <span class="mobile-topbar-title">Violent Bot</span>
  </div>
  <div class="kpis-strip">
    <div class="lanes-compact">
      <div class="lanes-rows" id="lanes"></div>
    </div>
    <div class="kpi-group">
      <div class="kpi"><i class="ti ti-world" aria-hidden="true"></i><span class="label">Worlds</span><span class="value" id="kpi-worlds">–</span></div>
      <div class="kpi"><i class="ti ti-brand-discord" aria-hidden="true"></i><span class="label">Discords</span><span class="value" id="kpi-discords">–</span></div>
      <div class="kpi"><i class="ti ti-users" aria-hidden="true"></i><span class="label">Tracked Players</span><span class="value" id="kpi-population">–</span></div>
    </div>
    <div class="log-alerts-summary">
      <span class="log-alert-count error" id="log-error-toggle"><i class="ti ti-alert-circle" aria-hidden="true"></i><span id="log-error-count">0 errors</span><i class="ti ti-chevron-down log-alerts-chevron" id="log-error-chevron" aria-hidden="true"></i></span>
      <span class="log-alert-count warn" id="log-warn-toggle"><i class="ti ti-alert-triangle" aria-hidden="true"></i><span id="log-warn-count">0 warnings</span><i class="ti ti-chevron-down log-alerts-chevron" id="log-warn-chevron" aria-hidden="true"></i></span>
    </div>
  </div>

  <div class="panel" id="log-errors-panel" style="display:none;">
    <div class="panel-title">Errors</div>
    <div class="feed" id="log-errors-list"></div>
  </div>

  <div class="panel" id="log-warnings-panel" style="display:none;">
    <div class="panel-title">Warnings</div>
    <div class="feed" id="log-warnings-list"></div>
  </div>

  <div class="panel">
    <div class="panel-title"><span id="detail-title">World</span><span class="stale" id="detail-stale"></span></div>
    <div class="detail-stats" id="detail-stats"></div>
    <div class="discord-list" id="detail-discords"></div>
  </div>

  <div class="panel">
    <div class="panel-title">Recent activity</div>
    <div class="feed" id="feed"></div>
  </div>

  <div class="panel">
    <div class="panel-title">Patreon supporters<button class="patreon-add-toggle" id="patreon-add-toggle" type="button">+ Add seat</button></div>
    <div class="detail-stats" id="patreon-stats"></div>
    <div class="patreon-list" id="patreon-list"></div>
    <form class="patreon-add-form" id="patreon-add-form">
      <input type="text" id="patreon-add-userid" placeholder="Discord user ID" required>
      <input type="text" id="patreon-add-guildid" placeholder="Guild ID" required>
      <input type="text" id="patreon-add-world" placeholder="World" required>
      <button type="submit">Add seat</button>
    </form>
  </div>
</main>

<script>
let lastData = null;
let selectedWorld = null;

function timeAgo(iso) {
  if (!iso) return '–';
  const seconds = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
  if (seconds < 60) return `${seconds}s ago`;
  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) return `${minutes}m ago`;
  return `${Math.floor(minutes / 60)}h ago`;
}

function sortedWorlds(worlds) {
  return worlds.slice().sort((a, b) => a.name.localeCompare(b.name));
}

// Shared 10-level heat ramp (green -> yellow -> orange -> red), used for both
// the sidebar's per-world edits heat and the rate-limit lane bars/labels —
// one gradient, two different 0-1 ratios fed into it. Quantized to exactly
// 10 discrete steps (not a smooth continuous gradient) so the color a given
// value maps to is stable and predictable, not a slightly-different shade
// every time the underlying number wiggles by one.
const HEAT_STOPS = [
  [62, 207, 142],  // green
  [224, 194, 62],  // yellow
  [207, 122, 46],  // orange
  [168, 54, 42]    // red
];

function heatColorForRatio(ratio) {
  const clamped = Math.min(1, Math.max(0, ratio));
  const level = Math.min(9, Math.floor(clamped * 10)); // 10 discrete levels: 0-9
  const t = level / 9;
  const segments = HEAT_STOPS.length - 1;
  const segPos = t * segments;
  const segIndex = Math.min(segments - 1, Math.floor(segPos));
  const segT = segPos - segIndex;
  const [r1, g1, b1] = HEAT_STOPS[segIndex];
  const [r2, g2, b2] = HEAT_STOPS[segIndex + 1];
  const lerp = (a, b) => Math.round(a + (b - a) * segT);
  return `rgb(${lerp(r1, r2)}, ${lerp(g1, g2)}, ${lerp(b1, b2)})`;
}

// Edits (15m) is what actually feeds the online-list rate-limit lane, so it
// stands in for per-world queue pressure — there's no true per-world queue
// depth tracked today, only bot-wide lane totals (see renderLanes). Ratio
// against a fixed max (not relative to the busiest world shown), so a given
// edit count always means the same thing regardless of how busy the bot is
// overall.
function heatColorForEdits(edits) {
  return heatColorForRatio(edits / 250);
}

const BE_ICON_GREEN = 'https://static.wikia.nocookie.net/tibia/images/a/a6/Be_icon_green.gif/revision/latest?cb=20170829131556&path-prefix=en&format=original';
const BE_ICON_YELLOW = 'https://static.wikia.nocookie.net/tibia/images/0/0f/Be_icon_yellow.gif/revision/latest?cb=20170829131625&path-prefix=en&format=original';

function renderSidebar(worlds) {
  const el = document.getElementById('world-list');
  el.innerHTML = '';
  sortedWorlds(worlds).forEach(w => {
    const div = document.createElement('div');
    div.className = 'world-item' + (w.name === selectedWorld ? ' active' : '');
    const nameColor = heatColorForEdits(w.edits15m);
    const beIcon = w.battleyeGreen ? BE_ICON_GREEN : BE_ICON_YELLOW;
    const beLabel = w.battleyeGreen ? 'Green BattlEye' : 'Yellow BattlEye';
    div.innerHTML = `<img class="be-icon" src="${beIcon}" alt="${beLabel}" title="${beLabel}"><span class="name" style="color:${nameColor}" title="${w.edits15m} edits in the last 15m">${w.name}</span><span class="pop">${w.population}</span>`;
    div.addEventListener('click', () => { selectedWorld = w.name; render(); closeSidebar(); });
    el.appendChild(div);
  });
}

function renderDetail(worlds) {
  const world = worlds.find(w => w.name === selectedWorld) || sortedWorlds(worlds)[0];
  if (!world) return;

  document.getElementById('detail-title').textContent = world.pvpType ? `${world.name} - ${world.pvpType}` : world.name;
  document.getElementById('detail-stale').textContent = world.lastPollAt ? '' : 'no data yet';

  document.getElementById('detail-stats').innerHTML = `
    <div class="detail-stat"><i class="ti ti-users" style="color:var(--accent)" aria-hidden="true"></i><div><div class="num">${world.population}</div><div class="num-label">Online</div></div></div>
    <div class="detail-stat"><i class="ti ti-skull" style="color:var(--bad)" aria-hidden="true"></i><div><div class="num">${world.deaths15m}</div><div class="num-label">Deaths (15m)</div></div></div>
    <div class="detail-stat"><i class="ti ti-arrow-big-up-lines" style="color:var(--good)" aria-hidden="true"></i><div><div class="num">${world.levels15m}</div><div class="num-label">Levels (15m)</div></div></div>
    <div class="detail-stat"><i class="ti ti-edit" style="color:var(--warn)" aria-hidden="true"></i><div><div class="num">${world.edits15m}</div><div class="num-label">Edits (15m)</div></div></div>
    <div class="detail-stat"><i class="ti ti-clock" style="color:var(--muted)" aria-hidden="true"></i><div><div class="num">${timeAgo(world.lastPollAt)}</div><div class="num-label">Last poll</div></div></div>
  `;

  document.getElementById('detail-discords').innerHTML = world.discords.length
    ? world.discords.map(d => `<div class="discord-item"><i class="ti ti-brand-discord" aria-hidden="true"></i><span>${d.name}</span><span class="sep">&middot;</span><i class="ti ti-crown owner-icon" aria-hidden="true"></i><span class="owner">${d.owner}</span><span class="gid">${d.id}</span></div>`).join('')
    : '<div class="muted">No discords tracking this world</div>';
}

// Display names only — the JSON keys ("background", "online-list") stay as
// the actual lane identifiers, matching RateLimitedSender's own labels.
function laneDisplayName(key) {
  if (key === 'background') return 'General';
  if (key === 'online-list') return 'Online Lists';
  return key;
}

function formatRefreshInterval(seconds) {
  return seconds < 60 ? `${seconds}s` : `${Math.round(seconds / 60)}min`;
}

function renderLanes(lanes) {
  const el = document.getElementById('lanes');
  el.innerHTML = '';
  Object.entries(lanes).forEach(([name, lane]) => {
    // "general" tends to stay small so 0-100 shows real movement; online-list
    // can genuinely back up into the hundreds/thousands under load, so it
    // needs the wider 0-1000 scale to stay meaningful instead of pinning at 100%.
    const barMax = name === 'background' ? 100 : 1000;
    const ratio = Math.min(1, lane.queueDepth / barMax);
    const depthColor = heatColorForRatio(ratio);
    // The single worst avg wait across this lane's labels — full per-label
    // detail (count, individual wait times) is available on hover only, to
    // keep this compact enough to sit in the KPI strip.
    const maxWaitMs = Object.values(lane.labels).reduce((max, s) => Math.max(max, s.avgWaitMs), 0);
    const labelDetail = Object.entries(lane.labels).map(([label, s]) => `${label}: ${Math.round(s.avgWaitMs)}ms`).join(', ') || 'no traffic yet';

    // Only online-list has an adaptive refresh cycle (general has no refresh
    // timer to back off) — the field is only present on that lane's JSON.
    const refreshLine = lane.refreshIntervalSeconds != null
      ? `<div class="lane-card-refresh">refresh: ${formatRefreshInterval(lane.refreshIntervalSeconds)}</div>`
      : '';

    const card = document.createElement('div');
    card.className = 'lane-card';
    card.title = `${laneDisplayName(name)} — ${lane.queueDepth} queued, ${lane.totalDropped} dropped, ${lane.totalSuperseded} superseded\n${labelDetail}`;
    card.innerHTML = `
      <div class="lane-card-label">${laneDisplayName(name)}</div>
      <div class="lane-card-depth" style="color:${depthColor};">${lane.queueDepth}</div>
      <div class="lane-card-ms">${Math.round(maxWaitMs)}ms</div>
      ${refreshLine}
    `;
    el.appendChild(card);
  });
}

function renderFeedRow(ev, groupCount) {
  const row = document.createElement('div');
  row.className = 'feed-row';
  const badgeAndChevron = groupCount
    ? `<span class="log-alert-repeat">&times;${groupCount}</span><i class="ti ti-chevron-down feed-group-chevron" aria-hidden="true"></i>`
    : '';
  row.innerHTML = `
    <div class="feed-time">${timeAgo(ev.at)}</div>
    <span class="tag ${ev.tag}">${ev.tag}</span>
    <div>${ev.text}</div>
    ${badgeAndChevron}
  `;
  return row;
}

// Consecutive level-ups posted to the same discord collapse into one row
// (badge shows the count, click to expand) — a busy world can otherwise
// bury everything else under a wall of near-identical "N players leveled
// up" lines, one per polling tick. Only adjacent same-discord level-ups
// group; anything else (including a level-up to a different discord, or
// any other tag) always starts a fresh row.
function groupFeedEvents(events) {
  const groups = [];
  events.forEach(ev => {
    const discordKey = ev.tag === 'level-up' ? (ev.text.match(/Discord ID: (\d+)/) || [])[1] : null;
    const last = groups[groups.length - 1];
    if (last && discordKey && last.discordKey === discordKey) {
      last.items.push(ev);
    } else {
      groups.push({ discordKey, items: [ev] });
    }
  });
  return groups;
}

function renderFeed(events) {
  const el = document.getElementById('feed');
  el.innerHTML = '';
  if (events.length === 0) {
    el.innerHTML = '<div class="feed-row muted">No recent activity for this world</div>';
    return;
  }
  groupFeedEvents(events).forEach(group => {
    if (group.items.length === 1) {
      el.appendChild(renderFeedRow(group.items[0]));
      return;
    }
    const row = renderFeedRow(group.items[0], group.items.length);
    row.classList.add('grouped');
    const subList = document.createElement('div');
    subList.className = 'feed-subgroup';
    subList.style.display = 'none';
    group.items.forEach(ev => subList.appendChild(renderFeedRow(ev)));
    row.addEventListener('click', () => {
      const isHidden = subList.style.display === 'none';
      subList.style.display = isHidden ? 'block' : 'none';
      row.querySelector('.feed-group-chevron').classList.toggle('expanded', isHidden);
    });
    el.appendChild(row);
    el.appendChild(subList);
  });
}

function renderLogList(elementId, events, emptyMessage) {
  const el = document.getElementById(elementId);
  el.innerHTML = '';
  if (events.length === 0) {
    el.innerHTML = `<div class="feed-row muted">${emptyMessage}</div>`;
    return;
  }
  events.forEach(ev => {
    const row = document.createElement('div');
    row.className = 'feed-row';
    const repeatBadge = ev.count > 1 ? `<span class="log-alert-repeat">&times;${ev.count}</span>` : '';
    row.innerHTML = `
      <div class="feed-time">${timeAgo(ev.at)}</div>
      <span class="tag ${ev.level.toLowerCase()}">${ev.level}</span>
      <span class="log-alert-logger">${ev.logger}</span>
      <div style="flex:1;">${ev.message}</div>
      ${repeatBadge}
    `;
    el.appendChild(row);
  });
}

function renderLogAlerts(logAlerts) {
  document.getElementById('log-error-count').textContent = `${logAlerts.errorCount} ${logAlerts.errorCount === 1 ? 'error' : 'errors'}`;
  document.getElementById('log-warn-count').textContent = `${logAlerts.warnCount} ${logAlerts.warnCount === 1 ? 'warning' : 'warnings'}`;
  renderLogList('log-errors-list', logAlerts.errors, 'No errors captured');
  renderLogList('log-warnings-list', logAlerts.warnings, 'No warnings captured');
}

function renderPatreon(patreon) {
  const allSeats = patreon.flatMap(s => s.seats);
  const activeSeats = allSeats.filter(s => s.active).length;

  document.getElementById('patreon-stats').innerHTML = `
    <div class="detail-stat"><i class="ti ti-crown" style="color:var(--warn)" aria-hidden="true"></i><div><div class="num">${patreon.length}</div><div class="num-label">Supporters</div></div></div>
    <div class="detail-stat"><i class="ti ti-armchair" style="color:var(--good)" aria-hidden="true"></i><div><div class="num">${activeSeats}</div><div class="num-label">Active seats</div></div></div>
    <div class="detail-stat"><i class="ti ti-player-pause" style="color:var(--warn)" aria-hidden="true"></i><div><div class="num">${allSeats.length - activeSeats}</div><div class="num-label">Paused seats</div></div></div>
  `;

  const el = document.getElementById('patreon-list');
  el.innerHTML = '';
  if (patreon.length === 0) {
    el.innerHTML = '<div class="muted">No Patreon seats assigned</div>';
    return;
  }
  patreon.forEach(supporter => {
    const sup = document.createElement('div');
    sup.className = 'patreon-sup';

    const head = document.createElement('div');
    head.className = 'patreon-sup-head';
    head.innerHTML = `<i class="ti ti-crown" aria-hidden="true"></i><span class="patreon-sup-name">${supporter.userName || supporter.userId}</span><span class="patreon-sup-seats">${supporter.seats.length} / ${supporter.seatLimit} seats</span>`;
    const clearBtn = document.createElement('button');
    clearBtn.className = 'patreon-btn danger';
    clearBtn.style.marginLeft = 'auto';
    clearBtn.textContent = 'Clear all';
    clearBtn.addEventListener('click', () => clearSeats(supporter.userId, supporter.userName));
    head.appendChild(clearBtn);
    sup.appendChild(head);

    supporter.seats.forEach(seat => {
      const row = document.createElement('div');
      row.className = 'patreon-seat';
      row.innerHTML = `<i class="ti ti-brand-discord" aria-hidden="true"></i><span>${seat.guildName}</span><span class="sep">&middot;</span><i class="ti ti-world" aria-hidden="true"></i><span>${seat.world}</span>`;
      const right = document.createElement('span');
      right.className = 'patreon-seat-right';
      right.innerHTML = seat.active ? '<span class="tag active">Active</span>' : '<span class="tag paused">Paused</span>';
      const removeBtn = document.createElement('button');
      removeBtn.className = 'patreon-btn danger';
      removeBtn.textContent = 'Remove';
      removeBtn.addEventListener('click', () => removeSeat(seat.guildId, seat.world, seat.guildName));
      right.appendChild(removeBtn);
      row.appendChild(right);
      sup.appendChild(row);
    });

    el.appendChild(sup);
  });
}

async function patreonAction(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
  if (!res.ok) {
    let message = `Request failed (${res.status})`;
    try {
      const parsed = await res.json();
      if (parsed.error) message = parsed.error;
    } catch (e) { /* body wasn't JSON — keep the default message */ }
    throw new Error(message);
  }
}

async function removeSeat(guildId, world, guildName) {
  if (!confirm(`Remove the seat for ${guildName} · ${world}?`)) return;
  try {
    await patreonAction('DELETE', '/dashboard/patreon/seats', { guildId, world });
    poll();
  } catch (e) {
    alert(e.message);
  }
}

async function clearSeats(userId, userName) {
  if (!confirm(`Clear ALL seats for ${userName || userId}?`)) return;
  try {
    await patreonAction('DELETE', `/dashboard/patreon/users/${encodeURIComponent(userId)}/seats`);
    poll();
  } catch (e) {
    alert(e.message);
  }
}

document.getElementById('patreon-add-toggle').addEventListener('click', () => {
  document.getElementById('patreon-add-form').classList.toggle('open');
});

document.getElementById('patreon-add-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const userId = document.getElementById('patreon-add-userid').value.trim();
  const guildId = document.getElementById('patreon-add-guildid').value.trim();
  const world = document.getElementById('patreon-add-world').value.trim();
  if (!userId || !guildId || !world) return;
  try {
    await patreonAction('POST', '/dashboard/patreon/seats', { userId, guildId, world });
    e.target.reset();
    e.target.classList.remove('open');
    poll();
  } catch (err) {
    alert(err.message);
  }
});

function setupLogToggle(toggleId, panelId, chevronId) {
  document.getElementById(toggleId).addEventListener('click', () => {
    const panel = document.getElementById(panelId);
    const chevron = document.getElementById(chevronId);
    const isHidden = panel.style.display === 'none';
    panel.style.display = isHidden ? 'block' : 'none';
    chevron.classList.toggle('expanded', isHidden);
  });
}
setupLogToggle('log-error-toggle', 'log-errors-panel', 'log-error-chevron');
setupLogToggle('log-warn-toggle', 'log-warnings-panel', 'log-warn-chevron');

// Mobile-only drawer — a no-op on desktop, where .sidebar never gets the
// "open" transform in the first place (see the max-width: 720px block).
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-backdrop').classList.remove('open');
}
document.getElementById('mobile-menu-btn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebar-backdrop').classList.add('open');
});
document.getElementById('sidebar-backdrop').addEventListener('click', closeSidebar);

function render() {
  if (!lastData) return;
  const worlds = lastData.worlds;
  if (!selectedWorld && worlds.length) selectedWorld = sortedWorlds(worlds)[0].name;

  document.getElementById('kpi-worlds').textContent = worlds.length;
  document.getElementById('kpi-discords').textContent = new Set(worlds.flatMap(w => w.discords.map(d => d.id))).size;
  document.getElementById('kpi-population').textContent = worlds.reduce((sum, w) => sum + w.population, 0);

  renderSidebar(worlds);
  renderDetail(worlds);
  renderLanes(lastData.rateLimitLanes);
  renderLogAlerts(lastData.logAlerts);
  renderPatreon(lastData.patreon || []);
  const selected = worlds.find(w => w.name === selectedWorld);
  renderFeed(selected ? selected.recentEvents : []);
}

async function poll() {
  try {
    const res = await fetch('/dashboard/status');
    if (!res.ok) return;
    lastData = await res.json();
    render();
  } catch (e) {
    console.error('status poll failed', e);
  }
}

poll();
setInterval(poll, 10000);
</script>

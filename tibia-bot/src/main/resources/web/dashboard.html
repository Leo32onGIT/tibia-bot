<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Violent Bot - Dashboard</title>
<link rel="icon" type="image/png" href="/status/images/avatar.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
  :root {
    --bg: #0b0d12;
    --sidebar-bg: #0f1218;
    --panel: #12151c;
    --panel-border: #1f2430;
    --text: #d7dce3;
    --text-strong: #e8ebf0;
    --muted: #7c8698;
    --accent: #5b8cff;
    --good: #3ecf8e;
    --warn: #e0a93e;
    --bad: #e0563e;
    --purple: #a78bfa;
    /* Shared with the public landing page (violentbot.xyz). Identifiers and
       numerics are set in mono there; matching it here is what makes the two
       read as one product. */
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    display: flex;
    /* Faint console grid, same 46px cell as the landing page. Only visible in
       main's gutters — the sidebar and every panel paint their own background
       over it. */
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.014) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.014) 1px, transparent 1px);
    background-size: 46px 46px;
  }
  .sidebar {
    width: 200px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--panel-border);
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: sticky;
    top: 0;
  }
  /* The world list is always taller than the viewport (80-odd worlds at 40px),
     so where it ends is a permanent visual edge rather than an edge case. The
     fade makes that edge look deliberate instead of guillotined; it sits over
     the list rather than masking .sidebar so the scrollbar stays crisp. */
  .sidebar::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 34px;
    background: linear-gradient(to top, var(--sidebar-bg), transparent);
    pointer-events: none;
  }
  /* No brand mark here any more — the masthead carries it, and two copies of
     the same wordmark sitting side by side at the top of the page read as a
     mistake. The sidebar is now purely the world list. */
  .world-list { flex: 1; overflow-y: auto; padding: 8px 0; }
  /* The browser default scrollbar is a bright grey slab against this panel's
     near-black, and it is on screen permanently. Thumb is drawn inset via a
     transparent border + background-clip so it reads as a slim pill rather
     than filling the gutter edge to edge. */
  .world-list { scrollbar-width: thin; scrollbar-color: #2a3140 transparent; }
  .world-list::-webkit-scrollbar { width: 10px; }
  .world-list::-webkit-scrollbar-track { background: transparent; }
  .world-list::-webkit-scrollbar-thumb {
    background: #2a3140;
    border-radius: 5px;
    border: 3px solid var(--sidebar-bg);
    background-clip: padding-box;
  }
  .world-list::-webkit-scrollbar-thumb:hover { background: #39435a; background-clip: padding-box; }
  .world-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px;
    border-left: 2px solid transparent;
    cursor: pointer;
    color: var(--muted);
  }
  .world-item i { font-size: 16px; }
  .be-icon { width: 16px; height: 16px; flex-shrink: 0; }
  /* Tinted name chip, the landing page's channel-name treatment. Both the text
     colour and the background tint are set inline from the edits heat ramp
     (see renderSidebar), so the chip reinforces the pressure signal the name
     colour already carried rather than overwriting it with a decorative hue. */
  .world-item .name {
    font-family: var(--mono);
    font-size: 12.5px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 5px;
  }
  .world-item .pop { font-family: var(--mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }
  .world-item:hover { background: rgba(255, 255, 255, 0.03); }
  .world-item.active {
    background: rgba(91, 140, 255, 0.1);
    border-left-color: var(--accent);
    color: var(--text-strong);
  }

  /* Mobile-only: a menu button to open the sidebar as a slide-in drawer, and
     the backdrop behind it. Both display:none here; the media query below
     turns them on — see .sidebar's mobile override for the actual drawer. */
  .mobile-topbar { display: none; align-items: center; gap: 10px; }
  .mobile-menu-btn {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    color: var(--text-strong);
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
  }
  .mobile-topbar-title { font-family: var(--mono); font-size: 13px; font-weight: 600; letter-spacing: -0.01em; color: var(--text-strong); }
  .sidebar-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 25;
  }
  .sidebar-backdrop.open { display: block; }

  main { flex: 1; padding: 20px 28px 40px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }

  /* Page masthead. Rate-limit lane cards used to occupy the left column here;
     they now live in the API throughput panel's Discord row, next to the
     throughput figures they belong with, which freed the width for the three
     headline stats to be read rather than squinted at. The brand mark also
     only ever existed in the sidebar, which is off-canvas on mobile — so this
     is the only header the page has at that size. */
  .kpis-strip {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 14px 18px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 26px;
    flex-shrink: 0;
  }
  .masthead-brand { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 14px; font-weight: 600; letter-spacing: -0.01em; color: var(--text-strong); }
  .masthead-brand img { width: 34px; height: 34px; border-radius: 8px; flex-shrink: 0; }
  .masthead-brand .brand-suffix { color: var(--muted); font-weight: 400; margin-left: 4px; }
  .masthead-sub { display: block; font-size: 10px; font-weight: 400; color: var(--muted); letter-spacing: 0.04em; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .kpi-group { display: flex; gap: 34px; justify-self: center; }
  .kpi { display: flex; flex-direction: column; gap: 5px; }
  .kpi .label { font-family: var(--mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .kpi .label i { font-size: 12px; }
  .kpi .value { color: var(--text-strong); font-family: var(--mono); font-size: 30px; font-weight: 600; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    overflow: hidden;
    flex-shrink: 0;
  }
  /* Reads as the landing page's `## section` rule: mono, wide tracking, an
     accent hash prefix, and the existing bottom border standing in for its
     trailing hairline. Laid out flex-start rather than space-between so the
     ::before hash can't get flung to one end of an otherwise single-item
     title — anything that belongs on the right claims `margin-left: auto`
     for itself instead (see .stale and .patreon-title-actions). */
  .panel-title {
    padding: 12px 16px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--muted);
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    justify-content: flex-start;
    align-items: center;
    gap: 8px;
  }
  .panel-title::before { content: '##'; color: var(--accent); letter-spacing: normal; }
  .panel-title .stale { color: var(--warn); text-transform: none; letter-spacing: normal; font-weight: 400; margin-left: auto; }
  .panel-title-toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .panel-chevron { color: var(--muted); font-size: 12px; flex-shrink: 0; transition: transform 0.15s ease; }
  .panel.collapsed .panel-chevron { transform: rotate(-90deg); }
  .panel.collapsed > *:not(.panel-title) { display: none; }
  .panel.collapsed .panel-title { border-bottom: none; }

  .detail-stats { display: flex; gap: 24px; padding: 16px; flex-wrap: wrap; }
  .detail-stat { display: flex; align-items: center; gap: 8px; }
  .detail-stat i { font-size: 18px; }
  .detail-stat .num { font-size: 16px; font-weight: 600; color: var(--text-strong); font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .detail-stat .num-label { font-size: 11px; color: var(--muted); }

  .discord-list { display: flex; flex-direction: column; gap: 6px; padding: 0 16px 16px; max-height: 320px; overflow-y: auto; }
  .discord-item { display: flex; align-items: center; gap: 8px; font-size: 12px; background: rgba(255, 255, 255, 0.02); padding: 8px 10px; border-radius: 6px; flex-shrink: 0; }
  .discord-item i { color: var(--muted); font-size: 14px; }
  .discord-item .owner-icon { color: var(--warn); font-size: 13px; }
  .discord-item .sep { color: var(--muted); }
  .discord-item .owner { color: var(--muted); }
  .gid { color: var(--muted); font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .discord-item .gid { margin-left: auto; }

  /* API throughput panel — bot > source > detail.
     The bot level is only rendered when more than one bot is connected; with a
     plain single-bot deployment the source rows sit directly in the panel and
     this collapses to two rows, since a lone "which bot" wrapper around
     everything would be pure chrome. Deliberately built from .patreon-sup's
     idiom (bordered card, clickable head, rotating chevron, hidden body) —
     the page already had a component for exactly this, so the extra level of
     nesting introduces no new visual language. */
  .bot-cards { display: flex; flex-direction: column; gap: 10px; padding: 0 16px 16px; }
  .bot-card { border: 1px solid var(--panel-border); border-radius: 8px; overflow: hidden; flex-shrink: 0; }
  .bot-head { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 18px; padding: 10px 13px; background: rgba(255, 255, 255, 0.02); cursor: pointer; }
  .bot-head:hover { background: rgba(255, 255, 255, 0.032); }
  .bot-id { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
  .bot-id .bot-avatar { width: 22px; height: 22px; }
  .bot-name { color: var(--text-strong); font-weight: 600; font-size: 12.5px; }
  /* The fleet roster line — worlds, guilds, last check-in. This is what the
     separate Bots panel used to be: once every bot has its own card here, a
     second table repeating the same roster was pure duplication. Its remaining
     two figures (tracked players, bot id) are on this element's tooltip. */
  .bot-meta { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; cursor: help; }
  /* Roll-up so a collapsed bot still reports its rates — the whole point of
     collapsing it is that you shouldn't have to open it to see if it's alive. */
  .bot-roll { display: flex; gap: 22px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .bot-roll .r { display: flex; flex-direction: column; gap: 3px; text-align: right; }
  .bot-roll .r .v { font-size: 14px; font-weight: 600; color: var(--text-strong); }
  .bot-roll .r .v .unit { font-size: 9px; font-weight: 400; color: var(--muted); margin-left: 2px; }
  .bot-roll .r .k { font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  .bot-chevron { color: var(--muted); font-size: 12px; transition: transform 0.15s ease; }
  .bot-card.expanded .bot-chevron { transform: rotate(180deg); }
  .bot-body { display: none; padding: 10px 12px 12px; }
  .bot-card.expanded .bot-body { display: block; }

  .api-rows { display: flex; flex-direction: column; gap: 8px; }
  .api-rows.top-level { padding: 0 16px 16px; }
  .api-row { background: rgba(255, 255, 255, 0.02); border-radius: 6px; overflow: hidden; flex-shrink: 0; }
  .api-head { position: relative; padding: 13px 15px; cursor: pointer; }
  .api-head:hover { background: rgba(255, 255, 255, 0.022); }
  /* The 10-minute history, drawn edge to edge behind the row rather than in a
     column of its own: at this size the shape is what's legible, not values off
     it, and as a backdrop it costs no width and never competes with a figure. */
  .api-bleed { position: absolute; inset: 0; opacity: 0.55; pointer-events: none; }
  .api-bleed svg { width: 100%; height: 100%; display: block; }
  .api-head-inner { position: relative; display: grid; grid-template-columns: 150px repeat(3, minmax(80px, 1fr)) 20px; align-items: center; gap: 14px; }
  .api-src { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-strong); }
  .api-src i { font-size: 15px; }
  .api-metric .v { font-family: var(--mono); font-size: 16px; font-weight: 600; line-height: 1; color: var(--text-strong); font-variant-numeric: tabular-nums; }
  .api-metric .v .unit { font-size: 10px; font-weight: 400; color: var(--muted); margin-left: 3px; }
  .api-metric .k { font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); margin-top: 3px; }
  .api-chevron { color: var(--muted); font-size: 12px; justify-self: end; transition: transform 0.15s ease; }
  .api-row.expanded .api-chevron { transform: rotate(180deg); }
  .api-detail { display: none; padding: 2px 15px 14px; border-top: 1px solid var(--panel-border); }
  .api-row.expanded .api-detail { display: block; }

  .detail-group { margin-top: 13px; }
  .detail-group-title { font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .detail-group-title .note { text-transform: none; letter-spacing: normal; }
  .detail-group-title::after { content: ''; flex: 1; height: 1px; background: var(--panel-border); }
  .drow { display: grid; grid-template-columns: 145px 1fr 54px 70px 92px; align-items: center; gap: 12px; font-family: var(--mono); font-size: 11.5px; font-variant-numeric: tabular-nums; padding: 5px 0; }
  .drow.dhead { color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; padding-bottom: 6px; }
  .drow .dname { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drow .dname .dim { color: var(--muted); }
  .drow .dnum { text-align: right; color: var(--text-strong); }
  .drow .dmuted { text-align: right; color: var(--muted); }
  .dbar { height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.045); overflow: hidden; }
  .dbar span { display: block; height: 100%; border-radius: 3px; }

  .log-alerts-summary { display: flex; align-items: center; gap: 12px; justify-self: end; }
  .log-alert-count { display: flex; align-items: center; gap: 4px; font-size: 12px; cursor: pointer; }
  .log-alert-count i { font-size: 14px; }
  .log-alert-count.error { color: var(--bad); }
  .log-alert-count.warn { color: var(--warn); }
  .log-alerts-chevron { color: var(--muted); font-size: 14px; transition: transform 0.15s ease; }
  .log-alerts-chevron.expanded { transform: rotate(180deg); }

  .feed { max-height: 320px; overflow-y: auto; }
  .feed-row { padding: 8px 16px; border-top: 1px solid var(--panel-border); font-size: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .feed-row > div:last-child { min-width: 0; word-break: break-word; }
  .feed-row a { color: var(--accent); text-decoration: none; }
  .feed-row a:hover { text-decoration: underline; }
  .feed-row:first-child { border-top: none; }
  .feed-time { color: var(--muted); font-family: var(--mono); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .feed-row.grouped { cursor: pointer; }
  .feed-group-chevron { color: var(--muted); font-size: 12px; transition: transform 0.15s ease; }
  .feed-group-chevron.expanded { transform: rotate(180deg); }
  .feed-subgroup { padding-left: 24px; }
  .feed-subgroup .feed-row { opacity: 0.8; }
  .tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
  .tag.death { background: rgba(224, 86, 62, 0.15); color: var(--bad); }
  .tag.level-up { background: rgba(62, 207, 142, 0.15); color: var(--good); }
  .tag.edit { background: rgba(91, 140, 255, 0.15); color: var(--accent); }
  .tag.error { background: rgba(224, 86, 62, 0.15); color: var(--bad); }
  .tag.warn { background: rgba(224, 169, 62, 0.15); color: var(--warn); }
  .log-alert-logger { color: var(--muted); }
  .log-alert-repeat { background: rgba(255, 255, 255, 0.06); color: var(--text); font-family: var(--mono); font-size: 10px; padding: 1px 7px; border-radius: 10px; font-variant-numeric: tabular-nums; }

  .muted { color: var(--muted); }
  .stale { color: var(--warn); }
  .sep { color: var(--muted); }
  .tag.active { background: rgba(62, 207, 142, 0.15); color: var(--good); }
  .tag.paused { background: rgba(224, 169, 62, 0.15); color: var(--warn); }
  .tag.unconfirmed { background: rgba(255, 255, 255, 0.06); color: var(--muted); }
  /* Which Discord bot serves this guild — only ever present once a
     shared-world-cycle primary's dashboard has secondary data merged in.
     Sits in each guild's own row in the discords list (.discord-item). */
  .bot-avatar { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; }

  .patreon-title-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .patreon-status-filter { background: #2b3242; border: 1px solid var(--panel-border); border-radius: 6px; color: var(--text-strong); font-size: 11px; font-weight: 600; padding: 4px 8px; cursor: pointer; text-transform: none; letter-spacing: normal; }
  .patreon-status-filter:hover { background: #343d51; }
  .patreon-search-row { padding: 0 16px 12px; }
  .patreon-search-input { width: 100%; background: rgba(255, 255, 255, 0.02); border: 1px solid var(--panel-border); border-radius: 6px; color: var(--text); font-size: 12px; padding: 6px 10px; }
  .patreon-search-input::placeholder { color: var(--muted); }
  .patreon-search-input:focus { outline: none; border-color: var(--accent); }
  .patreon-list { display: flex; flex-direction: column; gap: 10px; padding: 0 16px 16px; max-height: 400px; overflow-y: auto; }
  .patreon-sup { border: 1px solid var(--panel-border); border-radius: 8px; overflow: hidden; flex-shrink: 0; }
  .patreon-sup-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: rgba(255, 255, 255, 0.02); flex-wrap: wrap; cursor: pointer; }
  .patreon-sup-head i { color: var(--warn); font-size: 14px; }
  .patreon-sup-chevron { color: var(--muted) !important; font-size: 12px; flex-shrink: 0; transition: transform 0.15s ease; }
  .patreon-sup.expanded .patreon-sup-chevron { transform: rotate(90deg); }
  .patreon-sup-name { color: var(--text-strong); font-weight: 600; font-size: 12px; }
  .patreon-sup-discord { color: var(--purple); font-size: 11px; display: inline-flex; align-items: center; gap: 4px; }
  .patreon-sup-discord i { color: var(--purple) !important; font-size: 12px; }
  .patreon-sup-extra { font-size: 11px; font-variant-numeric: tabular-nums; }
  .patreon-sup-extra.positive { color: var(--good); }
  .patreon-sup-extra.negative { color: var(--bad); }
  .patreon-sup-details { display: none; }
  .patreon-sup.expanded .patreon-sup-details { display: block; }
  .patreon-empty { padding: 8px 12px 10px 34px; font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .patreon-seat { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 7px 12px 7px 34px; border-top: 1px solid var(--panel-border); flex-wrap: wrap; }
  .patreon-seat i { color: var(--muted); font-size: 13px; }
  .patreon-seat-text { color: var(--text); }
  .patreon-sup.unconfirmed .patreon-sup-name,
  .patreon-sup.unconfirmed .patreon-sup-head i,
  .patreon-sup.unconfirmed .patreon-seat-text { color: var(--muted); }
  .patreon-seat-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .patreon-btn { background: transparent; border: 1px solid var(--panel-border); border-radius: 6px; color: var(--muted); font-size: 11px; padding: 3px 8px; cursor: pointer; }
  .patreon-btn:hover { color: var(--text-strong); border-color: var(--muted); }
  .patreon-btn.danger:hover { color: var(--bad); border-color: var(--bad); }
  .patreon-add-toggle {
    background: #2b3242; border: 1px solid var(--panel-border); border-radius: 6px; color: var(--text-strong);
    cursor: pointer; width: 26px; height: 26px; padding: 0; font-size: 14px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .patreon-add-toggle:hover { background: #343d51; }
  .patreon-add-form { display: none; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--panel-border); flex-wrap: wrap; }
  .patreon-add-form.open { display: flex; }
  .patreon-add-form input { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--panel-border); border-radius: 6px; color: var(--text); font-size: 12px; padding: 6px 10px; flex: 1; min-width: 120px; }
  /* The one genuinely primary action here, so it gets the landing page's solid
     accent treatment rather than the grey used for every secondary control. */
  .patreon-add-form button[type="submit"] { background: var(--accent); border: 1px solid var(--accent); border-radius: 6px; color: var(--bg); font-size: 12px; font-weight: 600; padding: 6px 14px; cursor: pointer; }
  .patreon-add-form button[type="submit"]:hover { filter: brightness(1.08); }

  /* First break: the API panel's wide grids. The source row's five columns and
     the detail rows' five columns both stop fitting well before the phone
     breakpoint below, so they reflow here rather than being squeezed. The
     detail tables drop their cumulative-total column — it is the one figure
     that is reference rather than signal, and the rate beside it is what you
     came for. */
  /* The masthead loses its three-across layout well before the phone
     breakpoint, because the 200px sidebar is still taking its width here: the
     brand, three 30px figures and the alert pair need more room than a ~1000px
     window leaves. Brand and alerts keep the top row; the figures drop to their
     own full-width centered row rather than being crushed. */
  @media (max-width: 1040px) {
    .kpis-strip { grid-template-columns: 1fr auto; row-gap: 16px; }
    .kpi-group { grid-column: 1 / -1; justify-self: center; }
  }

  @media (max-width: 900px) {
    .api-head-inner { grid-template-columns: 1fr 1fr 20px; row-gap: 12px; }
    /* Keep only the leading figure — queue depth for a lane, share for a
       breakdown — since that is the signal and the rest is reference. Dropped
       positionally rather than by class so a header row (whose cells are all
       .dnum) loses exactly the same columns as the body rows it labels;
       matching on .dmuted left headers one cell wider than their own grid,
       which wrapped them onto a second line. */
    .drow { grid-template-columns: 110px 1fr 58px; }
    .drow > *:nth-last-child(-n+2) { display: none; }
    .bot-head { grid-template-columns: 1fr auto; row-gap: 12px; }
    .bot-roll { gap: 16px; }
  }

  /* Below this, the fixed 200px side-by-side sidebar and the single-row
     masthead both stop working: the sidebar eats half a phone screen, and the
     masthead's three grid columns have nowhere to shrink to. The sidebar
     becomes an off-canvas drawer (opened via .mobile-topbar's button,
     closed via the backdrop or picking a world) instead of taking any
     permanent screen space; the masthead stacks into one centered column. */
  @media (max-width: 720px) {
    .mobile-topbar { display: flex; }
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 260px;
      max-width: 80vw;
      z-index: 30;
      transform: translateX(-100%);
      transition: transform 0.2s ease;
    }
    .sidebar.open { transform: translateX(0); }

    main { padding: 12px 12px 32px; gap: 14px; }

    .kpis-strip { grid-template-columns: 1fr; gap: 16px; }
    .masthead-brand, .kpi-group, .log-alerts-summary { justify-self: center; }
    .kpi-group { flex-wrap: wrap; justify-content: center; gap: 22px; }
    .kpi .value { font-size: 24px; }

    .detail-stats { gap: 12px 20px; padding: 12px; }
    .discord-item { flex-wrap: wrap; }
    .discord-item .gid { margin-left: 0; width: 100%; }

    .panel-title { flex-wrap: wrap; gap: 8px; }

    .feed, .discord-list, .patreon-list { max-height: 260px; }

    .patreon-seat-right { margin-left: 0; width: 100%; justify-content: flex-end; }
  }
</style>
</head>
<body>
<div class="sidebar-backdrop" id="sidebar-backdrop"></div>
<aside class="sidebar" id="sidebar">
  <div class="world-list" id="world-list"></div>
</aside>
<main>
  <div class="mobile-topbar">
    <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle world list"><i class="ti ti-menu-2" aria-hidden="true"></i></button>
    <span class="mobile-topbar-title">Violent Bot</span>
  </div>
  <div class="kpis-strip">
    <div class="masthead-brand">
      <img src="/status/images/avatar.png" alt="">
      <span>Violent Bot<span class="brand-suffix">/status</span>
        <span class="masthead-sub" id="masthead-sub">&nbsp;</span>
      </span>
    </div>
    <div class="kpi-group">
      <div class="kpi"><span class="label"><i class="ti ti-world" aria-hidden="true"></i>Worlds</span><span class="value" id="kpi-worlds">–</span></div>
      <div class="kpi"><span class="label"><i class="ti ti-brand-discord" aria-hidden="true"></i>Discords</span><span class="value" id="kpi-discords">–</span></div>
      <div class="kpi"><span class="label"><i class="ti ti-users" aria-hidden="true"></i>Tracked Players</span><span class="value" id="kpi-population">–</span></div>
    </div>
    <div class="log-alerts-summary">
      <span class="log-alert-count error" id="log-error-toggle"><i class="ti ti-alert-circle" aria-hidden="true"></i><span id="log-error-count">0 errors</span><i class="ti ti-chevron-down log-alerts-chevron" id="log-error-chevron" aria-hidden="true"></i></span>
      <span class="log-alert-count warn" id="log-warn-toggle"><i class="ti ti-alert-triangle" aria-hidden="true"></i><span id="log-warn-count">0 warnings</span><i class="ti ti-chevron-down log-alerts-chevron" id="log-warn-chevron" aria-hidden="true"></i></span>
    </div>
  </div>

  <div class="panel" id="api-panel">
    <div class="panel-title">
      <span class="panel-title-toggle"><i class="ti ti-chevron-down panel-chevron" aria-hidden="true"></i>API throughput</span>
    </div>
    <div id="api-body"></div>
  </div>

  <div class="panel" id="log-errors-panel" style="display:none;">
    <div class="panel-title">Errors</div>
    <div class="feed" id="log-errors-list"></div>
  </div>

  <div class="panel" id="log-warnings-panel" style="display:none;">
    <div class="panel-title">Warnings</div>
    <div class="feed" id="log-warnings-list"></div>
  </div>

  <div class="panel">
    <div class="panel-title">
      <span class="panel-title-toggle"><i class="ti ti-chevron-down panel-chevron" aria-hidden="true"></i><span id="detail-title">World</span></span>
      <span class="stale" id="detail-stale"></span>
    </div>
    <div class="detail-stats" id="detail-stats"></div>
    <div class="discord-list" id="detail-discords"></div>
  </div>

  <div class="panel">
    <div class="panel-title">
      <span class="panel-title-toggle"><i class="ti ti-chevron-down panel-chevron" aria-hidden="true"></i>Recent activity</span>
    </div>
    <div class="feed" id="feed"></div>
  </div>

  <div class="panel">
    <div class="panel-title">
      <span class="panel-title-toggle"><i class="ti ti-chevron-down panel-chevron" aria-hidden="true"></i>Patreon supporters</span>
      <div class="patreon-title-actions">
        <select class="patreon-status-filter" id="patreon-status-filter" aria-label="Filter supporters by status">
          <option value="active">Active</option>
          <option value="all">All</option>
          <option value="former_patron">Former</option>
          <option value="declined_patron">Declined</option>
        </select>
        <button class="patreon-add-toggle" id="patreon-extra-toggle" type="button" aria-label="Grant extra seats" title="Grant extra seats"><i class="ti ti-adjustments" aria-hidden="true"></i></button>
      </div>
    </div>
    <div class="detail-stats" id="patreon-stats"></div>
    <div class="patreon-search-row">
      <input type="search" id="patreon-search" class="patreon-search-input" placeholder="Search supporters by name or Discord username/ID…">
    </div>
    <div class="patreon-list" id="patreon-list"></div>
    <form class="patreon-add-form" id="patreon-extra-form">
      <input type="text" id="patreon-extra-username" placeholder="Discord username, ID or @mention" required>
      <input type="number" id="patreon-extra-count" placeholder="Extra seats (can be negative)" required>
      <button type="submit">Set extra seats</button>
    </form>
  </div>
</main>

<script>
let lastData = null;
let selectedWorld = null;

function timeAgo(iso) {
  if (!iso) return '–';
  const seconds = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
  if (seconds < 60) return `${seconds}s ago`;
  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) return `${minutes}m ago`;
  return `${Math.floor(minutes / 60)}h ago`;
}

function sortedWorlds(worlds) {
  return worlds.slice().sort((a, b) => a.name.localeCompare(b.name));
}

// Shared 10-level heat ramp (green -> yellow -> orange -> red), used for both
// the sidebar's per-world edits heat and the rate-limit lane bars/labels —
// one gradient, two different 0-1 ratios fed into it. Quantized to exactly
// 10 discrete steps (not a smooth continuous gradient) so the color a given
// value maps to is stable and predictable, not a slightly-different shade
// every time the underlying number wiggles by one.
const HEAT_STOPS = [
  [62, 207, 142],  // green
  [224, 194, 62],  // yellow
  [207, 122, 46],  // orange
  [168, 54, 42]    // red
];

function heatRgbForRatio(ratio) {
  const clamped = Math.min(1, Math.max(0, ratio));
  const level = Math.min(9, Math.floor(clamped * 10)); // 10 discrete levels: 0-9
  const t = level / 9;
  const segments = HEAT_STOPS.length - 1;
  const segPos = t * segments;
  const segIndex = Math.min(segments - 1, Math.floor(segPos));
  const segT = segPos - segIndex;
  const [r1, g1, b1] = HEAT_STOPS[segIndex];
  const [r2, g2, b2] = HEAT_STOPS[segIndex + 1];
  const lerp = (a, b) => Math.round(a + (b - a) * segT);
  return [lerp(r1, r2), lerp(g1, g2), lerp(b1, b2)];
}

function heatColorForRatio(ratio) {
  const [r, g, b] = heatRgbForRatio(ratio);
  return `rgb(${r}, ${g}, ${b})`;
}

// Edits (15m) is what actually feeds the online-list rate-limit lane, so it
// stands in for per-world queue pressure — there's no true per-world queue
// depth tracked today, only bot-wide lane totals (see renderLaneGroup). Ratio
// against a fixed max (not relative to the busiest world shown), so a given
// edit count always means the same thing regardless of how busy the bot is
// overall.
function heatRgbForEdits(edits) {
  return heatRgbForRatio(edits / 250);
}

const BE_ICON_GREEN = '/status/images/be-icon-green.gif';
const BE_ICON_YELLOW = '/status/images/be-icon-yellow.gif';

function renderSidebar(worlds) {
  const el = document.getElementById('world-list');
  el.innerHTML = '';
  sortedWorlds(worlds).forEach(w => {
    const div = document.createElement('div');
    div.className = 'world-item' + (w.name === selectedWorld ? ' active' : '');
    // Text colour and chip tint both come off the edits heat ramp — same hue,
    // the background just at low alpha (see .world-item .name).
    const [hr, hg, hb] = heatRgbForEdits(w.edits15m);
    const nameStyle = `color:rgb(${hr}, ${hg}, ${hb});background:rgba(${hr}, ${hg}, ${hb}, 0.12)`;
    const beIcon = w.battleyeGreen ? BE_ICON_GREEN : BE_ICON_YELLOW;
    const beLabel = w.battleyeGreen ? 'Green BattlEye' : 'Yellow BattlEye';
    div.innerHTML = `<img class="be-icon" src="${beIcon}" alt="${beLabel}" title="${beLabel}"><span class="name" style="${nameStyle}" title="${w.edits15m} edits in the last 15m">${w.name}</span><span class="pop">${w.population}</span>`;
    div.addEventListener('click', () => { selectedWorld = w.name; render(); closeSidebar(); });
    el.appendChild(div);
  });
}

function renderDetail(worlds) {
  const world = worlds.find(w => w.name === selectedWorld) || sortedWorlds(worlds)[0];
  if (!world) return;

  document.getElementById('detail-title').textContent = world.pvpType ? `${world.name} - ${world.pvpType}` : world.name;
  document.getElementById('detail-stale').textContent = world.lastPollAt ? '' : 'no data yet';

  document.getElementById('detail-stats').innerHTML = `
    <div class="detail-stat"><i class="ti ti-users" style="color:var(--accent)" aria-hidden="true"></i><div><div class="num">${world.population}</div><div class="num-label">Online</div></div></div>
    <div class="detail-stat"><i class="ti ti-skull" style="color:var(--bad)" aria-hidden="true"></i><div><div class="num">${world.deaths15m}</div><div class="num-label">Deaths (15m)</div></div></div>
    <div class="detail-stat"><i class="ti ti-arrow-big-up-lines" style="color:var(--good)" aria-hidden="true"></i><div><div class="num">${world.levels15m}</div><div class="num-label">Levels (15m)</div></div></div>
    <div class="detail-stat"><i class="ti ti-edit" style="color:var(--warn)" aria-hidden="true"></i><div><div class="num">${world.edits15m}</div><div class="num-label">Edits (15m)</div></div></div>
    <div class="detail-stat" title="Average gap between a death happening and this bot first seeing it, over ${world.deathDetections15m || 0} deaths. Includes delays upstream of the bot (Tibia publishing the death, TibiaData scraping it, its cache holding the sheet), so read it for changes rather than as an absolute.${world.deathLagMax15m ? ` Worst in this window: ${fmtLag(world.deathLagMax15m)}.` : ''}"><i class="ti ti-hourglass-low" style="color:var(--bad)" aria-hidden="true"></i><div><div class="num">${world.deathDetections15m ? fmtLag(world.deathLagAvg15m) : '—'}</div><div class="num-label">Death lag (15m)</div></div></div>
    <div class="detail-stat"><i class="ti ti-clock" style="color:var(--muted)" aria-hidden="true"></i><div><div class="num">${timeAgo(world.lastPollAt)}</div><div class="num-label">Last poll</div></div></div>
  `;

  document.getElementById('detail-discords').innerHTML = world.discords.length
    ? world.discords.map(d => {
        // Only present once a shared-world-cycle primary's dashboard has
        // secondary data merged in — omitted entirely on a plain deployment.
        const botAvatar = d.bot ? `<img class="bot-avatar" src="${d.bot.avatarUrl}" alt="${d.bot.name}" title="${d.bot.name} (${d.bot.userId})">` : '';
        return `<div class="discord-item">${botAvatar}<span>${d.name}</span><span class="sep">&middot;</span><i class="ti ti-crown owner-icon" aria-hidden="true"></i><span class="owner">${d.owner}</span><span class="gid">${d.id}</span></div>`;
      }).join('')
    : '<div class="muted">No discords tracking this world</div>';
}

// Display names only — the JSON keys ("background", "online-list") stay as
// the actual lane identifiers, matching RateLimitedSender's own labels.
function laneDisplayName(key) {
  if (key === 'background') return 'General';
  if (key === 'online-list') return 'Online Lists';
  return key;
}

// The single worst avg wait across a lane's labels — full per-label detail
// (count, individual wait times) is only shown in the KPI header card's
// hover tooltip, to keep both this and the Bots panel's row compact.
function laneMaxWaitMs(lane) {
  return Object.values(lane.labels).reduce((max, s) => Math.max(max, s.avgWaitMs), 0);
}

// A queue depth's severity on the shared heat ramp. "general" tends to stay
// small so 0-100 shows real movement; online-list can genuinely back up into
// the hundreds/thousands under load, so it needs the wider 0-1000 scale to
// stay meaningful instead of pinning at 100%.
function laneDepthRatio(name, queueDepth) {
  return Math.min(1, queueDepth / (name === 'background' ? 100 : 1000));
}

function fmtCount(n) {
  return Math.round(n).toLocaleString('en-US');
}

function fmtCompact(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e5 ? 0 : 1) + 'k';
  return Math.round(n).toString();
}

// Sub-1/s traffic still needs a digit to show it's moving; a few hundred a
// second doesn't, and the decimal there is just noise that changes every poll.
function fmtRate(r) {
  return r >= 100 ? Math.round(r).toString() : r.toFixed(1);
}

// Queue waits span four orders of magnitude here — the general lane sits around
// 100ms while a saturated online-list lane runs to a minute or two — so a flat
// "Nms" prints things like 109000ms, which nobody reads as "just under two
// minutes". Switches unit at one second.
function fmtWait(ms) {
  if (ms < 1000) return `${Math.round(ms)}ms`;
  const seconds = ms / 1000;
  if (seconds < 60) return `${seconds.toFixed(seconds < 10 ? 1 : 0)}s`;
  return `${Math.floor(seconds / 60)}m ${Math.round(seconds % 60)}s`;
}

// Death lag arrives in seconds, but fmtWait is the formatter with the right
// granularity for it — "5m 30s", where fmtDuration would round to "5m" and
// hide the ~30s shift that is the whole point of watching this number.
const fmtLag = (seconds) => fmtWait(seconds * 1000);

function fmtDuration(seconds) {
  if (seconds < 60) return `${Math.floor(seconds)}s`;
  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) return `${minutes}m`;
  const hours = Math.floor(minutes / 60);
  return `${hours}h ${minutes % 60}m`;
}

// Filled-area sparkline stretched to its container, drawn as the row's
// backdrop. preserveAspectRatio="none" plus a non-scaling stroke lets one
// viewBox fill any row width without the line thickening with it.
function sparklineSvg(history, color) {
  if (!history || history.length < 2) return '';
  const w = 300, h = 60;
  const max = Math.max(...history) * 1.15;
  const min = Math.min(...history) * 0.85;
  const span = Math.max(1e-6, max - min);
  const points = history.map((v, i) =>
    `${((i / (history.length - 1)) * w).toFixed(1)},${(h - ((v - min) / span) * h).toFixed(1)}`
  ).join(' ');
  // Gradient ids must be unique per instance or every sparkline on the page
  // resolves to whichever one rendered last.
  const id = 'spark-' + Math.random().toString(36).slice(2, 9);
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" height="${h}" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <polygon points="0,${h} ${points} ${w},${h}" fill="url(#${id})"/>
    <polyline points="${points}" fill="none" stroke="${color}" stroke-width="1.1" stroke-opacity="0.55"
      vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
  </svg>`;
}

// Which bot cards and source rows are open. Keyed rather than read off the DOM
// so it survives the poll cycle rebuilding this panel from scratch every 10s —
// same approach as expandedSupporters on the Patreon panel.
const expandedApiRows = new Set();

const API_SOURCES = [
  { key: 'discord', label: 'Discord', icon: 'ti-brand-discord', color: '#a78bfa' },
  { key: 'tibiadata', label: 'TibiaData', icon: 'ti-api', color: '#5b8cff' }
];

// One breakdown table. `share` is normally computed within the group, which is
// right for a dimension that covers every call (status, endpoint). Pass
// `denominator` for a group that is deliberately partial — the operation
// breakdown hides its catch-all row, so sharing against the visible rows would
// inflate each one to cover traffic it didn't do. Such a group won't sum to
// 100%, which is the honest result.
function renderDetailGroup(title, note, nameHeader, rows, color, denominator, keepOrder) {
  if (!rows.length) return '';
  const groupTotal = denominator || rows.reduce((sum, r) => sum + r.total, 0) || 1;
  const ordered = keepOrder ? rows.slice() : rows.slice().sort((a, b) => b.total - a.total);
  const body = ordered.map(r => {
    const share = r.total / groupTotal;
    const pct = share < 0.001 ? '&lt;1%' : `${(share * 100).toFixed(share < 0.1 ? 1 : 0)}%`;
    return `<div class="drow">
      <span class="dname" title="${r.name}">${r.name}${r.note ? ` <span class="dim">${r.note}</span>` : ''}</span>
      <span class="dbar"><span style="width:${Math.max(1, share * 100).toFixed(1)}%;background:${r.color || color}"></span></span>
      <span class="dnum"${r.color ? ` style="color:${r.color}"` : ''}>${pct}</span>
      <span class="dnum">${fmtRate(r.perSecond)}</span>
      <span class="dmuted">${fmtCount(r.total)}</span>
    </div>`;
  }).join('');
  return `<div class="detail-group">
    <div class="detail-group-title">${title}${note ? ` <span class="note">${note}</span>` : ''}</div>
    <div class="drow dhead"><span>${nameHeader}</span><span></span><span class="dnum">Share</span><span class="dnum">Per sec</span><span class="dnum">Total</span></div>
    ${body}
  </div>`;
}

function dimensionRows(throughput, dimension) {
  const values = (throughput.dimensions || {})[dimension] || {};
  return Object.entries(values).map(([name, s]) => ({ name, total: s.total, perSecond: s.perSecond }));
}

// HTTP statuses colour-coded so a rising error share reads at a glance rather
// than needing the number to be parsed. 2xx good, 4xx that we caused (429) bad,
// 5xx and connection failures warn — an upstream wobble is not our bug, but it
// is our problem.
function statusColor(name) {
  if (/^2/.test(name)) return 'var(--good)';
  if (name === '429') return 'var(--bad)';
  if (/^5/.test(name) || name === 'failed') return 'var(--warn)';
  return null;
}

function renderLaneGroup(lanes) {
  const entries = Object.entries(lanes || {});
  if (!entries.length) return '';
  const rows = entries.map(([name, lane]) => {
    const color = heatColorForRatio(laneDepthRatio(name, lane.queueDepth));
    return `<div class="drow">
      <span class="dname">${laneDisplayName(name)}</span>
      <span class="dbar"><span style="width:${(laneDepthRatio(name, lane.queueDepth) * 100).toFixed(1)}%;background:${color}"></span></span>
      <span class="dnum" style="color:${color}">${lane.queueDepth}</span>
      <span class="dnum" style="color:${color}">${fmtWait(laneMaxWaitMs(lane))}</span>
      <span class="dmuted">${fmtCount(lane.totalDropped)}</span>
    </div>`;
  }).join('');
  return `<div class="detail-group">
    <div class="detail-group-title">Rate-limit lanes</div>
    <div class="drow dhead"><span>Lane</span><span></span><span class="dnum">Queued</span><span class="dnum">Avg wait</span><span class="dnum">Dropped</span></div>
    ${rows}
  </div>`;
}

// Cache-age buckets read as a lifecycle, not a leaderboard: the request that
// refilled the upstream entry, then that entry ageing out bucket by bucket,
// then the responses that never had an age to report. Sorting these by size
// (the default for detail groups) would scramble a histogram, so they keep
// this order instead. Anything unrecognised sorts to the end rather than
// silently vanishing.
const CACHE_AGE_ORDER = ['fresh', '0-59s', '60-119s', '120-179s', '180-239s', '240-299s', '300-359s', '360s+', 'error'];

// 'fresh' is the only bucket that actually learned something new, so it reads
// as the good one; 'error' is a wasted call. The ageing buckets are deliberately
// uncoloured — a high age is not a fault, it is just what a cache does.
function cacheAgeColor(name) {
  if (name === 'fresh') return 'var(--good)';
  if (name === 'error') return 'var(--warn)';
  return null;
}

function cacheAgeRows(throughput) {
  const rank = (n) => { const i = CACHE_AGE_ORDER.indexOf(n); return i === -1 ? CACHE_AGE_ORDER.length : i; };
  return dimensionRows(throughput, 'cacheAge')
    .sort((a, b) => rank(a.name) - rank(b.name))
    .map(r => ({ ...r, color: cacheAgeColor(r.name) }));
}

function renderApiDetail(sourceKey, throughput, lanes) {
  if (sourceKey === 'discord') {
    // Catch-all dropped from the view (see DiscordApiRoute.Other): it is
    // gateway/user GETs, reaction PUTs and channel creation, all a rounding
    // error next to the named five. It stays in the data so the dimension still
    // reconciles to the total, which is why share is taken against that total.
    const operations = dimensionRows(throughput, 'operation').filter(r => r.name !== 'other');
    return renderLaneGroup(lanes)
      + renderDetailGroup('By operation', '', 'Call', operations, '#a78bfa', throughput.total)
      + renderDetailGroup('By response', '', 'Status',
          dimensionRows(throughput, 'status').map(r => ({ ...r, color: statusColor(r.name) })), '#a78bfa');
  }
  return renderDetailGroup('By endpoint', '', 'Endpoint', dimensionRows(throughput, 'endpoint'), '#5b8cff')
    + renderDetailGroup('By response', '', 'Status',
        dimensionRows(throughput, 'status').map(r => ({ ...r, color: statusColor(r.name) })), '#5b8cff')
    + renderDetailGroup('By cache age', 'how old the upstream copy was', 'Age',
        cacheAgeRows(throughput), '#5b8cff', throughput.total, true);
}

function renderApiSourceRow(bot, source, throughput, lanes) {
  const key = `src:${bot.bot.userId}:${source.key}`;
  const expanded = expandedApiRows.has(key);
  const row = document.createElement('div');
  row.className = 'api-row' + (expanded ? ' expanded' : '');

  // Below a full hour of history the per-hour figure is a partial count, not a
  // rate — labelled as such rather than shown as a confident number that is
  // really "everything since this bot restarted".
  const partialHour = throughput.observedSeconds < 3600;
  const hourLabel = partialHour ? `Last ${fmtDuration(throughput.observedSeconds)}` : 'Per hour';

  const head = document.createElement('div');
  head.className = 'api-head';
  head.innerHTML = `
    <div class="api-bleed">${sparklineSvg(throughput.history, source.color)}</div>
    <div class="api-head-inner">
      <div class="api-src"><i class="ti ${source.icon}" style="color:${source.color}" aria-hidden="true"></i>${source.label}</div>
      <div class="api-metric"><div class="v">${fmtRate(throughput.perSecond)}<span class="unit">/s</span></div><div class="k">Per second</div></div>
      <div class="api-metric"><div class="v">${fmtCompact(throughput.perHour)}${partialHour ? '' : '<span class="unit">/h</span>'}</div><div class="k">${hourLabel}</div></div>
      <div class="api-metric"><div class="v">${fmtCount(throughput.total)}</div><div class="k">Total</div></div>
      <i class="ti ti-chevron-down api-chevron" aria-hidden="true"></i>
    </div>
  `;
  head.addEventListener('click', (e) => {
    e.stopPropagation();
    if (expandedApiRows.has(key)) expandedApiRows.delete(key);
    else expandedApiRows.add(key);
    row.classList.toggle('expanded');
  });
  row.appendChild(head);

  const detail = document.createElement('div');
  detail.className = 'api-detail';
  detail.innerHTML = renderApiDetail(source.key, throughput, lanes);
  row.appendChild(detail);
  return row;
}

function renderApiSourceRows(bot) {
  const wrap = document.createElement('div');
  wrap.className = 'api-rows';
  if (!bot.apiThroughput) {
    // A secondary still running a build from before these counters existed —
    // see StatusRoute.buildBotsJson. Explicitly "no data", never a 0/s that
    // would read as a bot sitting idle.
    wrap.innerHTML = '<div class="muted" style="padding:4px 2px;">No throughput data published by this bot</div>';
    return wrap;
  }
  API_SOURCES.forEach(source => {
    const throughput = bot.apiThroughput[source.key];
    if (throughput) wrap.appendChild(renderApiSourceRow(bot, source, throughput, bot.rateLimitLanes));
  });
  return wrap;
}

// The masthead's one-line subtitle: uptime, fleet size, combined rate. Reads
// this process's own startedAt (the primary is always bots[0] — see
// StatusRoute.buildBotsJson, which puts `own` first), not a secondary's.
function renderMastheadSub(bots) {
  const el = document.getElementById('masthead-sub');
  const own = bots[0];
  const parts = [];
  if (own && own.startedAt) {
    parts.push(`${fmtDuration((Date.now() - new Date(own.startedAt).getTime()) / 1000)} uptime`);
  }
  // Deliberately no throughput figure here — see fleetRate. The panel title
  // below carries it, split by source, which is the only form of it that means
  // anything.
  if (bots.length > 1) parts.push(`${bots.length} bots`);
  el.innerHTML = parts.join(' &middot; ') || '&nbsp;';
}

function renderApiThroughput(bots) {
  const body = document.getElementById('api-body');
  body.innerHTML = '';
  if (!bots.length) {
    body.innerHTML = '<div class="muted" style="padding:0 16px 16px;">No bots reporting</div>';
    document.getElementById('api-summary').textContent = '';
    return;
  }

  // One bot: the source rows go straight into the panel. A lone "which bot"
  // wrapper around everything would be a level of nesting that answers a
  // question nobody has on a single-bot deployment — same reasoning as the
  // Bots panel only appearing at 2+.
  if (bots.length < 2) {
    const rows = renderApiSourceRows(bots[0]);
    rows.classList.add('top-level');
    body.appendChild(rows);
    return;
  }

  const cards = document.createElement('div');
  cards.className = 'bot-cards';
  bots.forEach(bot => {
    const key = `bot:${bot.bot.userId}`;
    const expanded = expandedApiRows.has(key);
    const card = document.createElement('div');
    card.className = 'bot-card' + (expanded ? ' expanded' : '');

    const roleLabel = bot.bot.role === 'primary' ? 'Primary' : bot.bot.role === 'secondary' ? 'Secondary' : '';
    const throughput = bot.apiThroughput || {};
    // En dash, not 0, wherever a bot published nothing — a real zero here would
    // read as a bot that is connected but doing nothing, which is a completely
    // different (and alarming) thing from one running a build that predates
    // these counters.
    const rollFor = k => throughput[k] ? `${fmtRate(throughput[k].perSecond)}<span class="unit">/s</span>` : '–';
    const combinedTotal = bot.apiThroughput
      ? fmtCompact(API_SOURCES.reduce((sum, s) => sum + ((throughput[s.key] || {}).total || 0), 0))
      : '–';

    const head = document.createElement('div');
    head.className = 'bot-head';
    head.innerHTML = `
      <div class="bot-id">
        <img class="bot-avatar" src="${bot.bot.avatarUrl}" alt="" title="${bot.bot.name} (${bot.bot.userId})">
        <span class="bot-name">${bot.bot.name}</span>
        ${roleLabel ? `<span class="tag ${bot.bot.role === 'primary' ? 'active' : 'unconfirmed'}">${roleLabel}</span>` : ''}
        <span class="bot-meta" title="${bot.bot.userId} &middot; ${fmtCount(bot.population)} tracked players">&middot; ${bot.worldCount} worlds &middot; ${bot.discordCount} discords &middot; ${timeAgo(bot.publishedAt)}</span>
      </div>
      <div class="bot-roll">
        <div class="r"><div class="v">${rollFor('discord')}</div><div class="k">Discord</div></div>
        <div class="r"><div class="v">${rollFor('tibiadata')}</div><div class="k">TibiaData</div></div>
        <div class="r"><div class="v">${combinedTotal}</div><div class="k">Total</div></div>
      </div>
      <i class="ti ti-chevron-down bot-chevron" aria-hidden="true"></i>
    `;
    head.addEventListener('click', () => {
      if (expandedApiRows.has(key)) expandedApiRows.delete(key);
      else expandedApiRows.add(key);
      card.classList.toggle('expanded');
    });
    card.appendChild(head);

    const bodyEl = document.createElement('div');
    bodyEl.className = 'bot-body';
    bodyEl.appendChild(renderApiSourceRows(bot));
    card.appendChild(bodyEl);
    cards.appendChild(card);
  });
  body.appendChild(cards);
}

function renderFeedRow(ev, groupCount) {
  const row = document.createElement('div');
  row.className = 'feed-row';
  const badgeAndChevron = groupCount
    ? `<span class="log-alert-repeat">&times;${groupCount}</span><i class="ti ti-chevron-down feed-group-chevron" aria-hidden="true"></i>`
    : '';
  row.innerHTML = `
    <div class="feed-time">${timeAgo(ev.at)}</div>
    <span class="tag ${ev.tag}">${ev.tag}</span>
    <div>${ev.text}</div>
    ${badgeAndChevron}
  `;
  return row;
}

// Consecutive level-ups posted to the same discord collapse into one row
// (badge shows the count, click to expand) — a busy world can otherwise
// bury everything else under a wall of near-identical "N players leveled
// up" lines, one per polling tick. Only adjacent same-discord level-ups
// group; anything else (including a level-up to a different discord, or
// any other tag) always starts a fresh row.
function groupFeedEvents(events) {
  const groups = [];
  events.forEach(ev => {
    const discordKey = ev.tag === 'level-up' ? (ev.text.match(/Discord ID: (\d+)/) || [])[1] : null;
    const last = groups[groups.length - 1];
    if (last && discordKey && last.discordKey === discordKey) {
      last.items.push(ev);
    } else {
      groups.push({ discordKey, items: [ev] });
    }
  });
  return groups;
}

function renderFeed(events) {
  const el = document.getElementById('feed');
  el.innerHTML = '';
  if (events.length === 0) {
    el.innerHTML = '<div class="feed-row muted">No recent activity for this world</div>';
    return;
  }
  groupFeedEvents(events).forEach(group => {
    if (group.items.length === 1) {
      el.appendChild(renderFeedRow(group.items[0]));
      return;
    }
    const row = renderFeedRow(group.items[0], group.items.length);
    row.classList.add('grouped');
    const subList = document.createElement('div');
    subList.className = 'feed-subgroup';
    subList.style.display = 'none';
    group.items.forEach(ev => subList.appendChild(renderFeedRow(ev)));
    row.addEventListener('click', () => {
      const isHidden = subList.style.display === 'none';
      subList.style.display = isHidden ? 'block' : 'none';
      row.querySelector('.feed-group-chevron').classList.toggle('expanded', isHidden);
    });
    el.appendChild(row);
    el.appendChild(subList);
  });
}

function renderLogList(elementId, events, emptyMessage) {
  const el = document.getElementById(elementId);
  el.innerHTML = '';
  if (events.length === 0) {
    el.innerHTML = `<div class="feed-row muted">${emptyMessage}</div>`;
    return;
  }
  events.forEach(ev => {
    const row = document.createElement('div');
    row.className = 'feed-row';
    const repeatBadge = ev.count > 1 ? `<span class="log-alert-repeat">&times;${ev.count}</span>` : '';
    row.innerHTML = `
      <div class="feed-time">${timeAgo(ev.at)}</div>
      <span class="tag ${ev.level.toLowerCase()}">${ev.level}</span>
      <span class="log-alert-logger">${ev.logger}</span>
      <div style="flex:1;">${ev.message}</div>
      ${repeatBadge}
    `;
    el.appendChild(row);
  });
}

function renderLogAlerts(logAlerts) {
  document.getElementById('log-error-count').textContent = `${logAlerts.errorCount} ${logAlerts.errorCount === 1 ? 'error' : 'errors'}`;
  document.getElementById('log-warn-count').textContent = `${logAlerts.warnCount} ${logAlerts.warnCount === 1 ? 'warning' : 'warnings'}`;
  renderLogList('log-errors-list', logAlerts.errors, 'No errors captured');
  renderLogList('log-warnings-list', logAlerts.warnings, 'No warnings captured');
}

function patronStatusLabel(status) {
  if (status === 'active_patron') return 'Active patron';
  if (status === 'former_patron') return 'Former patron';
  if (status === 'declined_patron') return 'Payment declined';
  return 'No status';
}

// Driven by the #patreon-status-filter <select>. A supporter with no
// patronStatus at all (a seat with no Patreon cross-reference — see
// StatusRoute.buildPatreonJson) always matches, regardless of the filter:
// it's not part of the "Patreon subscription status" dimension the filter
// controls, it's just plain seat/bot-config data.
let patreonStatusFilter = 'active';

function matchesPatreonFilter(supporter) {
  if (supporter.patronStatus === undefined) return true;
  if (patreonStatusFilter === 'all') return true;
  if (patreonStatusFilter === 'active') return supporter.patronStatus === 'active_patron';
  return supporter.patronStatus === patreonStatusFilter;
}

// Driven by the #patreon-search box.
let patreonSearchQuery = '';

function matchesPatreonSearch(supporter) {
  if (!patreonSearchQuery) return true;
  const q = patreonSearchQuery.toLowerCase();
  return (supporter.userName || '').toLowerCase().includes(q)
    || (supporter.discordUsername || '').toLowerCase().includes(q)
    || (supporter.userId || '').toLowerCase().includes(q);
}

// Which cards have their details expanded — keyed so it survives the poll
// cycle re-rendering every card from scratch every 10s.
const expandedSupporters = new Set();

function supporterKey(supporter) {
  return supporter.userId || supporter.patreonMemberId || supporter.userName;
}

function buildSupporterCard(supporter) {
  // supporter.patronStatus is only present when patreonapi.PatreonApiClient's
  // sync could cross-reference this person — see StatusRoute.buildPatreonJson.
  const hasPatreonInfo = supporter.patronStatus !== undefined;
  // Seat-holders' confirmed/unconfirmed status comes from the per-seat flags
  // set by the periodic subscription recheck (see PaywallService.refreshAll),
  // which reads the same synced Patreon snapshot patronStatus comes from. A
  // seat in its grace period is still "active" (nothing is paused yet) but
  // has already failed that recheck, so it counts as unconfirmed here —
  // otherwise a lapse wouldn't show up on this panel until the pause landed
  // days later. Only a seatless, Patreon-sourced entry falls back to
  // patronStatus directly, since it has no seats to check at all.
  const confirmed = supporter.seats.length > 0
    ? supporter.seats.every(s => s.active && !s.inGrace)
    : (hasPatreonInfo ? supporter.patronStatus === 'active_patron' : true);

  const key = supporterKey(supporter);
  const expanded = expandedSupporters.has(key);

  const sup = document.createElement('div');
  sup.className = (confirmed ? 'patreon-sup' : 'patreon-sup unconfirmed') + (expanded ? ' expanded' : '');

  const head = document.createElement('div');
  head.className = 'patreon-sup-head';
  // Always reflects the synced patronStatus when a cross-reference exists —
  // regardless of seat count, and colored by patronStatus itself rather than
  // `confirmed` (a seat-holder's seats can be active while their Patreon
  // status has lapsed, or vice versa; the per-seat rows below already show
  // each seat's own active/paused state once expanded).
  let statusBadge = '';
  if (hasPatreonInfo) {
    const isActivePatron = supporter.patronStatus === 'active_patron';
    statusBadge = `<span class="tag ${isActivePatron ? 'active' : 'unconfirmed'}">${patronStatusLabel(supporter.patronStatus)}</span>`;
  } else if (!confirmed) {
    statusBadge = '<span class="tag unconfirmed">Not confirmed</span>';
  }
  // Shown next to the name regardless of seat count, purple to flag a
  // confirmed Discord link at a glance — the .patreon-empty note below only
  // renders for seatless supporters, so this is the only place a seat-holder
  // ever sees their linked Discord username.
  const discordBadge = supporter.discordUsername
    ? `<span class="patreon-sup-discord"><i class="ti ti-brand-discord" aria-hidden="true"></i>${supporter.discordUsername}</span>`
    : '';
  // Only set (non-zero) when a dashboard admin has granted this user a
  // seat-count adjustment — see PaywallService.setExtraSeats. Sign-prefixed
  // since a negative adjustment is allowed too.
  const extraSeatsBadge = supporter.extraSeats
    ? `<span class="patreon-sup-extra ${supporter.extraSeats > 0 ? 'positive' : 'negative'}">${supporter.extraSeats > 0 ? '+' : ''}${supporter.extraSeats} seats</span>`
    : '';
  head.innerHTML = `<i class="ti ti-chevron-right patreon-sup-chevron" aria-hidden="true"></i><i class="ti ti-crown" aria-hidden="true"></i><span class="patreon-sup-name">${supporter.userName || supporter.userId || 'Unknown'}</span>${discordBadge}${extraSeatsBadge}${statusBadge}`;
  head.addEventListener('click', () => {
    if (expandedSupporters.has(key)) expandedSupporters.delete(key);
    else expandedSupporters.add(key);
    sup.classList.toggle('expanded');
  });
  sup.appendChild(head);

  const details = document.createElement('div');
  details.className = 'patreon-sup-details';

  if (supporter.seats.length === 0) {
    const note = document.createElement('div');
    note.className = 'patreon-empty';
    if (supporter.userId) {
      const discordLabel = supporter.discordUsername ? `${supporter.discordUsername} (${supporter.userId})` : supporter.userId;
      note.innerHTML = `<i class="ti ti-brand-discord" aria-hidden="true"></i>Discord: ${discordLabel} &middot; no seats assigned yet`;
    } else {
      note.innerHTML = '<i class="ti ti-info-circle" aria-hidden="true"></i>Patreon supporter with no linked Discord account &mdash; can\'t assign a seat until they connect one';
    }
    details.appendChild(note);
  }

  supporter.seats.forEach(seat => {
    const row = document.createElement('div');
    row.className = 'patreon-seat';
    row.innerHTML = `<i class="ti ti-brand-discord" aria-hidden="true"></i><span class="patreon-seat-text">${seat.guildName}</span><span class="sep">&middot;</span><i class="ti ti-world" aria-hidden="true"></i><span class="patreon-seat-text">${seat.world}</span>`;
    const right = document.createElement('span');
    right.className = 'patreon-seat-right';
    right.innerHTML = seat.active ? '<span class="tag active">Active</span>' : '<span class="tag paused">Paused</span>';
    const removeBtn = document.createElement('button');
    removeBtn.className = 'patreon-btn danger';
    removeBtn.textContent = 'Remove';
    removeBtn.addEventListener('click', (e) => { e.stopPropagation(); removeSeat(seat.guildId, seat.world, seat.guildName); });
    right.appendChild(removeBtn);
    row.appendChild(right);
    details.appendChild(row);
  });

  sup.appendChild(details);

  return sup;
}

function renderPatreonList(elementId, supporters, emptyMessage) {
  const el = document.getElementById(elementId);
  el.innerHTML = '';
  if (supporters.length === 0) {
    if (emptyMessage) el.innerHTML = `<div class="muted">${emptyMessage}</div>`;
    return;
  }
  supporters.forEach(supporter => el.appendChild(buildSupporterCard(supporter)));
}

function renderPatreon(patreon) {
  const allSeats = patreon.flatMap(s => s.seats);
  const activeSeats = allSeats.filter(s => s.active).length;
  // Fixed at "active subscription" regardless of the interactive filter above
  // — a stable count of real active patrons, not a reflection of whatever's
  // currently being browsed.
  const activeSupporters = patreon.filter(s => s.patronStatus === 'active_patron').length;

  document.getElementById('patreon-stats').innerHTML = `
    <div class="detail-stat"><i class="ti ti-crown" style="color:var(--warn)" aria-hidden="true"></i><div><div class="num">${activeSupporters}</div><div class="num-label">Supporters</div></div></div>
    <div class="detail-stat"><i class="ti ti-armchair" style="color:var(--good)" aria-hidden="true"></i><div><div class="num">${activeSeats}</div><div class="num-label">Active seats</div></div></div>
    <div class="detail-stat"><i class="ti ti-player-pause" style="color:var(--warn)" aria-hidden="true"></i><div><div class="num">${allSeats.length - activeSeats}</div><div class="num-label">Paused seats</div></div></div>
  `;

  const visible = patreon.filter(matchesPatreonFilter).filter(matchesPatreonSearch);
  renderPatreonList('patreon-list', visible, patreon.length === 0 ? 'No Patreon seats assigned' : 'No supporters match this filter');
}

async function patreonAction(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
  if (!res.ok) {
    let message = `Request failed (${res.status})`;
    try {
      const parsed = await res.json();
      if (parsed.error) message = parsed.error;
    } catch (e) { /* body wasn't JSON — keep the default message */ }
    throw new Error(message);
  }
}

async function removeSeat(guildId, world, guildName) {
  if (!confirm(`Remove the seat for ${guildName} · ${world}?`)) return;
  try {
    await patreonAction('DELETE', '/status/patreon/seats', { guildId, world });
    poll();
  } catch (e) {
    alert(e.message);
  }
}

document.getElementById('patreon-extra-toggle').addEventListener('click', () => {
  document.getElementById('patreon-extra-form').classList.toggle('open');
});

document.getElementById('patreon-status-filter').addEventListener('change', (e) => {
  patreonStatusFilter = e.target.value;
  if (lastData) render();
});

document.getElementById('patreon-search').addEventListener('input', (e) => {
  patreonSearchQuery = e.target.value;
  if (lastData) render();
});

document.getElementById('patreon-extra-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('patreon-extra-username').value.trim();
  const extraSeatsRaw = document.getElementById('patreon-extra-count').value.trim();
  if (!username || extraSeatsRaw === '') return;
  const extraSeats = Number(extraSeatsRaw);
  if (!Number.isInteger(extraSeats)) { alert('Extra seats must be a whole number'); return; }
  try {
    await patreonAction('PUT', '/status/patreon/extra-seats', { username, extraSeats });
    e.target.reset();
    e.target.classList.remove('open');
    poll();
  } catch (err) {
    alert(err.message);
  }
});

function setupLogToggle(toggleId, panelId, chevronId) {
  document.getElementById(toggleId).addEventListener('click', () => {
    const panel = document.getElementById(panelId);
    const chevron = document.getElementById(chevronId);
    const isHidden = panel.style.display === 'none';
    panel.style.display = isHidden ? 'block' : 'none';
    chevron.classList.toggle('expanded', isHidden);
  });
}
setupLogToggle('log-error-toggle', 'log-errors-panel', 'log-error-chevron');
setupLogToggle('log-warn-toggle', 'log-warnings-panel', 'log-warn-chevron');

// World Info / Recent Activity / Patreon Supporters — collapse the whole
// panel body, leaving just the title bar. Plain classList toggle is enough
// (no state tracking needed): these .panel elements are static in the
// initial HTML and never rebuilt, unlike the per-supporter cards above.
document.querySelectorAll('.panel-title-toggle').forEach(toggle => {
  toggle.addEventListener('click', () => {
    toggle.closest('.panel').classList.toggle('collapsed');
  });
});

// Mobile-only drawer — a no-op on desktop, where .sidebar never gets the
// "open" transform in the first place (see the max-width: 720px block).
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-backdrop').classList.remove('open');
}
document.getElementById('mobile-menu-btn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebar-backdrop').classList.add('open');
});
document.getElementById('sidebar-backdrop').addEventListener('click', closeSidebar);

function render() {
  if (!lastData) return;
  const worlds = lastData.worlds;
  if (!selectedWorld && worlds.length) selectedWorld = sortedWorlds(worlds)[0].name;

  const bots = lastData.bots || [];

  document.getElementById('kpi-worlds').textContent = worlds.length;
  document.getElementById('kpi-discords').textContent = new Set(worlds.flatMap(w => w.discords.map(d => d.id))).size;
  document.getElementById('kpi-population').textContent = worlds.reduce((sum, w) => sum + w.population, 0).toLocaleString('en-US');
  renderMastheadSub(bots);

  renderSidebar(worlds);
  renderDetail(worlds);
  renderApiThroughput(bots);
  renderLogAlerts(lastData.logAlerts);
  renderPatreon(lastData.patreon || []);
  const selected = worlds.find(w => w.name === selectedWorld);
  renderFeed(selected ? selected.recentEvents : []);
}

async function poll() {
  try {
    const res = await fetch('/status/data');
    if (!res.ok) return;
    lastData = await res.json();
    render();
  } catch (e) {
    console.error('status poll failed', e);
  }
}

poll();
setInterval(poll, 10000);
</script>
</body>
</html>
